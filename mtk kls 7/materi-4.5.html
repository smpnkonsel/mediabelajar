<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembagian Bentuk Aljabar — Bab 4 Bentuk Aljabar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e1a;
    --bg-soft: #10142400;
    --panel: #151a2e;
    --panel-2: #1b2138;
    --border: #262c47;
    --text: #e8eaf5;
    --muted: #9099b8;
    --violet: #7c5cff;
    --violet-2: #a78bfa;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --green: #34d399;
    --red: #fb7185;
    --grad-1: linear-gradient(135deg, #7c5cff 0%, #22d3ee 100%);
    --grad-2: linear-gradient(135deg, #22d3ee 0%, #34d399 100%);
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius: 20px;
    --font-head: 'Fredoka', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(124,92,255,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(34,211,238,0.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; width:100vw;
    padding:18px clamp(12px,4vw,48px) 14px;
  }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:14px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-head); font-weight:600; font-size:15px; color:var(--muted);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--grad-1);
    box-shadow:0 0 12px rgba(124,92,255,0.7);
  }
  .progress-wrap{
    flex:1; min-width:160px; max-width:420px;
    height:8px; border-radius:999px; background:var(--panel-2);
    border:1px solid var(--border); overflow:hidden;
  }
  .progress-bar{
    height:100%; width:0%; border-radius:999px;
    background:var(--grad-1);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .slide-count{
    font-family:var(--font-mono); font-size:13px; color:var(--muted);
    min-width:56px; text-align:right;
  }

  main.stage{
    flex:1; position:relative; overflow:hidden;
    border-radius:26px;
  }
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(18px,3vw,44px) clamp(16px,4vw,64px);
    overflow-y:auto;
    animation: rise .45s cubic-bezier(.4,0,.2,1);
  }
  .slide.active{ display:flex; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:12.5px; color:var(--cyan);
    letter-spacing:0.02em; margin-bottom:8px;
  }
  h1{
    font-family:var(--font-head); font-weight:600;
    font-size:clamp(26px,4vw,44px); line-height:1.12; margin:0 0 10px;
  }
  h2{
    font-family:var(--font-head); font-weight:600;
    font-size:clamp(21px,2.6vw,30px); line-height:1.2; margin:0 0 14px;
  }
  h3{
    font-family:var(--font-head); font-weight:500;
    font-size:clamp(17px,1.8vw,21px); margin:0 0 8px; color:var(--violet-2);
  }
  p{ line-height:1.65; color:var(--text); max-width:70ch; }
  p.muted, .muted{ color:var(--muted); }
  .lead{ font-size:clamp(15px,1.6vw,18px); color:var(--muted); max-width:62ch; }

  .content-grid{
    display:grid; gap:20px;
    grid-template-columns: 1.1fr 0.9fr;
    align-items:start;
    flex:1;
  }
  @media (max-width:860px){ .content-grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:var(--shadow);
  }
  .card.soft{ background:var(--panel-2); }
  .card.accent{
    border-color:rgba(124,92,255,0.4);
    background:linear-gradient(180deg, rgba(124,92,255,0.10), rgba(21,26,46,0.6));
  }

  .formula{
    font-family:var(--font-mono); font-size:clamp(16px,2vw,21px);
    background:#0d1122; border:1px solid var(--border); border-radius:14px;
    padding:14px 18px; color:var(--cyan); display:inline-block; margin:10px 0;
  }
  .formula .op{ color:var(--amber); }
  .formula .exp{ vertical-align:super; font-size:0.7em; }

  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-family:var(--font-mono);
    padding:4px 10px; border-radius:999px;
    border:1px solid var(--border); color:var(--muted);
  }
  .tag.mudah{ color:var(--green); border-color:rgba(52,211,153,0.4); }
  .tag.sedang{ color:var(--amber); border-color:rgba(251,191,36,0.4); }
  .tag.menantang{ color:var(--red); border-color:rgba(251,113,133,0.4); }

  ul.point-list{ margin:6px 0; padding-left:20px; }
  ul.point-list li{ margin-bottom:8px; line-height:1.55; }

  .term{
    font-family:var(--font-mono); background:#0d1122; border:1px solid var(--border);
    border-radius:8px; padding:1px 7px; color:var(--violet-2);
  }

  /* Buttons */
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:10px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .btn:hover{ transform:translateY(-2px); border-color:var(--violet-2); }
  .btn:active{ transform:translateY(0); }
  .btn.primary{
    background:var(--grad-1); border:none; color:#0b0e1a;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* Accordion */
  .accordion{ border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:12px; background:var(--panel); }
  .accordion-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; cursor:pointer; font-family:var(--font-head); font-weight:500; font-size:15.5px;
  }
  .accordion-head:hover{ background:var(--panel-2); }
  .accordion-head .chevron{ transition:transform .3s ease; color:var(--cyan); }
  .accordion.open .chevron{ transform:rotate(180deg); }
  .accordion-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .accordion.open .accordion-body{ max-height:600px; }
  .accordion-body-inner{ padding:0 18px 18px; color:var(--muted); line-height:1.6; }

  /* Step reveal */
  .steps{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .step{
    border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--panel-2); opacity:.45;
  }
  .step.revealed{ opacity:1; border-color:rgba(34,211,238,0.35); }
  .step .step-label{ font-family:var(--font-mono); font-size:12px; color:var(--cyan); margin-bottom:4px; }

  /* MCQ practice */
  .mcq{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .opt{
    text-align:left; padding:11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer; font-family:var(--font-mono); font-size:14px;
    transition:all .15s ease;
  }
  .opt:hover{ border-color:var(--violet-2); }
  .opt.correct{ background:rgba(52,211,153,0.15); border-color:var(--green); color:var(--green); }
  .opt.wrong{ background:rgba(251,113,133,0.15); border-color:var(--red); color:var(--red); }
  .opt.disabled{ pointer-events:none; }
  .feedback{ margin-top:10px; font-size:14px; color:var(--muted); min-height:18px; }

  /* Slider interactive */
  .slider-row{ display:flex; align-items:center; gap:14px; margin-top:14px; }
  input[type=range]{ flex:1; accent-color: var(--violet); }
  .slider-readout{ font-family:var(--font-mono); font-size:15px; color:var(--cyan); min-width:170px; text-align:right; }

  /* FPB visual bars */
  .bars{ display:flex; gap:24px; align-items:flex-end; height:120px; margin:18px 0 6px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .bar{ width:56px; border-radius:8px 8px 0 0; background:var(--grad-1); }
  .bar-label{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }

  /* Quiz */
  .quiz-progress{ font-family:var(--font-mono); font-size:13px; color:var(--muted); margin-bottom:6px; }
  .quiz-card{ max-width:640px; }
  .score-ring{
    width:140px; height:140px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--violet) calc(var(--pct,0)*1%), #1b2138 0);
    position:relative;
  }
  .score-ring::before{
    content:""; position:absolute; inset:10px; border-radius:50%; background:var(--panel);
  }
  .score-ring span{ position:relative; z-index:1; font-family:var(--font-head); font-size:28px; }

  /* Nav */
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; gap:12px; flex-wrap:wrap;
  }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; max-width:60vw; }
  .dots .dotnav{
    width:8px; height:8px; border-radius:50%; background:var(--border); cursor:pointer;
    transition:all .2s ease; border:none; padding:0;
  }
  .dots .dotnav.active{ background:var(--cyan); width:22px; border-radius:5px; }
  .navbtns{ display:flex; gap:10px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  .center-cover{ align-items:center; justify-content:center; text-align:center; }
  .cover-badge{
    font-family:var(--font-mono); font-size:13px; color:var(--cyan);
    border:1px solid rgba(34,211,238,0.35); padding:6px 16px; border-radius:999px; margin-bottom:18px;
  }
  .cover-title{ font-size:clamp(32px,6vw,58px); }
  .cover-sub{ color:var(--muted); font-size:clamp(15px,2vw,19px); max-width:60ch; margin:0 auto; }
  .cover-icon-row{ display:flex; gap:18px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .float-chip{
    font-family:var(--font-mono); font-size:14px; padding:10px 16px; border-radius:14px;
    background:var(--panel); border:1px solid var(--border); color:var(--violet-2);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Bab 4 · Bentuk Aljabar — Pembagian Bentuk Aljabar</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="slide-count"><span id="curNum">1</span> / <span id="totalNum">1</span></div>
  </header>

  <main class="stage" id="stage"></main>

  <nav class="navbar">
    <div class="dots" id="dots"></div>
    <div class="navbtns">
      <button class="btn" id="prevBtn" onclick="prevSlide()">← Sebelumnya</button>
      <button class="btn primary" id="nextBtn" onclick="nextSlide()">Berikutnya →</button>
    </div>
  </nav>
</div>

<script>
/* ============ SLIDE CONTENT ============ */
const stage = document.getElementById('stage');

function slide(id, innerHtml, extraClass){
  return `<section class="slide ${extraClass||''}" id="${id}">${innerHtml}</section>`;
}

const slidesHtml = [

/* 1. COVER */
slide('s-cover', `
  <div class="cover-badge">Kurikulum Merdeka · Matematika SMP</div>
  <h1 class="cover-title">Pembagian Bentuk Aljabar</h1>
  <p class="cover-sub">Bab 4 — Bentuk Aljabar · Materi pokok: pembagian bentuk aljabar sederhana. Yuk pelajari cara membagi suku aljabar selangkah demi selangkah, lengkap dengan latihan dan kuis.</p>
  <div class="cover-icon-row">
    <span class="float-chip">a⁵ ÷ a² = a³</span>
    <span class="float-chip">6x² ÷ 2x = 3x</span>
    <span class="float-chip">(8x+12) ÷ 4</span>
  </div>
`, 'center-cover'),

/* 2. APERSEPSI */
slide('s-apersepsi', `
  <div class="eyebrow">Apersepsi</div>
  <h2>Sebelum mulai, ingat kembali pembagian bilangan</h2>
  <div class="content-grid">
    <div class="card">
      <p>Kamu tentu sudah tahu cara membagi bilangan biasa. Sekarang coba perhatikan pembagian bilangan berpangkat berikut.</p>
      <div class="formula">2<span class="exp">5</span> <span class="op">÷</span> 2<span class="exp">2</span> = ?</div>
      <p class="muted">Ingat: 2⁵ = 2×2×2×2×2 dan 2² = 2×2. Jika keduanya dibagi, beberapa faktor 2 akan saling coret.</p>
      <div class="accordion" id="acc-aper">
        <div class="accordion-head" onclick="toggleAcc('acc-aper')">
          <span>Klik untuk melihat penyelesaiannya</span><span class="chevron">⌄</span>
        </div>
        <div class="accordion-body"><div class="accordion-body-inner">
          2⁵ ÷ 2² = (2×2×2×2×2) ÷ (2×2) = 2×2×2 = 2³ = 8<br>
          Perhatikan: pangkatnya berubah dari 5 menjadi 3, yaitu hasil dari <span class="term">5 − 2</span>.
        </div></div>
      </div>
    </div>
    <div class="card soft">
      <h3>Pertanyaan Pemantik</h3>
      <ul class="point-list">
        <li>Bagaimana jika yang dibagi bukan angka, tapi variabel seperti <span class="term">x⁵ ÷ x²</span>?</li>
        <li>Apakah caranya akan sama dengan pembagian bilangan berpangkat di atas?</li>
        <li>Bagaimana jika bentuk aljabarnya terdiri dari beberapa suku, misalnya <span class="term">(6x² + 9x) ÷ 3x</span>?</li>
      </ul>
      <p class="muted">Simpan dulu pertanyaan ini di kepalamu — kita akan menjawabnya sepanjang pembelajaran ini.</p>
    </div>
  </div>
`),

/* 3. TUJUAN */
slide('s-tujuan', `
  <div class="eyebrow">Tujuan Pembelajaran</div>
  <h2>Setelah mempelajari materi ini, kamu diharapkan mampu:</h2>
  <div class="card accent">
    <ul class="point-list">
      <li>Menjelaskan sifat pembagian pada bilangan berpangkat dan bentuk aljabar.</li>
      <li>Membagi suku sejenis (monomial dibagi monomial) dengan benar.</li>
      <li>Membagi bentuk aljabar bersuku banyak (polinomial) oleh suku tunggal.</li>
      <li>Menggunakan Faktor Persekutuan Terbesar (FPB) untuk menyederhanakan pembagian bentuk aljabar.</li>
      <li>Menyelesaikan soal latihan dan kuis pembagian bentuk aljabar secara mandiri.</li>
    </ul>
  </div>
`),

/* 4. KONSEP DASAR - RECAP BENTUK ALJABAR */
slide('s-recap', `
  <div class="eyebrow">Konsep Dasar</div>
  <h2>Mengingat kembali bagian-bagian bentuk aljabar</h2>
  <div class="content-grid">
    <div class="card">
      <div class="formula">6<span style="color:var(--amber)">x</span><span class="exp">2</span> <span class="op">+</span> 3<span style="color:var(--amber)">x</span> <span class="op">−</span> 5</div>
      <ul class="point-list">
        <li><span class="term">6, 3</span> adalah <b>koefisien</b> — angka di depan variabel.</li>
        <li><span class="term">x</span> adalah <b>variabel</b> — lambang pengganti suatu bilangan.</li>
        <li><span class="term">−5</span> adalah <b>konstanta</b> — suku tanpa variabel.</li>
        <li>Setiap bagian yang dipisah tanda + atau − disebut <b>suku</b>.</li>
      </ul>
    </div>
    <div class="card soft">
      <h3>Kenapa perlu diingat?</h3>
      <p class="muted">Saat membagi bentuk aljabar, kita akan membagi koefisien dengan koefisien, dan variabel dengan variabel secara terpisah. Karena itu, penting untuk bisa mengenali ketiga bagian ini dengan cepat.</p>
    </div>
  </div>
`),

/* 5. SIFAT PEMBAGIAN BERPANGKAT - INTERACTIVE SLIDER */
slide('s-sifat-pangkat', `
  <div class="eyebrow">Konsep Kunci</div>
  <h2>Sifat pembagian bilangan berpangkat</h2>
  <div class="card accent">
    <div class="formula">a<span class="exp">m</span> <span class="op">÷</span> a<span class="exp">n</span> <span class="op">=</span> a<span class="exp">m−n</span> &nbsp;&nbsp;(a ≠ 0, m &gt; n)</div>
    <p>Jika basisnya sama, pembagian bilangan berpangkat dilakukan dengan <b>mengurangkan pangkatnya</b>.</p>
    <p class="lead">Coba geser slider di bawah untuk mengubah nilai m dan lihat bagaimana hasilnya berubah (basis a = x).</p>
    <div class="slider-row">
      <span class="muted" style="font-family:var(--font-mono)">m =</span>
      <input type="range" id="mSlider" min="3" max="9" value="5" oninput="updatePangkat()">
      <span class="slider-readout" id="pangkatReadout">x⁵ ÷ x² = x³</span>
    </div>
  </div>
`),

/* 6. PEMBAGIAN SUKU SEJENIS */
slide('s-monomial', `
  <div class="eyebrow">Konsep</div>
  <h2>Pembagian suku tunggal (monomial) oleh suku tunggal</h2>
  <div class="content-grid">
    <div class="card">
      <p>Untuk membagi dua suku tunggal, bagi <b>koefisien dengan koefisien</b>, lalu bagi <b>variabel sejenis</b> dengan mengurangkan pangkatnya.</p>
      <div class="formula">12<span style="color:var(--amber)">x</span><span class="exp">4</span><span style="color:var(--green)">y</span><span class="exp">2</span> <span class="op">÷</span> 4<span style="color:var(--amber)">x</span><span class="exp">2</span><span style="color:var(--green)">y</span> <span class="op">=</span> 3<span style="color:var(--amber)">x</span><span class="exp">2</span><span style="color:var(--green)">y</span></div>
    </div>
    <div class="card soft">
      <h3>Langkahnya</h3>
      <ul class="point-list">
        <li>Koefisien: 12 ÷ 4 = 3</li>
        <li>Variabel x: x⁴ ÷ x² = x⁽⁴⁻²⁾ = x²</li>
        <li>Variabel y: y² ÷ y¹ = y⁽²⁻¹⁾ = y¹ = y</li>
      </ul>
    </div>
  </div>
`),

/* 7. CONTOH SOAL 1 - STEP REVEAL */
slide('s-contoh1', `
  <div class="eyebrow">Contoh Soal 1</div>
  <h2>Selesaikan: 15x³ ÷ 3x</h2>
  <div class="card">
    <p class="muted">Klik tombol di bawah untuk mengungkap langkah penyelesaian satu per satu.</p>
    <div class="steps" id="steps1">
      <div class="step" data-step="0"><div class="step-label">LANGKAH 1</div>Bagi koefisiennya: 15 ÷ 3 = 5</div>
      <div class="step" data-step="1"><div class="step-label">LANGKAH 2</div>Bagi variabelnya: x³ ÷ x¹ = x⁽³⁻¹⁾ = x²</div>
      <div class="step" data-step="2"><div class="step-label">HASIL AKHIR</div>15x³ ÷ 3x = <b style="color:var(--green)">5x²</b></div>
    </div>
    <button class="btn primary" style="margin-top:14px" onclick="revealStep('steps1')">Tampilkan langkah berikutnya</button>
  </div>
`),

/* 8. LATIHAN MUDAH */
slide('s-latihan1', `
  <div class="eyebrow">Latihan</div>
  <h2>Latihan Mudah <span class="tag mudah">Level: Mudah</span></h2>
  <div class="content-grid">
    <div class="card">
      <h3>Soal 1</h3>
      <div class="formula">20x⁵ ÷ 4x² = ?</div>
      <div class="mcq" data-answer="0">
        <button class="opt" onclick="checkMcq(this,true)">5x³</button>
        <button class="opt" onclick="checkMcq(this,false)">5x⁷</button>
        <button class="opt" onclick="checkMcq(this,false)">16x³</button>
        <button class="opt" onclick="checkMcq(this,false)">5x²</button>
      </div>
      <div class="feedback"></div>
    </div>
    <div class="card">
      <h3>Soal 2</h3>
      <div class="formula">18x⁴y³ ÷ 6xy² = ?</div>
      <div class="mcq" data-answer="0">
        <button class="opt" onclick="checkMcq(this,true)">3x³y</button>
        <button class="opt" onclick="checkMcq(this,false)">3x⁴y</button>
        <button class="opt" onclick="checkMcq(this,false)">12x³y</button>
        <button class="opt" onclick="checkMcq(this,false)">3x³y²</button>
      </div>
      <div class="feedback"></div>
    </div>
  </div>
`),

/* 9. PEMBAGIAN POLINOMIAL OLEH SUKU TUNGGAL */
slide('s-polinom', `
  <div class="eyebrow">Konsep</div>

stage.innerHTML = slidesHtml.join('');

/* ============ NAVIGATION ============ */
const slides = Array.from(document.querySelectorAll('.slide'));
let current = 0;

const dotsWrap = document.getElementById('dots');
slides.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'dotnav';
  b.onclick = () => goToSlide(i);
  dotsWrap.appendChild(b);
});
document.getElementById('totalNum').textContent = slides.length;

function render(){
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.querySelectorAll('.dotnav').forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('curNum').textContent = current + 1;
  document.getElementById('progressBar').style.width = ((current) / (slides.length - 1) * 100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === slides.length - 1 ? 'Selesai ✓' : 'Berikutnya →';
  if(current === slides.length - 1){ document.getElementById('nextBtn').disabled = false; }
}
function goToSlide(i){
  if(i < 0 || i >= slides.length) return;
  current = i;
  render();
}
function nextSlide(){ if(current < slides.length - 1){ current++; render(); } }
function prevSlide(){ if(current > 0){ current--; render(); } }
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') nextSlide();
  if(e.key === 'ArrowLeft') prevSlide();
});
render();

/* ============ ACCORDION ============ */
function toggleAcc(id){
  document.getElementById(id).classList.toggle('open');
}

/* ============ STEP REVEAL ============ */
function revealStep(containerId){
  const container = document.getElementById(containerId);
  const steps = Array.from(container.querySelectorAll('.step'));
  const next = steps.find(s => !s.classList.contains('revealed'));
  if(next) next.classList.add('revealed');
}

/* ============ MCQ CHECK ============ */
function checkMcq(btn, isCorrect){
  const group = btn.parentElement;
  if(group.classList.contains('done')) return;
  group.classList.add('done');
  Array.from(group.children).forEach(opt => opt.classList.add('disabled'));
  const feedback = group.parentElement.querySelector('.feedback');
  if(isCorrect){
    btn.classList.add('correct');
    feedback.textContent = 'Benar! Jawabanmu tepat.';
    feedback.style.color = 'var(--green)';
  } else {
    btn.classList.add('wrong');
    Array.from(group.children).find(o => o.onclick.toString().includes('true'))?.classList.add('correct');
    feedback.textContent = 'Belum tepat. Coba periksa kembali langkah pembagiannya.';
    feedback.style.color = 'var(--red)';
  }
}

/* ============ EXPONENT SLIDER (slide 5) ============ */
function updatePangkat(){
  const m = parseInt(document.getElementById('mSlider').value);
  const n = 2;
  const result = m - n;
  document.getElementById('pangkatReadout').textContent = `x${sup(m)} ÷ x${sup(n)} = x${sup(result)}`;
}
function sup(n){
  const map = {0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
  return String(n).split('').map(d => map[d]).join('');
}

    exp:'27÷9=3, a³÷a²=a, b²÷b=b, sehingga hasilnya 3ab.' },
];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(quizIndex >= quizQuestions.length){
    const pct = Math.round((quizScore / quizQuestions.length) * 100);
    area.innerHTML = `
      <h3 style="text-align:center">Kuis Selesai!</h3>
      <div class="score-ring" style="--pct:${pct}"><span>${pct}%</span></div>
      <p style="text-align:center" class="muted">Skor kamu: ${quizScore} dari ${quizQuestions.length} soal benar.</p>
      <div style="display:flex; justify-content:center; margin-top:10px;">
        <button class="btn primary" onclick="restartQuiz()">Ulangi Kuis</button>
      </div>
    `;
    return;
  }
  const item = quizQuestions[quizIndex];
  quizAnswered = false;
  area.innerHTML = `
    <div class="quiz-progress">Soal ${quizIndex + 1} dari ${quizQuestions.length}</div>
    <h3>${item.q}</h3>
    <div class="mcq" id="quizMcq">
      ${item.opts.map((o,i) => `<button class="opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="quizFeedback"></div>
    <div style="margin-top:14px; display:flex; justify-content:flex-end;">
      <button class="btn primary" id="quizNextBtn" onclick="nextQuiz()" disabled>Soal Berikutnya →</button>
    </div>
  `;
}
function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quizQuestions[quizIndex];
  const opts = Array.from(document.querySelectorAll('#quizMcq .opt'));
  opts.forEach(o => o.classList.add('disabled'));
  opts[item.correct].classList.add('correct');
  const fb = document.getElementById('quizFeedback');
  if(i === item.correct){
    quizScore++;
    fb.style.color = 'var(--green)';
    fb.textContent = 'Benar! ' + item.exp;
  } else {
    opts[i].classList.add('wrong');
    fb.style.color = 'var(--red)';
    fb.textContent = 'Belum tepat. ' + item.exp;
  }
  document.getElementById('quizNextBtn').disabled = false;
}
function nextQuiz(){
  quizIndex++;
  renderQuiz();
}
function restartQuiz(){
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}
renderQuiz();
</script>
