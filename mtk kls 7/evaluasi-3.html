<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluasi Bab 3 - Rasio</title><style>
:root{--ink:#102033;--blue:#2563eb;--teal:#0f9f8c;--red:#dc5367;--bg:#eef3f7;--line:#d8e1ea}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:900}.brand{font-size:14px;min-width:210px}.brand small{display:block;color:#718096;font-size:11px}.bar{height:7px;background:#e7edf3;border-radius:9px;flex:1;max-width:430px;margin-left:auto}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#14b8a6);border-radius:9px}.count{font-size:12px;color:#718096}.main{position:relative;flex:1;min-height:0}.slide{display:none;position:absolute;inset:0;overflow:auto;padding:30px 6% 90px}.slide.active{display:block;animation:f .22s ease}@keyframes f{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}.inner{max-width:1000px;margin:auto}.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--teal)}h1{font-size:clamp(40px,6vw,70px);line-height:1;margin:12px 0}h2{font-size:clamp(28px,4vw,45px);margin:8px 0 16px}p{line-height:1.6;color:#56677b}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 10px 30px #1b2b3b0d}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{font-size:28px;color:var(--blue);display:block}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.blue{background:var(--blue);color:#fff;border-color:var(--blue)}.qhead{display:flex;justify-content:space-between;gap:10px}.topic{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:900}.q{font-size:19px;line-height:1.55;font-weight:650;margin:14px 0}.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #d7e0e8;border-radius:11px;padding:12px 14px;margin:7px 0;cursor:pointer;font-size:15px;color:var(--ink)}.opt:hover{border-color:#2563eb;background:#f7fbff}.opt.correct{background:#eafaf4;border-color:#10a77e}.opt.wrong{background:#fff0f2;border-color:var(--red)}.opt:disabled{cursor:default}.fb{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:13px}.fb.show{display:block}.ok{background:#eafaf4;color:#08775d}.no{background:#fff0f2;color:#a2384b}.explain{display:none;margin-top:10px;background:#f5f8fb;border:1px dashed #c9d5df;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.essay{width:100%;min-height:150px;resize:vertical;border:1.5px solid #d7e0e8;border-radius:11px;padding:13px;font:inherit;line-height:1.5}.rubric{width:100%;border-collapse:collapse}.rubric td,.rubric th{border:1px solid var(--line);padding:10px;text-align:left;font-size:13px}.rubric th{background:#f4f7fa}.score{font-size:64px;font-weight:950;color:var(--blue)}.bottom{height:70px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 18px}.dots{display:flex;gap:5px;max-width:45%;overflow:hidden}.dot{width:7px;height:7px;background:#cbd5e1;border-radius:50%;cursor:pointer;flex:none}.dot.active{background:#2563eb}.hint{font-size:12px;color:#718096}@media(max-width:680px){.top{height:60px}.brand{min-width:0}.brand small{display:none}.brand>span{display:none}.bar{max-width:none}.dots{display:none}.slide{padding:20px 5% 80px}.stats,.grid{grid-template-columns:1fr}.q{font-size:17px}.card{padding:17px}.bottom{height:64px}.bottom .btn{padding:10px 12px}.bottom .label{display:none}}
</style></head><body><div class="app"><header class="top"><div class="logo">∝</div><div class="brand"><b>Matematika · Evaluasi Bab 3</b><small>Rasio • Semester Ganjil</small></div><div class="bar"><i id="prog"></i></div><div class="count" id="count">01/21</div></header><main class="main" id="main"></main><footer class="bottom"><button class="btn" id="prev" onclick="go(cur-1)">← <span class="label">Sebelumnya</span></button><div class="dots" id="dots"></div><button class="btn primary" id="next" onclick="go(cur+1)"><span class="label">Selanjutnya</span> →</button></footer></div><script>
const pg=[
['Perbandingan Berbalik Nilai','6 pekerja menyelesaikan pekerjaan dalam 12 hari. Jika pekerja menjadi 9 orang, waktunya adalah …',['6 hari','8 hari','16 hari','18 hari'],1,'6×12=9×x, jadi x=8 hari.'],
['Perbandingan Berbalik Nilai','Semakin banyak pekerja untuk pekerjaan yang sama, waktu yang diperlukan …',['semakin lama','tetap','semakin singkat','tidak dapat dibandingkan'],2,'Jumlah pekerja dan waktu berbanding terbalik.'],
['Perbandingan Berbalik Nilai','Kecepatan 60 km/jam ditempuh selama 5 jam. Jika kecepatan 75 km/jam untuk jarak sama, waktunya …',['3 jam','4 jam','5 jam','6 jam'],1,'60×5=75×t, sehingga t=4 jam.'],
['Perbandingan Berbalik Nilai','4 mesin menyelesaikan pekerjaan dalam 15 jam. Dengan 10 mesin, waktunya …',['4 jam','6 jam','10 jam','37,5 jam'],1,'4×15=10×t, jadi t=6 jam.'],
['Skala dan Peta','Skala 1:200.000 dan jarak peta 7 cm. Jarak sebenarnya …',['1,4 km','7 km','14 km','140 km'],2,'7×200.000=1.400.000 cm=14 km.'],
['Skala dan Peta','Jarak sebenarnya 36 km, skala 1:600.000. Jarak pada peta …',['3 cm','6 cm','12 cm','21,6 cm'],1,'36 km=3.600.000 cm; dibagi 600.000=6 cm.'],
['Skala dan Peta','Jarak peta 4 cm dan sebenarnya 20 km. Skalanya …',['1:50.000','1:200.000','1:500.000','1:5.000.000'],2,'20 km=2.000.000 cm; 4:2.000.000=1:500.000.'],
['Skala dan Peta','Skala 1:100.000 berarti …',['1 cm=100 m','1 cm=1 km','1 cm=10 km','100 cm=1 km'],1,'100.000 cm sama dengan 1 km.'],
['Laju Perubahan','Jarak berubah dari 20 km menjadi 80 km dalam 3 jam. Laju rata-rata …',['10 km/jam','20 km/jam','30 km/jam','60 km/jam'],1,'(80−20)÷3=20 km/jam.'],
['Laju Perubahan','Volume bertambah 42 liter dalam 6 menit. Laju perubahannya …',['5 L/menit','6 L/menit','7 L/menit','8 L/menit'],2,'42÷6=7 L/menit.'],
['Grafik Perbandingan','Grafik jarak-waktu berupa garis lurus naik teratur. Artinya …',['jarak berkurang','laju perubahan tetap','waktu tidak berubah','tidak ada hubungan'],1,'Kenaikan teratur menunjukkan laju perubahan tetap.'],
['Grafik Perbandingan','Dengan skala sumbu sama, grafik lebih curam menunjukkan …',['laju lebih kecil','laju lebih besar','x selalu lebih kecil','tidak ada perubahan'],1,'Kemiringan lebih besar berarti perubahan y per perubahan x lebih besar.'],
['Grafik Perbandingan','Pada grafik waktu dan jarak, sumbu horizontal biasanya menunjukkan …',['jarak','waktu','laju','skala'],1,'Waktu biasanya diletakkan pada sumbu x.'],
['Grafik Perbandingan','Jika nilai y tetap saat x bertambah, grafik berbentuk …',['garis naik','garis turun','garis mendatar','kurva tajam'],2,'Nilai y tetap menghasilkan garis mendatar.'],
['Penerapan Rasio','Skala 1:250.000 dan jarak peta 8 cm. Jarak sebenarnya …',['2 km','8 km','20 km','25 km'],2,'8×250.000=2.000.000 cm=20 km.']];
const essay=[
['Perbandingan Berbalik Nilai','8 pekerja menyelesaikan pekerjaan dalam 15 hari. Berapa pekerja diperlukan agar selesai dalam 10 hari? Jelaskan langkahmu.','8×15=p×10, maka p=12 pekerja.'],
['Perbandingan Berbalik Nilai','Perjalanan 6 jam dengan kecepatan 50 km/jam. Jika kecepatan menjadi 75 km/jam untuk jarak sama, tentukan waktunya.','50×6=75×t, maka t=4 jam.'],
['Skala dan Peta','Skala 1:400.000. Jarak pada peta 6,5 cm. Tentukan jarak sebenarnya dalam kilometer.','6,5×400.000=2.600.000 cm=26 km.'],
['Laju Perubahan','Volume air berubah dari 30 liter menjadi 90 liter dalam 5 menit. Tentukan laju perubahan rata-rata dan artinya.','(90−30)÷5=12 L/menit. Artinya volume bertambah rata-rata 12 liter setiap menit.'],
['Grafik Perbandingan','Jelaskan cara menyajikan hubungan waktu dan jarak dalam grafik serta arti grafik yang curam, mendatar, dan menurun.','Sumbu x untuk waktu dan sumbu y untuk jarak. Curam berarti laju lebih besar, mendatar berarti y tetap, menurun berarti y berkurang saat x bertambah.']];
let slides=[],cur=0,score=0,done=new Set();
function add(html){const s=document.createElement('section');s.className='slide';s.innerHTML='<div class="inner">'+html+'</div>';main.appendChild(s);slides.push(s)}
add('<div class="center"><div class="eyebrow">Semester Ganjil · Bab 3</div><h1>Evaluasi Rasio</h1><p>Evaluasi interaktif mencakup perbandingan berbalik nilai, skala dan peta, laju perubahan, serta grafik perbandingan.</p><div class="stats"><div class="stat"><b>15</b>Pilihan Ganda</div><div class="stat"><b>5</b>Esai</div><div class="stat"><b>100</b>Nilai Maksimal</div></div><button class="btn blue" onclick="go(1)">Mulai Evaluasi →</button></div>');
add('<div class="eyebrow">Petunjuk</div><h2>Cara mengerjakan</h2><div class="grid"><div class="card"><b>15 Pilihan Ganda</b><p>Pilih satu jawaban yang paling tepat. Setiap soal bernilai 4 poin.</p></div><div class="card"><b>5 Esai</b><p>Tulis langkah penyelesaian secara jelas. Setiap soal maksimal 8 poin.</p></div><div class="card"><b>Materi</b><p>Perbandingan berbalik nilai, skala dan peta, laju perubahan, dan grafik.</p></div></div>');
pg.forEach((q,i)=>add('<div class="eyebrow">Pilihan Ganda · '+(i+1)+'</div><div class="card"><div class="qhead"><span class="topic">'+q[0]+'</span><span class="hint">'+(i+1)+'/15 · 4 poin</span></div><div class="q">'+q[1]+'</div>'+q[2].map((o,j)=>'<button class="opt" onclick="ans('+i+','+j+',this)">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'<div class="fb" id="fb'+i+'"></div><div class="explain" id="ex'+i+'"><b>Pembahasan:</b> '+q[4]+'</div></div>'));
essay.forEach((q,i)=>add('<div class="eyebrow">Esai · '+(i+1)+'</div><div class="card"><div class="qhead"><span class="topic">'+q[0]+'</span><span class="hint">'+(i+1)+'/5 · maks. 8 poin</span></div><div class="q">'+q[1]+'</div><textarea class="essay" id="essay'+i+'" placeholder="Tuliskan jawaban dan langkah penyelesaianmu..."></textarea><button class="btn" style="margin-top:10px" onclick="saveE('+i+')">Simpan Jawaban</button><div class="fb" id="efb'+i+'"></div></div>'));
add('<div class="eyebrow">Hasil</div><h2>Rekap Evaluasi</h2><div class="grid"><div class="card" style="text-align:center"><div class="score" id="pgs">0</div><p>Skor Pilihan Ganda / 60</p></div><div class="card" style="text-align:center"><div class="score" id="final">—</div><p>Nilai akhir / 100</p><b id="pred">Esai dinilai guru</b></div></div><div class="card"><h3>Rubrik Esai</h3><table class="rubric"><tr><th>Komponen</th><th>Poin</th></tr><tr><td>Pemahaman konsep dan rumus tepat</td><td>3</td></tr><tr><td>Langkah sistematis dan benar</td><td>3</td></tr><tr><td>Jawaban akhir dan satuan tepat</td><td>2</td></tr></table><p>Nilai akhir = skor PG (maks. 60) + skor esai (maks. 40).</p></div>');
add('<div class="center"><div class="eyebrow">Selesai</div><h2>Evaluasi Bab 3 Selesai! 🎉</h2><p>Periksa kembali jawabanmu. Setelah selesai, kembali ke halaman informasi Bab 2.</p><button class="btn primary" onclick="finish()">✓ Selesai — Kembali ke Info Bab 2</button><p class="hint">Pastikan file <b>infob-bab2.html</b> berada dalam folder yang sama.</p></div>');
function ans(i,j,b){if(done.has(i))return;done.add(i);const q=pg[i],all=b.parentElement.querySelectorAll('.opt');all.forEach(x=>x.disabled=true);let ok=j===q[3];b.classList.add(ok?'correct':'wrong');if(ok)score+=4;let f=document.getElementById('fb'+i);f.className='fb show '+(ok?'ok':'no');f.textContent=ok?'✓ Benar! +4 poin.':'✗ Belum tepat.';document.getElementById('ex'+i).style.display='block';document.getElementById('pgs').textContent=score;document.getElementById('final').textContent=score;document.getElementById('pred').textContent=score>=54?'Sangat Baik (sementara)':score>=45?'Baik (sementara)':score>=36?'Cukup (sementara)':'Perlu Bimbingan (sementara)'}
function saveE(i){let f=document.getElementById('efb'+i);f.className='fb show ok';f.textContent='✓ Jawaban tersimpan. Esai dinilai berdasarkan rubrik guru.'}
function go(n){if(n<0||n>=slides.length)return;cur=n;slides.forEach((s,i)=>s.classList.toggle('active',i===cur));document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';document.getElementById('count').textContent=String(cur+1).padStart(2,'0')+'/'+slides.length;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===slides.length-1;slides[cur].scrollTop=0}
slides.forEach((_,i)=>{let d=document.createElement('span');d.className='dot'+(i?'':' active');d.onclick=()=>go(i);dots.appendChild(d)});function finish(){location.href='infob-bab2.html'}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});go(0);
</script></body></html>
