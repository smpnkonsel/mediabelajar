<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifat Distributif dan Penyederhanaan — Bab 4 Bentuk Aljabar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e1a;
    --panel: #151a2e;
    --panel-2: #1b2138;
    --border: #262c47;
    --text: #e8eaf5;
    --muted: #9099b8;
    --violet: #7c5cff;
    --violet-2: #a78bfa;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --green: #34d399;
    --red: #fb7185;
    --grad-1: linear-gradient(135deg, #7c5cff 0%, #22d3ee 100%);
    --grad-2: linear-gradient(135deg, #22d3ee 0%, #34d399 100%);
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius: 20px;
    --font-head: 'Fredoka', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(124,92,255,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(34,211,238,0.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; width:100vw;
    padding:18px clamp(12px,4vw,48px) 14px;
  }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:14px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-head); font-weight:600; font-size:15px; color:var(--muted);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--grad-1);
    box-shadow:0 0 12px rgba(124,92,255,0.7);
  }
  .progress-wrap{
    flex:1; min-width:160px; max-width:420px;
    height:8px; border-radius:999px; background:var(--panel-2);
    border:1px solid var(--border); overflow:hidden;
  }
  .progress-bar{
    height:100%; width:0%; border-radius:999px;
    background:var(--grad-1);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .slide-count{
    font-family:var(--font-mono); font-size:13px; color:var(--muted);
    min-width:56px; text-align:right;
  }

  main.stage{
    flex:1; position:relative; overflow:hidden;
    border-radius:26px;
  }
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(18px,3vw,44px) clamp(16px,4vw,64px);
    overflow-y:auto;
    animation: rise .45s cubic-bezier(.4,0,.2,1);
  }
  .slide.active{ display:flex; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:12.5px; color:var(--cyan);
    letter-spacing:0.02em; margin-bottom:8px;
  }
  h1{
    font-family:var(--font-head); font-weight:600;
    font-size:clamp(26px,4vw,44px); line-height:1.12; margin:0 0 10px;
  }
  h2{
    font-family:var(--font-head); font-weight:600;
    font-size:clamp(21px,2.6vw,30px); line-height:1.2; margin:0 0 14px;
  }
  h3{
    font-family:var(--font-head); font-weight:500;
    font-size:clamp(17px,1.8vw,21px); margin:0 0 8px; color:var(--violet-2);
  }
  p{ line-height:1.65; color:var(--text); max-width:70ch; }
  p.muted, .muted{ color:var(--muted); }
  .lead{ font-size:clamp(15px,1.6vw,18px); color:var(--muted); max-width:62ch; }

  .content-grid{
    display:grid; gap:20px;
    grid-template-columns: 1.1fr 0.9fr;
    align-items:start;
    flex:1;
  }
  @media (max-width:860px){ .content-grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:var(--shadow);
  }
  .card.soft{ background:var(--panel-2); }
  .card.accent{
    border-color:rgba(124,92,255,0.4);
    background:linear-gradient(180deg, rgba(124,92,255,0.10), rgba(21,26,46,0.6));
  }

  .formula{
    font-family:var(--font-mono); font-size:clamp(16px,2vw,21px);
    background:#0d1122; border:1px solid var(--border); border-radius:14px;
    padding:14px 18px; color:var(--cyan); display:inline-block; margin:10px 0;
  }
  .formula .op{ color:var(--amber); }
  .formula .exp{ vertical-align:super; font-size:0.7em; }

  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-family:var(--font-mono);
    padding:4px 10px; border-radius:999px;
    border:1px solid var(--border); color:var(--muted);
  }
  .tag.mudah{ color:var(--green); border-color:rgba(52,211,153,0.4); }
  .tag.sedang{ color:var(--amber); border-color:rgba(251,191,36,0.4); }
  .tag.menantang{ color:var(--red); border-color:rgba(251,113,133,0.4); }

  ul.point-list{ margin:6px 0; padding-left:20px; }
  ul.point-list li{ margin-bottom:8px; line-height:1.55; }

  .term{
    font-family:var(--font-mono); background:#0d1122; border:1px solid var(--border);
    border-radius:8px; padding:1px 7px; color:var(--violet-2);
  }

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:10px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .btn:hover{ transform:translateY(-2px); border-color:var(--violet-2); }
  .btn:active{ transform:translateY(0); }
  .btn.primary{ background:var(--grad-1); border:none; color:#0b0e1a; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  .accordion{ border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:12px; background:var(--panel); }
  .accordion-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; cursor:pointer; font-family:var(--font-head); font-weight:500; font-size:15.5px;
  }
  .accordion-head:hover{ background:var(--panel-2); }
  .accordion-head .chevron{ transition:transform .3s ease; color:var(--cyan); }
  .accordion.open .chevron{ transform:rotate(180deg); }
  .accordion-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .accordion.open .accordion-body{ max-height:600px; }
  .accordion-body-inner{ padding:0 18px 18px; color:var(--muted); line-height:1.6; }

  .steps{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .step{
    border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--panel-2); opacity:.45;
  }
  .step.revealed{ opacity:1; border-color:rgba(34,211,238,0.35); }
  .step .step-label{ font-family:var(--font-mono); font-size:12px; color:var(--cyan); margin-bottom:4px; }

  .mcq{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .opt{
    text-align:left; padding:11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer; font-family:var(--font-mono); font-size:14px;
    transition:all .15s ease;
  }
  .opt:hover{ border-color:var(--violet-2); }
  .opt.correct{ background:rgba(52,211,153,0.15); border-color:var(--green); color:var(--green); }
  .opt.wrong{ background:rgba(251,113,133,0.15); border-color:var(--red); color:var(--red); }
  .opt.disabled{ pointer-events:none; }
  .feedback{ margin-top:10px; font-size:14px; color:var(--muted); min-height:18px; }

  .slider-row{ display:flex; align-items:center; gap:14px; margin-top:14px; flex-wrap:wrap; }
  input[type=range]{ flex:1; min-width:120px; accent-color: var(--violet); }
  .slider-readout{ font-family:var(--font-mono); font-size:15px; color:var(--cyan); min-width:170px; text-align:right; }

  .area-model{ display:flex; align-items:flex-end; gap:4px; margin:18px 0 8px; }
  .area-block{ border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:13px; color:#0b0e1a; font-weight:600; transition:all .25s ease; }
  .area-block.ab{ background:var(--grad-1); }
  .area-block.ac{ background:var(--grad-2); }
  .area-label-row{ display:flex; gap:4px; margin-bottom:6px; }
  .area-label{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:center; }

  .bars{ display:flex; gap:24px; align-items:flex-end; height:120px; margin:18px 0 6px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .bar{ width:56px; border-radius:8px 8px 0 0; background:var(--grad-1); }
  .bar-label{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }

  .quiz-progress{ font-family:var(--font-mono); font-size:13px; color:var(--muted); margin-bottom:6px; }
  .quiz-card{ max-width:640px; }
  .score-ring{
    width:140px; height:140px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--violet) calc(var(--pct,0)*1%), #1b2138 0);
    position:relative;
  }
  .score-ring::before{ content:""; position:absolute; inset:10px; border-radius:50%; background:var(--panel); }
  .score-ring span{ position:relative; z-index:1; font-family:var(--font-head); font-size:28px; }

  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; gap:12px; flex-wrap:wrap;
  }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; max-width:60vw; }
  .dots .dotnav{
    width:8px; height:8px; border-radius:50%; background:var(--border); cursor:pointer;
    transition:all .2s ease; border:none; padding:0;
  }
  .dots .dotnav.active{ background:var(--cyan); width:22px; border-radius:5px; }
  .navbtns{ display:flex; gap:10px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  .center-cover{ align-items:center; justify-content:center; text-align:center; }
  .cover-badge{
    font-family:var(--font-mono); font-size:13px; color:var(--cyan);
    border:1px solid rgba(34,211,238,0.35); padding:6px 16px; border-radius:999px; margin-bottom:18px;
  }
  .cover-title{ font-size:clamp(32px,6vw,58px); }
  .cover-sub{ color:var(--muted); font-size:clamp(15px,2vw,19px); max-width:60ch; margin:0 auto; }
  .cover-icon-row{ display:flex; gap:18px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .float-chip{
    font-family:var(--font-mono); font-size:14px; padding:10px 16px; border-radius:14px;
    background:var(--panel); border:1px solid var(--border); color:var(--violet-2);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Bab 4 · Bentuk Aljabar — Sifat Distributif dan Penyederhanaan</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="slide-count"><span id="curNum">1</span> / <span id="totalNum">1</span></div>
  </header>

  <main class="stage" id="stage"></main>

  <nav class="navbar">
    <div class="dots" id="dots"></div>
    <div class="navbtns">
      <button class="btn" id="prevBtn" onclick="prevSlide()">← Sebelumnya</button>
      <button class="btn primary" id="nextBtn" onclick="nextSlide()">Berikutnya →</button>
    </div>
  </nav>
</div>

<script>
const stage = document.getElementById('stage');
function slide(id, innerHtml, extraClass){
  return `<section class="slide ${extraClass||''}" id="${id}">${innerHtml}</section>`;
}

const slidesHtml = [

/* 1. COVER */
slide('s-cover', `
  <div class="cover-badge">Kurikulum Merdeka · Matematika SMP</div>
  <h1 class="cover-title">Sifat Distributif dan Penyederhanaan</h1>
  <p class="cover-sub">Bab 4 — Bentuk Aljabar · Materi pokok: menggunakan sifat distributif untuk mengembangkan dan menyederhanakan bentuk aljabar. Yuk pelajari cara membuka tanda kurung dan menggabungkan suku sejenis selangkah demi selangkah.</p>
  <div class="cover-icon-row">
    <span class="float-chip">a(b+c) = ab+ac</span>
    <span class="float-chip">3(x+4) = 3x+12</span>
    <span class="float-chip">2(x+3)+3(x-1)</span>
  </div>
`, 'center-cover'),

/* 2. APERSEPSI */
slide('s-apersepsi', `
  <div class="eyebrow">Apersepsi</div>
  <h2>Mengingat kembali cara mengalikan bilangan dengan penjumlahan</h2>
  <div class="content-grid">
    <div class="card">
      <p>Perhatikan dua cara berikut untuk menghitung nilai yang sama.</p>
      <div class="formula">3 <span class="op">×</span> (4 <span class="op">+</span> 5) <span class="op">=</span> 3 <span class="op">×</span> 9 <span class="op">=</span> 27</div>
      <div class="formula">(3<span class="op">×</span>4) <span class="op">+</span> (3<span class="op">×</span>5) <span class="op">=</span> 12 <span class="op">+</span> 15 <span class="op">=</span> 27</div>
      <p class="muted">Ternyata hasilnya sama! Angka 3 "dibagikan" ke setiap suku di dalam kurung.</p>
      <div class="accordion" id="acc-aper">
        <div class="accordion-head" onclick="toggleAcc('acc-aper')">
          <span>Klik untuk melihat kesimpulannya</span><span class="chevron">⌄</span>
        </div>
        <div class="accordion-body"><div class="accordion-body-inner">
          Sifat ini disebut <b>sifat distributif</b>. Sifat ini juga berlaku ketika angka di dalam kurung diganti dengan variabel, seperti pada bentuk aljabar.
        </div></div>
      </div>
    </div>
    <div class="card soft">
      <h3>Pertanyaan Pemantik</h3>
      <ul class="point-list">
        <li>Bagaimana jika bentuknya menjadi <span class="term">3 × (x + 5)</span>, dengan x sebagai variabel?</li>
        <li>Apa yang terjadi jika ada tanda kurang di dalam kurung, misalnya <span class="term">−2 × (x − 4)</span>?</li>
        <li>Bagaimana cara menyederhanakan bentuk seperti <span class="term">3(x+2) + 2(x−1)</span>?</li>
      </ul>
    </div>
  </div>
`),

/* 3. TUJUAN */
slide('s-tujuan', `
  <div class="eyebrow">Tujuan Pembelajaran</div>
  <h2>Setelah mempelajari materi ini, kamu diharapkan mampu:</h2>
  <div class="card accent">
    <ul class="point-list">
      <li>Menjelaskan sifat distributif perkalian terhadap penjumlahan dan pengurangan.</li>
      <li>Mengembangkan (membuka tanda kurung) bentuk aljabar menggunakan sifat distributif.</li>
      <li>Membagikan tanda negatif dengan benar saat mengalikan bentuk berkurung.</li>
      <li>Menyederhanakan bentuk aljabar dengan menggabungkan suku sejenis setelah distribusi.</li>
      <li>Menyelesaikan soal latihan dan kuis penerapan sifat distributif secara mandiri.</li>
    </ul>
  </div>
`),

/* 4. KONSEP DASAR SIFAT DISTRIBUTIF */
slide('s-konsep', `
  <div class="eyebrow">Konsep Dasar</div>
  <h2>Apa itu sifat distributif?</h2>
  <div class="content-grid">
    <div class="card accent">
      <div class="formula">a(b <span class="op">+</span> c) <span class="op">=</span> ab <span class="op">+</span> ac</div>
      <div class="formula">a(b <span class="op">−</span> c) <span class="op">=</span> ab <span class="op">−</span> ac</div>
      <p>Setiap suku di dalam kurung dikalikan dengan bilangan atau variabel di luar kurung.</p>
    </div>
    <div class="card soft">
      <h3>Kenapa penting?</h3>
      <p class="muted">Sifat distributif adalah kunci untuk mengembangkan bentuk berkurung menjadi bentuk aljabar biasa, dan sebaliknya, untuk memfaktorkan kembali bentuk aljabar menjadi bentuk berkurung.</p>
    </div>
  </div>
`),

/* 5. DISTRIBUSI DENGAN VARIABEL */
slide('s-distribusi-variabel', `
  <div class="eyebrow">Konsep</div>
  <h2>Menerapkan distributif pada bentuk aljabar</h2>
  <div class="content-grid">
    <div class="card">
      <p>Kalikan bilangan di luar kurung dengan setiap suku di dalamnya, satu per satu.</p>
      <div class="formula">3(<span style="color:var(--amber)">x</span> <span class="op">+</span> 4) <span class="op">=</span> 3<span style="color:var(--amber)">x</span> <span class="op">+</span> 12</div>
    </div>
    <div class="card soft">
      <h3>Langkahnya</h3>
      <ul class="point-list">
        <li>3 × x = 3x</li>
        <li>3 × 4 = 12</li>
        <li>Gabungkan: 3x + 12</li>
      </ul>
    </div>
  </div>
`),

/* 6. DISTRIBUSI DENGAN KOEFISIEN NEGATIF */
slide('s-distribusi-negatif', `
  <div class="eyebrow">Perhatian Tanda</div>
  <h2>Distribusi dengan bilangan negatif</h2>
  <div class="content-grid">
    <div class="card">
      <p>Jika bilangan di luar kurung negatif, tanda setiap suku di dalam kurung akan berubah saat dikalikan.</p>
      <div class="formula">−2(<span style="color:var(--amber)">x</span> <span class="op">−</span> 5) <span class="op">=</span> −2<span style="color:var(--amber)">x</span> <span class="op">+</span> 10</div>
    </div>
    <div class="card soft">
      <h3>Langkahnya</h3>
      <ul class="point-list">
        <li>−2 × x = −2x</li>
        <li>−2 × (−5) = +10 &nbsp;(negatif × negatif = positif)</li>
        <li>Gabungkan: −2x + 10</li>
      </ul>
      <p class="muted">Kesalahan yang sering terjadi: lupa mengubah tanda suku kedua. Selalu periksa kembali tanda setiap suku!</p>
    </div>
  </div>
`),

/* 7. CONTOH SOAL 1 - STEP REVEAL */
slide('s-contoh1', `
  <div class="eyebrow">Contoh Soal 1</div>
  <h2>Selesaikan: 5(x + 4)</h2>
  <div class="card">
    <p class="muted">Klik tombol di bawah untuk mengungkap langkah penyelesaian satu per satu.</p>
    <div class="steps" id="steps1">
      <div class="step" data-step="0"><div class="step-label">LANGKAH 1</div>Kalikan suku pertama: 5 × x = 5x</div>
      <div class="step" data-step="1"><div class="step-label">LANGKAH 2</div>Kalikan suku kedua: 5 × 4 = 20</div>
      <div class="step" data-step="2"><div class="step-label">HASIL AKHIR</div>5(x + 4) = <b style="color:var(--green)">5x + 20</b></div>
    </div>
    <button class="btn primary" style="margin-top:14px" onclick="revealStep('steps1')">Tampilkan langkah berikutnya</button>
  </div>
`),

/* 8. LATIHAN MUDAH */
slide('s-latihan1', `
  <div class="eyebrow">Latihan</div>
  <h2>Latihan Mudah <span class="tag mudah">Level: Mudah</span></h2>
  <div class="content-grid">
    <div class="card">
      <h3>Soal 1</h3>
      <div class="formula">3(x + 5) = ?</div>
      <div class="mcq" data-answer="0">
        <button class="opt" onclick="checkMcq(this,true)">3x + 15</button>
        <button class="opt" onclick="checkMcq(this,false)">3x + 5</button>
        <button class="opt" onclick="checkMcq(this,false)">x + 15</button>
        <button class="opt" onclick="checkMcq(this,false)">3x + 8</button>
      </div>
      <div class="feedback"></div>
    </div>
    <div class="card">
      <h3>Soal 2</h3>
      <div class="formula">−2(x + 4) = ?</div>
      <div class="mcq" data-answer="0">
        <button class="opt" onclick="checkMcq(this,true)">−2x − 8</button>
        <button class="opt" onclick="checkMcq(this,false)">−2x + 8</button>
        <button class="opt" onclick="checkMcq(this,false)">2x − 8</button>
        <button class="opt" onclick="checkMcq(this,false)">−2x − 4</button>
      </div>
      <div class="feedback"></div>
    </div>
  </div>
`),

/* 9. VISUALISASI MODEL LUAS (AREA MODEL) - INTERACTIVE */
slide('s-area-model', `
  <div class="eyebrow">Visualisasi</div>
  <h2>Sifat distributif sebagai model luas persegi panjang</h2>
  <div class="card accent">
    <p>Bayangkan persegi panjang dengan tinggi <span class="term">a</span> dan lebar <span class="term">(b+c)</span>. Luas total sama dengan menjumlahkan dua persegi panjang kecil: <span class="term">ab</span> dan <span class="term">ac</span>.</p>
    <div class="slider-row">

stage.innerHTML = slidesHtml.join('');

/* ============ NAVIGATION ============ */
const slides = Array.from(document.querySelectorAll('.slide'));
let current = 0;

const dotsWrap = document.getElementById('dots');
slides.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'dotnav';
  b.onclick = () => goToSlide(i);
  dotsWrap.appendChild(b);
});
document.getElementById('totalNum').textContent = slides.length;

function render(){
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.querySelectorAll('.dotnav').forEach((d, i) => d.classList.toggle('active', i === current));
  document.getElementById('curNum').textContent = current + 1;
  document.getElementById('progressBar').style.width = ((current) / (slides.length - 1) * 100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === slides.length - 1 ? 'Selesai ✓' : 'Berikutnya →';
}
function goToSlide(i){
  if(i < 0 || i >= slides.length) return;
  current = i;
  render();
}
function nextSlide(){ if(current < slides.length - 1){ current++; render(); } }
function prevSlide(){ if(current > 0){ current--; render(); } }
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') nextSlide();
  if(e.key === 'ArrowLeft') prevSlide();
});
render();

/* ============ ACCORDION ============ */
function toggleAcc(id){
  document.getElementById(id).classList.toggle('open');
}

/* ============ STEP REVEAL ============ */
function revealStep(containerId){
  const container = document.getElementById(containerId);
  const steps = Array.from(container.querySelectorAll('.step'));
  const next = steps.find(s => !s.classList.contains('revealed'));
  if(next) next.classList.add('revealed');
}

/* ============ MCQ CHECK ============ */
function checkMcq(btn, isCorrect){
  const group = btn.parentElement;
  if(group.classList.contains('done')) return;
  group.classList.add('done');
  Array.from(group.children).forEach(opt => opt.classList.add('disabled'));
  const feedback = group.parentElement.querySelector('.feedback');
  if(isCorrect){
    btn.classList.add('correct');
    feedback.textContent = 'Benar! Jawabanmu tepat.';
    feedback.style.color = 'var(--green)';
  } else {
    btn.classList.add('wrong');
    Array.from(group.children).find(o => o.onclick.toString().includes('true'))?.classList.add('correct');
    feedback.textContent = 'Belum tepat. Coba periksa kembali langkah distribusinya.';
    feedback.style.color = 'var(--red)';
  }
}

/* ============ AREA MODEL (slide 9) ============ */
function updateAreaModel(){
  const a = parseInt(document.getElementById('aSlider').value);
  const b = parseInt(document.getElementById('bSlider').value);
  const c = parseInt(document.getElementById('cSlider').value);
  const unit = 22;
  const height = a * unit;
  const widthB = b * unit;
  const widthC = c * unit;
  const ab = a * b;
  const ac = a * c;

  document.getElementById('areaLabelRow').innerHTML = `
    <div class="area-label" style="width:${widthB}px">b = ${b}</div>
    <div class="area-label" style="width:${widthC}px">c = ${c}</div>
  `;
  document.getElementById('areaModel').innerHTML = `
    <div class="area-block ab" style="width:${widthB}px; height:${height}px;">${ab}</div>
    <div class="area-block ac" style="width:${widthC}px; height:${height}px;">${ac}</div>
  `;
  document.getElementById('areaFormula').innerHTML =
    `${a}(${b} + ${c}) = ${a}×${b} + ${a}×${c} = ${ab} + ${ac} = <span style="color:var(--green)">${ab + ac}</span>`;
}
setTimeout(updateAreaModel, 0);

/* ============ QUIZ ============ */
const quizQuestions = [
  { q:'4(x + 3) = ?', opts:['4x + 12','4x + 3','x + 12','4x + 7'], correct:0,
    exp:'4×x=4x dan 4×3=12, sehingga hasilnya 4x + 12.' },
  { q:'−3(x − 5) = ?', opts:['−3x + 15','−3x − 15','−3x + 5','3x − 15'], correct:0,
    exp:'−3×x=−3x dan −3×(−5)=+15, sehingga hasilnya −3x + 15.' },
  { q:'Sifat distributif menyatakan bahwa a(b + c) = ...', opts:['ab + ac','a + b + c','ab + c','a + bc'], correct:0,
    exp:'Sifat distributif: a(b+c) = ab + ac, setiap suku di dalam kurung dikalikan a.' },
  { q:'Sederhanakan: 2(x + 4) + 3(x + 1)', opts:['5x + 11','5x + 7','6x + 9','5x + 12'], correct:0,
    exp:'2(x+4)=2x+8 dan 3(x+1)=3x+3, digabung: (2x+3x)+(8+3)=5x+11.' },
  { q:'Sederhanakan: 5(x − 2) − 2(x − 1)', opts:['3x − 8','7x − 8','3x − 12','3x + 8'], correct:0,
    exp:'5(x−2)=5x−10 dan −2(x−1)=−2x+2, digabung: (5x−2x)+(−10+2)=3x−8.' },
  { q:'Bentuk 6x + 15 dapat difaktorkan (kebalikan distributif) menjadi ...', opts:['3(2x + 5)','3(2x + 15)','6(x + 15)','5(x + 3)'], correct:0,
    exp:'FPB dari 6 dan 15 adalah 3, sehingga 6x+15 = 3(2x+5).' },
  { q:'Sederhanakan: −2(3x − 4) + 5', opts:['−6x + 13','−6x + 9','−6x − 13','6x + 13'], correct:0,
    exp:'−2(3x−4)=−6x+8, ditambah 5 menjadi −6x+13.' },
  { q:'4(2x − 3) − 3(x − 5) = ?', opts:['5x + 3','5x − 27','11x − 27','5x − 3'], correct:0,
    exp:'4(2x−3)=8x−12 dan −3(x−5)=−3x+15, digabung: (8x−3x)+(−12+15)=5x+3.' },
];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(quizIndex >= quizQuestions.length){
    const pct = Math.round((quizScore / quizQuestions.length) * 100);
    area.innerHTML = `
      <h3 style="text-align:center">Kuis Selesai!</h3>
      <div class="score-ring" style="--pct:${pct}"><span>${pct}%</span></div>
      <p style="text-align:center" class="muted">Skor kamu: ${quizScore} dari ${quizQuestions.length} soal benar.</p>
      <div style="display:flex; justify-content:center; margin-top:10px;">
        <button class="btn primary" onclick="restartQuiz()">Ulangi Kuis</button>
      </div>
    `;
    return;
  }
  const item = quizQuestions[quizIndex];
  quizAnswered = false;
  area.innerHTML = `
    <div class="quiz-progress">Soal ${quizIndex + 1} dari ${quizQuestions.length}</div>
    <h3>${item.q}</h3>
    <div class="mcq" id="quizMcq">
      ${item.opts.map((o,i) => `<button class="opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="quizFeedback"></div>
    <div style="margin-top:14px; display:flex; justify-content:flex-end;">
      <button class="btn primary" id="quizNextBtn" onclick="nextQuiz()" disabled>Soal Berikutnya →</button>
    </div>
  `;
}
function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quizQuestions[quizIndex];
  const opts = Array.from(document.querySelectorAll('#quizMcq .opt'));
  opts.forEach(o => o.classList.add('disabled'));
  opts[item.correct].classList.add('correct');
  const fb = document.getElementById('quizFeedback');
  if(i === item.correct){
    quizScore++;
    fb.style.color = 'var(--green)';
    fb.textContent = 'Benar! ' + item.exp;
  } else {
    opts[i].classList.add('wrong');
    fb.style.color = 'var(--red)';
    fb.textContent = 'Belum tepat. ' + item.exp;
  }
  document.getElementById('quizNextBtn').disabled = false;
}
function nextQuiz(){
  quizIndex++;
  renderQuiz();
}
function restartQuiz(){
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}
renderQuiz();
</script>
