<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluasi Bab 7 — Statistika</title>

<style>
:root{
  --primary:#2563eb;
  --primary2:#4f46e5;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 18px 45px rgba(15,23,42,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-width:0;
  overflow-x:hidden;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f8fafc);
  color:var(--text);
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.65;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  font-weight:800;
  display:flex;
  gap:10px;
  align-items:center;
}

.brand-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  display:grid;
  place-items:center;
}

.top-info{
  font-size:13px;
  color:var(--muted);
}

/* ================= MAIN ================= */

main{
  width:min(1180px,calc(100% - 32px));
  margin:24px auto 112px;
  flex:1;
  min-width:0;
}

.slide{
  display:none;
  animation:slideIn .35s ease;
}

.slide.active{
  display:block;
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.card{
  width:100%;
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:clamp(18px,2.2vw,24px);
  box-shadow:var(--shadow);
  padding:clamp(18px,3vw,32px);
}

/* ================= COVER ================= */

.cover{
  min-height:clamp(500px,calc(100svh - 150px),720px);
  display:grid;
  place-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 20%,#dbeafe 0,transparent 35%),
    radial-gradient(circle at 85% 80%,#e0e7ff 0,transparent 35%),
    #fff;
}

.cover-inner{
  max-width:820px;
  width:100%;
  min-width:0;
}

.eyebrow{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  background:#eff6ff;
  color:var(--primary);
  font-size:13px;
  font-weight:800;
  margin-bottom:15px;
}

.cover h1{
  font-size:clamp(32px,6vw,58px);
  line-height:1.05;
  margin:8px 0;
}

.cover h2{
  font-size:20px;
  color:var(--muted);
  font-weight:600;
}

.stats{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin:25px 0;
}

.stat{
  padding:14px 18px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#f8fafc;
  font-weight:700;
}

.stat span{
  display:block;
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  margin-top:3px;
}

.topic-tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:18px;
}

.tag{
  padding:7px 10px;
  background:#f1f5f9;
  border-radius:999px;
  font-size:12px;
  color:#475569;
}

/* ================= BUTTON ================= */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 20px;
  font-weight:800;
  transition:.2s;
}

.btn:hover:not(:disabled){
  transform:translateY(-2px);
}

.primary{
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 9px 22px rgba(37,99,235,.22);
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

.ghost{
  background:#fff;
  border:1px solid var(--border);
  color:var(--text);
}

/* ================= QUESTION ================= */

.question-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:20px;
}

.q-number{
  font-size:13px;
  color:var(--primary);
  font-weight:900;
}

.progress-wrap{
  height:9px;
  background:#e8eef7;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  width:0;
  transition:.35s;
}

.question{
  font-size:clamp(18px,2.5vw,28px);
  line-height:1.45;
  margin:10px 0 25px;
  font-weight:750;
  overflow-wrap:anywhere;
  word-break:normal;
}

.options{
  display:grid;
  gap:12px;
}

.option{
  width:100%;
  max-width:100%;
  min-width:0;
  text-align:left;
  padding:clamp(13px,2vw,17px) clamp(13px,2.2vw,18px);
  border:2px solid var(--border);
  background:#fff;
  border-radius:16px;
  display:flex;
  gap:13px;
  align-items:flex-start;
  transition:.2s;
  overflow-wrap:anywhere;
}

.option:hover:not(:disabled){
  border-color:#93c5fd;
  background:#f8fbff;
}

.letter{
  min-width:31px;
  height:31px;
  border-radius:10px;
  background:#eff6ff;
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:900;
}

.option.correct{
  border-color:#86efac;
  background:#f0fdf4;
}

.option.correct .letter{
  background:#dcfce7;
  color:var(--success);
}

.option.wrong{
  border-color:#fca5a5;
  background:#fef2f2;
}

.option.wrong .letter{
  background:#fee2e2;
  color:var(--danger);
}

.feedback{
  margin-top:18px;
  border-radius:16px;
  padding:17px;
  display:none;
}

.feedback.show{
  display:block;
}

.feedback.ok{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

.feedback.no{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.feedback strong{
  display:block;
  margin-bottom:6px;
}

.discussion{
  margin-top:8px;
  color:#334155;
}

/* ================= NAVIGATION ================= */

.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:25px;
}

.nav-right{
  margin-left:auto;
}

/* ================= ESSAY ================= */

.essay-title,
.section-title{
  font-size:30px;
  margin:0 0 8px;
}

.muted{
  color:var(--muted);
}

.essay-card{
  margin-top:18px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#fafcff;
}

.essay-card h3{
  margin:0 0 10px;
}

.essay-card textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:2px solid var(--border);
  border-radius:15px;
  padding:14px;
  outline:none;
  background:#fff;
}

.essay-card textarea:focus{
  border-color:#93c5fd;
}

.score-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.score-row input{
  width:90px;
  padding:10px;
  border:2px solid var(--border);
  border-radius:10px;
}

.score-hint{
  font-size:12px;
  color:var(--muted);
}

/* ================= ACCORDION ================= */

.accordion{
  border:1px solid var(--border);
  border-radius:15px;
  margin:10px 0;
  overflow:hidden;
}

.acc-btn{
  width:100%;
  border:0;
  background:#f8fafc;
  padding:16px;
  text-align:left;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.acc-content{
  display:none;
  padding:17px;
  border-top:1px solid var(--border);
  line-height:1.65;
}

.accordion.open .acc-content{
  display:block;
}

/* ================= RESULT ================= */

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));
  gap:13px;
  margin:22px 0;
}

.result-box{
  min-width:0;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  background:#f8fafc;
  overflow-wrap:anywhere;
}

.result-box small{
  display:block;
  color:var(--muted);
  margin-bottom:6px;
}

.result-box b{
  font-size:25px;
}

.score-main{
  text-align:center;
  padding:30px;
  border-radius:20px;
  background:linear-gradient(135deg,#eff6ff,#eef2ff);
  margin-bottom:20px;
}

.score-main .big{
  font-size:65px;
  font-weight:900;
  color:var(--primary);
}

.category{
  font-size:22px;
  font-weight:900;
}

.analysis{
  border-left:5px solid var(--primary);
  background:#f8fafc;
  padding:18px;
  border-radius:12px;
  line-height:1.7;
}

/* ================= RESULT ACTIONS ================= */

.result-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}

.result-actions .btn{
  flex:1 1 180px;
  min-width:0;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px max(10px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));
  z-index:90;
}

.bottom-inner{
  width:min(1180px,100%);
  min-width:0;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.dots{
  display:flex;
  gap:5px;
  overflow-x:auto;
  overflow-y:hidden;
  flex:1 1 auto;
  min-width:0;
  padding:4px;
  scrollbar-width:thin;
}

.dot{
  flex:0 0 30px;
  min-width:30px;
  height:30px;
  border:0;
  border-radius:9px;
  background:#e2e8f0;
  color:#475569;
  font-size:11px;
  font-weight:800;
}

.dot.active{
  background:var(--primary);
  color:#fff;
}

.dot.done{
  background:#dcfce7;
  color:#166534;
}

.hidden{
  display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topbar{
    height:58px;
    padding:0 12px;
  }

  .brand{
    gap:8px;
    min-width:0;
  }

  .brand-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    flex:0 0 34px;
  }

  .brand span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14px;
  }

  .top-info{
    display:none;
  }

  main{
    width:calc(100% - 16px);
    margin:12px auto calc(96px + env(safe-area-inset-bottom));
  }

  .card{
    padding:18px 15px;
    border-radius:18px;
  }

  .cover{
    min-height:calc(100svh - 105px);
    padding:20px 8px;
  }

  .cover h1{
    font-size:clamp(30px,9vw,42px);
    line-height:1.05;
  }

  .cover h2{
    font-size:17px;
  }

  .stats{
    gap:8px;
    margin:20px 0;
  }

  .stat{
    padding:11px 13px;
    font-size:14px;
  }

  .tag{
    font-size:11px;
    padding:6px 8px;
  }

  .question-head{
    align-items:flex-start;
    margin-bottom:15px;
  }

  .q-number{
    font-size:12px;
  }

  .question{
    font-size:clamp(18px,5.2vw,22px);
    margin:8px 0 20px;
  }

  .options{
    gap:9px;
  }

  .option{
    padding:12px 11px;
    gap:9px;
    border-radius:13px;
  }

  .letter{
    min-width:29px;
    width:29px;
    height:29px;
    border-radius:9px;
  }

  .feedback{
    padding:13px;
    font-size:14px;
  }

  .essay-title,
  .section-title{
    font-size:clamp(22px,7vw,28px);
  }

  .essay-card{
    padding:14px;
  }

  .essay-card textarea{
    min-height:120px;
  }

  .score-row{
    flex-wrap:wrap;
  }

  .score-row input{
    width:78px;
  }

  .result-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .result-box{
    padding:13px;
  }

  .result-box b{
    font-size:21px;
  }

  .score-main{
    padding:22px 14px;
  }

  .score-main .big{
    font-size:clamp(46px,14vw,58px);
  }

  .analysis{
    padding:14px;
    font-size:14px;
  }

  .result-actions{
    flex-direction:column;
  }

  .result-actions .btn{
    width:100%;
    flex:1 1 auto;
  }

  .bottom-nav{
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  }

  .bottom-inner{
    gap:5px;
  }

  .bottom-inner .btn{
    flex:0 1 auto;
    min-width:0;
    white-space:nowrap;
    padding:9px 10px;
    font-size:12px;
    border-radius:11px;
  }

  .dots{
    gap:4px;
    padding:3px 2px;
  }

  .dot{
    flex:0 0 27px;
    min-width:27px;
    height:27px;
    border-radius:8px;
    font-size:10px;
  }
}

@media(max-width:420px){

  .topbar{
    height:54px;
  }

  .brand-icon{
    width:31px;
    height:31px;
    flex-basis:31px;
  }

  main{
    width:calc(100% - 10px);
  }

  .card{
    padding:15px 12px;
  }

  .bottom-inner .btn{
    padding:8px 8px;
    font-size:11px;
  }

  .dot{
    flex-basis:25px;
    min-width:25px;
    height:25px;
    font-size:9px;
  }
}

@media(max-width:350px){

  .bottom-inner{
    gap:3px;
  }

  .bottom-inner .btn{
    padding:8px 6px;
    font-size:10px;
  }

  .dot{
    flex-basis:23px;
    min-width:23px;
    height:23px;
  }
}

</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">∑</div>
    <span id="brandTitle">Evaluasi Pembelajaran</span>
  </div>

  <div class="top-info" id="topInfo"></div>
</header>

<main id="slides"></main>

<div class="bottom-nav hidden" id="bottomNav">
  <div class="bottom-inner">

    <button class="btn ghost" id="prevBtn">
      ← Sebelumnya
    </button>

    <div class="dots" id="dots"></div>

    <button class="btn primary" id="nextBtn">
      Berikutnya →
    </button>

  </div>
</div>

</div>

<script>

/* ==========================================================
   DATA MATERI
   CUKUP UBAH BAGIAN INI
   ========================================================== */

const SUBJECT = "MATEMATIKA";

const CLASS_PHASE = "KELAS 7 / FASE D";

const CHAPTER = "Bab 7 — Statistika";

const SUBMATERIALS = [
  "Konsep dasar statistika",
  "Pengumpulan dan pengorganisasian data",
  "Tabel frekuensi",
  "Diagram batang",
  "Diagram garis",
  "Diagram lingkaran",
  "Mean",
  "Median",
  "Modus",
  "Analisis dan interpretasi data",
  "Pemecahan masalah statistika"
];


/* JUMLAH SOAL */

const PG_COUNT = 15;

const ESSAY_COUNT = 5;


/* ==========================================================
   LINK NAVIGASI
   GANTI DENGAN LINK ASLI
   ========================================================== */

const NEXT_BAB_URL = "infob-bab8.html";

const DASHBOARD_URL = "index.html";


/* ==========================================================
   BANK SOAL PILIHAN GANDA
   ========================================================== */

const questions = [

{
  question:"Dalam statistika, kumpulan seluruh objek yang menjadi sasaran penelitian disebut ...",
  options:[
    "Sampel",
    "Populasi",
    "Frekuensi",
    "Variabel"
  ],
  answer:1,
  discussion:"Populasi adalah seluruh objek atau anggota yang menjadi sasaran penelitian. Sampel adalah sebagian anggota populasi."
},

{
  question:"Seorang guru ingin mengetahui cara siswa datang ke sekolah. Data diperoleh dengan menanyakan langsung kepada siswa. Cara pengumpulan data tersebut adalah ...",
  options:[
    "Observasi",
    "Wawancara/kuesioner",
    "Eksperimen",
    "Menggambar diagram"
  ],
  answer:1,
  discussion:"Data dapat dikumpulkan dengan bertanya kepada responden melalui wawancara atau kuesioner."
},

{
  question:"Data jumlah buku yang dibaca 10 siswa adalah 2, 3, 2, 4, 3, 2, 5, 3, 4, 2. Frekuensi nilai 2 adalah ...",
  options:[
    "2",
    "3",
    "4",
    "5"
  ],
  answer:2,
  discussion:"Nilai 2 muncul empat kali, sehingga frekuensinya adalah 4."
},

{
  question:"Sebuah diagram batang menunjukkan banyak siswa yang memilih olahraga: sepak bola 12, basket 8, dan bulu tangkis 10. Olahraga yang paling banyak dipilih adalah ...",
  options:[
    "Basket",
    "Bulu tangkis",
    "Sepak bola",
    "Semua sama"
  ],
  answer:2,
  discussion:"Batang tertinggi adalah sepak bola dengan 12 siswa."
},

{
  question:"Data suhu sebuah kota selama lima hari adalah 29°C, 30°C, 31°C, 30°C, dan 32°C. Diagram yang paling tepat untuk menunjukkan perubahan suhu dari hari ke hari adalah ...",
  options:[
    "Diagram garis",
    "Diagram lingkaran",
    "Diagram batang tunggal tanpa urutan waktu",
    "Tabel frekuensi saja"
  ],
  answer:0,
  discussion:"Diagram garis cocok untuk menunjukkan perubahan atau kecenderungan data yang memiliki urutan waktu."
},

{
  question:"Dalam diagram lingkaran, seluruh data mewakili 360°. Jika 25% siswa memilih kegiatan membaca, besar sudut sektornya adalah ...",
  options:[
    "45°",
    "60°",
    "90°",
    "120°"
  ],
  answer:2,
  discussion:"25% × 360° = 90°. Jadi sektor untuk kegiatan membaca besarnya 90°."
},

{
  question:"Rata-rata dari data 6, 7, 8, 9, dan 10 adalah ...",
  options:[
    "7",
    "8",
    "9",
    "10"
  ],
  answer:1,
  discussion:"Mean = (6 + 7 + 8 + 9 + 10) ÷ 5 = 40 ÷ 5 = 8."
},

{
  question:"Median dari data 4, 9, 6, 7, dan 5 adalah ...",
  options:[
    "5",
    "6",
    "7",
    "9"
  ],
  answer:1,
  discussion:"Urutkan data menjadi 4, 5, 6, 7, 9. Nilai tengahnya adalah 6."
},

{
  question:"Modus dari data 5, 7, 6, 5, 8, 7, 5, 9 adalah ...",
  options:[
    "5",
    "6",
    "7",
    "8"
  ],
  answer:0,
  discussion:"Nilai 5 muncul tiga kali, lebih banyak daripada nilai lainnya. Jadi modusnya 5."
},

{
  question:"Nilai ulangan lima siswa adalah 70, 80, 80, 90, dan 100. Pernyataan yang benar adalah ...",
  options:[
    "Mean = 80 dan modus = 90",
    "Mean = 84 dan modus = 80",
    "Median = 84 dan modus = 70",
    "Mean = 90 dan median = 80"
  ],
  answer:1,
  discussion:"Jumlah data 420, sehingga mean = 420 ÷ 5 = 84. Median dan modusnya adalah 80."
},

{
  question:"Data jumlah pengunjung perpustakaan selama empat hari adalah Senin 20, Selasa 25, Rabu 18, Kamis 27. Kesimpulan yang tepat adalah ...",
  options:[
    "Pengunjung selalu meningkat",
    "Kamis memiliki jumlah pengunjung terbanyak",
    "Rabu memiliki jumlah pengunjung terbanyak",
    "Selasa dan Kamis sama"
  ],
  answer:1,
  discussion:"Jumlah terbesar adalah 27 pada hari Kamis, sehingga Kamis memiliki pengunjung terbanyak."
},

{
  question:"Sebuah kelas memiliki data tinggi badan 10 siswa. Guru ingin mengetahui tinggi badan yang paling sering muncul. Ukuran pemusatan yang paling tepat adalah ...",
  options:[
    "Mean",
    "Median",
    "Modus",
    "Rentang"
  ],

function clampCount(count,length){
  return Math.max(
    0,
    Math.min(Number(count) || 0,length)
  );
}

  questions.slice(

    clampCount(PG_COUNT,questions.length)

function escapeHTML(str){

  return String(str).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}

/* ==========================================================

   ========================================================== */

function renderDots(){

  const d = $("dots");

  d.innerHTML = "";

  slides.forEach((_,i)=>{

    const b = document.createElement("button");

    b.className = "dot";

    b.textContent = i + 1;

    b.id = `dot-${i}`;

    b.addEventListener(
      "click",
      () => {

        /* Slide dapat diklik hanya jika evaluasi sudah dimulai */
        if(i === 0 || started){
          show(i);
        }

      }
    );

    d.appendChild(b);

  });
}


/* ==========================================================
   TAMPILKAN SLIDE
   ========================================================== */

function show(i){

  if(!slides.length) return;

  current = Math.max(
    0,
    Math.min(
      Number(i) || 0,
      slides.length - 1
    )
  );


  slides.forEach(
    (s,k) => s.classList.toggle(
      "active",
      k === current
    )
  );


  const nav = $("bottomNav");

  if(nav){

    nav.classList.toggle(
      "hidden",
      current === 0
    );

  }


  const prev = $("prevBtn");

  const next = $("nextBtn");


  if(prev){

    prev.disabled =
      current <= 1;

  }


  if(next){

    if(current === slides.length - 1){

      next.textContent = "Selesai";

    }
    else if(current === slides.length - 2){

      next.textContent = "Lihat Hasil →";

    }
    else{

      next.textContent = "Berikutnya →";

    }

  }


  document
    .querySelectorAll(".dot")
    .forEach((d,k)=>{

      d.classList.toggle(
        "active",
        k === current
      );

      d.classList.toggle(
        "done",
        k < current
      );

    });


  /* Pulihkan tampilan jawaban */
  if(
    current >= 1 &&
    current <= activeQuestions.length
  ){

    restoreAnswer(current - 1);

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ==========================================================
   MULAI
   ========================================================== */

function startEvaluation(){

  started = true;

  if(activeQuestions.length > 0){

    show(1);

  }
  else if(activeEssays.length > 0){

    show(1);

  }
  else{

    show(1);

  }
}


/* ==========================================================
   NEXT
   ========================================================== */

function nextSlide(){

  /*
   * Jika sedang di soal PG,
   * pengguna boleh lanjut walaupun belum menjawab.
   */

  if(
    current >= 1 &&
    current <= activeQuestions.length
  ){

    const questionIndex =
      current - 1;

    saveEssayInputs();

    show(current + 1);

    return;
  }


  if(current < slides.length - 1){

    saveEssayInputs();

    if(current === slides.length - 2){

      calculateResult();

    }

    show(current + 1);

  }

}


/* ==========================================================
   PREVIOUS
   ========================================================== */

function prevSlide(){

  saveEssayInputs();

  if(current > 1){

    show(current - 1);

  }
  else if(current === 1){

    show(0);

  }

}


/* ==========================================================
   JAWAB PG
   ========================================================== */

function answerPG(i,j){

  const q = activeQuestions[i];

  if(!q) return;

  if(
    !Array.isArray(q.options) ||
    j < 0 ||
    j >= q.options.length
  ){

    return;

  }


  /* Jawaban hanya boleh dipilih satu kali */

  if(answers[i] !== undefined){

    return;

  }


  answers[i] = j;


  const correct =
    j === q.answer;


  q.options.forEach((_,k)=>{

    const b =
      $(`opt-${i}-${k}`);

    if(!b) return;

    b.disabled = true;


    if(k === q.answer){

      b.classList.add("correct");

    }


    if(
      k === j &&
      !correct
    ){

      b.classList.add("wrong");

    }

  });


  const fb =
    $(`feedback-${i}`);


  if(fb){

    fb.className =
      `feedback show ${
        correct ? "ok" : "no"
      }`;


    fb.innerHTML = `

      <strong>
        ${
          correct
            ? "✓ Jawaban Benar"
            : "✕ Jawaban Salah"
        }
      </strong>

      ${
        !correct
          ? `
            <div>
              Jawaban benar:
              <b>
                ${String.fromCharCode(65+q.answer)}.
                ${escapeHTML(q.options[q.answer])}
              </b>
            </div>
          `
          : ""
      }

      <div class="discussion">
        <b>Pembahasan:</b>
        ${escapeHTML(q.discussion)}
      </div>

    `;

  }


  const status =
    $(`status-${i}`);


  if(status){

    status.textContent =
      correct
        ? "✓ Benar"
        : "✕ Salah";

    status.style.color =
      correct
        ? "var(--success)"
        : "var(--danger)";

  }


  const bar =
    $(`bar-${i}`);


  if(bar){

    bar.style.width = "100%";

  }


  updateDotForQuestion(i);
}

/* ==========================================================
   SKOR ESAI
   ========================================================== */

function setScore(i,v){

  const q =
    activeEssays[i];

  if(!q) return;


  let n =
    Number(v);


  if(!Number.isFinite(n)){

    n = 0;

  }


  n = Math.max(
    0,
    Math.min(
      q.maxScore,
      Math.round(n)
    )
  );


  essayScores[i] = n;


  const input =
    $(`score-${i}`);


  if(input){

    input.value = n;

  }

}


/* ==========================================================
   SIMPAN JAWABAN ESAI
   ========================================================== */

function saveEssayInputs(){

  activeEssays.forEach((_,i)=>{

    const textarea =
      $(`essay-${i}`);

    if(textarea){

      essayAnswers[i] =
        textarea.value;

    }


    const score =
      $(`score-${i}`);

    if(score){

      setScore(
        i,
        score.value
      );

    }

  });

}

   JAWABAN ESAI

let essayAnswers = {};


/* ==========================================================
   HASIL
   ========================================================== */

function calculateResult(){

  /*
   * PG
   */

  const correct =
    activeQuestions.reduce(
      (n,q,i) =>
        n +
        (answers[i] === q.answer ? 1 : 0),
      0
    );


  const wrong =
    activeQuestions.length - correct;


  const unanswered =
    activeQuestions.reduce(
      (n,_,i) =>
        n +
        (answers[i] === undefined ? 1 : 0),
      0
    );


  const pgValue =
    activeQuestions.length
      ? (correct / activeQuestions.length) * 100
      : 0;


  /*
   * ESAI
   */

  const essayMax =
    activeEssays.reduce(
      (n,q) =>
        n + Number(q.maxScore || 0),
      0
    );


  const essayGot =
    activeEssays.reduce(
      (n,_,i) =>
        n + Number(essayScores[i] || 0),
      0
    );


  const essayValue =
    essayMax
      ? (essayGot / essayMax) * 100
      : 0;


  /*
   * NILAI AKHIR
   *
   * Jika PG dan esai tersedia:
   * PG = 50%
   * Esai = 50%
   *
   * Jika hanya salah satu yang tersedia,
   * nilainya menggunakan bagian tersebut.
   */

  let final = 0;


  if(
    activeQuestions.length > 0 &&
    activeEssays.length > 0
  ){

    final =
      (pgValue * 0.5) +
      (essayValue * 0.5);

  }
  else if(activeQuestions.length > 0){

    final = pgValue;

  }
  else if(activeEssays.length > 0){

    final = essayValue;

  }


  /*
   * KATEGORI
   */

  let cat;

  let msg;


  if(final >= 85){

    cat = "Sangat Baik";

    msg =
      "Pemahaman terhadap materi sudah sangat baik. Pertahankan hasil belajar dan lanjutkan ke materi berikutnya.";

  }
  else if(final >= 70){

    cat = "Baik";

    msg =
      "Pemahaman sudah baik, tetapi masih terdapat beberapa bagian yang perlu diperkuat.";

  }
  else if(final >= 55){

    cat = "Cukup";

    msg =
      "Beberapa konsep sudah dipahami, tetapi perlu latihan tambahan dan meninjau kembali submateri yang belum dikuasai.";

  }
  else{

    cat = "Perlu Bimbingan";

    msg =
      "Pelajari kembali submateri yang belum dikuasai, kemudian lakukan latihan ulang secara bertahap.";

  }


  const result =
    $("resultContent");


  if(!result) return;


  result.innerHTML = `

    <div class="score-main">

      <div class="muted">
        NILAI AKHIR
      </div>

      <div class="big">
        ${final.toFixed(1)}
      </div>

      <div class="category">
        ${cat}
      </div>

    </div>


    <div class="result-grid">

      <div class="result-box">
        <small>Benar</small>
        <b>${correct}</b>
      </div>

      <div class="result-box">
        <small>Salah</small>
        <b>${wrong}</b>
      </div>

      <div class="result-box">
        <small>Belum Dijawab</small>
        <b>${unanswered}</b>
      </div>

      <div class="result-box">
        <small>Nilai Pilihan Ganda</small>
        <b>${pgValue.toFixed(1)}</b>
      </div>

      <div class="result-box">
        <small>Nilai Esai</small>
        <b>${essayValue.toFixed(1)}</b>
      </div>

      <div class="result-box">
        <small>Skor Esai</small>
        <b>${essayGot}/${essayMax}</b>
      </div>

    </div>


    <div class="analysis">

      <b>
        📊 Analisis Hasil — ${cat}
      </b>

      <br>

      ${msg}

    </div>

  `;
}

  answers = {};

  essayAnswers = {};

  started = false;

  build();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================================
   DASHBOARD
   ========================================================== */

function goDashboard(){

  if(
    DASHBOARD_URL &&
    !DASHBOARD_URL.startsWith("[")
  ){

    window.location.href =
      DASHBOARD_URL;

  }
  else{

    alert(
      "Silakan isi DASHBOARD_URL pada bagian DATA MATERI."
    );

  }

}


/* ==========================================================
   BAB BERIKUTNYA
   ========================================================== */

function goNext(){

  if(
    NEXT_BAB_URL &&
    !NEXT_BAB_URL.startsWith("[")
  ){

    window.location.href =
      NEXT_BAB_URL;

  }
  else{

    alert(
      "Silakan isi NEXT_BAB_URL pada bagian DATA MATERI."
    );

  }

}


/* ==========================================================
   EVENT CLICK
   ========================================================== */

document.addEventListener(
  "click",
  function(e){

    const actionEl =
      e.target.closest("[data-action]");

    if(!actionEl) return;


    const action =
      actionEl.dataset.action;


    if(action === "start"){

      startEvaluation();

    }

    else if(action === "next"){

      nextSlide();

    }

    else if(action === "prev"){

      prevSlide();

    }

    else if(action === "answer"){

      answerPG(
        Number(actionEl.dataset.q),
        Number(actionEl.dataset.choice)
      );

    }

    else if(action === "restart"){

      restart();

    }

    else if(action === "dashboard"){

      goDashboard();

    }

    else if(action === "nextchapter"){

      goNext();

    }

    else if(action === "accordion"){

      const box =
        actionEl.closest(".accordion");

      if(box){

        box.classList.toggle("open");

        const icon =
          actionEl.querySelector("span");

        if(icon){

          icon.textContent =
            box.classList.contains("open")
              ? "−"
              : "＋";

        }

      }

    }

  }
);


/* ==========================================================
   EVENT CHANGE
   ========================================================== */

document.addEventListener(
  "change",
  function(e){

    const input =
      e.target.closest("[data-score-index]");

    if(!input) return;


    setScore(
      Number(input.dataset.scoreIndex),
      input.value
    );

  }
);


/* ==========================================================
   EVENT INPUT
   ========================================================== */

document.addEventListener(
  "input",
  function(e){

    const textarea =
      e.target.closest("textarea");

    if(!textarea) return;


    const match =
      textarea.id.match(/^essay-(\d+)$/);

    if(match){

      essayAnswers[
        Number(match[1])
      ] = textarea.value;

    }

  }
);


/* ==========================================================
   NAVIGASI BAWAH
   ========================================================== */

function initNavigation(){

  const prev =
    $("prevBtn");

  const next =
    $("nextBtn");


  if(prev){

    prev.addEventListener(
      "click",
      prevSlide
    );

  }


  if(next){

    next.addEventListener(
      "click",
      nextSlide
    );

  }

}


/* ==========================================================
   INIT
   ========================================================== */

function initEvaluation(){

  initNavigation();

  build();

}


if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initEvaluation
  );

}
else{

  initEvaluation();

}

</script>
