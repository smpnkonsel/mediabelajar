<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tarik Tambang Matematika — Operasi Bilangan Bulat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#EAF2FF;
    --bg-bottom:#F6F0FF;
    --ink:#1C2541;
    --ink-soft:#4B5570;
    --ink-faint:#8892AC;

    --biru:#2E5CE6;
    --biru-dark:#1B3B99;
    --biru-soft:#E7EEFE;

    --merah:#E63950;
    --merah-dark:#A81C31;
    --merah-soft:#FDEAEC;

    --gold:#F2B705;
    --success:#1FA363;
    --white:#FFFFFF;

    --rope:#C99A54;
    --rope-dark:#8C6A38;
    --skin:#FFD9B3;

    --shadow: 0 2px 4px rgba(28,37,65,0.06), 0 16px 34px -16px rgba(28,37,65,0.28);
    --radius: 20px;

    --display-font:'Baloo 2', system-ui, sans-serif;
    --body-font:'Nunito', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--body-font);
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, #DCE9FF 0%, transparent 60%),
      radial-gradient(1200px 500px at 90% 110%, #F3E4FF 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    /* Everything below is sized with vh units so it scales down on short
       screens instead of overflowing — that's what lets us keep this
       locked to one screen with no scrollbar. */
    height:100vh;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    display:flex;
    flex-direction:column;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  .wrap{
    max-width:1240px;
    width:100%;
    height:100%;
    margin:0 auto;
    padding:clamp(10px,2.6vh,26px) clamp(14px,3vw,32px);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  /* ===== Header ===== */
  header{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:2px;
    margin-bottom:clamp(6px,1.6vh,14px);
    flex:0 0 auto;
  }
  .titleblock h1{
    font-family:var(--display-font);
    font-weight:800;
    font-size:clamp(20px,3vw,32px);
    margin:0;
    color:var(--ink);
    letter-spacing:0.2px;
    line-height:1.25;
  }
  .titleblock h1 .num{ color:var(--gold); -webkit-text-stroke:1.5px var(--ink); }
  .titleblock p{
    margin:0; font-size:13px; color:var(--ink-soft); font-weight:700;
  }

  /* ===== Main stage: panel | rope | panel ===== */
  .stage{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns: minmax(210px, 280px) minmax(220px, 380px) minmax(210px, 280px);
    gap:16px;
    align-items:center;
    align-content:center;
    justify-content:center;
    padding-bottom:6px;
  }
  @media (max-width:880px){
    .stage{ grid-template-columns:1fr; grid-template-rows:auto auto auto; overflow-y:auto; }
    .rope-col{ order:2; }
    .panel.biru{ order:1; }
    .panel.merah{ order:3; }
  }

  .panel{
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(12px,2.2vh,22px) clamp(14px,1.6vw,20px) clamp(10px,1.8vh,20px);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.1vh,10px);
  }
  .panel.biru{ background: linear-gradient(160deg, var(--biru) 0%, var(--biru-dark) 100%); }
  .panel.merah{ background: linear-gradient(160deg, var(--merah) 0%, var(--merah-dark) 100%); }

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
    gap:6px 10px;
    flex:0 0 auto;
  }

  .panel-body{
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1.1vh,10px);
    min-height:0;
  }
  .team-badge{
    font-family:var(--display-font); font-weight:800; font-size:14px;
    color:#fff; letter-spacing:0.4px;
    display:flex; align-items:center; gap:7px;
    white-space:nowrap;
  }
  .team-badge .dot{ width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.28); flex:0 0 auto; }
  .correct-count{
    font-family:var(--body-font); font-weight:800; font-size:11.5px;
    color:#fff; background:rgba(255,255,255,0.18);
    padding:4px 10px; border-radius:999px;
    white-space:nowrap;
  }

  .question-box{
    background:rgba(255,255,255,0.96);
    border-radius:16px;
    padding:clamp(6px,1.4vh,16px) 14px;
    text-align:center;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
  }
  .question-box .q{
    font-family:var(--display-font); font-weight:800;
    font-size:clamp(22px,3.6vh,32px);
    color:var(--ink);
    letter-spacing:0.5px;
    line-height:1.3;
    word-break:keep-all;
  }
  .question-box .q sup{
    font-size:0.62em;
    font-weight:800;
    color:var(--gold);
    -webkit-text-stroke:0.6px var(--ink);
    vertical-align:super;
    margin-left:1px;
  }
  .question-box .hint{
    display:block;
    font-family:var(--body-font);
    font-weight:800;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .question-box .hint .b{ color:var(--ink-soft); }
  .question-box .hint .e{ color:#B8890A; }
  .answer-display{
    background:rgba(255,255,255,0.96);
    border-radius:14px;
    padding:clamp(6px,1.2vh,12px) 14px;
    text-align:right;
    font-family:var(--display-font); font-weight:800;
    font-size:clamp(16px,2.6vh,22px);
    color:var(--ink);
    min-height:20px;
    letter-spacing:1px;
    flex:0 0 auto;
    width:100%;
    max-width:210px;
    margin:0 auto;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
  }
  .answer-display.placeholder{ color:#B7BDCF; font-size:clamp(12px,1.8vh,15px); }
  .answer-display.shake{ animation: shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(5px); }
  }

  .feedback{
    text-align:center;
    font-family:var(--display-font); font-weight:700; font-size:13px;
    min-height:18px;
    color:#fff;
    opacity:0;
    transition:opacity .2s ease;
    flex:0 0 auto;
  }
  .feedback.show{ opacity:1; }
  .feedback.good{ color:#CFF7DE; }
  .feedback.bad{ color:#FFE0E4; }

  .keypad{
    /* height-driven (not width-driven): scales with viewport height so it
       shrinks on short screens instead of pushing the panel taller than
       the screen */
    flex:0 0 auto;
    height:clamp(110px,26vh,190px);
    width:auto;
    max-width:min(100%,210px);
    aspect-ratio: 3 / 4;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(4, 1fr);
    gap:clamp(4px,0.8vh,8px);
  }
  .key{
    font-family:var(--display-font); font-weight:700; font-size:clamp(13px,2vh,17px);
    background:rgba(255,255,255,0.94);
    color:var(--ink);
    border:none; border-radius:11px;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,0.12);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .key:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.12); }
  .key.zero{ grid-column:2; }
  .key.clear{ background:rgba(255,255,255,0.6); color:#fff; font-size:0.85em; }

  .go-btn{
    display:block;
    width:100%;
    max-width:210px;
    margin:0 auto;
    font-family:var(--display-font); font-weight:800;
    font-size:clamp(15px,2.4vh,19px);
    background:var(--gold); color:var(--ink);
    border:none; border-radius:12px;
    padding:clamp(8px,1.4vh,12px) 0;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .go-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.15); }

  /* ===== Rope column ===== */
  .rope-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(8px,1.6vh,16px);
    min-height:0;
  }
  .rope-col svg{ width:100%; max-width:380px; height:auto; }
  .status-line{
    text-align:center;
    font-family:var(--display-font);
    font-weight:700;
    font-size:clamp(12px,1.8vh,15px);
    color:var(--ink-soft);
    letter-spacing:0.2px;
  }
  .status-line strong{ color:var(--ink); }

  #knotGroup{ transition: transform .55s cubic-bezier(.34,1.56,.64,1); }
  #knotGroup.pulse{ animation: pulse-knot .5s ease; }
  @keyframes pulse-knot{
    0%{ transform: scale(1); } 40%{ transform: scale(1.35); } 100%{ transform: scale(1); }
  }

  .footer-bar{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(6px,1.2vh,12px);
    padding-top:clamp(6px,1.6vh,14px);
    flex:0 0 auto;
  }
  .caption{
    text-align:center;
    font-family:var(--display-font);
    font-weight:700;
    font-size:clamp(12px,1.7vh,15px);
    color:var(--ink-soft);
  }
  .footer-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .reset-btn, .finish-btn{
    font-family:var(--body-font); font-weight:800; font-size:13.5px;
    border-radius:14px;
    padding:9px 18px; cursor:pointer;
    box-shadow:var(--shadow);
    display:inline-flex; align-items:center; gap:8px;
    white-space:nowrap;
    text-decoration:none;
    transition:transform .12s ease, border-color .15s ease, background .15s ease;
    border:2px solid transparent;
  }
  .reset-btn{
    background:var(--white); color:var(--ink);
    border-color:#D8E0F2;
  }
  .reset-btn:hover{ border-color:var(--ink); transform:translateY(-1px); }
  .reset-btn:active{ transform:translateY(0); }

  .finish-btn{
    background:var(--success); color:#fff;
    border-color:var(--success);
  }
  .finish-btn:hover{ background:#178853; transform:translateY(-1px); }
  .finish-btn:active{ transform:translateY(0); }

  /* ===== Winner modal ===== */
  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,26,48,0.55);
    display:none; align-items:center; justify-content:center;
    padding:20px;
    overflow-y:auto;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    background:#fff; border-radius:26px;
    padding:38px 34px; text-align:center;
    max-width:380px; width:100%;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.4);
    animation: pop-in .35s cubic-bezier(.34,1.56,.64,1);
    margin:auto;
  }
  @keyframes pop-in{
    from{ opacity:0; transform:scale(0.8) translateY(10px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  .modal-card .trophy{ font-size:52px; margin-bottom:6px; }
  .modal-card h2{
    font-family:var(--display-font); font-weight:800; font-size:26px;
    margin:0 0 8px;
    line-height:1.3;
  }
  .modal-card h2.biru{ color:var(--biru-dark); }
  .modal-card h2.merah{ color:var(--merah-dark); }
  .modal-card p{ color:var(--ink-soft); font-weight:700; margin:0 0 22px; font-size:14.5px; line-height:1.4; }
  .modal-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .play-again{
    font-family:var(--display-font); font-weight:800; font-size:16px;
    background:var(--ink); color:#fff; border:none;
    padding:14px 26px; border-radius:14px; cursor:pointer;
  }
  .play-again:hover{ background:#0F1730; }
  .modal-finish{
    font-family:var(--display-font); font-weight:800; font-size:16px;
    background:var(--success); color:#fff; border:none;
    padding:14px 26px; border-radius:14px; cursor:pointer;
    text-decoration:none;
    display:inline-flex; align-items:center;
  }
  .modal-finish:hover{ background:#178853; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>Tarik Tambang <span class="num">Bilangan Bulat</span></h1>
      <p>Tambah, kurang, kali, bagi &amp; pangkat</p>
    </div>
  </header>

  <div class="stage">
    <div class="panel biru">
      <div class="panel-head">
        <span class="team-badge"><span class="dot"></span> TIM BIRU</span>
        <span class="correct-count" id="countBiru">Benar: 0</span>
      </div>
      <div class="panel-body">
        <div class="question-box">
          <span class="q" id="qBiru"></span>
          <span class="hint" id="hintBiru"></span>
        </div>
        <div class="answer-display placeholder" id="inputBiru">Ketik jawaban…</div>
        <div class="feedback" id="fbBiru"></div>
        <div class="keypad" id="keypadBiru"></div>
        <button class="go-btn" onclick="checkAnswer('biru')">Go</button>
      </div>
    </div>

    <div class="rope-col">
      <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="70" cy="178" rx="34" ry="7" fill="#1C2541" opacity="0.08"/>
        <ellipse cx="330" cy="178" rx="34" ry="7" fill="#1C2541" opacity="0.08"/>

        <g>
          <line x1="38" y1="66" x2="38" y2="158" stroke="#1C2541" stroke-width="3" opacity="0.35"/>
          <path d="M38,66 L66,76 L38,86 Z" fill="var(--biru)"/>
        </g>
        <g>
          <line x1="362" y1="66" x2="362" y2="158" stroke="#1C2541" stroke-width="3" opacity="0.35"/>
          <path d="M362,66 L334,76 L362,86 Z" fill="var(--merah)"/>
        </g>

        <line x1="52" y1="120" x2="348" y2="120" stroke="var(--rope-dark)" stroke-width="9" stroke-linecap="round"/>
        <line x1="52" y1="120" x2="348" y2="120" stroke="var(--rope)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>

        <!-- BLUE character (facing right, fixed at left end) -->
        <g transform="translate(78,158)">
          <line x1="0" y1="0" x2="-14" y2="30" stroke="var(--biru-dark)" stroke-width="8" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="17" y2="28" stroke="var(--biru-dark)" stroke-width="8" stroke-linecap="round"/>
          <rect x="-14" y="-41" width="28" height="43" rx="12" fill="var(--biru)"/>
          <line x1="9" y1="-27" x2="30" y2="-34" stroke="var(--biru-dark)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="32" cy="-34" r="4.5" fill="var(--skin)"/>
          <line x1="-9" y1="-27" x2="-27" y2="-20" stroke="var(--biru-dark)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="0" cy="-52" r="13.5" fill="var(--skin)"/>
          <path d="M-13.5,-55.5 a13.5,12 0 0 1 27,0 z" fill="var(--biru-dark)"/>
          <circle cx="4.5" cy="-52" r="1.8" fill="var(--ink)"/>
          <circle cx="-3.5" cy="-52" r="1.8" fill="var(--ink)"/>
          <path d="M-3.5,-46 q5,3.5 9,0" stroke="var(--ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- RED character (facing left, fixed at right end) -->
        <g transform="translate(322,158) scale(-1,1)">
          <line x1="0" y1="0" x2="-14" y2="30" stroke="var(--merah-dark)" stroke-width="8" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="17" y2="28" stroke="var(--merah-dark)" stroke-width="8" stroke-linecap="round"/>
          <rect x="-14" y="-41" width="28" height="43" rx="12" fill="var(--merah)"/>
          <line x1="9" y1="-27" x2="30" y2="-34" stroke="var(--merah-dark)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="32" cy="-34" r="4.5" fill="var(--skin)"/>
          <line x1="-9" y1="-27" x2="-27" y2="-20" stroke="var(--merah-dark)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="0" cy="-52" r="13.5" fill="var(--skin)"/>
          <path d="M-13.5,-55.5 a13.5,12 0 0 1 27,0 z" fill="var(--merah-dark)"/>
          <circle cx="4.5" cy="-52" r="1.8" fill="var(--ink)"/>
          <circle cx="-3.5" cy="-52" r="1.8" fill="var(--ink)"/>
          <path d="M-3.5,-46 q5,3.5 9,0" stroke="var(--ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </g>

        <g id="knotGroup" transform="translate(200,120)">
          <circle r="11.5" fill="var(--gold)" stroke="var(--ink)" stroke-width="2.2"/>
          <circle r="3.5" fill="var(--ink)" opacity="0.5"/>
        </g>
      </svg>
      <div class="status-line" id="statusLine">Seimbang — ayo jawab soalnya!</div>
    </div>

    <div class="panel merah">
      <div class="panel-head">
        <span class="team-badge"><span class="dot"></span> TIM MERAH</span>
        <span class="correct-count" id="countMerah">Benar: 0</span>
      </div>
      <div class="panel-body">
        <div class="question-box">
          <span class="q" id="qMerah"></span>
          <span class="hint" id="hintMerah"></span>
        </div>
        <div class="answer-display placeholder" id="inputMerah">Ketik jawaban…</div>
        <div class="feedback" id="fbMerah"></div>
        <div class="keypad" id="keypadMerah"></div>
        <button class="go-btn merah" onclick="checkAnswer('merah')">Go</button>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="caption">Jawab soal untuk menarik tali ke arahmu!</div>
    <div class="footer-actions">
      <button class="reset-btn" onclick="resetGame()">↺ Main Baru</button>
      <a class="finish-btn" href="materi.html">✓ Selesai</a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="trophy">🏆</div>
    <h2 id="winnerTitle">Tim Biru Menang!</h2>
    <p id="winnerSub">Tali berhasil ditarik penuh ke arah Tim Biru.</p>
    <div class="modal-actions">
      <button class="play-again" onclick="resetGame()">Main Lagi</button>
      <a class="modal-finish" href="materi.html">Selesai</a>
    </div>
  </div>
</div>

<script>
const SUP = {2:'²', 3:'³'};
const MINUS = '\u2212';

const state = {
  tugPosition: 50, // 0 = biru win, 100 = merah win
  biru: { answer:0, input:'', correct:0 },
  merah:{ answer:0, input:'', correct:0 }
};

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randNonZero(min,max){ let n=0; while(n===0){ n=randInt(min,max); } return n; }

// Wrap a negative operand in parentheses so e.g. "5 + (−3)" reads unambiguously
function fmtOperand(n){ return n<0 ? `(${MINUS}${Math.abs(n)})` : `${n}`; }

function newQuestion(team){
  const ops = ['+','-','×','÷','^'];
  const op = ops[randInt(0, ops.length-1)];
  let a, b, answer, qHtml, hintHtml;

  if(op === '+'){
    a = randInt(-12,12); b = randInt(-12,12);
    answer = a + b;
    qHtml = `${a} + ${fmtOperand(b)} = ?`;
    hintHtml = 'Penjumlahan bilangan bulat';
  } else if(op === '-'){
    a = randInt(-12,12); b = randInt(-12,12);
    answer = a - b;
    qHtml = `${a} ${MINUS} ${fmtOperand(b)} = ?`;
    hintHtml = 'Pengurangan bilangan bulat';
  } else if(op === '×'){
    a = randInt(-9,9); b = randInt(-9,9);
    answer = a * b;
    qHtml = `${a} × ${fmtOperand(b)} = ?`;
    hintHtml = 'Perkalian bilangan bulat';
  } else if(op === '÷'){
    const d = randNonZero(-9,9);
    const q = randInt(-9,9);
    a = d * q; b = d;
    answer = q;
    qHtml = `${a} ÷ ${fmtOperand(b)} = ?`;
    hintHtml = 'Pembagian bilangan bulat';
  } else {
    const base = randNonZero(-9,9);
    const exp = Math.random() < 0.5 ? 2 : 3;
    answer = Math.pow(base, exp);
    qHtml = `${fmtOperand(base)}<sup>${SUP[exp]}</sup> = ?`;
    hintHtml = `basis <span class="b">${base}</span> · pangkat <span class="e">${exp}</span>`;
  }

  state[team].answer = answer;
  state[team].input = '';
  document.getElementById(team==='biru'?'qBiru':'qMerah').innerHTML = qHtml;
  document.getElementById(team==='biru'?'hintBiru':'hintMerah').innerHTML = hintHtml;
  renderInput(team);
}

function renderInput(team){
  const el = document.getElementById(team==='biru'?'inputBiru':'inputMerah');
  const val = state[team].input;
  if(val === '' || val === '-'){
    el.textContent = val === '-' ? '-' : 'Ketik jawaban…';
    el.classList.toggle('placeholder', val === '');
    el.style.fontSize = '';
  } else {
    el.textContent = val;
    el.classList.remove('placeholder');
    // shrink font a bit for longer numbers so nothing gets clipped
    const len = val.replace('-','').length;
    el.style.fontSize = len >= 3 ? 'clamp(14px,2.2vh,19px)' : '';
  }
}

function showFeedback(team, msg, kind){
  const el = document.getElementById(team==='biru'?'fbBiru':'fbMerah');
  el.textContent = msg;
  el.className = 'feedback show ' + kind;
  setTimeout(()=>{ el.classList.remove('show'); }, 1000);
}

function pressKey(team, key){
  const t = state[team];
  if(key === 'C'){
    t.input = '';
  } else if(key === '±'){
    t.input = t.input.startsWith('-') ? t.input.slice(1) : '-' + t.input;
  } else if(key === 'Go'){
    checkAnswer(team);
    return;
  } else {
    const digitsOnly = t.input.replace('-','');
    if(digitsOnly.length < 3) t.input += key;
  }
  renderInput(team);
}

function checkAnswer(team){
  const t = state[team];
  if(t.input === '' || t.input === '-'){ return; }
  const guess = parseInt(t.input, 10);
  if(guess === t.answer){
    t.correct++;
    document.getElementById(team==='biru'?'countBiru':'countMerah').textContent = 'Benar: ' + t.correct;
    showFeedback(team, 'Benar! Menarik tali… 🎉', 'good');
    pullRope(team);
    newQuestion(team);
  } else {
    showFeedback(team, 'Coba lagi!', 'bad');
    const inputEl = document.getElementById(team==='biru'?'inputBiru':'inputMerah');
    inputEl.classList.remove('shake'); void inputEl.offsetWidth;
    inputEl.classList.add('shake');
    t.input = '';
    renderInput(team);
  }
}

function pullRope(team){
  const step = 12.5;
  if(team === 'biru') state.tugPosition = Math.max(0, state.tugPosition - step);
  else state.tugPosition = Math.min(100, state.tugPosition + step);
  renderRope();
  if(state.tugPosition <= 0){ announceWinner('biru'); }
  else if(state.tugPosition >= 100){ announceWinner('merah'); }
}

function renderRope(){
  const x = 130 + (state.tugPosition/100) * 140;
  const knot = document.getElementById('knotGroup');
  knot.setAttribute('transform', `translate(${x},120)`);
  knot.classList.remove('pulse'); void knot.offsetWidth; knot.classList.add('pulse');

  const status = document.getElementById('statusLine');
  if(state.tugPosition < 42) status.innerHTML = '<strong style="color:var(--biru-dark)">Tim Biru</strong> sedang unggul!';
  else if(state.tugPosition > 58) status.innerHTML = '<strong style="color:var(--merah-dark)">Tim Merah</strong> sedang unggul!';
  else status.textContent = 'Seimbang — ayo jawab soalnya!';
}

function announceWinner(team){
  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('winnerTitle');
  const sub = document.getElementById('winnerSub');
  title.className = team;
  title.textContent = team === 'biru' ? 'Tim Biru Menang!' : 'Tim Merah Menang!';
  sub.textContent = `Tali berhasil ditarik penuh ke arah Tim ${team === 'biru' ? 'Biru' : 'Merah'}.`;
  overlay.classList.add('show');
}

function buildKeypad(team){
  const container = document.getElementById(team === 'biru' ? 'keypadBiru' : 'keypadMerah');
  container.innerHTML = '';
  const layout = ['1','2','3','4','5','6','7','8','9','±','0','C'];
  layout.forEach(k=>{
    const btn = document.createElement('button');
    btn.className = 'key';
    if(k==='0') btn.classList.add('zero');
    if(k==='C' || k==='±') btn.classList.add('clear');
    btn.textContent = k;
    btn.addEventListener('click', ()=>pressKey(team, k));
    container.appendChild(btn);
  });
}

function resetGame(){
  state.tugPosition = 50;
  state.biru.correct = 0;
  state.merah.correct = 0;
  document.getElementById('countBiru').textContent = 'Benar: 0';
  document.getElementById('countMerah').textContent = 'Benar: 0';
  document.getElementById('modalOverlay').classList.remove('show');
  newQuestion('biru');
  newQuestion('merah');
  renderRope();
}

buildKeypad('biru');
buildKeypad('merah');
resetGame();
</script>
</body>
</html>
