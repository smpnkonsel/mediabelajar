<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bab 4 — Konsep Bentuk Aljabar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0f1a;
    --bg-1:#111729;
    --bg-2:#161d33;
    --card:#1a2138;
    --card-border:#2a3352;
    --text-hi:#f2f4fb;
    --text-mid:#b7c0dc;
    --text-low:#7c86a8;
    --coral:#ff6b6b;
    --teal:#4ecdc4;
    --amber:#ffd166;
    --violet:#8b7cf6;
    --grad-1: linear-gradient(135deg, #ff6b6b 0%, #ffd166 100%);
    --grad-2: linear-gradient(135deg, #4ecdc4 0%, #8b7cf6 100%);
    --grad-3: linear-gradient(135deg, #8b7cf6 0%, #ff6b6b 100%);
    --shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    --radius: 22px;
    --font-head:'Fredoka', sans-serif;
    --font-body:'Plus Jakarta Sans', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--font-body);
    background: radial-gradient(ellipse at top left, #171f38 0%, var(--bg-0) 55%), var(--bg-0);
    color: var(--text-hi);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== TOP BAR ===== */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px clamp(14px,3vw,32px);
    gap:14px;
    z-index:20;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(13px,1.6vw,16px);
    color:var(--text-mid);
    white-space:nowrap;
  }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--grad-1); flex-shrink:0;}
  #progress-wrap{
    flex:1;
    height:8px;
    background:var(--bg-2);
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--card-border);
    max-width:420px;
  }
  #progress-bar{
    height:100%;
    width:0%;
    background:var(--grad-2);
    border-radius:99px;
    transition: width .45s cubic-bezier(.65,0,.35,1);
  }
  #slide-counter{
    font-family:var(--font-mono);
    font-size:clamp(11px,1.4vw,13px);
    color:var(--text-low);
    white-space:nowrap;
  }

  /* ===== SLIDES ===== */
  #stage{
    flex:1;
    position:relative;
    overflow:hidden;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: clamp(14px,3vh,28px) clamp(16px,5vw,64px) clamp(90px,10vh,110px);
    opacity:0;
    transform: translateX(40px) scale(.98);
    transition: opacity .5s ease, transform .5s cubic-bezier(.65,0,.35,1);
    pointer-events:none;
    overflow-y:auto;
  }
  .slide.active{
    opacity:1;
    transform: translateX(0) scale(1);
    pointer-events:auto;
  }
  .slide.prev{
    transform: translateX(-40px) scale(.98);
  }
  .slide-inner{
    width:100%;
    max-width:980px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:clamp(11px,1.5vw,13px);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:500;
  }
  h1.slide-title{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(24px,4.4vw,44px);
    line-height:1.15;
    background:var(--grad-2);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h2.section-title{
    font-family:var(--font-head);
    font-weight:600;
    font-size:clamp(20px,3vw,30px);
    color:var(--text-hi);
  }
  p.lead{
    font-size:clamp(14px,1.9vw,18px);
    color:var(--text-mid);
    line-height:1.65;
    max-width:760px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:clamp(16px,2.6vw,28px);
    box-shadow: var(--shadow);
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:760px){ .grid2, .grid3{grid-template-columns:1fr;} }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--font-mono);
    font-size:12px;
    padding:4px 12px;
    border-radius:99px;
    background:var(--bg-2);
    border:1px solid var(--card-border);
    color:var(--text-mid);
    width:fit-content;
  }

  .expr{
    font-family:var(--font-mono);
    font-weight:700;
    letter-spacing:.02em;
  }

  /* ===== NAV ===== */
  #navbar{
    position:absolute;
    bottom:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding: 14px clamp(14px,4vw,40px) 18px;
    background: linear-gradient(0deg, rgba(11,15,26,.92) 40%, rgba(11,15,26,0) 100%);
    z-index:30;
  }
  .nav-btn{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:clamp(13px,1.6vw,15px);
    color:var(--text-hi);
    background:var(--card);
    border:1px solid var(--card-border);
    padding:10px 18px;
    border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease, opacity .2s ease;
    user-select:none;
  }
  .nav-btn:hover{ transform:translateY(-2px); background:var(--bg-2); }
  .nav-btn:active{ transform:translateY(0); }
  .nav-btn.primary{ background:var(--grad-2); color:#0b0f1a; border:none; }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }

  #dots{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:46vw;
  }
  .dot-i{
    width:8px; height:8px; border-radius:50%;
    background:var(--card-border);
    cursor:pointer;
    transition: all .25s ease;
    flex-shrink:0;
  }
  .dot-i.active{ background:var(--teal); width:22px; border-radius:5px;}
  .dot-i.done{ background:var(--text-low); }
  @media (max-width:640px){ #dots{display:none;} }

  /* ===== INTERACTIVE WIDGETS ===== */
  .reveal-btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:#0b0f1a;
    background:var(--amber);
    border:none;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    transition: transform .15s ease, filter .2s ease;
  }
  .reveal-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .hidden-box{
    display:none;
    margin-top:12px;
    padding:14px 16px;
    background:var(--bg-2);
    border-left:3px solid var(--teal);
    border-radius:10px;
    font-size:14px;
    color:var(--text-mid);
    line-height:1.6;
  }
  .hidden-box.show{ display:block; animation: fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

  .term-token{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:clamp(20px,4vw,34px);
    padding:6px 10px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
    transition: all .2s ease;
    display:inline-block;
  }
  .term-token:hover{ border-color:var(--card-border); background:var(--bg-2); }
  .term-token.picked-coef{ background:rgba(255,107,107,.18); border-color:var(--coral); color:var(--coral); }
  .term-token.picked-var{ background:rgba(78,205,196,.18); border-color:var(--teal); color:var(--teal); }
  .term-token.picked-const{ background:rgba(255,209,102,.18); border-color:var(--amber); color:var(--amber); }
  .term-token.picked-op{ background:rgba(139,124,246,.18); border-color:var(--violet); color:var(--violet); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .legend-chip{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-mid); }
  .legend-swatch{ width:14px; height:14px; border-radius:4px; }

  .choice-row{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .choice-btn{
    text-align:left;
    font-family:var(--font-body);
    font-size:14px;
    color:var(--text-hi);
    background:var(--bg-2);
    border:1.5px solid var(--card-border);
    padding:13px 16px;
    border-radius:13px;
    cursor:pointer;
    transition: all .2s ease;
  }
  .choice-btn:hover{ border-color:var(--teal); transform:translateX(3px); }
  .choice-btn.correct{ border-color:var(--teal); background:rgba(78,205,196,.15); }
  .choice-btn.wrong{ border-color:var(--coral); background:rgba(255,107,107,.15); }
  .choice-btn:disabled{ cursor:default; }

  .feedback-msg{ font-size:14px; margin-top:10px; font-weight:600; }
  .feedback-msg.ok{ color:var(--teal); }
  .feedback-msg.bad{ color:var(--coral); }

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:16px; }
  @media (max-width:700px){ .match-wrap{grid-template-columns:1fr;} }
  .match-col{ display:flex; flex-direction:column; gap:10px; }
  .match-item{
    padding:12px 14px;
    background:var(--bg-2);
    border:1.5px solid var(--card-border);
    border-radius:12px;
    font-size:13.5px;
    cursor:grab;
    user-select:none;
  }
  .match-item.term-src{ font-family:var(--font-mono); font-weight:700; text-align:center; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:rgba(255,209,102,.12); }
  .match-item.matched-ok{ border-color:var(--teal); background:rgba(78,205,196,.15); cursor:default; }
  .match-item.matched-bad{ border-color:var(--coral); }
  .match-item.drop-target{ min-height:50px; display:flex; align-items:center; }

  .term-box{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:clamp(24px,5vw,40px);
    padding:16px 26px; border-radius:16px; background:var(--bg-2);
    border:1.5px solid var(--card-border); gap:4px; flex-wrap:wrap;
  }

  .step-list{ counter-reset:step; display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .step-item{
    display:flex; gap:14px; align-items:flex-start;
    background:var(--bg-2); border:1px solid var(--card-border); border-radius:14px; padding:14px 16px;
  }
  .step-num{
    counter-increment:step;
    font-family:var(--font-head); font-weight:600;
    width:28px; height:28px; border-radius:50%;
    background:var(--grad-1); color:#1a0d0d;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:13px;
  }
  .step-num::before{ content: counter(step); }

  input.answer-input{
    font-family:var(--font-mono);
    font-size:15px;
    padding:10px 14px;
    border-radius:10px;
    border:1.5px solid var(--card-border);
    background:var(--bg-1);
    color:var(--text-hi);
    width:140px;
    outline:none;
  }
  input.answer-input:focus{ border-color:var(--teal); }
  .check-btn{
    font-family:var(--font-body); font-weight:700; font-size:13px;
    background:var(--grad-2); color:#0b0f1a; border:none;
    padding:10px 16px; border-radius:10px; cursor:pointer; margin-left:8px;
  }

  .tf-row{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap;}
  .tf-btn{
    font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:12px 26px; border-radius:12px; border:1.5px solid var(--card-border);
    background:var(--bg-2); color:var(--text-hi); cursor:pointer; transition:all .2s ease;
  }
  .tf-btn.correct{ background:rgba(78,205,196,.18); border-color:var(--teal); }
  .tf-btn.wrong{ background:rgba(255,107,107,.18); border-color:var(--coral); }

  .quiz-progress{ font-family:var(--font-mono); font-size:12px; color:var(--text-low); }
  .score-ring{
    width:140px; height:140px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .score-ring svg{ transform:rotate(-90deg); }
  .score-num{ position:absolute; font-family:var(--font-head); font-size:30px; font-weight:600; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--card-border); border-radius:99px; }

  .kbd{
    font-family:var(--font-mono); font-size:11px; background:var(--bg-2);
    border:1px solid var(--card-border); padding:2px 6px; border-radius:6px; color:var(--text-low);
  }

  .icon-cover{
    width:84px; height:84px; border-radius:22px;
    background:var(--grad-2); display:flex; align-items:center; justify-content:center;
    font-size:38px; box-shadow: var(--shadow);
  }
  ul.plain{ padding-left:20px; color:var(--text-mid); font-size:14.5px; line-height:1.8; }
  ul.plain li::marker{ color:var(--teal); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot"></span>Bab 4 · Bentuk Aljabar</div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="slide-counter"><span id="cur-num">1</span> / <span id="tot-num">1</span></div>
  </div>

  <div id="stage"></div>

  <div id="navbar">
    <button class="nav-btn" id="btnPrev">← Sebelumnya</button>
    <div id="dots"></div>
    <button class="nav-btn primary" id="btnNext">Berikutnya →</button>
  </div>
</div>

<script>
/* ======================================================
   DATA SOAL KUIS
====================================================== */
const quizData = [
  {
    q: "Perhatikan bentuk aljabar 5x + 3. Manakah yang merupakan variabel?",
    opts: ["5", "x", "3", "+"],
    correct: 1,
    explain: "Variabel adalah huruf yang mewakili nilai yang belum diketahui. Pada 5x + 3, huruf x adalah variabelnya."
  },
  {
    q: "Pada bentuk aljabar 7y − 4, nilai −4 disebut...",
    opts: ["Variabel", "Koefisien", "Konstanta", "Suku sejenis"],
    correct: 2,
    explain: "Konstanta adalah bilangan yang nilainya tetap dan tidak diikuti variabel. −4 tidak memiliki variabel, sehingga disebut konstanta."
  },
  {
    q: "Koefisien dari variabel p pada bentuk 9p adalah...",
    opts: ["p", "9", "9p", "Tidak ada"],
    correct: 1,
    explain: "Koefisien adalah bilangan yang mengalikan variabel dalam satu suku. Pada 9p, angka 9 adalah koefisiennya."
  },
  {
    q: "Berapa banyak suku pada bentuk aljabar 4x² − 2x + 7?",
    opts: ["1 suku", "2 suku", "3 suku", "4 suku"],
    correct: 2,
    explain: "Suku dipisahkan oleh tanda + atau −. Bentuk ini memiliki 3 suku, yaitu: 4x², −2x, dan 7."
  },
  {
    q: "Manakah pasangan suku sejenis?",
    opts: ["3x dan 3y", "5a² dan 5a", "6m dan −2m", "8 dan 8n"],
    correct: 2,
    explain: "Suku sejenis memiliki variabel dan pangkat yang sama. 6m dan −2m sama-sama memuat variabel m berpangkat 1."
  },
  {
    q: "Bentuk aljabar 2x + 3y − 5 disebut...",
    opts: ["Monomial (1 suku)", "Binomial (2 suku)", "Trinomial (3 suku)", "Bukan bentuk aljabar"],
    correct: 2,
    explain: "Karena memiliki 3 suku (2x, 3y, dan −5), bentuk ini disebut trinomial."
  },
  {
    q: "Seorang pedagang menjual x kg apel dengan harga Rp15.000 per kg. Bentuk aljabar untuk total harga adalah...",
    opts: ["15000 + x", "15000x", "x − 15000", "15000/x"],
    correct: 1,
    explain: "Total harga = harga per kg × banyak kg = 15.000 × x, ditulis 15000x."
  },
  {
    q: "Pada bentuk aljabar −3x² + x − 9, koefisien dari x adalah...",
    opts: ["−3", "1", "−9", "2"],
    correct: 1,
    explain: "Suku 'x' sama dengan '1x', sehingga koefisiennya adalah 1 (tanda di depannya positif)."
  }
];

/* ======================================================
   BANGUN SLIDE
====================================================== */
const stage = document.getElementById('stage');
let slides = [];
let currentIndex = 0;

function addSlide(html){
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `<div class="slide-inner">${html}</div>`;
  stage.appendChild(div);
  slides.push(div);
  return div;
}

/* ---------- 1. COVER ---------- */
addSlide(`
  <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px; margin-top:6vh;">
    <div class="icon-cover">🧮</div>
    <div class="eyebrow">Matematika · Kelas VII · Kurikulum Merdeka</div>
    <h1 class="slide-title" style="font-size:clamp(28px,6vw,52px);">Bab 4 — Bentuk Aljabar</h1>
    <p class="lead">Submateri: <b style="color:var(--text-hi)">Konsep Bentuk Aljabar</b></p>
    <p class="lead">Materi Pokok: Variabel, Konstanta, Koefisien, Suku, dan Bentuk Aljabar</p>
    <div class="badge">👉 Gunakan tombol <b>Berikutnya</b> atau tanda panah <span class="kbd">←</span> <span class="kbd">→</span> untuk menjelajah</div>
  </div>
`);

/* ---------- 2. APERSEPSI ---------- */
addSlide(`
  <div class="eyebrow">Apersepsi</div>
  <h2 class="section-title">Aljabar Ada di Sekitar Kita</h2>
  <p class="lead">Sebelum masuk ke materi, coba perhatikan situasi berikut ini.</p>
  <div class="grid2">
    <div class="card">
      <div style="font-size:30px;">🍎</div>
      <p style="margin-top:10px; color:var(--text-mid); font-size:14.5px; line-height:1.6;">Andi membeli <b style="color:var(--text-hi)">beberapa</b> apel dengan harga Rp8.000 per kg. Karena banyak apel belum diketahui, kita bisa menuliskannya sebagai <span class="expr" style="color:var(--teal)">8000x</span>, dengan x mewakili banyak kilogram apel.</p>
    </div>
    <div class="card">
      <div style="font-size:30px;">📐</div>
      <p style="margin-top:10px; color:var(--text-mid); font-size:14.5px; line-height:1.6;">Keliling sebuah persegi panjang dengan panjang p dan lebar 5 dapat ditulis sebagai <span class="expr" style="color:var(--coral)">2p + 10</span>. Bentuk seperti inilah yang disebut <b style="color:var(--text-hi)">bentuk aljabar</b>.</p>
    </div>
  </div>
  <p class="lead" style="margin-top:6px;">Dalam kehidupan sehari-hari, kita sering menemui besaran yang <i>belum diketahui</i> atau <i>berubah-ubah</i> nilainya. Aljabar membantu kita menuliskan besaran seperti itu dengan simbol.</p>
`);

/* ---------- 3. TUJUAN PEMBELAJARAN ---------- */
addSlide(`
  <div class="eyebrow">Tujuan Pembelajaran</div>
  <h2 class="section-title">Setelah mempelajari bagian ini, kalian mampu:</h2>
  <div class="step-list">
    <div class="step-item"><div class="step-num"></div><div>Menjelaskan pengertian variabel, konstanta, koefisien, dan suku dalam bentuk aljabar.</div></div>
    <div class="step-item"><div class="step-num"></div><div>Mengidentifikasi variabel, konstanta, koefisien, dan suku pada suatu bentuk aljabar.</div></div>
    <div class="step-item"><div class="step-num"></div><div>Membedakan suku sejenis dan suku tidak sejenis.</div></div>
    <div class="step-item"><div class="step-num"></div><div>Menyusun bentuk aljabar dari suatu permasalahan sehari-hari.</div></div>
    <div class="step-item"><div class="step-num"></div><div>Mengklasifikasikan bentuk aljabar berdasarkan banyak sukunya (monomial, binomial, trinomial, polinomial).</div></div>
  </div>
`);

/* ---------- 4. PERTANYAAN PEMANTIK ---------- */
addSlide(`
  <div class="eyebrow">Pertanyaan Pemantik</div>
  <h2 class="section-title">Coba pikirkan dahulu...</h2>
  <div class="card" style="display:flex; flex-direction:column; gap:16px;">
    <p class="lead" style="font-size:clamp(16px,2.2vw,20px); color:var(--text-hi);">"Jika umur Rani sekarang tidak diketahui, tetapi umur adiknya 3 tahun lebih muda, bagaimana cara menuliskan umur adik Rani menggunakan simbol matematika?"</p>
    <button class="reveal-btn" onclick="toggleReveal(this)">💡 Lihat Arah Jawaban</button>
    <div class="hidden-box">

    <div class="card"><b style="color:var(--violet)">Suku</b><p style="color:var(--text-mid); font-size:13.5px; margin-top:6px;">Bagian bentuk aljabar yang dipisahkan tanda + atau −.</p></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <p class="lead">Bentuk aljabar diklasifikasikan berdasarkan banyak sukunya menjadi <b>monomial (1 suku)</b>, <b>binomial (2 suku)</b>, <b>trinomial (3 suku)</b>, dan <b>polinomial (&gt;3 suku)</b>. Dua suku disebut <b>sejenis</b> jika memiliki variabel dan pangkat yang sama.</p>
  </div>
`);

/* ---------- 23. PENUTUP ---------- */
addSlide(`
  <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; margin-top:8vh;">
    <div class="icon-cover" style="background:var(--grad-1);">🎉</div>
    <h1 class="slide-title">Kerja Bagus!</h1>
    <p class="lead">Kamu telah menyelesaikan pembelajaran Konsep Bentuk Aljabar. Lanjutkan ke submateri berikutnya: <b style="color:var(--text-hi)">Operasi Hitung Bentuk Aljabar</b>.</p>
    <div class="badge">🙌 Sampai jumpa di pembelajaran berikutnya!</div>
  </div>
`);

/* ======================================================
   NAVIGASI SLIDE
====================================================== */
const totalSlides = slides.length;
document.getElementById('tot-num').textContent = totalSlides;
const dotsWrap = document.getElementById('dots');
slides.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot-i';
  d.onclick = () => goToSlide(i);
  dotsWrap.appendChild(d);
});

function updateUI(){
  slides.forEach((s, i) => {
    s.classList.remove('active','prev');
    if(i === currentIndex) s.classList.add('active');
    else if(i < currentIndex) s.classList.add('prev');
  });
  document.getElementById('cur-num').textContent = currentIndex + 1;
  document.getElementById('progress-bar').style.width = ((currentIndex+1)/totalSlides*100) + '%';
  document.querySelectorAll('.dot-i').forEach((d,i) => {
    d.classList.toggle('active', i === currentIndex);
    d.classList.toggle('done', i < currentIndex);
  });
  document.getElementById('btnPrev').disabled = currentIndex === 0;
  document.getElementById('btnNext').textContent = currentIndex === totalSlides - 1 ? 'Selesai ✓' : 'Berikutnya →';
  stage.scrollTop = 0;
  slides[currentIndex].scrollTop = 0;
}

function goToSlide(i){
  if(i < 0 || i >= totalSlides) return;
  currentIndex = i;
  updateUI();
  if(i === 19) initQuizIfNeeded();
  if(i === 11) initTF();
  if(i === 18) initMatch();
}

document.getElementById('btnNext').onclick = () => { if(currentIndex < totalSlides-1) goToSlide(currentIndex+1); };
document.getElementById('btnPrev').onclick = () => { if(currentIndex > 0) goToSlide(currentIndex-1); };

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goToSlide(currentIndex+1);
  if(e.key === 'ArrowLeft') goToSlide(currentIndex-1);
});

/* swipe support */
let touchStartX = 0;
stage.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive:true});
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(dx > 60) goToSlide(currentIndex-1);
  else if(dx < -60) goToSlide(currentIndex+1);
}, {passive:true});

updateUI();

/* ======================================================
   WIDGET: reveal toggle
====================================================== */
function toggleReveal(btn){
  const box = btn.nextElementSibling;
  box.classList.toggle('show');
}

/* ======================================================
   WIDGET: identify tokens (slide 10)
====================================================== */
const tokenLabels = {
  coef: {name:'Koefisien', cls:'picked-coef', desc:'Bilangan yang mengalikan/menyertai variabel dalam satu suku.'},
  var: {name:'Variabel', cls:'picked-var', desc:'Huruf yang mewakili nilai yang belum diketahui atau berubah-ubah.'},
  op: {name:'Operator', cls:'picked-op', desc:'Simbol operasi hitung yang menghubungkan antar suku (+ atau −).'},
  const: {name:'Konstanta', cls:'picked-const', desc:'Bilangan tetap yang tidak diikuti variabel.'}
};
function pickToken(el, type){
  document.querySelectorAll('#identifyBox .term-token').forEach(t => {
    t.classList.remove('picked-coef','picked-var','picked-const','picked-op');
  });
  el.classList.add(tokenLabels[type].cls);
  const fb = document.getElementById('identifyFeedback');
  fb.innerHTML = `<b>${tokenLabels[type].name}</b> — ${tokenLabels[type].desc}`;
  fb.classList.add('show');
}

/* ======================================================
   WIDGET: True/False suku sejenis (slide 12)
====================================================== */
const tfData = [
  {a:'3x', b:'5x', sejenis:true},
  {a:'4a', b:'4b', sejenis:false},
  {a:'2m²', b:'-6m²', sejenis:true},
  {a:'7y', b:'7y²', sejenis:false},
  {a:'-p', b:'9p', sejenis:true},
  {a:'6', b:'6x', sejenis:false}
];
let tfIndex = 0;
let tfAnswered = false;
function initTF(){
  tfIndex = 0; tfAnswered = false; renderTF();
}
function renderTF(){
  const item = tfData[tfIndex];
  document.getElementById('tfQuestion').innerHTML = `<span class="expr">${item.a}</span> &nbsp;dan&nbsp; <span class="expr">${item.b}</span>`;
  document.getElementById('tfFeedback').textContent = '';
  document.getElementById('tfFeedback').className = 'feedback-msg';
  document.getElementById('tfProgress').textContent = `Soal ${tfIndex+1} dari ${tfData.length}`;
  document.querySelectorAll('#tfGame .tf-btn').forEach(b => b.classList.remove('correct','wrong'));
  tfAnswered = false;
}
function answerTF(guessSejenis){
  if(tfAnswered) return;
  tfAnswered = true;
  const item = tfData[tfIndex];
  const correct = guessSejenis === item.sejenis;
  const fb = document.getElementById('tfFeedback');
  const btns = document.querySelectorAll('#tfGame .tf-btn');
  btns[item.sejenis ? 0 : 1].classList.add('correct');
  if(!correct) btns[guessSejenis ? 0 : 1].classList.add('wrong');
  fb.textContent = correct ? '✅ Benar!' : '❌ Belum tepat, perhatikan lagi variabel dan pangkatnya.';
  fb.className = 'feedback-msg ' + (correct ? 'ok' : 'bad');
}
function nextTF(){
  tfIndex = (tfIndex + 1) % tfData.length;
  renderTF();
}

/* ======================================================
   WIDGET: matching istilah & definisi (slide 19)
====================================================== */
const matchPairs = [
  {term:'Variabel', def:'Huruf yang mewakili nilai yang belum diketahui'},
  {term:'Konstanta', def:'Bilangan tetap tanpa variabel'},
  {term:'Koefisien', def:'Bilangan yang menyertai variabel'},
  {term:'Suku', def:'Bagian yang dipisahkan tanda + atau −'}
];
let matchInitialized = false;
let selectedTerm = null;
let matchedCount = 0;
function initMatch(){
  if(matchInitialized) return;
  matchInitialized = true;
  const termsWrap = document.getElementById('matchTerms');
  const defsWrap = document.getElementById('matchDefs');
  const shuffledTerms = [...matchPairs].sort(() => Math.random()-0.5);
  const shuffledDefs = [...matchPairs].sort(() => Math.random()-0.5);
  shuffledTerms.forEach(p => {
    const el = document.createElement('div');
    el.className = 'match-item term-src';
    el.textContent = p.term;
    el.dataset.term = p.term;
    el.onclick = () => selectTerm(el, p.term);
    termsWrap.appendChild(el);
  });
  shuffledDefs.forEach(p => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = p.def;
    el.dataset.def = p.def;
    el.dataset.term = p.term;
    el.onclick = () => selectDef(el);
    defsWrap.appendChild(el);
  });
}
function selectTerm(el, term){
  if(el.classList.contains('matched-ok')) return;
  document.querySelectorAll('#matchTerms .match-item').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  selectedTerm = {el, term};
}
function selectDef(el){
  if(!selectedTerm || el.classList.contains('matched-ok')) return;
  const status = document.getElementById('matchStatus');
  if(el.dataset.term === selectedTerm.term){
    el.classList.add('matched-ok');
    selectedTerm.el.classList.add('matched-ok');
    selectedTerm.el.classList.remove('selected');
    matchedCount++;
    status.textContent = '✅ Cocok!';
    status.className = 'feedback-msg ok';
    selectedTerm = null;
    if(matchedCount === matchPairs.length){
      status.textContent = '🎉 Semua pasangan berhasil dicocokkan!';
    }
  } else {
    el.classList.add('matched-bad');
    status.textContent = '❌ Belum cocok, coba lagi.';
    status.className = 'feedback-msg bad';
    setTimeout(() => el.classList.remove('matched-bad'), 500);
  }
}

/* ======================================================
   WIDGET: isian jawaban (slide 18)
====================================================== */
function checkAnswer(inputId, fbId, validAnswers){
  const val = document.getElementById(inputId).value.trim().toLowerCase().replace(/\s+/g,'');
  const fb = document.getElementById(fbId);
  const isCorrect = validAnswers.some(a => a.toLowerCase().replace(/\s+/g,'') === val);
  fb.textContent = isCorrect ? '✅ Benar!' : '❌ Coba periksa lagi.';
  fb.className = 'feedback-msg ' + (isCorrect ? 'ok' : 'bad');
}

/* ======================================================
   WIDGET: kuis (slide 20)
====================================================== */
let quizIndex = 0;
let quizScore = 0;
let quizInitialized = false;
function initQuizIfNeeded(){
  if(quizInitialized) return;
  quizInitialized = true;
  quizIndex = 0; quizScore = 0;
  renderQuiz();
}
function renderQuiz(){
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('quizResult').style.display = 'none';
  const item = quizData[quizIndex];
  document.getElementById('quizProgress').textContent = `Soal ${quizIndex+1} dari ${quizData.length} · Skor sementara: ${quizScore}`;
  document.getElementById('quizQuestion').textContent = item.q;
  const choicesWrap = document.getElementById('quizChoices');
  choicesWrap.innerHTML = '';
  document.getElementById('quizExplain').classList.remove('show');
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => selectQuizAnswer(i, btn);
    choicesWrap.appendChild(btn);
  });
}
function selectQuizAnswer(i, btn){
  const item = quizData[quizIndex];
  const allBtns = document.querySelectorAll('#quizChoices .choice-btn');
  allBtns.forEach(b => b.disabled = true);
  if(i === item.correct){
    btn.classList.add('correct');
    quizScore++;
  } else {
    btn.classList.add('wrong');
    allBtns[item.correct].classList.add('correct');
  }
  const exp = document.getElementById('quizExplain');
  exp.innerHTML = `<b>Pembahasan:</b> ${item.explain}`;
  exp.classList.add('show');
  setTimeout(() => {
    if(quizIndex < quizData.length - 1){
      quizIndex++;
      renderQuiz();
    } else {
      showQuizResult();
    }
  }, 1800);
}
function showQuizResult(){
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('quizResult').style.display = 'block';
  const pct = Math.round((quizScore / quizData.length) * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  const circle = document.getElementById('scoreCircle');
  const circumference = 377;
  circle.style.strokeDashoffset = circumference - (circumference * pct / 100);
  let msg = '';
  if(pct >= 90) msg = `Luar biasa! Skor kamu ${quizScore}/${quizData.length}. Kamu sangat menguasai konsep bentuk aljabar!`;
  else if(pct >= 70) msg = `Bagus! Skor kamu ${quizScore}/${quizData.length}. Sedikit lagi untuk menguasai sepenuhnya.`;
  else if(pct >= 50) msg = `Cukup baik. Skor kamu ${quizScore}/${quizData.length}. Coba pelajari kembali bagian yang masih sulit.`;
  else msg = `Skor kamu ${quizScore}/${quizData.length}. Yuk, ulangi materi variabel, konstanta, koefisien, dan suku sekali lagi!`;
  document.getElementById('scoreMsg').textContent = msg;
}
function restartQuiz(){
  quizIndex = 0; quizScore = 0;
  renderQuiz();
}
</script>
