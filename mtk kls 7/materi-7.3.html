<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bab 7: Statistika — Tabel Frekuensi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a;
    --bg-alt:#0f1424;
    --card:#141a2b;
    --card-hi:#1b2338;
    --border:#262f47;
    --border-hi:#3a4568;
    --primary:#7c6cff;
    --primary-dim:#5b4fd1;
    --secondary:#22d3c5;
    --accent:#ff8fab;
    --warn:#ffb648;
    --good:#3ddc97;
    --bad:#ff6b6b;
    --text:#eef1fb;
    --text-dim:#a6b0cc;
    --text-dimmer:#6b7594;
    --grad-1:linear-gradient(135deg,#7c6cff 0%,#22d3c5 100%);
    --grad-2:linear-gradient(135deg,#ff8fab 0%,#7c6cff 100%);
    --radius:20px;
    --radius-sm:12px;
    --shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,108,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(34,211,197,0.14), transparent 45%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.font-head{font-family:'Fredoka', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{
    max-width:980px;
    margin:0 auto;
    padding:18px 18px 110px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.topbar{
    display:flex; align-items:center; gap:14px;
    margin-bottom:18px;
  }
  .topbar .brand{
    display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;
  }
  .topbar .brand small{color:var(--text-dimmer); font-size:12px; letter-spacing:.5px; text-transform:uppercase;}
  .topbar .brand strong{font-family:'Fredoka'; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .slide-counter{
    font-family:'JetBrains Mono'; font-size:13px; color:var(--text-dim);
    background:var(--card); border:1px solid var(--border); padding:6px 12px; border-radius:100px;
    white-space:nowrap;
  }
  .progress-track{
    height:8px; background:var(--card); border-radius:100px; overflow:hidden; border:1px solid var(--border);
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--grad-1); border-radius:100px;
    transition:width .45s cubic-bezier(.6,0,.3,1);
  }
  .dots{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--border-hi); cursor:pointer;
    transition:all .25s ease; flex-shrink:0;
  }
  .dot.active{background:var(--primary); width:20px; border-radius:5px;}
  .dot.done{background:var(--secondary);}

  .stage{ position:relative; flex:1; }
  .slide{
    display:none;
    animation:fadeUp .5s ease;
  }
  .slide.active{display:block;}
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    box-shadow:var(--shadow);
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700;
    color:var(--secondary); margin-bottom:12px;
  }
  .eyebrow::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--secondary); box-shadow:0 0 12px var(--secondary);}
  h2.slide-title{font-size:clamp(22px,4vw,32px); font-weight:600; line-height:1.25; margin-bottom:10px;}
  .slide-sub{color:var(--text-dim); font-size:15px; margin-bottom:18px; line-height:1.6;}
  p{color:var(--text-dim); line-height:1.7; font-size:15.5px;}
  strong{color:var(--text); font-weight:700;}
  ul,ol{color:var(--text-dim); line-height:1.8; padding-left:22px; font-size:15.5px;}
  li{margin-bottom:6px;}
  li::marker{color:var(--secondary);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:680px){ .grid2{grid-template-columns:1fr;} }

  .badge{
    display:inline-block; padding:4px 12px; border-radius:100px; font-size:12px; font-weight:700;
    background:rgba(124,108,255,0.15); color:#b9aeff; border:1px solid rgba(124,108,255,0.3);
  }
  .badge.easy{background:rgba(61,220,151,.15); color:var(--good); border-color:rgba(61,220,151,.3);}
  .badge.med{background:rgba(255,182,72,.15); color:var(--warn); border-color:rgba(255,182,72,.3);}
  .badge.hard{background:rgba(255,107,107,.15); color:var(--bad); border-color:rgba(255,107,107,.3);}

  .formula-box{
    background:linear-gradient(135deg, rgba(124,108,255,.12), rgba(34,211,197,.08));
    border:1px solid var(--border-hi);
    border-radius:var(--radius-sm);
    padding:18px 20px;
    margin:16px 0;
    text-align:center;
  }
  .formula-box .f{
    font-family:'JetBrains Mono'; font-size:clamp(15px,3vw,20px); color:var(--text); font-weight:700;
    letter-spacing:.5px;
  }
  .formula-box .f small{display:block; font-size:11px; color:var(--text-dimmer); font-weight:400; margin-top:6px; letter-spacing:normal;}

  .info-card{
    background:var(--card-hi); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:16px 18px; margin-bottom:12px;
  }
  .info-card h4{font-family:'Fredoka'; font-size:15px; font-weight:600; margin-bottom:6px; color:var(--secondary);}

  .accordion{border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px;}
  .acc-head{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px 16px; background:var(--card-hi); cursor:pointer; font-weight:600; font-size:14.5px;
    user-select:none;
  }
  .acc-head:hover{background:#212a44;}
  .acc-head .arrow{transition:transform .3s ease; color:var(--secondary); font-size:14px;}
  .accordion.open .acc-head .arrow{transform:rotate(180deg);}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .acc-body-inner{padding:14px 16px; border-top:1px solid var(--border); font-size:14.5px; color:var(--text-dim); line-height:1.7;}

  .btn{
    font-family:'Plus Jakarta Sans'; font-weight:700; font-size:14px; cursor:pointer;
    border:none; border-radius:100px; padding:11px 22px;
    display:inline-flex; align-items:center; gap:8px;
    transition:all .2s ease;
  }
  .btn-primary{background:var(--grad-1); color:#0b0f1a;}
  .btn-primary:hover{filter:brightness(1.1); transform:translateY(-1px);}
  .btn-ghost{background:transparent; border:1px solid var(--border-hi); color:var(--text);}
  .btn-ghost:hover{background:var(--card-hi);}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none !important;}
  .btn-sm{padding:8px 16px; font-size:13px;}

  .reveal-wrap{margin:14px 0;}
  .reveal-body{
    max-height:0; overflow:hidden; transition:max-height .4s ease;
    background:rgba(34,211,197,.06); border:1px dashed var(--border-hi); border-radius:var(--radius-sm);
    margin-top:10px;
  }
  .reveal-body.open{max-height:600px;}
  .reveal-body-inner{padding:16px;}

  .step-list{counter-reset:step;}
  .step-item{
    display:flex; gap:12px; margin-bottom:12px; opacity:.35; transition:opacity .3s ease;
  }
  .step-item.shown{opacity:1;}
  .step-num{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--grad-1);
    color:#0b0f1a; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .step-text{flex:1; padding-top:3px; font-size:14.5px; color:var(--text-dim); line-height:1.6;}
  .step-text .mono{color:var(--text);}

  .mcq-options{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .mcq-opt{
    text-align:left; padding:13px 16px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--card-hi); color:var(--text); cursor:pointer; font-size:14.5px; font-weight:500;
    transition:all .2s ease; display:flex; align-items:center; gap:10px;
  }
  .mcq-opt:hover:not(:disabled){border-color:var(--primary);}
  .mcq-opt .letter{
    width:24px; height:24px; border-radius:50%; background:var(--border); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; flex-shrink:0;
  }
  .mcq-opt.correct{background:rgba(61,220,151,.14); border-color:var(--good);}
  .mcq-opt.correct .letter{background:var(--good); color:#0b0f1a;}
  .mcq-opt.wrong{background:rgba(255,107,107,.14); border-color:var(--bad);}
  .mcq-opt.wrong .letter{background:var(--bad); color:#0b0f1a;}
  .mcq-opt:disabled{cursor:default;}
  .fb-msg{margin-top:12px; padding:12px 14px; border-radius:var(--radius-sm); font-size:14px; display:none;}
  .fb-msg.ok{display:block; background:rgba(61,220,151,.1); border:1px solid var(--good); color:var(--good);}
  .fb-msg.no{display:block; background:rgba(255,107,107,.1); border:1px solid var(--bad); color:var(--bad);}

  .viz-wrap{
    background:var(--card-hi); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:16px; margin:16px 0; display:flex; justify-content:center;
  }
  .viz-wrap svg{max-width:100%; height:auto;}

  .slider-ctrl{margin:18px 0;}
  .slider-ctrl label{display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:600;}
  .slider-ctrl label .val{color:var(--secondary); font-family:'JetBrains Mono';}
  input[type=range]{
    width:100%; -webkit-appearance:none; height:6px; border-radius:100px; background:var(--border-hi); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--grad-1); cursor:pointer;
    border:3px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:var(--primary); cursor:pointer; border:3px solid var(--bg);
  }

  .answer-row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  .answer-row input[type=text]{
    flex:1; min-width:140px; background:var(--card-hi); border:1px solid var(--border-hi); border-radius:var(--radius-sm);
    padding:11px 14px; color:var(--text); font-family:'JetBrains Mono'; font-size:15px;
  }
  .answer-row input[type=text]:focus{outline:none; border-color:var(--primary);}

  table{width:100%; border-collapse:collapse; margin:14px 0; font-size:14px;}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);}
  th{color:var(--secondary); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.5px;}
  td{color:var(--text-dim);}
  table.freq-table td, table.freq-table th{text-align:center;}
  table.freq-table td:first-child, table.freq-table th:first-child{text-align:left;}

  .navbar{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(11,15,26,0.85); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:14px 18px;
    display:flex; justify-content:center; z-index:50;
  }
  .navbar-inner{
    max-width:980px; width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .nav-hint{font-size:11px; color:var(--text-dimmer); text-align:center; display:none;}
  @media(min-width:680px){ .nav-hint{display:block;} }

  .quiz-progress{display:flex; gap:5px; margin-bottom:16px;}
  .quiz-progress .qp{flex:1; height:5px; border-radius:100px; background:var(--border);}
  .quiz-progress .qp.filled{background:var(--secondary);}
  .quiz-progress .qp.filled.wrong{background:var(--bad);}
  .quiz-score-ring{
    width:140px; height:140px; margin:0 auto 18px; position:relative; display:flex; align-items:center; justify-content:center;
  }
  .quiz-score-ring strong{font-size:32px; font-family:'Fredoka';}
  .quiz-score-ring span{font-size:12px; color:var(--text-dim); position:absolute; bottom:36px;}

  .center{text-align:center;}
  .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mb-0{margin-bottom:0;}
  .flex-wrap{display:flex; gap:10px; flex-wrap:wrap;}

  .cover-hero{
    text-align:center; padding:40px 10px 20px;
  }
  .cover-hero .icon{font-size:56px; margin-bottom:16px; display:block;}
  .cover-hero h1{font-size:clamp(26px,5vw,42px); line-height:1.2; margin-bottom:14px;}
  .cover-hero h1 span{background:var(--grad-1); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .cover-hero p{max-width:520px; margin:0 auto; font-size:16px;}
  .chip-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
  .chip{background:var(--card-hi); border:1px solid var(--border); padding:7px 14px; border-radius:100px; font-size:12.5px; color:var(--text-dim);}

  .matching-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:16px;}
  @media(max-width:640px){.matching-wrap{grid-template-columns:1fr;}}
  .match-item{
    padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card-hi);
    margin-bottom:8px; cursor:pointer; font-size:14px; transition:all .2s;
  }
  .match-item.selected{border-color:var(--primary); background:rgba(124,108,255,.15);}
  .match-item.matched{border-color:var(--good); background:rgba(61,220,151,.12); cursor:default;}
  .match-item.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .final-card{text-align:center; padding:44px 24px;}
  .final-card .icon{font-size:60px; margin-bottom:14px;}

  .raw-data{
    background:var(--card-hi); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:14px 16px; font-family:'JetBrains Mono'; font-size:14px; color:var(--text); line-height:2;
    letter-spacing:1px; text-align:center; margin:14px 0;
  }

  .tally-stage{
    background:var(--card-hi); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:20px; margin:16px 0; text-align:center;
  }
  .tally-display{
    min-height:60px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px;
    margin-bottom:16px;
  }
  .tally-group{position:relative; display:inline-block; width:32px; height:26px;}
  .tally-bar{position:absolute; bottom:0; width:3px; height:24px; background:var(--secondary); border-radius:2px;}
  .tally-diag{position:absolute; top:0; left:0; width:32px; height:24px; border-top:3px solid var(--accent); transform:rotate(-32deg); transform-origin:left top; top:11px;}
  .tally-count{font-family:'JetBrains Mono'; font-size:15px; color:var(--text-dim);}
  .tally-count strong{color:var(--secondary); font-size:22px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <small>Bab 7 — Statistika</small>
      <strong>Tabel Frekuensi</strong>
    </div>
    <div class="slide-counter"><span id="curNum">1</span> / <span id="totNum">1</span></div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="dots" id="dotsWrap"></div>

  <div class="stage" id="stage"></div>

</div>

<div class="navbar">
  <div class="navbar-inner">
    <button class="btn btn-ghost btn-sm" id="btnPrev">← Sebelumnya</button>
    <span class="nav-hint">Gunakan tombol panah ← → pada keyboard untuk navigasi</span>
    <button class="btn btn-primary btn-sm" id="btnNext">Berikutnya →</button>
  </div>
</div>

<script>
/* =========================================================
   DATA & STATE
========================================================= */
const slidesData = [];
let current = 0;

function S(html){ slidesData.push(html); }

/* ---------- 1. PEMBUKA ---------- */
S(`
<div class="card cover-hero">
  <span class="icon">📊</span>
  <h1>Bab 7: Statistika<br><span>Tabel Frekuensi</span></h1>
  <p>Bagaimana cara merangkum ratusan data menjadi sesuatu yang mudah dibaca dalam sekali pandang? Jawabannya ada pada salah satu alat statistika paling dasar: <strong>tabel frekuensi</strong>.</p>
  <div class="chip-row">
    <span class="chip">🔢 Turus &amp; Frekuensi</span>
    <span class="chip">📋 Membuat Tabel</span>
    <span class="chip">🔍 Membaca Data</span>
    <span class="chip">🧠 Menafsirkan Informasi</span>
  </div>
</div>
`);

/* ---------- 2. APERSEPSI ---------- */
S(`
<div class="card">
  <div class="eyebrow">Apersepsi</div>
  <h2 class="slide-title">Bayangkan Situasi Ini...</h2>
  <p class="slide-sub">Bu Guru mencatat nilai ulangan 20 siswa satu per satu di papan tulis. Datanya berantakan seperti ini:</p>
  <div class="raw-data">7, 8, 6, 9, 7, 8, 8, 6, 7, 9, 8, 7, 6, 8, 9, 7, 8, 6, 7, 8</div>
  <p>Coba amati sendiri: <strong>sulit, kan,</strong> untuk langsung tahu nilai berapa yang paling banyak diperoleh siswa hanya dengan melihat deretan angka acak ini?</p>
  <div class="reveal-wrap">
    <button class="btn btn-ghost" onclick="toggleReveal(this)">💡 Bagaimana cara Bu Guru merapikannya?</button>
    <div class="reveal-body"><div class="reveal-body-inner">
      <p>Bu Guru bisa mengelompokkan data yang sama, lalu menghitung berapa kali setiap nilai muncul. Hasil pengelompokan ini kemudian disusun rapi ke dalam <strong>tabel frekuensi</strong> — dan itulah yang akan kita pelajari sekarang!</p>
    </div></div>
  </div>
</div>
`);

/* ---------- 3. TUJUAN PEMBELAJARAN ---------- */
S(`
<div class="card">
  <div class="eyebrow">Tujuan Pembelajaran</div>
  <h2 class="slide-title">Setelah mempelajari submateri ini, kamu diharapkan mampu:</h2>
  <ul class="mt-16">
    <li>Menjelaskan <strong>pengertian tabel frekuensi</strong>.</li>
    <li><strong>Membuat tabel frekuensi</strong> dari data mentah menggunakan turus.</li>
    <li>Menentukan <strong>frekuensi</strong> suatu data tertentu.</li>
    <li><strong>Membaca</strong> informasi yang tersaji dalam tabel frekuensi.</li>
    <li>Menentukan <strong>jumlah seluruh data</strong> dari sebuah tabel frekuensi.</li>
    <li>Menentukan <strong>nilai yang memiliki frekuensi tertentu</strong> (misalnya frekuensi tertinggi/terendah).</li>
    <li><strong>Menyajikan data</strong> ke dalam bentuk tabel.</li>
    <li><strong>Menafsirkan informasi</strong> dari tabel frekuensi untuk mengambil kesimpulan.</li>
  </ul>
</div>
`);

/* ---------- 4. KONSEP: PENGERTIAN TABEL FREKUENSI ---------- */
S(`
<div class="card">
  <div class="eyebrow">Konsep Dasar</div>
  <h2 class="slide-title">Apa itu Tabel Frekuensi?</h2>
  <p><strong>Frekuensi</strong> adalah banyaknya kemunculan suatu data (nilai/kategori) dalam sekumpulan data. <strong>Tabel frekuensi</strong> adalah tabel yang menyajikan setiap data beserta banyak kemunculannya (frekuensinya) secara ringkas dan terorganisir.</p>
  <div class="formula-box">
    <div class="f">Tabel Frekuensi = Daftar Data + Banyak Kemunculan Tiap Data
      <small>tujuannya agar data mentah lebih mudah dibaca dan dianalisis</small>
    </div>
  </div>
  <div class="info-card mt-16">
    <h4>📌 Contoh Sederhana</h4>
    <p style="font-size:14px">Jika dalam sekumpulan data terdapat angka 8 sebanyak 7 kali, maka frekuensi data 8 adalah <strong>7</strong>.</p>
  </div>
</div>
`);

/* ---------- 5. ISTILAH PENTING ---------- */
S(`
<div class="card">
  <div class="eyebrow">Istilah Penting</div>
  <h2 class="slide-title">Kenali Istilah-istilah Berikut</h2>
  <p class="slide-sub">Klik setiap istilah untuk melihat penjelasannya.</p>
  <div class="accordion">
    <div class="acc-head" onclick="toggleAcc(this)"><span>📄 Data</span><span class="arrow">▾</span></div>
    <div class="acc-body"><div class="acc-body-inner">Kumpulan fakta, angka, atau keterangan yang dikumpulkan melalui pengamatan atau survei, misalnya nilai ulangan, tinggi badan, atau warna favorit.</div></div>
  </div>
  <div class="accordion">
    <div class="acc-head" onclick="toggleAcc(this)"><span>🔢 Frekuensi</span><span class="arrow">▾</span></div>
    <div class="acc-body"><div class="acc-body-inner">Banyaknya kemunculan suatu data tertentu dalam sekumpulan data.</div></div>
  </div>
  <div class="accordion">

/* =========================================================
   QUIZ DATA
========================================================= */
const quizQuestions = [
  {
    q: "Dari tabel nilai ulangan (6:4, 7:6, 8:7, 9:3), berapa siswa yang mendapat nilai 8?",
    opts: ["4 siswa","6 siswa","7 siswa","3 siswa"],
    correct: 2,
    explain: "Berdasarkan tabel, frekuensi nilai 8 adalah 7 siswa."
  },
  {
    q: "Berapa total siswa yang mengikuti ulangan pada tabel nilai (6:4, 7:6, 8:7, 9:3)?",
    opts: ["16 siswa","18 siswa","20 siswa","22 siswa"],
    correct: 2,
    explain: "4 + 6 + 7 + 3 = 20 siswa."
  },
  {
    q: "Nilai berapa yang paling banyak diperoleh siswa (frekuensi tertinggi) pada tabel nilai tersebut?",
    opts: ["6","7","8","9"],
    correct: 2,
    explain: "Nilai 8 memiliki frekuensi tertinggi yaitu 7."
  },
  {
    q: "Pernyataan: 'Frekuensi adalah banyaknya kemunculan suatu data dalam sekumpulan data.' Benar atau salah?",
    opts: ["Benar","Salah"],
    correct: 0,
    explain: "Pernyataan tersebut benar dan merupakan definisi dasar frekuensi."
  },
  {

  },
  {
    q: "Berapa total keluarga yang disurvei pada tabel jumlah anak (0:3, 1:8, 2:12, 3:5, 4:2)?",
    opts: ["25 keluarga","28 keluarga","30 keluarga","32 keluarga"],
    correct: 2,
    explain: "3 + 8 + 12 + 5 + 2 = 30 keluarga."
  },
  {
    q: "Dari data penjualan sepatu (38:6, 39:10, 40:15, 41:9, 42:4), ukuran berapa yang paling laris?",
    opts: ["38","39","40","41"],
    correct: 2,
    explain: "Ukuran 40 memiliki frekuensi tertinggi, yaitu 15 pasang terjual."
  },
  {
    q: "Pernyataan: 'Jumlah seluruh data pada tabel frekuensi sama dengan jumlah semua nilai frekuensinya.' Benar atau salah?",
    opts: ["Benar","Salah"],
    correct: 0,
    explain: "Benar, jumlah seluruh data diperoleh dengan menjumlahkan semua frekuensi pada tabel."
  },
  {
    q: "Dari tabel jumlah anak (total 30 keluarga), berapa persen (dibulatkan) keluarga yang memiliki 1 anak (frekuensi 8)?",
    opts: ["20%","27%","33%","40%"],
    correct: 1,
    explain: "(8 ÷ 30) × 100% ≈ 26,7%, dibulatkan menjadi 27%."
  },
  {
    q: "Tanda turus 'IIII' (empat garis tegak tanpa coretan menyilang) biasanya mewakili berapa data?",
    opts: ["3 data","4 data","5 data","10 data"],
    correct: 1,
    explain: "Empat garis tegak tanpa coretan menyilang mewakili 4 data; garis kelima baru dicoret menyilang untuk membentuk kelompok 5."
  }
];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = [];

function renderQuiz(){
  quizIndex = 0; quizScore = 0; quizAnswered = new Array(quizQuestions.length).fill(null);
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  if(quizIndex >= quizQuestions.length){
    renderQuizResult();
    return;
  }
  const q = quizQuestions[quizIndex];
  let progressHtml = '<div class="quiz-progress">';
  for(let i=0;i<quizQuestions.length;i++){
    let cls = 'qp';
    if(quizAnswered[i]===true) cls += ' filled';
    if(quizAnswered[i]===false) cls += ' filled wrong';
    progressHtml += `<div class="${cls}"></div>`;
  }
  progressHtml += '</div>';

  let optsHtml = '<div class="mcq-options">';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt,i)=>{
    optsHtml += `<button class="mcq-opt" onclick="answerQuiz(${i})"><span class="letter">${letters[i]}</span>${opt}</button>`;
  });
  optsHtml += '</div>';

  area.innerHTML = `
    ${progressHtml}
    <p style="font-size:12px;color:var(--text-dimmer);margin-bottom:6px;">Soal ${quizIndex+1} dari ${quizQuestions.length}</p>
    <p style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:4px;">${q.q}</p>
    ${optsHtml}
    <div class="fb-msg" id="quizFb"></div>
    <div class="flex-wrap mt-16">
      <button class="btn btn-primary btn-sm" id="quizNextBtn" style="display:none" onclick="nextQuizQuestion()">Soal Berikutnya →</button>
    </div>
  `;
}

function answerQuiz(i){
  const q = quizQuestions[quizIndex];
  const buttons = document.querySelectorAll('#quizArea .mcq-opt');
  buttons.forEach((b,idx)=>{
    b.disabled = true;
    if(idx===q.correct) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  const fb = document.getElementById('quizFb');
  const isCorrect = (i===q.correct);
  quizAnswered[quizIndex] = isCorrect;
  if(isCorrect) quizScore++;
  fb.className = 'fb-msg ' + (isCorrect?'ok':'no');
  fb.textContent = (isCorrect?'✅ Benar! ':'❌ Belum tepat. ') + q.explain;
  document.getElementById('quizNextBtn').style.display = 'inline-flex';
  document.getElementById('quizNextBtn').textContent = (quizIndex === quizQuestions.length-1) ? 'Lihat Skor →' : 'Soal Berikutnya →';
}

function nextQuizQuestion(){
  quizIndex++;
  renderQuizQuestion();
}

function renderQuizResult(){
  const area = document.getElementById('quizArea');
  const pct = Math.round((quizScore/quizQuestions.length)*100);
  let msg = 'Terus berlatih ya!';
  let icon = '💪';
  if(pct>=90){ msg='Luar biasa! Kamu menguasai submateri ini dengan sangat baik.'; icon='🏆'; }
  else if(pct>=70){ msg='Kerja bagus! Pemahamanmu sudah cukup kuat.'; icon='🎉'; }
  else if(pct>=50){ msg='Sudah lumayan, tapi coba ulas kembali beberapa konsep ya.'; icon='📘'; }

  area.innerHTML = `
    <div class="center">
      <div class="quiz-score-ring">
        <strong>${pct}%</strong>
        <span>Skor Akhir</span>
      </div>
      <div style="font-size:40px;">${icon}</div>
      <p style="font-size:15px;margin:10px 0 4px;color:var(--text)">${quizScore} dari ${quizQuestions.length} jawaban benar</p>
      <p style="font-size:14px;max-width:400px;margin:0 auto;">${msg}</p>
      <button class="btn btn-primary mt-24" onclick="renderQuiz()">↺ Ulangi Kuis</button>
    </div>
  `;
}

/* =========================================================
   INTERACTIVITY HELPERS
========================================================= */
let tallyCounter = 0;
function renderTallyHTML(n){
  const groups = Math.floor(n/5);
  const rem = n%5;
  let html = '';
  for(let g=0; g<groups; g++){
    html += '<span class="tally-group">'
      + '<span class="tally-bar" style="left:0px;"></span>'
      + '<span class="tally-bar" style="left:7px;"></span>'
      + '<span class="tally-bar" style="left:14px;"></span>'
      + '<span class="tally-bar" style="left:21px;"></span>'
      + '<span class="tally-diag"></span>'
      + '</span>';
  }
  if(rem>0){
    html += '<span class="tally-group">';
    for(let i=0;i<rem;i++){
      html += `<span class="tally-bar" style="left:${i*7}px;"></span>`;
    }
    html += '</span>';
  }
  return html || '<span style="color:var(--text-dimmer);font-size:13px;">Belum ada data</span>';
}
function addTally(){
  tallyCounter++;
  document.getElementById('tallyDisplay').innerHTML = renderTallyHTML(tallyCounter);
  document.getElementById('tallyCount').textContent = tallyCounter;
}
function resetTally(){
  tallyCounter = 0;
  document.getElementById('tallyDisplay').innerHTML = renderTallyHTML(0);
  document.getElementById('tallyCount').textContent = 0;
}

function toggleAcc(headEl){
  const acc = headEl.parentElement;
  const body = acc.querySelector('.acc-body');
  const isOpen = acc.classList.contains('open');
  if(isOpen){
    acc.classList.remove('open');
    body.style.maxHeight = null;
  } else {
    acc.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function toggleReveal(btn){
  const wrap = btn.parentElement;
  const body = wrap.querySelector('.reveal-body');
  body.classList.toggle('open');
}

function revealSteps(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const items = container.querySelectorAll('.step-item');
  let i = 0;
  const iv = setInterval(()=>{
    if(i>=items.length){ clearInterval(iv); return; }
    items[i].classList.add('shown');
    i++;
  }, 450);
}

function checkNumAnswer(inputId, correctVal, fbId, tolerance){
  const tol = (typeof tolerance === 'number') ? tolerance : 0.01;
  const input = document.getElementById(inputId);
  const fb = document.getElementById(fbId);
  const raw = input.value.replace(',', '.').replace('%','').trim();
  const val = parseFloat(raw);
  if(isNaN(val)){
    fb.className = 'fb-msg no';
    fb.textContent = 'Masukkan jawaban berupa angka terlebih dahulu.';
    return;
  }
  if(Math.abs(val - correctVal) <= tol){
    fb.className = 'fb-msg ok';
    fb.textContent = '✅ Benar! Jawabanmu tepat.';
  } else {
    fb.className = 'fb-msg no';
    fb.textContent = '❌ Belum tepat, coba periksa kembali langkah perhitunganmu. Lihat pembahasan di bawah untuk membantumu.';
  }
}

function answerMCQ(btn, groupId, isCorrect, label){
  const group = document.getElementById(groupId);
  const buttons = group.querySelectorAll('.mcq-opt');
  buttons.forEach(b=>b.disabled = true);
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b=>{
      if(b.textContent.trim().startsWith('B') && b.textContent.includes('7 keluarga')) b.classList.add('correct');
    });
  }
  const fb = document.getElementById(groupId+'-fb');
  fb.className = 'fb-msg ' + (isCorrect?'ok':'no');
  fb.textContent = isCorrect
    ? '✅ Benar! Keluarga dengan lebih dari 2 anak = frekuensi 3 anak (5) + frekuensi 4 anak (2) = 7 keluarga.'
    : '❌ Belum tepat. Keluarga dengan lebih dari 2 anak = 5 + 2 = 7 keluarga.';
}

function reflectPick(btn){
  const group = btn.parentElement;
  group.querySelectorAll('.mcq-opt').forEach(b=>b.classList.remove('correct'));
  btn.classList.add('correct');
  const fb = document.getElementById('reflectFb');
  fb.className = 'fb-msg ok';
  fb.textContent = 'Terima kasih sudah jujur merefleksikan pemahamanmu! Jika masih ada yang bingung, coba ulangi slide contoh soal sebelumnya atau tanyakan pada gurumu.';
}

let matchSelected = null;
let matchCount = 0;
function selectMatch(el){
  if(el.classList.contains('matched')) return;
  if(matchSelected === null){
    matchSelected = el;
    el.classList.add('selected');
    return;
  }
  if(matchSelected === el){
    el.classList.remove('selected');
    matchSelected = null;
    return;
  }
  const p1 = matchSelected.dataset.pair;
  const p2 = el.dataset.pair;
  if(p1 === p2){
    matchSelected.classList.remove('selected');
    matchSelected.classList.add('matched');
    el.classList.add('matched');
    matchCount++;
    document.getElementById('matchStatus').textContent = matchCount + ' dari 4 pasangan benar';
    matchSelected = null;
  } else {
    el.classList.add('shake');
    matchSelected.classList.add('shake');
    setTimeout(()=>{
      el.classList.remove('shake');
      matchSelected.classList.remove('shake');
      matchSelected.classList.remove('selected');
      matchSelected = null;
    }, 400);
  }
}

/* =========================================================
   SLIDE ENGINE
========================================================= */
const stage = document.getElementById('stage');
function buildSlides(){
  stage.innerHTML = '';
  slidesData.forEach((html, idx)=>{
    const div = document.createElement('div');
    div.className = 'slide' + (idx===0 ? ' active' : '');
    div.dataset.index = idx;
    div.innerHTML = html;
    stage.appendChild(div);
  });
  document.getElementById('totNum').textContent = slidesData.length;
  buildDots();
  updateProgress();
}

function buildDots(){
  const wrap = document.getElementById('dotsWrap');
  wrap.innerHTML = '';
  slidesData.forEach((_, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx===0?' active':'');
    d.onclick = ()=>goTo(idx);
    wrap.appendChild(d);
  });
}

function updateProgress(){
  const pct = ((current) / (slidesData.length-1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('curNum').textContent = current+1;
  document.querySelectorAll('.dot').forEach((d,idx)=>{
    d.classList.remove('active','done');
    if(idx===current) d.classList.add('active');
    else if(idx<current) d.classList.add('done');
  });
  document.getElementById('btnPrev').disabled = (current===0);
  document.getElementById('btnNext').disabled = (current===slidesData.length-1);
}

function goTo(idx){
  if(idx<0 || idx>=slidesData.length) return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  const target = stage.querySelector(`.slide[data-index="${idx}"]`);
  target.classList.add('active');
  current = idx;
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});

  if(target.querySelector('#tallyDisplay') && !target.dataset.tallyInit){
    target.dataset.tallyInit = '1';
    resetTally();
  }
  if(target.querySelector('#quizArea') && !target.dataset.quizInit){
    target.dataset.quizInit = '1';
    renderQuiz();
  }
}

document.getElementById('btnNext').addEventListener('click', ()=>goTo(current+1));
document.getElementById('btnPrev').addEventListener('click', ()=>goTo(current-1));
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});

buildSlides();
</script>
