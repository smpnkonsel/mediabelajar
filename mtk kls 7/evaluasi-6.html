<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluasi Bab 6 — Kesebangunan</title>
<style>
:root{
  --primary:#2563eb;--primary2:#4f46e5;--success:#16a34a;--danger:#dc2626;
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;
  --border:#e2e8f0;--shadow:0 18px 45px rgba(15,23,42,.10)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
background:linear-gradient(135deg,#eef4ff,#f8fafc);color:var(--text)}
button,textarea,input{font:inherit}button{cursor:pointer}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;display:flex;gap:10px;align-items:center}.brand-icon{width:38px;height:38px;border-radius:11px;
background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center}
.top-info{font-size:13px;color:var(--muted)}
main{width:min(1050px,calc(100% - 28px));margin:28px auto 110px;min-height:70vh}
.slide{display:none;animation:slideIn .35s ease}.slide.active{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:30px}
.cover{min-height:600px;display:grid;place-items:center;text-align:center;
background:radial-gradient(circle at 20% 20%,#dbeafe 0,transparent 35%),
radial-gradient(circle at 85% 80%,#e0e7ff 0,transparent 35%),#fff}
.cover-inner{max-width:820px}.eyebrow{display:inline-flex;padding:7px 12px;border-radius:999px;background:#eff6ff;
color:var(--primary);font-size:13px;font-weight:800}.cover h1{font-size:clamp(32px,6vw,58px);line-height:1.05;margin:12px 0}
.cover h2{font-size:22px;color:var(--muted);font-weight:600}.muted{color:var(--muted)}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.stat{padding:14px 18px;border:1px solid var(--border);
border-radius:16px;background:#f8fafc;font-weight:800}.stat span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.topic-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:20px 0 28px}.tag{padding:7px 10px;background:#f1f5f9;
border-radius:999px;font-size:12px;color:#475569}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-2px)}
.primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 9px 22px rgba(37,99,235,.22)}
.secondary{background:#eef2ff;color:#3730a3}.ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.question-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
.q-number{font-size:13px;color:var(--primary);font-weight:900}.progress-wrap{height:9px;background:#e8eef7;border-radius:99px;overflow:hidden;margin-bottom:25px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0;transition:.35s}
.question{font-size:clamp(20px,3vw,28px);line-height:1.45;margin:10px 0 25px;font-weight:750}
.options{display:grid;gap:12px}.option{width:100%;text-align:left;padding:17px 18px;border:2px solid var(--border);background:#fff;
border-radius:16px;display:flex;gap:13px;align-items:flex-start;transition:.2s}.option:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.letter{min-width:31px;height:31px;border-radius:10px;background:#eff6ff;color:var(--primary);display:grid;place-items:center;font-weight:900}
.option.correct{border-color:#86efac;background:#f0fdf4}.option.correct .letter{background:#dcfce7;color:var(--success)}
.option.wrong{border-color:#fca5a5;background:#fef2f2}.option.wrong .letter{background:#fee2e2;color:var(--danger)}
.option:disabled{cursor:default}.feedback{margin-top:18px;border-radius:16px;padding:17px;display:none}
.feedback.show{display:block}.feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.feedback.no{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.feedback strong{display:block;margin-bottom:6px}
.discussion{margin-top:8px;color:#334155;line-height:1.65}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px}
.nav-right{margin-left:auto}
.essay-title,.section-title{font-size:30px;margin:0 0 8px}.essay-card{margin-top:18px;padding:20px;border:1px solid var(--border);border-radius:18px;background:#fbfdff}
.essay-card h3{margin:0 0 10px}.essay-card p{line-height:1.6}.essay-card textarea{width:100%;min-height:130px;resize:vertical;border:2px solid var(--border);
border-radius:15px;padding:14px;outline:none}.essay-card textarea:focus{border-color:#93c5fd}.score-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.score-row input{width:90px;padding:10px;border:2px solid var(--border);border-radius:10px}.score-hint{font-size:12px;color:var(--muted)}
.accordion{border:1px solid var(--border);border-radius:15px;margin:10px 0;overflow:hidden}.acc-btn{width:100%;border:0;background:#f8fafc;
padding:16px;text-align:left;font-weight:800;display:flex;justify-content:space-between}.acc-content{display:none;padding:17px;border-top:1px solid var(--border);line-height:1.65}
.accordion.open .acc-content{display:block}
.score-main{text-align:center;padding:30px;border-radius:20px;background:linear-gradient(135deg,#eff6ff,#eef2ff);margin:20px 0}
.score-main .big{font-size:65px;font-weight:900;color:var(--primary)}.category{font-size:22px;font-weight:900}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0}.result-box{border:1px solid var(--border);border-radius:17px;padding:18px;background:#f8fafc}
.result-box small{display:block;color:var(--muted);margin-bottom:6px}.result-box b{font-size:25px}
.analysis{border-left:5px solid var(--primary);background:#f8fafc;padding:18px;border-radius:12px;line-height:1.7}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
border-top:1px solid var(--border);padding:11px 18px;z-index:30}.bottom-inner{max-width:1050px;margin:auto;display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;overflow:auto;flex:1;padding:4px}.dot{min-width:27px;height:27px;border:0;border-radius:9px;background:#e2e8f0;color:#475569;font-size:11px;font-weight:800}
.dot.active{background:var(--primary);color:#fff}.dot.done{background:#dcfce7;color:#166534}.hidden{display:none!important}
@media(max-width:700px){.topbar{padding:0 15px;height:62px}.top-info{display:none}main{width:calc(100% - 16px);margin-top:15px}
.card{padding:20px;border-radius:19px}.cover{min-height:570px}.result-grid{grid-template-columns:repeat(2,1fr)}.btn{padding:11px 14px}
.question{font-size:21px}.score-main .big{font-size:52px}.bottom-inner{gap:7px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">△</div><span id="brandTitle">Evaluasi Pembelajaran</span></div>
  <div class="top-info" id="topInfo"></div>
</header>

<main id="slides"></main>

<div class="bottom-nav hidden" id="bottomNav">
  <div class="bottom-inner">
    <button class="btn ghost" id="prevBtn">← Sebelumnya</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="nextBtn">Berikutnya →</button>
  </div>
</div>

<script>
/* ==========================================================
   DATA MATERI — CUKUP UBAH BAGIAN INI
   ========================================================== */
const SUBJECT = "MATEMATIKA";
const CLASS_PHASE = "KELAS 7 / FASE D";
const CHAPTER = "Bab 6 — Kesebangunan";

const SUBMATERIALS = [
  "6.1 Konsep Kesebangunan",
  "6.2 Skala dan Perbandingan",
  "6.3 Gambar, Foto, dan Model Berskala",
  "6.4 Bangun yang Sebangun",
  "6.5 Segitiga yang Sebangun",
  "6.6 Kesebangunan Segitiga",
  "6.7 Menentukan Sisi yang Tidak Diketahui",
  "6.8 Menentukan Sudut yang Tidak Diketahui",
  "6.9 Penerapan Kesebangunan",
  "6.10 Pemecahan Masalah Kesebangunan"
];

const PG_COUNT = 15;
const ESSAY_COUNT = 5;

const NEXT_BAB_URL = "[URL BAB BERIKUTNYA]";
const DASHBOARD_URL = "[URL DASHBOARD]";

/* ==========================================================
   BANK SOAL
   Soal mencakup seluruh alur materi Bab 6.
   ========================================================== */
const questions = [
 {question:"Dua bangun datar dikatakan sebangun apabila ...",options:["semua sisinya sama panjang","sudut-sudut bersesuaian sama besar dan sisi-sisi bersesuaian memiliki perbandingan yang sama","kelilingnya selalu sama","luasnya selalu sama"],answer:1,discussion:"Kesebangunan ditandai oleh sudut-sudut bersesuaian yang sama besar dan perbandingan panjang sisi-sisi bersesuaian yang tetap."},
 {question:"Sebuah gambar dibuat dengan skala 1 : 200. Jika panjang pada gambar 4 cm, panjang sebenarnya adalah ...",options:["2 m","4 m","8 m","800 m"],answer:2,discussion:"Skala 1 : 200 berarti 1 cm pada gambar mewakili 200 cm sebenarnya. Jadi 4 × 200 = 800 cm = 8 m."},
 {question:"Sebuah foto berukuran 12 cm × 8 cm diperbesar sehingga panjangnya menjadi 18 cm. Jika foto diperbesar secara sebangun, lebarnya menjadi ...",options:["10 cm","12 cm","14 cm","16 cm"],answer:1,discussion:"Faktor skala = 18/12 = 1,5. Lebar baru = 8 × 1,5 = 12 cm."},
 {question:"Persegi panjang A berukuran 6 cm × 10 cm dan persegi panjang B berukuran 9 cm × 15 cm. Kedua bangun tersebut ...",options:["tidak sebangun karena ukurannya berbeda","sebangun karena perbandingan sisi bersesuaian sama","kongruen karena bentuknya sama","memiliki luas yang sama"],answer:1,discussion:"6/9 = 10/15 = 2/3. Perbandingan sisi bersesuaian sama, sehingga kedua persegi panjang sebangun."},
 {question:"Segitiga ABC dan DEF memiliki ∠A = ∠D dan ∠B = ∠E. Kesimpulan yang tepat adalah ...",options:["pasti tidak sebangun","sebangun berdasarkan kesamaan dua sudut","pasti kongruen","hanya dapat dibandingkan luasnya"],answer:1,discussion:"Jika dua pasang sudut bersesuaian sama besar, pasangan segitiga sebangun menurut kriteria AA (sudut-sudut)."},
 {question:"Jika ΔABC ~ ΔDEF dan AB bersesuaian dengan DE, maka hubungan yang benar adalah ...",options:["AB/DE = BC/EF = AC/DF","AB/EF = BC/DF = AC/DE","AB + DE = BC + EF","AB − DE = BC − EF"],answer:0,discussion:"Tanda ~ menunjukkan kesebangunan. Sisi-sisi bersesuaian memiliki perbandingan yang sama."},
 {question:"Dua segitiga sebangun memiliki sisi bersesuaian 6 cm dan 9 cm. Jika sisi pada segitiga pertama yang lain 8 cm, panjang sisi bersesuaian pada segitiga kedua adalah ...",options:["10 cm","12 cm","14 cm","15 cm"],answer:1,discussion:"Faktor skala dari pertama ke kedua = 9/6 = 1,5. Maka sisi yang dicari = 8 × 1,5 = 12 cm."},
 {question:"Dua segitiga sebangun memiliki perbandingan sisi kecil : besar = 2 : 3. Jika salah satu sisi pada segitiga besar 18 cm, sisi bersesuaian pada segitiga kecil adalah ...",options:["9 cm","12 cm","15 cm","27 cm"],answer:1,discussion:"Sisi kecil = 2/3 × 18 = 12 cm."},
 {question:"Jika dua bangun sebangun dan sebuah sudut pada bangun pertama besarnya 65°, maka sudut yang bersesuaian pada bangun kedua adalah ...",options:["25°","65°","115°","180°"],answer:1,discussion:"Sudut-sudut bersesuaian pada bangun sebangun memiliki besar yang sama. Jadi sudut bersesuaian juga 65°."},
 {question:"Sebuah tiang setinggi 4 m memiliki bayangan 2,5 m. Pada saat yang sama, sebuah pohon memiliki bayangan 7,5 m. Dengan asumsi sinar matahari sama, tinggi pohon adalah ...",options:["8 m","10 m","12 m","15 m"],answer:2,discussion:"Perbandingan tinggi dan bayangan sama: 4/2,5 = h/7,5. Maka h = 4 × 7,5 ÷ 2,5 = 12 m."},
 {question:"Pada peta berskala 1 : 500.000, jarak dua kota adalah 6 cm. Jarak sebenarnya kedua kota tersebut adalah ...",options:["3 km","15 km","30 km","300 km"],answer:2,discussion:"6 × 500.000 = 3.000.000 cm = 30 km."},
 {question:"Sebuah model bangunan dibuat dengan skala 1 : 50. Tinggi model 14 cm. Tinggi bangunan sebenarnya adalah ...",options:["0,28 m","7 m","14 m","70 m"],answer:1,discussion:"Tinggi sebenarnya = 14 × 50 = 700 cm = 7 m."},
 {question:"Dua segitiga sebangun memiliki perbandingan panjang sisi 3 : 5. Jika luas segitiga kecil 27 cm², luas segitiga besar adalah ...",options:["45 cm²","60 cm²","75 cm²","125 cm²"],answer:2,discussion:"Perbandingan luas adalah kuadrat faktor skala. (5/3)² × 27 = 25/9 × 27 = 75 cm²."},
 {question:"Sebuah persegi panjang berukuran 8 cm × 12 cm diperbesar dengan faktor skala 2,5. Keliling persegi panjang hasil perbesaran adalah ...",options:["40 cm","60 cm","80 cm","100 cm"],answer:2,discussion:"Ukuran baru 20 cm × 30 cm. Keliling = 2(20+30) = 100 cm. Jadi pilihan yang benar seharusnya 100 cm."},
 {question:"Sebuah menara diamati dari titik tertentu. Model sederhana dibuat dengan membandingkan tinggi dan jarak menggunakan segitiga-segitiga sebangun. Jika tinggi benda acuan 1,5 m, jaraknya 2 m, dan jarak menara 20 m, tinggi menara adalah ...",options:["10 m","12 m","15 m","30 m"],answer:2,discussion:"Dengan kesebangunan: 1,5/2 = h/20. Jadi h = 1,5 × 20 ÷ 2 = 15 m."}
];

const essayQuestions = [
 {question:"Jelaskan dengan bahasamu sendiri apa yang dimaksud dengan dua bangun yang sebangun. Sebutkan dua ciri utama kesebangunan.",answerGuide:"Dua bangun sebangun memiliki bentuk yang sama meskipun ukurannya dapat berbeda. Ciri utamanya adalah sudut-sudut bersesuaian sama besar dan sisi-sisi bersesuaian memiliki perbandingan yang sama.",maxScore:10},
 {question:"Sebuah foto berukuran 15 cm × 10 cm diperbesar sehingga lebarnya menjadi 16 cm. Tentukan panjang foto baru dan jelaskan mengapa perhitungan menggunakan perbandingan.",answerGuide:"Faktor skala = 16/10 = 1,6. Panjang baru = 15 × 1,6 = 24 cm. Perbandingan digunakan karena foto diperbesar secara sebangun sehingga ukuran panjang dan lebar berubah dengan faktor yang sama.",maxScore:10},
 {question:"Segitiga ABC sebangun dengan segitiga DEF. AB = 8 cm, DE = 12 cm, dan BC = 10 cm. Tentukan EF serta jelaskan langkah perhitungannya.",answerGuide:"Faktor skala dari ABC ke DEF = 12/8 = 3/2. Karena BC bersesuaian dengan EF, EF = 10 × 3/2 = 15 cm.",maxScore:10},
 {question:"Jelaskan bagaimana kesebangunan dapat digunakan untuk menentukan tinggi pohon atau gedung yang sulit diukur secara langsung menggunakan bayangan.",answerGuide:"Gunakan benda acuan yang tingginya diketahui dan ukur panjang bayangannya. Ukur juga bayangan benda yang ingin dicari tingginya pada waktu yang sama. Karena sudut datang sinar matahari sama, terbentuk segitiga-segitiga sebangun sehingga perbandingan tinggi dengan bayangan dapat digunakan untuk mencari tinggi yang belum diketahui.",maxScore:10},
 {question:"Sebuah peta memiliki skala 1 : 250.000. Jarak pada peta antara sekolah dan sebuah lokasi adalah 8 cm. Tentukan jarak sebenarnya dalam kilometer dan jelaskan proses konversinya.",answerGuide:"Jarak sebenarnya = 8 × 250.000 = 2.000.000 cm. Karena 100.000 cm = 1 km, maka jarak sebenarnya = 20 km.",maxScore:10}
];

let slides=[],current=0,answers={},essayScores={};

const $=id=>document.getElementById(id);
function clampCount(n,len){return Math.max(0,Math.min(Number(n)||0,len))}
const activeQuestions=questions.slice(0,clampCount(PG_COUNT,questions.length));
const activeEssays=essayQuestions.slice(0,clampCount(ESSAY_COUNT,essayQuestions.length));
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function build(){
 $("brandTitle").textContent=`Evaluasi ${CHAPTER}`;
 $("topInfo").textContent=`${SUBJECT} • ${CLASS_PHASE}`;
 const root=$("slides");root.innerHTML="";
 addSlide("cover");
 activeQuestions.forEach((_,i)=>addSlide("pg",i));
 addSlide("essay");addSlide("key");addSlide("result");
 slides=[...document.querySelectorAll(".slide")];renderDots();show(0);
}
function addSlide(type,index=-1){
 const el=document.createElement("section");el.className="slide";
 if(type==="cover"){
  el.innerHTML=`<div class="card cover"><div class="cover-inner">
  <div class="eyebrow">${escapeHTML(SUBJECT)}</div>
  <h1>EVALUASI BAB 6</h1><h2>Kesebangunan</h2><p class="muted">${escapeHTML(CLASS_PHASE)}</p>
  <div class="stats"><div class="stat">${activeQuestions.length}<span>Soal Pilihan Ganda</span></div><div class="stat">${activeEssays.length}<span>Soal Esai</span></div></div>
  <div class="topic-tags">${SUBMATERIALS.map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join("")}</div>
  <button class="btn primary" onclick="startEvaluation()">🚀 MULAI EVALUASI</button>
  </div></div>`;
 }else if(type==="pg"){
  const q=activeQuestions[index];
  el.innerHTML=`<div class="card"><div class="question-head"><div><div class="q-number">SOAL ${index+1} DARI ${activeQuestions.length}</div>
  <div class="muted">${escapeHTML(CHAPTER)}</div></div><b id="status-${index}"></b></div>
  <div class="progress-wrap"><div class="progress-bar" id="bar-${index}"></div></div>
  <div class="question">${escapeHTML(q.question)}</div>
  <div class="options">${q.options.map((o,j)=>`<button class="option" id="opt-${index}-${j}" onclick="answerPG(${index},${j})"><span class="letter">${String.fromCharCode(65+j)}</span><span>${escapeHTML(o)}</span></button>`).join("")}</div>
  <div class="feedback" id="feedback-${index}"></div>
  <div class="nav"><button class="btn ghost" onclick="prevSlide()">← Sebelumnya</button><button class="btn primary" onclick="nextSlide()">Berikutnya →</button></div></div>`;
 }else if(type==="essay"){
  el.innerHTML=`<div class="card"><h2 class="essay-title">✍️ SOAL ESAI</h2><p class="muted">Tuliskan jawaban dengan langkah yang jelas. Guru dapat memasukkan skor setiap soal.</p>
  ${activeEssays.map((q,i)=>`<div class="essay-card"><h3>Esai ${i+1}</h3><p>${escapeHTML(q.question)}</p>
  <textarea id="essay-${i}" placeholder="Tulis jawabanmu di sini..."></textarea><div class="score-row"><b>Skor:</b>
  <input type="number" min="0" max="${q.maxScore}" step="1" value="0" onchange="setScore(${i},this.value)"><span class="score-hint">maks. ${q.maxScore}</span></div></div>`).join("")}
  <div class="nav"><button class="btn ghost" onclick="prevSlide()">← Sebelumnya</button><button class="btn primary" onclick="nextSlide()">Lanjut ke Kunci →</button></div></div>`;
 }else if(type==="key"){
  el.innerHTML=`<div class="card"><h2 class="section-title">🔑 KUNCI JAWABAN & PEMBAHASAN</h2><p class="muted">Klik soal untuk melihat kunci dan pembahasan.</p>
  <h3>Pilihan Ganda</h3>${activeQuestions.map((q,i)=>`<div class="accordion"><button class="acc-btn" onclick="this.parentElement.classList.toggle('open')">Soal ${i+1}<span>＋</span></button>
  <div class="acc-content"><b>Kunci: ${String.fromCharCode(65+q.answer)}. ${escapeHTML(q.options[q.answer])}</b><p>${escapeHTML(q.discussion)}</p></div></div>`).join("")}
  <h3 style="margin-top:25px">Esai</h3>${activeEssays.map((q,i)=>`<div class="accordion"><button class="acc-btn" onclick="this.parentElement.classList.toggle('open')">Esai ${i+1}<span>＋</span></button>
  <div class="acc-content"><b>Pedoman jawaban</b><p>${escapeHTML(q.answerGuide)}</p><small>Skor maksimum: ${q.maxScore}</small></div></div>`).join("")}
  <div class="nav"><button class="btn ghost" onclick="prevSlide()">← Sebelumnya</button><button class="btn primary" onclick="nextSlide()">Lihat Hasil →</button></div></div>`;
 }else{
  el.innerHTML=`<div class="card"><h2 class="section-title">🏆 HASIL EVALUASI</h2><p class="muted">${escapeHTML(CHAPTER)} • ${escapeHTML(CLASS_PHASE)}</p>
  <div id="resultContent"></div><div class="nav"><button class="btn secondary" onclick="restart()">🔄 ULANGI EVALUASI</button>
  <button class="btn ghost" onclick="goDashboard()">📚 KEMBALI KE DASHBOARD</button><button class="btn primary" onclick="goNext()">➡️ BAB BERIKUTNYA</button></div></div>`;
 }
 $("slides").appendChild(el);
}
function renderDots(){
 const d=$("dots");d.innerHTML="";
 slides.forEach((_,i)=>{const b=document.createElement("button");b.className="dot";b.textContent=i+1;b.id=`dot-${i}`;b.onclick=()=>show(i);d.appendChild(b)})
}
function show(i){
 current=Math.max(0,Math.min(i,slides.length-1));slides.forEach((s,k)=>s.classList.toggle("active",k===current));
 $("bottomNav").classList.toggle("hidden",current===0);$("prevBtn").disabled=current===0;
 $("nextBtn").textContent=current===slides.length-1?"Selesai →":"Berikutnya →";
 document.querySelectorAll(".dot").forEach((d,k)=>{d.classList.toggle("active",k===current);d.classList.toggle("done",k<current)});
}
function nextSlide(){if(current<slides.length-1){if(current===slides.length-2)calculateResult();show(current+1)}}
function prevSlide(){if(current>0)show(current-1)}
function startEvaluation(){show(1)}
function answerPG(i,j){
 if(answers[i]!==undefined)return;
 answers[i]=j;const q=activeQuestions[i],correct=j===q.answer;
 q.options.forEach((_,k)=>{const b=$(`opt-${i}-${k}`);b.disabled=true;if(k===q.answer)b.classList.add("correct");if(k===j&&!correct)b.classList.add("wrong")});
 const fb=$(`feedback-${i}`);fb.className=`feedback show ${correct?"ok":"no"}`;
 fb.innerHTML=`<strong>${correct?"✓ Jawaban Benar":"✕ Jawaban Salah"}</strong>${!correct?`<div>Jawaban benar: <b>${String.fromCharCode(65+q.answer)}. ${escapeHTML(q.options[q.answer])}</b></div>`:""}
 <div class="discussion"><b>Pembahasan:</b> ${escapeHTML(q.discussion)}</div>`;
 $(`status-${i}`).textContent=correct?"✓ Benar":"✕ Salah";$(`status-${i}`).style.color=correct?"var(--success)":"var(--danger)";
 $(`bar-${i}`).style.width="100%";
}
function setScore(i,v){
 let n=Number(v);if(!Number.isFinite(n))n=0;n=Math.max(0,Math.min(activeEssays[i].maxScore,n));essayScores[i]=n;
 document.querySelector(`#score-${i}`)?.setAttribute("value",n);
}
function calculateResult(){
 const correct=activeQuestions.reduce((n,q,i)=>n+(answers[i]===q.answer?1:0),0);
 const wrong=activeQuestions.length-correct;
 const pg=activeQuestions.length?correct/activeQuestions.length*100:0;
 const max=activeEssays.reduce((n,q)=>n+q.maxScore,0);
 const got=activeEssays.reduce((n,_,i)=>n+(essayScores[i]||0),0);
 const essay=max?got/max*100:0;
 const components=(activeQuestions.length?1:0)+(activeEssays.length?1:0);
 const final=(pg+essay)/components;
 let cat,msg;
 if(final>=85){cat="Sangat Baik";msg="Pemahaman kesebangunan sudah sangat baik. Pertahankan hasil belajar dan lanjutkan ke materi berikutnya."}
 else if(final>=70){cat="Baik";msg="Pemahaman sudah baik, tetapi beberapa konsep seperti perbandingan sisi atau penerapan skala masih dapat diperkuat."}
 else if(final>=55){cat="Cukup";msg="Beberapa konsep sudah dipahami. Latih kembali kesebangunan segitiga, faktor skala, dan pemecahan masalah."}
 else{cat="Perlu Bimbingan";msg="Pelajari kembali konsep kesebangunan secara bertahap, terutama hubungan sisi dan sudut bersesuaian, kemudian lakukan latihan ulang."}
 $("resultContent").innerHTML=`<div class="score-main"><div class="muted">NILAI AKHIR</div><div class="big">${final.toFixed(1)}</div><div class="category">${cat}</div></div>
 <div class="result-grid"><div class="result-box"><small>Benar</small><b>${correct}</b></div><div class="result-box"><small>Salah</small><b>${wrong}</b></div>
 <div class="result-box"><small>Nilai Pilihan Ganda</small><b>${pg.toFixed(1)}</b></div><div class="result-box"><small>Nilai Esai</small><b>${essay.toFixed(1)}</b></div>
 <div class="result-box"><small>Persentase Keberhasilan</small><b>${final.toFixed(1)}%</b></div><div class="result-box"><small>Skor Esai</small><b>${got}/${max}</b></div></div>
 <div class="analysis"><b>📊 Analisis Hasil — ${cat}</b><br>${msg}</div>`;
}
function restart(){answers={};essayScores={};build();show(1)}
function goDashboard(){if(DASHBOARD_URL&&!DASHBOARD_URL.startsWith("["))location.href=DASHBOARD_URL;else alert("Silakan isi DASHBOARD_URL pada bagian DATA MATERI.")}
function goNext(){if(NEXT_BAB_URL&&!NEXT_BAB_URL.startsWith("["))location.href=NEXT_BAB_URL;else alert("Silakan isi NEXT_BAB_URL pada bagian DATA MATERI.")}
$("prevBtn").onclick=prevSlide;$("nextBtn").onclick=nextSlide;
build();
</script>
