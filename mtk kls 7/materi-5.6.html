<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bunga Tunggal — Aritmetika Sosial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c;
  --bg-soft:#0d1424;
  --surface:#131c31;
  --surface-2:#19243d;
  --surface-3:#202d4a;
  --border:#263252;
  --border-soft:#1c2740;
  --text:#eef2fb;
  --text-dim:#aab7d1;
  --text-mute:#7686a8;
  --mint:#2fd6a7;
  --mint-dim:#1a8f70;
  --sky:#4fb2f2;
  --gold:#f0b73d;
  --coral:#f2725a;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow-lift:0 24px 60px -24px rgba(0,0,0,.65);
  --font-head:'Fredoka',sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --grad-money: linear-gradient(120deg,#2fd6a7 0%,#4fb2f2 100%);
  --grad-gold: linear-gradient(120deg,#f0b73d 0%,#f2725a 100%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 10% 0%, rgba(47,214,167,.08), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(79,178,242,.08), transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-head{font-family:var(--font-head);font-weight:600;letter-spacing:.2px;}
code, .mono, .num{font-family:var(--font-mono);}
::selection{background:var(--mint);color:#04231a;}

/* ===== APP SHELL ===== */
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  width:100vw;
}
header.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 22px;
  border-bottom:1px solid var(--border-soft);
  background:rgba(10,15,28,.7);
  backdrop-filter:blur(10px);
  z-index:20;
  flex-shrink:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--font-head);
  font-size:15px;
  color:var(--text);
  white-space:nowrap;
}
.brand .badge{
  width:30px;height:30px;border-radius:9px;
  background:var(--grad-money);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  box-shadow:0 6px 16px -4px rgba(47,214,167,.5);
}
.progress-track{
  flex:1;
  height:7px;
  background:var(--surface-2);
  border-radius:99px;
  overflow:hidden;
  position:relative;
}
.progress-fill{
  height:100%;
  width:0%;
  background:var(--grad-money);
  border-radius:99px;
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.slide-counter{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--text-mute);
  white-space:nowrap;
  min-width:56px;
  text-align:right;
}
.home-btn{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-dim);
  width:34px;height:34px;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
  flex-shrink:0;
}
.home-btn:hover{background:var(--surface-3);color:var(--text);}

main#stage{
  flex:1;
  position:relative;
  overflow:hidden;
}
.slide{
  position:absolute;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  padding:38px 24px 30px;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .35s ease, transform .35s ease;
}
.slide.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:1;
  transform:translateY(0);
}
.slide-inner{
  width:100%;
  max-width:840px;
  margin:auto;
  padding-bottom:10px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12.5px;
  color:var(--mint);
  background:rgba(47,214,167,.1);
  border:1px solid rgba(47,214,167,.25);
  padding:5px 12px;
  border-radius:99px;
  margin-bottom:16px;
  font-weight:600;
}
.slide h2.title{
  font-size:clamp(22px,4vw,32px);
  margin:0 0 10px;
  line-height:1.25;
}
.slide p.lead{
  font-size:15.5px;
  color:var(--text-dim);
  line-height:1.7;
  margin:0 0 22px;
  max-width:70ch;
}

/* ===== FOOTER NAV ===== */
footer.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px 22px;
  border-top:1px solid var(--border-soft);
  background:rgba(10,15,28,.7);
  backdrop-filter:blur(10px);
  flex-shrink:0;
}
.nav-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 20px;
  border-radius:12px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}
.nav-btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--mint-dim);transform:translateY(-1px);}
.nav-btn:active:not(:disabled){transform:translateY(0);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn.primary{background:var(--grad-money);color:#04231a;border:none;}
.nav-btn.primary:hover{filter:brightness(1.08);}
.nav-hint{
  font-size:12px;
  color:var(--text-mute);
  display:flex;gap:6px;align-items:center;
}
kbd{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:5px;
  padding:1px 6px;
  font-family:var(--font-mono);
  font-size:11px;
}

/* ===== GENERIC COMPONENTS ===== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:22px;
  box-shadow:var(--shadow-lift);
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.pill-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
.pill-list li{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:14px 16px;
  font-size:14.5px;
  color:var(--text-dim);
  line-height:1.6;
}
.pill-list .ic{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;
  background:rgba(47,214,167,.12);color:var(--mint);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}

.formula-box{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-left:4px solid var(--mint);
  border-radius:var(--radius-md);
  padding:20px 22px;
  margin:16px 0;
}
.formula-box .f{
  font-family:var(--font-mono);
  font-size:clamp(17px,3vw,22px);
  color:var(--mint);
  font-weight:700;
  letter-spacing:.3px;
}
.formula-box .cap{font-size:12.5px;color:var(--text-mute);margin-top:8px;}
.var-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.var-chip{
  font-family:var(--font-mono);
  font-size:12.5px;
  background:var(--surface-3);
  border:1px solid var(--border);
  border-radius:8px;
  padding:5px 10px;
  color:var(--text-dim);
}
.var-chip b{color:var(--text);}

/* accordion */
.accordion{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:10px;background:var(--surface);}
.accordion-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;cursor:pointer;font-weight:600;font-size:14.5px;
  user-select:none;
}
.accordion-head:hover{background:var(--surface-2);}
.accordion-head .arrow{transition:transform .25s;color:var(--mint);}
.accordion.open .arrow{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.accordion-body-in{padding:0 18px 16px;font-size:14px;color:var(--text-dim);line-height:1.7;}

/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(max-width:600px){.flip-grid{grid-template-columns:1fr;}}
.flip-card{
  perspective:1200px;height:130px;cursor:pointer;
}
.flip-inner{
  position:relative;width:100%;height:100%;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;
  border-radius:var(--radius-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;
  padding:14px;text-align:center;
  border:1px solid var(--border);
}
.flip-front{background:var(--surface-2);}
.flip-front .term{font-family:var(--font-head);font-size:16px;color:var(--gold);}
.flip-front .tap{font-size:11px;color:var(--text-mute);margin-top:6px;}
.flip-back{background:var(--surface-3);transform:rotateY(180deg);font-size:13px;color:var(--text-dim);line-height:1.55;}

/* tabs */
.tabbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;
}
.tab-btn.active{background:var(--grad-money);color:#04231a;border-color:transparent;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* example / step reveal */
.example-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;}
.example-tag{
  display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;
  padding:4px 10px;border-radius:99px;margin-bottom:12px;
}
.tag-easy{background:rgba(47,214,167,.15);color:var(--mint);}
.tag-med{background:rgba(240,183,61,.15);color:var(--gold);}
.tag-hard{background:rgba(242,114,90,.15);color:var(--coral);}
.soal-text{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:14px;}
.step{
  background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:13px 15px;margin-top:10px;font-size:14px;color:var(--text-dim);line-height:1.7;
  animation:fadeStep .35s ease;
}
.step.hidden{display:none;}
.step b, .step .num{color:var(--mint);}
.step.final{border-color:var(--mint-dim);background:rgba(47,214,167,.07);}
.step.final b{color:var(--mint);}
@keyframes fadeStep{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.btn-step{
  margin-top:12px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s;
}
.btn-step:hover:not(:disabled){background:var(--mint-dim);border-color:var(--mint);}
.btn-step:disabled{opacity:.6;cursor:default;background:rgba(47,214,167,.15);color:var(--mint);border-color:var(--mint-dim);}

/* practice input */
.practice-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.practice-row input[type=text]{
  flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);padding:12px 14px;border-radius:10px;font-family:var(--font-mono);font-size:14.5px;
}
.practice-row input[type=text]:focus{outline:none;border-color:var(--mint);}
.btn-check{
  background:var(--grad-money);color:#04231a;border:none;padding:12px 20px;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap;
}
.btn-check:hover{filter:brightness(1.08);}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;display:none;line-height:1.6;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(47,214,167,.12);border:1px solid var(--mint-dim);color:var(--mint);}
.feedback.bad{background:rgba(242,114,90,.12);border:1px solid #a8493b;color:var(--coral);}
.link-btn{background:none;border:none;color:var(--sky);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-top:10px;font-family:var(--font-body);}

/* simulator */
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:760px){.sim-grid{grid-template-columns:1fr;}}
.sim-control{margin-bottom:20px;}
.sim-control label{display:flex;justify-content:space-between;font-size:13.5px;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.sim-control label .val{font-family:var(--font-mono);color:var(--mint);font-weight:700;}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:99px;
  background:var(--surface-3);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--grad-money);cursor:pointer;border:3px solid #0a0f1c;box-shadow:0 0 0 2px var(--mint);
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--grad-money);cursor:pointer;border:3px solid #0a0f1c;
}
.sim-output{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.sim-out-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.sim-out-card .lab{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.4px;}
.sim-out-card .v{font-family:var(--font-mono);font-size:17px;color:var(--text);margin-top:4px;font-weight:700;}
.sim-out-card.hi .v{color:var(--mint);}
svg.chart{width:100%;height:auto;display:block;}

/* quiz */
.quiz-shell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.quiz-progress-track{flex:1;height:6px;background:var(--surface-2);border-radius:99px;margin:0 14px;overflow:hidden;}
.quiz-progress-fill{height:100%;background:var(--grad-gold);border-radius:99px;transition:width .3s;}
.quiz-q{font-size:16.5px;line-height:1.6;margin-bottom:18px;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.quiz-opt{
  text-align:left;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:13px 16px;border-radius:12px;cursor:pointer;font-size:14.5px;transition:.15s;font-family:var(--font-body);
}
.quiz-opt:hover{border-color:var(--sky);background:var(--surface-3);}
.quiz-opt.correct{background:rgba(47,214,167,.15);border-color:var(--mint);}
.quiz-opt.wrong{background:rgba(242,114,90,.15);border-color:var(--coral);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{margin-top:14px;padding:13px 15px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:13.5px;color:var(--text-dim);line-height:1.65;display:none;}
.quiz-explain.show{display:block;}
.quiz-next-wrap{margin-top:18px;display:flex;justify-content:flex-end;}
.quiz-result{text-align:center;padding:30px 10px;}
.quiz-result .score-num{font-family:var(--font-head);font-size:52px;background:var(--grad-money);-webkit-background-clip:text;background-clip:text;color:transparent;}
.quiz-result p{color:var(--text-dim);margin:8px 0 22px;}

/* misc */
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.mini-badge{font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:6px 12px;color:var(--text-dim);}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;height:100%;min-height:60vh;}
.hero-icon{
  width:88px;height:88px;border-radius:26px;background:var(--grad-money);
  display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:22px;
  box-shadow:0 20px 50px -14px rgba(47,214,167,.5);
}
.check-item{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--text-dim);padding:10px 0;border-bottom:1px solid var(--border-soft);}
.check-item:last-child{border-bottom:none;}
.check-item input{margin-top:4px;accent-color:var(--mint);width:16px;height:16px;flex-shrink:0;}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(max-width:640px){.summary-grid{grid-template-columns:1fr;}}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;}
.summary-card h3{margin:0 0 8px;font-size:15px;color:var(--gold);}
.summary-card p{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;}
textarea:focus,input:focus,button:focus{outline:none;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:9px 16px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;}
.btn-outline:hover{border-color:var(--mint);color:var(--mint);}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="home-btn" onclick="goToSlide(0)" title="Kembali ke awal">⌂</button>
    <div class="brand"><span class="badge">💰</span><span>Bab 5 · Bunga Tunggal</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="slide-counter" id="slideCounter">1 / 1</div>
  </header>

  <main id="stage"></main>

  <footer class="navbar">
    <button class="nav-btn" id="btnPrev" onclick="prevSlide()">‹ Sebelumnya</button>
    <div class="nav-hint">Navigasi <kbd>←</kbd> <kbd>→</kbd></div>
    <button class="nav-btn primary" id="btnNext" onclick="nextSlide()">Berikutnya ›</button>
  </footer>
</div>

<script>
/* =======================================================
   DATA MATERI (SUMBER TUNGGAL) — hanya didefinisikan sekali
   ======================================================= */
const MATERI = "Aritmetika Sosial";
const SUBMATERI = "Bunga Tunggal";

/* =======================================================
   SLIDE CONTENT — dibangun sebagai array HTML string
   ======================================================= */
const slidesHTML = [];

/* ---------- 0. COVER ---------- */
slidesHTML.push(`
<div class="slide-inner center-col">
  <div class="hero-icon">🏦</div>
  <span class="eyebrow">Bab 5 · ${MATERI}</span>
  <h2 class="title" style="font-size:clamp(28px,5vw,42px)">${SUBMATERI}</h2>
  <p class="lead" style="max-width:60ch">Menghitung bunga tunggal, besar tabungan, dan nilai akhir — dipelajari lewat simulasi, contoh nyata, dan latihan bertahap.</p>
  <div class="badge-row" style="justify-content:center">
    <span class="mini-badge">📘 Kurikulum Merdeka</span>
    <span class="mini-badge">🎯 Fase D · Kelas VII</span>
    <span class="mini-badge">⏱️ ± 45 menit</span>
  </div>
  <div style="margin-top:28px">
    <button class="nav-btn primary" onclick="nextSlide()">Mulai Belajar ›</button>
  </div>
</div>`);

/* ---------- 1. APERSEPSI ---------- */
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow">🧭 Apersepsi</span>
  <h2 class="title">Pernah menabung di bank?</h2>
  <p class="lead">Coba ingat kembali pengalaman kalian menabung. Amati ilustrasi berikut, lalu pikirkan pertanyaannya.</p>
  <div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <svg width="150" height="130" viewBox="0 0 150 130" style="flex-shrink:0">
      <rect x="15" y="55" width="120" height="65" rx="8" fill="#19243d" stroke="#2fd6a7" stroke-width="2"/>

function goToSlide(i){
  if(i < 0 || i >= totalSlides) return;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  current = i;
  document.getElementById('slide-' + i).classList.add('active');
  document.getElementById('slideCounter').textContent = (i+1) + ' / ' + totalSlides;
  document.getElementById('progressFill').style.width = (((i+1)/totalSlides)*100) + '%';
  document.getElementById('btnPrev').disabled = (i === 0);
  document.getElementById('btnNext').textContent = (i === totalSlides-1) ? 'Selesai ✓' : 'Berikutnya ›';
  document.getElementById('btnNext').disabled = false;
  document.getElementById('stage').scrollTop = 0;
  if(i === 21 && !quizInitialized){ initQuiz(); }
}
function nextSlide(){ if(current < totalSlides-1) goToSlide(current+1); }
function prevSlide(){ if(current > 0) goToSlide(current-1); }

document.addEventListener('keydown', function(e){
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'ArrowRight') nextSlide();
  if(e.key === 'ArrowLeft') prevSlide();
});

function toggleAccordion(id){
  const acc = document.getElementById(id);

  if(isOpen){
    acc.classList.remove('open');

   ======================================================= */
function revealStep(cardId, btn){
  const card = document.getElementById(cardId);
  const steps = card.querySelectorAll('.step');
  let count = parseInt(card.getAttribute('data-count')) || 0;
  if(count < steps.length){
    steps[count].classList.remove('hidden');
    count++;
    card.setAttribute('data-count', count);
  }
  if(count >= steps.length){
    btn.textContent = 'Pembahasan Selesai ✓';
    btn.disabled = true;
  } else {
    btn.textContent = 'Tampilkan Langkah ' + (count+1);
  }
}

function parseRupiah(str){
  const cleaned = str.replace(/[^0-9]/g,'');
  return cleaned ? parseInt(cleaned,10) : NaN;
}
function checkPractice(inputId, fbId, correctVal){
  const val = parseRupiah(document.getElementById(inputId).value);
  const fb = document.getElementById(fbId);
  fb.classList.add('show');
  if(!isNaN(val) && val === correctVal){
    fb.className = 'feedback show ok';
    fb.textContent = '✓ Benar! Jawabannya Rp' + correctVal.toLocaleString('id-ID') + '. Kerja bagus!';
  } else {
    fb.className = 'feedback show bad';

  }
}

/* =======================================================
   SIMULATOR
   ======================================================= */
function formatRp(n){
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function updateSimulator(){
  const M = parseFloat(document.getElementById('simM').value);
  const p = parseFloat(document.getElementById('simP').value);
  const t = parseFloat(document.getElementById('simT').value);
  document.getElementById('simMLabel').textContent = formatRp(M);
  document.getElementById('simPLabel').textContent = p + '%';
  document.getElementById('simTLabel').textContent = t + ' tahun';
  const B = (M * p * t) / 100;
  const Ma = M + B;
  document.getElementById('simBOut').textContent = formatRp(B);
  document.getElementById('simMaOut').textContent = formatRp(Ma);
  drawSimChart(M, p, t);
}
function drawSimChart(M, p, t){
  const svg = document.getElementById('simChart');
  const w = 320, h = 220, padL = 46, padB = 28, padT = 14, padR = 10;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const maxVal = M + (M*p*t)/100;
  let points = [];
  for(let y=0; y<=t; y++){
    const val = M + (M*p*y)/100;
    const x = padL + (y/t) * chartW;
    const yy = padT + chartH - (val/maxVal)*chartH;
    points.push([x, yy, val, y]);
  }
  let svgContent = '';
  // gridlines
  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (g/4)*chartH;
    svgContent += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="#1c2740" stroke-width="1"/>';
  }
  // axis
  svgContent += '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="#263252" stroke-width="1.5"/>';
  svgContent += '<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH)+'" stroke="#263252" stroke-width="1.5"/>';
  // line path
  let path = 'M ' + points.map(pt => pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' L ');
  svgContent += '<path d="'+path+'" fill="none" stroke="#2fd6a7" stroke-width="2.5" stroke-linejoin="round"/>';
  points.forEach(pt => {
    svgContent += '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="4" fill="#0a0f1c" stroke="#2fd6a7" stroke-width="2"/>';
    if(pt[3] % Math.ceil(t/5 || 1) === 0 || t <= 6){
      svgContent += '<text x="'+pt[0].toFixed(1)+'" y="'+(padT+chartH+18)+'" text-anchor="middle" fill="#7686a8" font-size="9">Th'+pt[3]+'</text>';
    }
  });
  svgContent += '<text x="4" y="'+(padT+6)+'" fill="#7686a8" font-size="9">Rp</text>';
  svg.innerHTML = svgContent;
}

let quizInitialized = false;
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function initQuiz(){
  quizInitialized = true;
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}
function renderQuiz(){
  quizAnswered = false;
  const shell = document.getElementById('quizShell');
  if(quizIndex >= quizData.length){
    renderQuizResult();
    return;
  }
  const item = quizData[quizIndex];
  let optsHTML = item.opts.map((o,i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('');
  shell.innerHTML = `
    <div class="quiz-top">
      <span class="mono" style="font-size:12.5px;color:var(--text-mute)">Soal ${quizIndex+1}/${quizData.length}</span>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${(quizIndex/quizData.length)*100}%"></div></div>
      <span class="mono" style="font-size:12.5px;color:var(--gold)">Skor: ${quizScore}</span>

    <div class="quiz-next-wrap"><button class="nav-btn primary" id="quizNextBtn" style="display:none" onclick="nextQuizQuestion()">Lanjut ›</button></div>

}
function answerQuiz(selected){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quizData[quizIndex];
  const btns = document.querySelectorAll('#quizOpts .quiz-opt');
  btns.forEach((b,i) => {
    b.disabled = true;
    if(i === item.correct) b.classList.add('correct');
    else if(i === selected) b.classList.add('wrong');
  });
  if(selected === item.correct) quizScore++;
  document.getElementById('quizExplain').classList.add('show');
  document.getElementById('quizNextBtn').style.display = 'inline-flex';
}
function nextQuizQuestion(){
  quizIndex++;
  renderQuiz();
}
function renderQuizResult(){
  const shell = document.getElementById('quizShell');
  const pct = Math.round((quizScore/quizData.length)*100);
  let msg = "Terus berlatih ya, kamu pasti bisa lebih baik!";

    <div class="quiz-result">
      <div class="score-num">${quizScore}/${quizData.length}</div>

}
