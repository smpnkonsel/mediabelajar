<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bab 5 — Aritmetika Sosial | Bruto, Neto, dan Tara</title>
  <meta name="description" content="Media pembelajaran interaktif matematika SMP: Bruto, Neto, dan Tara.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#08111f;
      --bg2:#0d1728;
      --panel:#111d31;
      --panel2:#15243b;
      --line:rgba(255,255,255,.10);
      --text:#edf5ff;
      --muted:#a8b7cb;
      --primary:#67e8f9;
      --primary2:#38bdf8;
      --accent:#a78bfa;
      --green:#4ade80;
      --yellow:#facc15;
      --red:#fb7185;
      --orange:#fb923c;
      --shadow:0 20px 60px rgba(0,0,0,.28);
      --radius:24px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.10),transparent 28%),radial-gradient(circle at 85% 20%,rgba(167,139,250,.10),transparent 30%),var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif}
    body{overflow-x:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:flex;flex-direction:column}

    header{
      position:sticky;top:0;z-index:50;
      background:rgba(8,17,31,.84);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line)
    }
    .topbar{max-width:1250px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary2),var(--accent));color:#06111e;
      font-weight:900;box-shadow:0 8px 28px rgba(56,189,248,.22)
    }
    .brand-text{min-width:0}
    .brand-text strong{font-family:Fredoka,sans-serif;font-size:18px;display:block}
    .brand-text span{font-size:11px;color:var(--muted);white-space:nowrap}
    .header-spacer{flex:1}
    .home-btn,.restart-btn{
      border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);
      padding:10px 14px;border-radius:13px;font-weight:700;transition:.2s
    }
    .home-btn:hover,.restart-btn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}

    .progress-wrap{max-width:1250px;margin:auto;padding:0 22px 13px}
    .progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}
    .progress-track{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary2),var(--accent));border-radius:inherit;transition:width .4s ease}

    main{width:min(1080px,calc(100% - 30px));margin:30px auto 100px;flex:1}
    .slide{display:none;animation:enter .38s ease}
    .slide.active{display:block}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    .hero{
      min-height:540px;display:grid;place-items:center;text-align:center;
      padding:54px 24px;border:1px solid var(--line);border-radius:32px;
      background:linear-gradient(145deg,rgba(17,29,49,.96),rgba(12,25,43,.88));
      box-shadow:var(--shadow);position:relative;overflow:hidden
    }
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
    .hero:before{width:260px;height:260px;background:rgba(56,189,248,.13);top:-110px;right:-80px}
    .hero:after{width:220px;height:220px;background:rgba(167,139,250,.12);bottom:-100px;left:-80px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(103,232,249,.22);
      background:rgba(103,232,249,.07);border-radius:99px;color:var(--primary);font-size:12px;font-weight:800;
      letter-spacing:.04em;text-transform:uppercase
    }
    h1,h2,h3{font-family:Fredoka,sans-serif;margin:0;line-height:1.08}
    h1{font-size:clamp(42px,7vw,76px);margin:22px 0 12px}
    h2{font-size:clamp(30px,4vw,46px);margin-bottom:14px}
    h3{font-size:22px;margin-bottom:9px}
    .gradient-text{background:linear-gradient(90deg,var(--primary),#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{color:var(--muted);font-size:16px;line-height:1.75;max-width:760px;margin:0 auto}
    .subline{color:#dbeafe;font-weight:700;margin-top:18px}
    .cta{
      margin-top:28px;border:0;border-radius:15px;padding:13px 20px;
      background:linear-gradient(135deg,var(--primary2),var(--accent));color:#06111e;font-weight:900;
      box-shadow:0 12px 30px rgba(56,189,248,.18);transition:.2s
    }
    .cta:hover{transform:translateY(-2px);box-shadow:0 16px 35px rgba(56,189,248,.26)}

    .section-head{margin-bottom:20px}
    .section-head p{color:var(--muted);line-height:1.7;margin:0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .grid.two{grid-template-columns:repeat(2,1fr)}
    .card{
      background:linear-gradient(145deg,rgba(17,29,49,.96),rgba(15,27,46,.84));
      border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 14px 35px rgba(0,0,0,.15)
    }
    .card p,.card li{color:var(--muted);line-height:1.7}
    .card ul{padding-left:20px;margin-bottom:0}
    .icon{
      width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.15);font-size:22px;margin-bottom:15px
    }

    .question{
      padding:24px;border-radius:22px;background:linear-gradient(135deg,rgba(56,189,248,.10),rgba(167,139,250,.08));
      border:1px solid rgba(103,232,249,.16);margin:18px 0
    }
    .question strong{display:block;margin-bottom:8px}
    .muted{color:var(--muted)}
    .pill-row{display:flex;gap:9px;flex-wrap:wrap}
    .pill{padding:8px 11px;border-radius:99px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:12px;color:#dbeafe;font-weight:700}

    .formula{
      font-family:"JetBrains Mono",monospace;background:#070e19;border:1px solid rgba(103,232,249,.16);
      border-radius:18px;padding:18px;text-align:center;font-size:clamp(17px,3vw,24px);color:#dffbff;overflow:auto
    }
    .formula .op{color:var(--primary)}
    .formula .accent{color:#c4b5fd}

    .steps{display:grid;gap:11px;margin-top:18px}
    .step{
      display:grid;grid-template-columns:42px 1fr;gap:13px;align-items:start;padding:15px;border:1px solid var(--line);
      border-radius:17px;background:rgba(255,255,255,.025)
    }
    .step-num{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(56,189,248,.12);color:var(--primary);font-weight:900}
    .step p{margin:2px 0;color:var(--muted);line-height:1.65}

    .interactive{border:1px solid rgba(167,139,250,.22);background:linear-gradient(145deg,rgba(167,139,250,.08),rgba(56,189,248,.06))}
    .reveal{margin-top:14px}
    .reveal-btn,.choice,.check-btn,.small-btn{
      border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:10px 13px;border-radius:12px;
      font-weight:800;transition:.2s
    }
    .reveal-btn:hover,.choice:hover,.check-btn:hover,.small-btn:hover{background:rgba(255,255,255,.10)}
    .hidden{display:none}
    .answer-box{margin-top:13px;padding:15px;border-radius:15px;background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.18);color:#d7ffe4;line-height:1.7}

    .package{
      max-width:650px;margin:12px auto 0;border:1px solid var(--line);border-radius:25px;padding:20px;background:#0b1525
    }
    .package-visual{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
    .box{
      width:190px;min-height:125px;border-radius:18px;border:2px dashed rgba(251,146,60,.55);
      background:linear-gradient(145deg,rgba(251,146,60,.13),rgba(251,146,60,.04));display:grid;place-items:center;
      text-align:center;padding:16px;position:relative
    }
    .box small{color:var(--muted);display:block;margin-top:5px}
    .arrow{font-size:28px;color:var(--primary)}
    .weight{font-family:"JetBrains Mono";font-size:22px;color:#fed7aa}

    .equation-builder{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-top:15px}
    label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}
    input[type=number],input[type=text]{
      width:100%;border:1px solid var(--line);background:#091321;color:var(--text);padding:12px 13px;border-radius:12px;outline:none
    }
    input:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(103,232,249,.08)}
    .result{margin-top:15px;padding:15px;border-radius:14px;background:rgba(103,232,249,.06);border:1px solid rgba(103,232,249,.15);line-height:1.7}
    .result strong{color:var(--primary)}

    .slider-wrap{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025)}
    input[type=range]{width:100%;accent-color:#38bdf8}
    .slider-value{text-align:center;font-family:"JetBrains Mono";font-size:30px;margin:8px 0 15px;color:var(--primary)}

    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line)}
    th{background:rgba(255,255,255,.04);font-size:12px;color:#cbd5e1}
    td{color:var(--muted)}
    tr:last-child td{border-bottom:0}
    .good{color:var(--green)!important;font-weight:800}
    .warn{color:var(--yellow)!important;font-weight:800}
    .bad{color:var(--red)!important;font-weight:800}

    .quiz-list{display:grid;gap:16px}
    .quiz-q{padding:20px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.025)}
    .quiz-q p{margin-top:0;line-height:1.7}
    .options{display:grid;gap:8px}
    .option{
      display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:13px;
      background:rgba(255,255,255,.03);cursor:pointer;transition:.2s
    }
    .option:hover{background:rgba(255,255,255,.07)}
    .option input{margin-top:4px}
    .quiz-feedback{margin-top:11px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.6;display:none}
    .quiz-feedback.show{display:block}
    .quiz-feedback.correct{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.18);color:#d7ffe4}
    .quiz-feedback.incorrect{background:rgba(251,113,133,.07);border:1px solid rgba(251,113,133,.18);color:#ffe1e6}

    .score{
      display:none;text-align:center;padding:24px;border-radius:22px;background:linear-gradient(135deg,rgba(56,189,248,.11),rgba(167,139,250,.10));
      border:1px solid rgba(103,232,249,.18);margin-top:20px
    }
    .score.show{display:block}
    .score-num{font-family:Fredoka;font-size:54px;color:var(--primary)}

    .reflection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
    .reflect{
      min-height:150px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);padding:18px
    }
    .reflect textarea{
      width:100%;height:80px;resize:vertical;margin-top:10px;border-radius:12px;border:1px solid var(--line);
      background:#091321;color:var(--text);padding:10px;outline:none
    }

    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(8,17,31,.90);backdrop-filter:blur(18px);
      border-top:1px solid var(--line)
    }
    .nav-inner{width:min(1080px,calc(100% - 30px));margin:auto;padding:13px 0;display:flex;align-items:center;gap:12px}
    .nav-btn{
      min-width:120px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);padding:12px 16px;border-radius:14px;font-weight:900
    }
    .nav-btn.primary{background:linear-gradient(135deg,var(--primary2),var(--accent));color:#06111e;border:0}
    .nav-btn:disabled{opacity:.35;cursor:not-allowed}
    .dots{display:flex;justify-content:center;gap:5px;flex:1;overflow:hidden}
    .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);transition:.25s}
    .dot.active{width:23px;border-radius:99px;background:var(--primary)}

    .toast{
      position:fixed;right:18px;top:90px;z-index:100;padding:12px 15px;border-radius:13px;background:#122039;
      border:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(-15px);opacity:0;pointer-events:none;transition:.25s;color:#dbeafe;font-size:13px
    }
    .toast.show{opacity:1;transform:none}

    .mini-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
    .mini-nav button{font-size:12px}

    @media(max-width:820px){
      .grid,.reflection-grid{grid-template-columns:1fr 1fr}
      .equation-builder{grid-template-columns:1fr}
      .nav-btn{min-width:auto}
      .dots{display:none}
    }
    @media(max-width:600px){
      .topbar{padding:11px 15px}.progress-wrap{padding:0 15px 11px}
      .brand-text span{display:none}
      .home-btn{padding:9px 10px}.home-btn span{display:none}
      main{width:min(100% - 20px,1080px);margin-top:20px}
      .hero{min-height:500px;padding:38px 17px;border-radius:25px}
      .grid,.grid.two,.reflection-grid{grid-template-columns:1fr}
      .card{padding:18px;border-radius:19px}
      .nav-inner{width:calc(100% - 20px)}
      .nav-btn{flex:1;padding:11px 10px;font-size:13px}
      h2{font-size:32px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">∑</div>
        <div class="brand-text">
          <strong id="brandMaterial">Bab 5 — Aritmetika Sosial</strong>
          <span id="brandSubmaterial">Bruto, Neto, dan Tara</span>
        </div>
      </div>
      <div class="header-spacer"></div>
      <button class="home-btn" id="homeBtn">⌂ <span>Awal</span></button>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="slideLabel">Slide 1</span><span id="progressText">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <main id="lesson"></main>

  <div class="toast" id="toast"></div>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-btn" id="prevBtn">← Sebelumnya</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn primary" id="nextBtn">Berikutnya →</button>
    </div>
  </nav>
</div>

<script>
/* =========================================================
   DATA UTAMA — MATERI DAN SUBMATERI DITULIS SATU KALI
   ========================================================= */
const COURSE = {
  materi: "Bab 5 — Aritmetika Sosial",
  submateri: "Bruto, Neto, dan Tara",
  materiPokok: "Memahami dan menghitung bruto, neto, dan tara"
};

/* =========================================================
   KONTEN PEMBELAJARAN DIBANGUN OTOMATIS DARI COURSE
   ========================================================= */
const lesson = document.getElementById("lesson");

function slide(content, cls="") {
  return `<section class="slide ${cls}">${content}</section>`;
}
function sectionHead(title, desc) {
  return `<div class="section-head"><div class="eyebrow">Pembelajaran • ${COURSE.submateri}</div><h2>${title}</h2><p>${desc}</p></div>`;
}
function card(icon,title,body){
  return `<article class="card"><div class="icon">${icon}</div><h3>${title}</h3>${body}</article>`;
}

lesson.innerHTML = [
slide(`
  <div class="hero">
    <div>
      <div class="eyebrow">Media Pembelajaran Interaktif</div>
      <h1><span class="gradient-text">${COURSE.materi}</span></h1>
      <h2 style="font-size:clamp(25px,4vw,42px);margin:0 0 15px">${COURSE.submateri}</h2>
      <p class="lead">${COURSE.materiPokok}. Belajar melalui contoh kemasan, rumus, simulasi, latihan, dan kuis interaktif.</p>
      <div class="subline">Siap membongkar rahasia berat sebuah produk?</div>
      <button class="cta" onclick="goTo(1)">Mulai Pembelajaran →</button>
    </div>
  </div>
`),
slide(`
  ${sectionHead("Apersepsi: Berat yang Mana?", "Bayangkan kamu membeli beras dalam sebuah karung. Timbangan menunjukkan berat seluruh benda, tetapi tidak semuanya merupakan isi beras.")}
  <div class="grid">
    ${card("🛒","Di toko","Sebuah produk biasanya terdiri dari isi dan kemasannya. Timbangan dapat menunjukkan berat keseluruhan produk.")}
    ${card("📦","Kemasan","Kotak, botol, karung, kaleng, atau bungkus memiliki berat sendiri. Berat ini tidak termasuk isi produk.")}
    ${card("⚖️","Tantangan","Jika berat seluruh paket diketahui, bagaimana menentukan berat isi tanpa kemasan?")}
  </div>
  <div class="question">
    <strong>💡 Pertanyaan pemantik</strong>
    <span class="muted">Sebuah kaleng biskuit memiliki berat 1,2 kg ketika masih berisi. Setelah biskuit dikeluarkan, kalengnya berbobot 200 gram. Berapa berat biskuitnya?</span>
  </div>
  <button class="reveal-btn" onclick="toggleReveal('apersepsi')">Tampilkan ide penyelesaian</button>
  <div id="apersepsi" class="answer-box hidden">Berat biskuit diperoleh dengan mengurangi berat seluruh paket dengan berat kaleng. Inilah inti hubungan <b>bruto, tara, dan neto</b>.</div>
`),
slide(`
  ${sectionHead("Tujuan Pembelajaran", "Setelah menyelesaikan pembelajaran, kamu diharapkan mampu menggunakan konsep berat pada kemasan untuk memecahkan masalah sehari-hari.")}
  <div class="grid">
    ${card("🎯","Mengenali istilah","Menjelaskan arti bruto, neto, dan tara serta membedakan ketiganya.")}
    ${card("🧮","Menggunakan rumus","Menghitung salah satu dari bruto, neto, atau tara jika dua besaran lainnya diketahui.")}
    ${card("🧠","Memecahkan masalah","Menyelesaikan persoalan kontekstual dan memeriksa kewajaran hasil perhitungan.")}
  </div>
  <div class="pill-row" style="margin-top:18px">
    <span class="pill">Konsep</span><span class="pill">Rumus</span><span class="pill">Visualisasi</span><span class="pill">Latihan</span><span class="pill">HOTS</span>
  </div>
`),
slide(`
  ${sectionHead("Tiga Istilah Kunci", "Ketiga istilah ini saling berhubungan. Pahami maknanya sebelum menghafalkan rumus.")}
  <div class="grid">
    ${card("📦","Bruto","<b>Bruto</b> adalah berat keseluruhan benda beserta kemasannya. Contoh: berat karung beras yang masih berisi beras.")}
    ${card("🍚","Neto","<b>Neto</b> adalah berat isi barang tanpa kemasan. Ini merupakan berat produk yang sebenarnya.")}
    ${card("🧺","Tara","<b>Tara</b> adalah berat kemasan atau pembungkus yang digunakan untuk menampung produk.")}
  </div>
  <div class="question">
    <strong>Ingat urutannya:</strong>
    <div class="formula"><span class="op">BRUTO</span> = <span class="accent">NETO</span> + <span class="accent">TARA</span></div>
  </div>
`),
slide(`
  ${sectionHead("Visualisasi: Bongkar Sebuah Paket", "Bruto dapat dipandang sebagai gabungan berat isi dan berat kemasan.")}
  <div class="package">
    <div class="package-visual">
      <div class="box"><div><div style="font-size:42px">📦</div><b>Kemasan</b><small>Tara</small><div class="weight">0,2 kg</div></div></div>
      <div class="arrow">＋</div>
      <div class="box" style="border-color:rgba(103,232,249,.55);background:linear-gradient(145deg,rgba(103,232,249,.13),rgba(103,232,249,.04))"><div><div style="font-size:42px">🍚</div><b>Isi</b><small>Neto</small><div class="weight">2,8 kg</div></div></div>
      <div class="arrow">＝</div>
      <div class="box" style="border-color:rgba(167,139,250,.55);background:linear-gradient(145deg,rgba(167,139,250,.13),rgba(167,139,250,.04))"><div><div style="font-size:42px">⚖️</div><b>Keseluruhan</b><small>Bruto</small><div class="weight">3,0 kg</div></div></div>
    </div>
  </div>
  <div class="formula" style="margin-top:18px">2,8 kg <span class="op">+</span> 0,2 kg <span class="op">=</span> <span class="accent">3,0 kg</span></div>
`),
slide(`
  ${sectionHead("Hubungan Rumus", "Mulailah dari hubungan dasar, kemudian ubah susunan sesuai besaran yang ingin dicari.")}
  <div class="grid">
    ${card("①","Mencari Bruto",`<div class="formula">B = N <span class="op">+</span> T</div><p>Bruto diperoleh dari neto ditambah tara.</p>`)}

const slides = [...document.querySelectorAll(".slide")];
let current = 0;

document.getElementById("brandMaterial").textContent = COURSE.materi;
document.getElementById("brandSubmaterial").textContent = COURSE.submateri;
document.title = `${COURSE.materi} | ${COURSE.submateri}`;

function renderDots(){
  const dots = document.getElementById("dots");
  dots.innerHTML = slides.map((_,i)=>`<span class="dot ${i===current?'active':''}" title="Slide ${i+1}"></span>`).join("");
}
function updateUI(){
  slides.forEach((s,i)=>s.classList.toggle("active",i===current));
  const pct = Math.round((current/(slides.length-1))*100);
  document.getElementById("slideLabel").textContent = `Slide ${current+1} dari ${slides.length}`;
  document.getElementById("progressText").textContent = `${pct}%`;
  document.getElementById("progressFill").style.width = `${pct}%`;
  document.getElementById("prevBtn").disabled = current===0;
  document.getElementById("nextBtn").disabled = current===slides.length-1;
  document.getElementById("nextBtn").textContent = current===slides.length-1 ? "Selesai ✓" : "Berikutnya →";
  renderDots();
  window.scrollTo({top:0,behavior:"smooth"});
}
function goTo(index){
  current=Math.max(0,Math.min(index,slides.length-1));
  updateUI();
}
function nextSlide(){if(current<slides.length-1){current++;updateUI()}}
function prevSlide(){if(current>0){current--;updateUI()}}
document.getElementById("nextBtn").addEventListener("click",nextSlide);
document.getElementById("prevBtn").addEventListener("click",prevSlide);
document.getElementById("homeBtn").addEventListener("click",()=>goTo(0));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextSlide();
  if(e.key==="ArrowLeft") prevSlide();
  if(e.key==="Home") goTo(0);
});

function toggleReveal(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle("hidden");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function numValue(id){
  const v=document.getElementById(id).value.trim();
  return v==="" ? null : Number(v);
}
function fmt(n){
  return Number(n).toLocaleString("id-ID",{maximumFractionDigits:4});
}
function calculateBNT(){
  const B=numValue("calcB"),N=numValue("calcN"),T=numValue("calcT");
  const known=[B,N,T].filter(v=>v!==null).length;
  const out=document.getElementById("calcResult");
  if(known!==2){
    out.innerHTML="<span class='bad'>Masukkan tepat dua nilai.</span> Satu kotak harus dibiarkan kosong.";
    return;
  }
  if([B,N,T].some(v=>v!==null && v<0)){
    out.innerHTML="<span class='bad'>Nilai berat tidak boleh negatif.</span>";
    return;
  }
  if(B!==null && N!==null && T===null){
    const r=B-N;
    if(r<0){out.innerHTML="<span class='bad'>Neto tidak boleh lebih besar daripada bruto.</span>";return}
    document.getElementById("calcT").value=r;
    out.innerHTML=`Tara = Bruto − Neto = ${fmt(B)} − ${fmt(N)} = <strong>${fmt(r)} kg</strong>`;
  } else if(B!==null && T!==null && N===null){
    const r=B-T;
    if(r<0){out.innerHTML="<span class='bad'>Tara tidak boleh lebih besar daripada bruto.</span>";return}
    document.getElementById("calcN").value=r;
    out.innerHTML=`Neto = Bruto − Tara = ${fmt(B)} − ${fmt(T)} = <strong>${fmt(r)} kg</strong>`;
  } else if(N!==null && T!==null && B===null){
    const r=N+T;
    document.getElementById("calcB").value=r;
    out.innerHTML=`Bruto = Neto + Tara = ${fmt(N)} + ${fmt(T)} = <strong>${fmt(r)} kg</strong>`;
  }
}

function updateSlider(){
  const p=Number(document.getElementById("taraSlider").value);
  const B=20,T=B*p/100,N=B-T;
  document.getElementById("taraPct").textContent=p;
  document.getElementById("simTara").textContent=`${fmt(T)} kg`;
  document.getElementById("simNeto").textContent=`${fmt(N)} kg`;
  document.getElementById("simEquation").textContent=`20 − ${fmt(T)} = ${fmt(N)} kg`;
}
function answerChoice(btn,correct,msg){
  const container=btn.parentElement;
  [...container.children].forEach(b=>b.disabled=true);
  btn.style.borderColor=correct?"rgba(74,222,128,.45)":"rgba(251,113,133,.45)";
  btn.style.background=correct?"rgba(74,222,128,.08)":"rgba(251,113,133,.08)";
  const fb=document.getElementById("easyFeedback");
  fb.classList.remove("hidden");
  fb.innerHTML=(correct?"<span class='good'>✓ Benar!</span> ":"<span class='bad'>Belum tepat.</span> ")+msg;
}
function checkMedium(){
  const t=Number(document.getElementById("latTara").value);
  const n=Number(document.getElementById("latNeto").value);
  const fb=document.getElementById("mediumFeedback");
  const final=document.getElementById("latFinal");
  if(!Number.isFinite(t)||!Number.isFinite(n)){
    fb.classList.remove("hidden");fb.innerHTML="<span class='bad'>Isi kedua jawaban terlebih dahulu.</span>";return;
  }
  const okT=Math.abs(t-2)<0.001, okN=Math.abs(n-48)<0.001;
  final.value=okT&&okN?"Benar — 48 kg":"Periksa lagi";
  fb.classList.remove("hidden");
  fb.innerHTML=okT&&okN
    ?"<span class='good'>✓ Tepat!</span> Tara = 4% × 50 = 2 kg dan neto = 50 − 2 = 48 kg."
    :"<span class='warn'>Belum tepat.</span> Hitung tara dengan 4% × 50, lalu kurangkan dari bruto.";
}

const quizAnswers={q1:"a",q2:"b",q3:"a",q4:"c",q5:"a",q6:"b"};
const quizExplanations={
  q1:"N = B − T = 7,5 − 0,5 = 7 kg.",
  q2:"B = N + T = 4,8 + 0,2 = 5 kg.",
  q3:"T = 10% × 30 = 3 kg, sehingga N = 30 − 3 = 27 kg.",
  q4:"T = B − N = 2.500 − 2.300 = 200 gram.",
  q5:"T = 4% × 25 = 1 kg, sehingga N = 25 − 1 = 24 kg.",
  q6:"T = 12 − 11,4 = 0,6 kg. Persentase = 0,6/12 × 100% = 5%."
};
function gradeQuiz(){
  let score=0,answered=0;
  Object.keys(quizAnswers).forEach((q,i)=>{
    const selected=document.querySelector(`input[name="${q}"]:checked`);
    const fb=document.getElementById(`fb${i+1}`);
    if(selected) answered++;
    const correct=selected && selected.value===quizAnswers[q];
    if(correct) score++;
    fb.className="quiz-feedback show "+(correct?"correct":"incorrect");
    fb.innerHTML=correct
      ?`<b>✓ Benar.</b> ${quizExplanations[q]}`
      :`<b>✗ ${selected?"Belum tepat.":"Belum dijawab."}</b> ${quizExplanations[q]}`;
  });
  const pct=Math.round(score/Object.keys(quizAnswers).length*100);
  document.getElementById("quizScore").classList.add("show");
  document.getElementById("scoreNum").textContent=pct;
  document.getElementById("scoreText").textContent=`${score} dari ${Object.keys(quizAnswers).length} jawaban benar • ${answered} soal dijawab.`;
  toast(`Skor kuis: ${pct}`);
}
function resetQuiz(){
  document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);
  document.querySelectorAll(".quiz-feedback").forEach(x=>x.className="quiz-feedback");
  document.getElementById("quizScore").classList.remove("show");
  toast("Kuis direset.");
}

updateSlider();
updateUI();
</script>
