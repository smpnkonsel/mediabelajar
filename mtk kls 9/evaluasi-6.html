<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Evaluasi Bab 6 — Teori Peluang</title>
<style>
:root{--p:#2563eb;--p2:#1d4ed8;--c:#06b6d4;--ok:#16a34a;--bad:#dc2626;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:1150px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:13px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--c));display:grid;place-items:center;color:white;font-size:23px}
.brand strong{display:block;font-size:15px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.prog{margin-left:auto;width:min(350px,40vw)}.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}.bar{height:8px;background:#e8eef8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--c));transition:.3s}
main{width:min(1080px,calc(100% - 24px));margin:24px auto 35px;flex:1}.slide{display:none;animation:in .3s ease}.slide.active{display:block}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.cover{min-height:calc(100vh - 165px);display:grid;place-items:center}.cover-card,.card{background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px #0f172a18}.cover-card{width:min(820px,100%);padding:clamp(30px,6vw,65px);border-radius:32px;text-align:center}.icon{width:86px;height:86px;margin:0 auto 18px;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;font-size:42px}.kicker{color:var(--p);font-weight:900;font-size:12px;letter-spacing:2px}.cover-card h1{font-size:clamp(30px,6vw,55px);line-height:1.05;margin:12px 0}.sub{color:var(--muted)}.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:24px 0}.pill{padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:#f8fafc;font-size:13px;font-weight:700;color:#475569}
.card{border-radius:22px;padding:clamp(19px,4vw,33px)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.num{font-size:12px;color:var(--p);font-weight:900;letter-spacing:1px;text-transform:uppercase}h2{font-size:clamp(23px,4vw,34px);margin:0 0 8px}.q{font-size:clamp(19px,3vw,27px);line-height:1.5;font-weight:750;margin:16px 0 22px}.opts{display:grid;gap:11px}.opt{border:2px solid var(--line);background:white;border-radius:15px;padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:.2s}.opt:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}.opt:disabled{cursor:default}.letter{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#eff6ff;color:var(--p);display:grid;place-items:center;font-weight:900}.opt.correct{border-color:#86efac;background:#f0fdf4}.opt.wrong{border-color:#fca5a5;background:#fef2f2}.feedback{display:none;margin-top:17px;padding:15px;border-radius:15px;border:1px solid}.feedback.show{display:block}.good{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}.discussion{margin-top:7px;line-height:1.6}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:850;display:inline-flex;justify-content:center;align-items:center;gap:7px;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.success{background:var(--ok);color:#fff}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.nav .btn{min-width:135px}.dots{max-width:950px;margin:0 auto 15px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:#cbd5e1}.dot.active{background:var(--p);transform:scale(1.25)}.dot.done{background:#86efac}
.essay{display:grid;gap:16px}.ebox{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fbfdff}.eq{font-weight:800;line-height:1.55;margin-bottom:11px}.ebox textarea{width:100%;min-height:115px;resize:vertical;border:1px solid #cbd5e1;border-radius:12px;padding:12px;outline:none}.score{display:flex;align-items:center;gap:9px;margin-top:9px}.score input{width:90px;padding:8px;border:1px solid var(--line);border-radius:9px}.note{color:var(--muted);font-size:13px;line-height:1.6}
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:9px 0}.ah{width:100%;border:0;background:#f8fafc;padding:14px 16px;text-align:left;font-weight:800;display:flex;justify-content:space-between}.ab{display:none;padding:15px;line-height:1.65;border-top:1px solid var(--line)}.acc.open .ab{display:block}
.big{text-align:center;padding:27px;border-radius:21px;background:linear-gradient(135deg,#eff6ff,#ecfeff);border:1px solid #bfdbfe}.big b{font-size:60px;color:var(--p);display:block}.cat{display:inline-block;margin-top:8px;background:white;padding:8px 14px;border-radius:99px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:15px;background:#f8fafc}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:4px}.analysis{padding:17px;border-radius:16px;background:#f8fafc;border:1px solid var(--line);line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:17px}
@media(max-width:700px){.prog{display:none}.head{padding:10px 13px}main{width:calc(100% - 14px);margin-top:13px}.card{padding:17px}.cover-card{border-radius:24px}.stats{grid-template-columns:1fr}.nav .btn{min-width:0;flex:1}.q{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><div class="logo">ℙ</div><div class="brand"><strong id="hs"></strong><span id="hb"></span></div><div class="prog"><div class="pl"><span id="pt">Belum dimulai</span><span id="pp">0%</span></div><div class="bar"><i id="pb"></i></div></div></div></header>
<main id="slides"></main><div class="dots" id="dots"></div><footer>Evaluasi pembelajaran interaktif • Bab 6 Teori Peluang</footer>
</div>
<script>
/* =========================================================
   DATA MATERI — SATU-SATUNYA BAGIAN MATERI YANG PERLU DIISI.
   Submateri dibuat mencakup materi utama Teori Peluang kelas 9.
   ========================================================= */
const DATA_MATERI={
 mataPelajaran:"MATEMATIKA",
 kelasFase:"KELAS 9 / FASE D",
 bab:"Bab 6 — Teori Peluang",
 submateri:[
  "Percobaan acak",
  "Ruang sampel",
  "Titik sampel",
  "Kejadian",
  "Peluang suatu kejadian",
  "Peluang kejadian sederhana",
  "Kisaran nilai peluang",
  "Peluang kejadian pasti dan mustahil",
  "Frekuensi harapan",
  "Peluang empiris",
  "Penerapan peluang dalam kehidupan sehari-hari"
 ],
 jumlahPG:15,
 jumlahEsai:5,
 urlBab:"bab6.html"
};

/* URL TUJUAN — cukup ubah dua variabel ini */
const NEXT_BAB_URL="[URL BAB BERIKUTNYA]";
const DASHBOARD_URL="[URL DASHBOARD]";

/* =========================================================
   SOAL KELAS 9 — BAB 6 TEORI PELUANG
   ========================================================= */
const questions=[
 {question:"Ketika sebuah dadu bersisi enam dilempar satu kali, hasil yang mungkin muncul adalah 1, 2, 3, 4, 5, atau 6. Himpunan semua hasil yang mungkin disebut ....",options:["kejadian","ruang sampel","frekuensi","peluang"],answer:1,discussion:"Ruang sampel adalah himpunan seluruh hasil yang mungkin dari suatu percobaan acak. Untuk satu dadu, ruang sampelnya {1,2,3,4,5,6}."},
 {question:"Sebuah koin dilempar satu kali. Banyak titik sampel pada ruang sampelnya adalah ....",options:["1","2","3","4"],answer:1,discussion:"Satu koin memiliki dua hasil yang mungkin, yaitu sisi angka dan sisi gambar. Jadi terdapat 2 titik sampel."},
 {question:"Dalam pelemparan sebuah dadu, kejadian muncul bilangan genap adalah ....",options:["{1,3,5}","{2,4,6}","{1,2,3}","{3,4,5}"],answer:1,discussion:"Bilangan genap pada dadu adalah 2, 4, dan 6. Jadi kejadian tersebut adalah {2,4,6}."},
 {question:"Peluang muncul angka 4 ketika sebuah dadu fair dilempar satu kali adalah ....",options:["1/2","1/4","1/6","4/6"],answer:2,discussion:"Ada 1 hasil yang diinginkan, yaitu 4, dari 6 titik sampel yang sama mungkin. Jadi P(4)=1/6."},
 {question:"Nilai peluang suatu kejadian selalu berada pada interval ....",options:["−1 sampai 1","0 sampai 1","1 sampai 2","−∞ sampai ∞"],answer:1,discussion:"Peluang tidak pernah kurang dari 0 dan tidak pernah lebih dari 1. Jadi 0 ≤ P(A) ≤ 1."},
 {question:"Sebuah kejadian yang pasti terjadi mempunyai peluang ....",options:["0","1/4","1/2","1"],answer:3,discussion:"Kejadian pasti memiliki peluang 1 atau 100%. Contohnya, pada dadu, pasti muncul bilangan antara 1 dan 6."},
 {question:"Sebuah kejadian yang mustahil terjadi mempunyai peluang ....",options:["0","1/6","1/2","1"],answer:0,discussion:"Kejadian mustahil tidak memiliki hasil yang mendukung, sehingga peluangnya 0."},
 {question:"Sebuah kantong berisi 3 bola merah dan 2 bola biru. Satu bola diambil secara acak. Peluang terambil bola biru adalah ....",options:["2/3","2/5","3/5","1/2"],answer:1,discussion:"Jumlah bola = 3+2=5. Bola biru ada 2, sehingga peluangnya 2/5."},
 {question:"Dari 40 kali percobaan pelemparan sebuah koin, sisi gambar muncul 22 kali. Peluang empiris muncul gambar adalah ....",options:["9/20","11/20","18/20","22/40 + 1"],answer:1,discussion:"Peluang empiris = frekuensi kejadian/frekuensi percobaan = 22/40 = 11/20."},
 {question:"Sebuah dadu dilempar 120 kali. Peluang teoretis muncul angka 6 adalah 1/6. Frekuensi harapan muncul angka 6 adalah ....",options:["10","15","20","30"],answer:2,discussion:"Frekuensi harapan = banyak percobaan × peluang = 120 × 1/6 = 20."},
 {question:"Sebuah kartu bernomor 1 sampai 10 dipilih secara acak. Peluang terpilih bilangan prima adalah ....",options:["1/5","2/5","3/5","4/5"],answer:1,discussion:"Bilangan prima dari 1 sampai 10 adalah 2,3,5,7, yaitu 4 angka. Peluang = 4/10 = 2/5."},
 {question:"Dalam sebuah kotak terdapat 5 bola putih dan 5 bola hitam. Jika satu bola diambil acak, peluang mengambil bola putih adalah ....",options:["1/10","1/5","1/2","4/5"],answer:2,discussion:"Ada 5 bola putih dari total 10 bola. Jadi P(putih)=5/10=1/2."},
 {question:"Jika P(A)=0,35, maka peluang kejadian bukan A adalah ....",options:["0,35","0,50","0,65","1,35"],answer:2,discussion:"Peluang komplemen A adalah P(Aᶜ)=1−P(A)=1−0,35=0,65."},
 {question:"Sebuah spinner memiliki 8 bagian sama besar bernomor 1 sampai 8. Peluang mendapatkan bilangan lebih dari 5 adalah ....",options:["1/8","2/8","3/8","5/8"],answer:2,discussion:"Bilangan lebih dari 5 adalah 6,7,8, sebanyak 3 hasil dari 8 hasil yang mungkin. Jadi peluangnya 3/8."},
 {question:"Peluang hujan pada suatu hari diperkirakan 0,7. Pernyataan yang tepat adalah ....",options:["Peluang tidak hujan 0,7","Peluang tidak hujan 0,3","Hujan pasti terjadi","Hujan mustahil terjadi"],answer:1,discussion:"Peluang komplemen tidak hujan = 1−0,7=0,3. Artinya peluang tidak hujan diperkirakan 30%."}
];

const essayQuestions=[
 {question:"Jelaskan perbedaan percobaan acak, ruang sampel, titik sampel, dan kejadian dengan contoh pelemparan sebuah dadu.",answerGuide:"Percobaan acak adalah kegiatan yang hasilnya belum dapat dipastikan sebelumnya. Ruang sampel adalah semua hasil yang mungkin, yaitu {1,2,3,4,5,6}. Titik sampel adalah satu hasil, misalnya 4. Kejadian adalah kumpulan titik sampel yang memenuhi syarat, misalnya kejadian muncul bilangan genap {2,4,6}.",maxScore:10},
 {question:"Sebuah dadu dilempar satu kali. Tentukan peluang muncul bilangan ganjil dan jelaskan langkahnya.",answerGuide:"Bilangan ganjil pada dadu adalah {1,3,5}, sehingga ada 3 hasil yang diinginkan dari 6 titik sampel. P(A)=3/6=1/2.",maxScore:10},
 {question:"Sebuah kantong berisi 4 bola merah, 3 bola biru, dan 3 bola hijau. Jika satu bola diambil acak, tentukan peluang terambil bola merah dan peluang tidak terambil bola merah.",answerGuide:"Total bola = 10. P(merah)=4/10=2/5. Peluang tidak merah = 1−2/5=3/5 atau 6/10.",maxScore:10},
 {question:"Sebuah dadu dilempar 180 kali. Tentukan frekuensi harapan muncul bilangan 6 dan jelaskan mengapa hasil nyata dapat berbeda dari frekuensi harapan.",answerGuide:"P(6)=1/6, sehingga frekuensi harapan=180×1/6=30. Hasil nyata dapat berbeda karena percobaan acak memiliki variasi; frekuensi harapan adalah perkiraan berdasarkan peluang teoretis.",maxScore:10},
 {question:"Dalam sebuah permainan, peluang seorang pemain menang adalah 0,65. Tentukan peluang pemain tersebut tidak menang dan jelaskan maknanya dalam konteks permainan.",answerGuide:"P(tidak menang)=1−0,65=0,35. Artinya, berdasarkan model peluang, kemungkinan pemain tidak menang adalah 35%.",maxScore:10}
];

const slides=document.getElementById("slides"),dots=document.getElementById("dots");
let current=0,answers=Array(questions.length).fill(null),essayScores=Array(essayQuestions.length).fill(0);

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]||m))}
function pg(){return questions.slice(0,Math.max(0,Number(DATA_MATERI.jumlahPG)||questions.length))}
function es(){return essayQuestions.slice(0,Math.max(0,Number(DATA_MATERI.jumlahEsai)||essayQuestions.length))}

function build(){
 document.title="Evaluasi "+DATA_MATERI.bab;
 document.getElementById("hs").textContent=DATA_MATERI.mataPelajaran;
 document.getElementById("hb").textContent=DATA_MATERI.bab;
 slides.innerHTML="";
 let n=0,P=pg(),E=es();

 slides.insertAdjacentHTML("beforeend",`<section class="slide active cover">
 <div class="cover-card"><div class="icon">ℙ</div><div class="kicker">${esc(DATA_MATERI.mataPelajaran)}</div>
 <h1>EVALUASI<br>${esc(DATA_MATERI.bab)}</h1><div class="sub">${esc(DATA_MATERI.kelasFase)}</div>
 <div class="pills"><span class="pill">📝 ${P.length} Soal Pilihan Ganda</span><span class="pill">✍️ ${E.length} Soal Esai</span><span class="pill">📚 ${DATA_MATERI.submateri.length} Submateri</span></div>
 <button class="btn primary" onclick="start()">🚀 MULAI EVALUASI</button>
 <p class="note">Jawablah setiap soal dengan teliti. Pembahasan muncul setelah jawaban dipilih.</p></div></section>`);

 P.forEach((q,i)=>{
  n++;
  slides.insertAdjacentHTML("beforeend",`<section class="slide">
   <div class="card"><div class="top"><span class="num">Pilihan Ganda • Soal ${i+1} dari ${P.length}</span><span class="pill">${i<5?"Konsep":i<10?"Penerapan":"Penalaran"}</span></div>
   <div class="q">${esc(q.question)}</div><div class="opts">${q.options.map((o,j)=>`<button class="opt" id="o${i}-${j}" onclick="answer(${i},${j})"><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div id="f${i}" class="feedback"></div><div class="nav"><button class="btn secondary" onclick="prev()">← Sebelumnya</button><button class="btn primary" onclick="next()">Berikutnya →</button></div></div></section>`);
 });

 if(E.length){n++;slides.insertAdjacentHTML("beforeend",`<section class="slide"><div class="card"><div class="top"><span class="num">Bagian Esai</span><span class="pill">${E.length} Soal</span></div><h2>✍️ SOAL ESAI</h2><p class="note">Guru dapat memasukkan skor setiap soal. Maksimum skor tiap soal mengikuti data soal.</p><div class="essay">${E.map((q,i)=>`<div class="ebox"><div class="eq">${i+1}. ${esc(q.question)}</div><textarea id="ea${i}" placeholder="Tuliskan jawabanmu..."></textarea><div class="score"><label>Skor:</label><input type="number" min="0" max="${q.maxScore}" value="0" onchange="setScore(${i},this.value)"><span class="note">maks. ${q.maxScore}</span></div></div>`).join("")}</div><div class="nav"><button class="btn secondary" onclick="prev()">← Sebelumnya</button><button class="btn primary" onclick="saveNext()">Simpan & Berikutnya →</button></div></div></section>`)}

 n++;
 slides.insertAdjacentHTML("beforeend",`<section class="slide"><div class="card"><div class="top"><span class="num">Kunci & Pembahasan</span><span class="pill">Review</span></div><h2>🔑 KUNCI JAWABAN & PEMBAHASAN</h2><p class="note">Klik soal untuk membuka kunci dan pembahasan.</p><h3>Pilihan Ganda</h3>${P.map((q,i)=>`<div class="acc"><button class="ah" onclick="this.parentElement.classList.toggle('open')"><span>Soal ${i+1} — Kunci ${String.fromCharCode(65+q.answer)}</span><span>＋</span></button><div class="ab"><b>Pembahasan:</b><br>${esc(q.discussion)}</div></div>`).join("")}${E.length?`<h3>Esai</h3>${E.map((q,i)=>`<div class="acc"><button class="ah" onclick="this.parentElement.classList.toggle('open')"><span>Esai ${i+1} — Pedoman Jawaban</span><span>＋</span></button><div class="ab"><b>Pedoman:</b><br>${esc(q.answerGuide)}<br><small>Skor maksimum: ${q.maxScore}</small></div></div>`).join("")}`:""}<div class="nav"><button class="btn secondary" onclick="prev()">← Sebelumnya</button><button class="btn primary" onclick="next()">Lihat Hasil →</button></div></div></section>`);

 n++;
 slides.insertAdjacentHTML("beforeend",`<section class="slide"><div class="card"><div class="top"><span class="num">Hasil Akhir</span><span class="pill">Otomatis</span></div><h2>📊 HASIL EVALUASI</h2><div class="big"><b id="final">0</b>Nilai Akhir (0–100)<div class="cat" id="cat">Belum dihitung</div></div><div class="stats">
 <div class="stat"><small>Jawaban Benar</small><strong id="correct">0</strong></div><div class="stat"><small>Jawaban Salah</small><strong id="wrong">0</strong></div><div class="stat"><small>Nilai Pilihan Ganda</small><strong id="pgscore">0</strong></div><div class="stat"><small>Nilai Esai</small><strong id="escore">0</strong></div><div class="stat"><small>Persentase PG</small><strong id="pct">0%</strong></div><div class="stat"><small>Jumlah Submateri</small><strong>${DATA_MATERI.submateri.length}</strong></div></div><div class="analysis" id="analysis"></div><div class="actions"><button class="btn primary" onclick="restart()">🔄 ULANGI EVALUASI</button><button class="btn secondary" onclick="go(DASHBOARD_URL)">📚 KEMBALI KE DASHBOARD</button><button class="btn success" onclick="go(NEXT_BAB_URL)">➡️ BAB BERIKUTNYA</button></div></div></section>`);

 dots.innerHTML="";
 document.querySelectorAll(".slide").forEach((_,i)=>{let d=document.createElement("button");d.className="dot";d.id="d"+i;d.title="Slide "+(i+1);d.onclick=()=>show(i);dots.appendChild(d)});
 show(0);
}
function show(n){let S=document.querySelectorAll(".slide");if(n<0||n>=S.length)return;current=n;S.forEach((x,i)=>x.classList.toggle("active",i===n));document.querySelectorAll(".dot").forEach((d,i)=>{d.classList.toggle("active",i===n);d.classList.toggle("done",i<n)});let p=S.length<2?0:Math.round(n/(S.length-1)*100);document.getElementById("pb").style.width=p+"%";document.getElementById("pp").textContent=p+"%";document.getElementById("pt").textContent=n===0?"Belum dimulai":`Slide ${n+1} dari ${S.length}`;if(n===S.length-1)result();scrollTo({top:0,behavior:"smooth"})}
function start(){show(1)}function next(){show(current+1)}function prev(){show(current-1)}
function answer(i,c){if(answers[i]!==null)return;answers[i]=c;let q=pg()[i],good=c===q.answer;q.options.forEach((_,j)=>{let b=document.getElementById(`o${i}-${j}`);b.disabled=true;if(j===q.answer)b.classList.add("correct");if(j===c&&!good)b.classList.add("wrong")});let f=document.getElementById("f"+i);f.className="feedback show "+(good?"good":"bad");f.innerHTML=`<b>${good?"✓ Jawaban Benar":"✕ Jawaban Salah — Jawaban benar: "+String.fromCharCode(65+q.answer)}</b><div class="discussion">${esc(q.discussion)}</div>`}
function setScore(i,v){let max=es()[i]?.maxScore||0;essayScores[i]=Math.max(0,Math.min(max,Number(v)||0))}
function saveNext(){es().forEach((q,i)=>{let x=document.querySelector(`#slides textarea`) ;let inp=document.querySelectorAll(".score input")[i];if(inp)setScore(i,inp.value)});next()}
function result(){
 let P=pg(),E=es(),correct=answers.reduce((s,a,i)=>s+(a===P[i]?.answer?1:0),0),wrong=answers.reduce((s,a,i)=>s+(a!==null&&a!==P[i]?.answer?1:0),0);
 let maxE=E.reduce((s,q)=>s+q.maxScore,0),rawE=maxE?essayScores.slice(0,E.length).reduce((s,v)=>s+Number(v||0),0)/maxE:0,rawP=P.length?correct/P.length:0;
 let wp=P.length&&E.length?.7:P.length?1:0,we=P.length&&E.length?.3:E.length?1:0,ps=rawP*100*wp,esv=rawE*100*we,total=Math.round((ps+esv)*100)/100;
 let cat,txt,mot;if(total>=85){cat="Sangat Baik";txt="Pemahaman terhadap materi sudah sangat baik. Pertahankan dan lanjutkan ke materi berikutnya.";mot="Hebat! Pertahankan ketelitian dan kemampuan penalaranmu."}else if(total>=70){cat="Baik";txt="Pemahaman sudah baik, tetapi masih ada bagian yang perlu diperkuat.";mot="Bagus! Pelajari kembali soal yang belum tepat agar pemahaman semakin kuat."}else if(total>=55){cat="Cukup";txt="Beberapa konsep sudah dipahami, tetapi perlu latihan tambahan.";mot="Tetap semangat. Latihan bertahap akan membantu meningkatkan penguasaan konsep."}else{cat="Perlu Bimbingan";txt="Pelajari kembali konsep peluang dan lakukan latihan ulang secara bertahap.";mot="Jangan menyerah. Mulai dari konsep dasar, kemudian lanjutkan ke soal penerapan."}
 document.getElementById("correct").textContent=correct;document.getElementById("wrong").textContent=wrong;document.getElementById("pgscore").textContent=ps.toFixed(2);document.getElementById("escore").textContent=esv.toFixed(2);document.getElementById("final").textContent=total.toFixed(2);document.getElementById("pct").textContent=(P.length?Math.round(rawP*100):0)+"%";document.getElementById("cat").textContent=cat;document.getElementById("analysis").innerHTML=`<b>Analisis Hasil: ${cat}</b><br>${txt}<br><br><b>Motivasi:</b> ${mot}`;
}
function restart(){answers=Array(questions.length).fill(null);essayScores=Array(essayQuestions.length).fill(0);build()}
function go(url){if(!url||url.startsWith("[")){alert("Silakan isi NEXT_BAB_URL atau DASHBOARD_URL terlebih dahulu.");return}location.href=url}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});
build();
