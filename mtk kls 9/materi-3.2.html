<style>

<script>
/* ================= MESIN 3D ================= */
const sub=(a,b)=>a.map((x,k)=>x-b[k]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const nrm3=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
const I3=()=>[[1,0,0],[0,1,0],[0,0,1]];
const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
const orth=M=>{const a=nrm3(M[0]),b=nrm3(sub(M[1],a.map(x=>x*dot(a,M[1]))));return[a,b,cross(a,b)]};
const rg=n=>[...Array(n).keys()],PI=Math.PI;
const P=(n,r,o=0)=>rg(n).map(i=>{const a=o+2*PI*i/n;return[r*Math.cos(a),r*Math.sin(a)]});
const box=(w,h,d)=>{const v=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1])v.push([x*w/2,y*h/2,z*d/2]);
 return{v,f:[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]]}};
const prism=(b,t)=>{const n=b.length;return{v:b.map(p=>[p[0],-t/2,p[1]]).concat(b.map(p=>[p[0],t/2,p[1]])),f:[rg(n),rg(n).map(i=>i+n),...rg(n).map(i=>[i,(i+1)%n,(i+1)%n+n,i+n])]}};
const pyr=(b,t)=>{const n=b.length;return{v:b.map(p=>[p[0],-t/2,p[1]]).concat([[0,t/2,0]]),f:[rg(n),...rg(n).map(i=>[i,(i+1)%n,n])]}};
const sph=(r,N=10,M=20)=>{const v=[[0,r,0]];for(let i=1;i<N;i++)for(let j=0;j<M;j++){const a=PI*i/N,b=2*PI*j/M;v.push([r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b)])}
 v.push([0,-r,0]);const id=(i,j)=>1+(i-1)*M+j%M,L=v.length-1,f=[];
 for(let j=0;j<M;j++)f.push([0,id(1,j+1),id(1,j)]);
 for(let i=1;i<N-1;i++)for(let j=0;j<M;j++)f.push([id(i,j),id(i,j+1),id(i+1,j+1),id(i+1,j)]);
 for(let j=0;j<M;j++)f.push([L,id(N-1,j),id(N-1,j+1)]);return{v,f}};
const hemi=(r,N,M)=>{const v=[[0,r,0]];for(let i=1;i<=N;i++){const a=PI/2*i/N;for(let j=0;j<M;j++){const b=2*PI*j/M;v.push([r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b)])}}
 const id=(i,j)=>1+(i-1)*M+j%M,f=[];for(let j=0;j<M;j++)f.push([0,id(1,j+1),id(1,j)]);
 for(let i=1;i<N;i++)for(let j=0;j<M;j++)f.push([id(i,j),id(i,j+1),id(i+1,j+1),id(i+1,j)]);return{v,f}};
const tri=(w,h,d)=>{const v=[];for(const z of[-d/2,d/2])v.push([-w/2,0,z],[w/2,0,z],[0,h,z]);return{v,f:[[0,1,2],[3,4,5],[1,2,5,4],[2,0,3,5]]}};
const merge=(A,B,dy)=>{const o=A.v.length;return{v:A.v.concat(B.v.map(p=>[p[0],p[1]+dy,p[2]])),f:A.f.concat(B.f.map(f=>f.map(i=>i+o)))}};
const noBase=G=>({v:G.v,f:G.f.slice(1)});

function mkGeo(s){
 const g=s.g(),V=g.v;
 const mn=[0,1,2].map(k=>Math.min(...V.map(p=>p[k]))),mx=[0,1,2].map(k=>Math.max(...V.map(p=>p[k])));
 const c=mn.map((m,k)=>(m+mx[k])/2);
 let v=V.map(p=>p.map((x,k)=>x-c[k]));const sc=Math.max(...v.map(p=>Math.hypot(...p)));v=v.map(p=>p.map(x=>x/sc));
 const gm=[0,1,2].map(k=>v.reduce((a,p)=>a+p[k],0)/v.length);
 const f=g.f.map(fc=>{const t=fc.map(i=>v[i]),m=[0,1,2].map(k=>t.reduce((a,p)=>a+p[k],0)/t.length);
  return dot(cross(sub(t[1],t[0]),sub(t[2],t[0])),sub(m,gm))<0?[...fc].reverse():fc});
 const n=f.map(fc=>nrm3(cross(sub(v[fc[1]],v[fc[0]]),sub(v[fc[2]],v[fc[0]]))));
 const G={v,f,n,h:[],rt:s.rt||0,net:!s.nonet};
 if(G.net){const em={};f.forEach((fc,i)=>fc.forEach((a,k)=>{const b=fc[(k+1)%fc.length],key=Math.min(a,b)+'-'+Math.max(a,b);(em[key]=em[key]||[]).push(i)}));
  const par=Array(f.length).fill(-2),qu=[G.rt];par[G.rt]=-1;
  for(let h=0;h<qu.length;h++){const x=qu[h];if(s.lf&&s.lf.includes(x))continue;f[x].forEach((a,k)=>{const b=f[x][(k+1)%f[x].length],o=em[Math.min(a,b)+'-'+Math.max(a,b)].find(y=>y!==x);

<p class="lead">Bayangkan sebuah kardus. Jika kamu menggunting semua sisinya lalu merebahkannya di atas meja, kamu mendapatkan bidang datar bernama <b style="color:var(--accent)">jaring-jaring</b>. Tekan tombol "Buka jaring-jaring" pada model.</p>
<p class="lead" style="margin-top:12px">Luas permukaan bangun ruang = <b style="color:var(--white-line)">jumlah luas seluruh sisi</b> pada jaring-jaring tersebut.</p>
<div class="formula-box" style="margin-top:22px"><div class="flabel">Prinsip Umum</div><div class="fmain">L = Σ (luas setiap sisi)</div></div></div>
<div class="v3-wrap" data-shape="Kubus"></div>`,'content-grid');
TOPICS.forEach((t,i)=>{
 html+=sl(t.key+' · Materi',`<div><div class="eyebrow">Lembar ${lem()} — Bangun ${pad(i+1)}</div><h2 class="title-md">${t.title}</h2><p class="lead">${t.lead}</p>
 <ul class="part-list">${partLis(t.parts)}</ul><div class="formula-box"><div class="flabel">Rumus Luas Permukaan ${t.title}</div><div class="fmain">${t.formula}</div></div></div>
 <div class="v3-wrap" data-shape="${t.key}"></div>`,'content-grid');
 html+=sl(t.key+' · Contoh Soal',`<div class="eyebrow">Lembar ${lem()} — Latihan Bangun ${pad(i+1)}</div><h2 class="title-md">Contoh Soal: ${t.title}</h2><div class="two-col-examples">${exCards(t.ex)}</div>`);
});
html+=sl('Gabungan · Materi',`<div><div class="eyebrow">Lembar ${lem()} — Bangun 08</div><h2 class="title-md">Bangun Ruang Gabungan</h2>
<p class="lead">Bangun gabungan tersusun dari dua bangun ruang atau lebih. Bidang yang saling menempel tertutup, jadi <b style="color:var(--white-line)">tidak ikut dihitung</b>. Pilih bangun, lalu ketuk bagian-bagiannya.</p>
<div class="chips" id="gabChips">${GAB.map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-i="${i}">${g.name}</button>`).join('')}</div>
<p class="lead" id="gabDesc" style="margin-top:14px;font-size:14.5px"></p>
<ul class="part-list" id="gabParts"></ul>
<div class="formula-box"><div class="flabel">Luas Permukaan Gabungan</div><div class="fmain" id="gabFormula"></div></div></div>
<div class="v3-wrap" data-shape="GK" id="gabViewer"></div>`,'content-grid');
html+=sl('Gabungan · Contoh Soal',`<div class="eyebrow">Lembar ${lem()} — Latihan Bangun 08</div><h2 class="title-md">Contoh Soal: Bangun Ruang Gabungan</h2><div class="two-col-examples">${exCards(GEX)}</div>`);
const RUMUS=[['Kubus','L = 6 × s²'],['Balok','L = 2 (pl + pt + lt)'],['Prisma Segitiga','L = (2 × luas alas) + (keliling alas × tinggi)'],['Limas Segiempat','L = luas alas + jumlah luas sisi tegak'],['Tabung','L = 2πr(r + t)'],['Kerucut','L = πr(r + s)'],['Bola','L = 4πr²'],['Bangun Gabungan','L = jumlah luas semua bagian yang terlihat (tanpa bidang sambungan)']];
html+=sl('Rangkuman Rumus',`<div class="eyebrow">Lembar ${lem()} — Rangkuman</div><h2 class="title-md">Rangkuman Rumus Luas Permukaan</h2>
<div class="table-wrap"><table class="rangkuman"><tr><th>Bangun Ruang</th><th>Rumus Luas Permukaan</th></tr>${RUMUS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<p class="hint" style="margin-top:20px;text-align:left">Siap? Uji pemahamanmu di kuis berikutnya.</p>`);
html+=sl('Kuis',`<div class="eyebrow">Lembar ${lem()} — Uji Pemahaman</div><div class="quiz-wrap"><div class="quiz-progress" id="quiz-progress"></div><div id="quiz-body"></div></div>`);
html+=sl('Selesai',`<div class="finish-icon" style="margin-bottom:20px"><svg width="72" height="72" viewBox="0 0 72 72" fill="none" style="margin:0 auto;display:block"><circle cx="36" cy="36" r="34" stroke="#FF8C42" stroke-width="1.5"/><path d="M22 37 L32 47 L50 26" stroke="#4CAF7D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="eyebrow" style="justify-content:center">Lembar ${lem()} — Penutup</div><h1 class="title-lg">Kerja Bagus!</h1>
<p class="lead" style="margin:0 auto 8px">Kamu telah menyelesaikan 3.2 Luas Permukaan Bangun Ruang. Kubus, balok, prisma, limas, tabung, kerucut, bola, sampai bangun gabungan, semua kulitnya sudah kamu bongkar dan ukur.</p>
<div style="font-family:var(--font-mono);font-size:14px;color:var(--accent);margin:20px 0" id="final-score-note"></div>
<div style="margin-top:24px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="goTo(0)">Ulangi Presentasi</button><button class="btn solid big" onclick="window.location.href='bab3.html'">Selesai — Kembali ke Bab 3</button></div>`,'finish-wrap');
document.getElementById('deck').innerHTML=html;

/* ================= NAVIGASI ================= */
const slides=document.querySelectorAll('.slide'),totalSlides=slides.length;let current=0;
const dotsRow=document.getElementById('dotsRow');
slides.forEach((s,i)=>{const d=document.createElement('button');d.className='navdot';d.setAttribute('aria-label','Slide '+(i+1));d.onclick=()=>goTo(i);dotsRow.appendChild(d)});
function updateUI(){
 slides.forEach((s,i)=>s.classList.toggle('active',i===current));
 document.querySelectorAll('.navdot').forEach((d,i)=>d.classList.toggle('active',i===current));
 document.getElementById('slideCount').textContent=(current+1)+' / '+totalSlides;
 document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===totalSlides-1;
 document.getElementById('tb-slide-name').textContent=slides[current].dataset.name.toUpperCase();
 window.scrollTo(0,0);
 if(current===totalSlides-1){document.getElementById('final-score-note').textContent=quizAnswers>0?('Skor kuis kamu: '+quizScore+'/'+quizTotal+' ('+Math.round(quizScore/quizTotal*100)+'%)'):''}
}
function goTo(i){if(i<0||i>=totalSlides)return;current=i;updateUI();if(slides[current].dataset.name==='Kuis'&&!quizStarted)startQuiz()}
function nextSlide(){goTo(current+1)}function prevSlide(){goTo(current-1)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')prevSlide()});
function toggleSolution(btn){const sol=btn.nextElementSibling;sol.classList.toggle('show');btn.textContent=sol.classList.contains('show')?'Sembunyikan Penyelesaian':'Lihat Penyelesaian'}

/* ================= VIEWER 3D ================= */
const ENG=[];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function mkViewer(wrap,keys,o={}){
 const mini=!!o.mini;
 wrap.innerHTML=`<div class="v3"><canvas></canvas></div>`+(mini?'':`<div class="v3-ctl"><button class="vbtn tpb" aria-pressed="false">Tembus pandang</button><button class="vbtn aub" aria-pressed="false">Putar otomatis</button><button class="vbtn rsb">Atur ulang</button><button class="vbtn jrb">Buka jaring-jaring</button><input class="vrange nr" type="range" min="0" max="100" value="0" aria-label="Buka jaring-jaring"></div><div class="hint"></div><div class="progress-note"></div>`);
 const q=s=>wrap.querySelector(s),hint=q('.hint'),pn=q('.progress-note'),nr=q('.nr'),jr=q('.jrb'),act=new Set();let E;
 const lis=()=>o.ul?[...o.ul.querySelectorAll('li[data-part]')]:[];
 function sync(){const L=lis();L.forEach(li=>{li.classList.toggle('active',act.has(li.dataset.part));li.onclick=()=>toggle(li.dataset.part)});
  if(pn)pn.textContent=L.length?(act.size>=L.length?'✓ Rumus lengkap!':act.size+' / '+L.length+' bagian ditemukan'):''}
 function toggle(k){if(k==null)return;act.has(k)?act.delete(k):act.add(k);sync()}
 E=Eng(q('canvas'),keys.map(k=>SH[k]),{act:()=>act,hint:t=>{if(hint)hint.textContent=t},onu:v=>{if(nr)nr.value=Math.round(v*100)},onTap:toggle,auto:mini&&!reduce,z:mini?.4:.34,
  onset:G=>{if(jr){jr.textContent='Buka jaring-jaring';jr.disabled=nr.disabled=!G.net;nr.value=0;jr.title=G.net?'':'Bola dan bangun gabungan tidak punya satu jaring-jaring tunggal'}}});
 if(!mini){const tg=(b,fn)=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on)};
  tg(q('.tpb'),v=>E.tp(v));tg(q('.aub'),v=>E.auto(v));if(reduce)q('.aub').disabled=true;
  q('.rsb').onclick=()=>{E.home();E.setU(0);jr.textContent='Buka jaring-jaring';nr.value=0};
  jr.onclick=()=>{const t=E.u()<.5?1:0;E.net(t);jr.textContent=t?'Lipat kembali':'Buka jaring-jaring'};
  nr.oninput=()=>{E.setU(nr.value/100);jr.textContent=nr.value>50?'Lipat kembali':'Buka jaring-jaring'}}
 E.set(0);ENG.push(E);sync();
 return{E,set(i){act.clear();E.set(i);sync()},sync};
}
document.querySelectorAll('.v3-wrap[data-shape]').forEach(w=>{
 if(w.id==='gabViewer')return;
 const ul=w.closest('.slide-inner').querySelector('.part-list');
 mkViewer(w,[w.dataset.shape],{ul,mini:!!w.dataset.mini});
});
/* bangun gabungan */
(function(){
 const w=document.getElementById('gabViewer'),ul=document.getElementById('gabParts'),ch=[...document.querySelectorAll('#gabChips .chip')];
 const V=mkViewer(w,GAB.map(g=>g.key),{ul});
 function show(i){const g=GAB[i];ch.forEach((c,k)=>c.setAttribute('aria-pressed',k===i));
  document.getElementById('gabDesc').textContent=g.desc;ul.innerHTML=partLis(g.parts);document.getElementById('gabFormula').textContent=g.formula;V.set(i)}
 ch.forEach(c=>c.onclick=()=>show(+c.dataset.i));show(0);
})();
(function loop(){ENG.forEach(e=>{e.sl=e.sl||e.cv.closest('.slide');if(e.sl.classList.contains('active'))e.step()});requestAnimationFrame(loop)})();

/* ================= KUIS ================= */
const quizData=[
 {q:"Sebuah kubus memiliki panjang rusuk 5 cm. Berapa luas permukaannya?",options:["125 cm²","150 cm²","100 cm²","75 cm²"],correct:1,exp:"L = 6 × s² = 6 × 25 = 150 cm²"},
 {q:"Sebuah balok berukuran p = 8 cm, l = 5 cm, t = 4 cm. Berapa luas permukaannya?",options:["160 cm²","92 cm²","184 cm²","200 cm²"],correct:2,exp:"L = 2(pl + pt + lt) = 2(40 + 32 + 20) = 2 × 92 = 184 cm²"},
 {q:"Alas prisma berbentuk segitiga siku-siku dengan kaki 3 cm dan 4 cm (sisi miring 5 cm). Tinggi prisma 10 cm. Berapa luas permukaannya?",options:["120 cm²","132 cm²","72 cm²","144 cm²"],correct:1,exp:"Luas alas = 6 cm², keliling alas = 12 cm. L = 2 × 6 + 12 × 10 = 132 cm²"},
 {q:"Limas segiempat beraturan, sisi alas 8 cm, tinggi sisi tegak 9 cm. Berapa luas permukaannya?",options:["144 cm²","64 cm²","208 cm²","280 cm²"],correct:2,exp:"Luas alas = 64, 4 sisi tegak = 4 × (½ × 8 × 9) = 144, total = 64 + 144 = 208 cm²"},
 {q:"Tabung dengan r = 10 cm, t = 12 cm (π = 3,14). Berapa luas permukaannya?",options:["1.381,6 cm²","690,8 cm²","1.256 cm²","2.763,2 cm²"],correct:0,exp:"L = 2πr(r + t) = 2 × 3,14 × 10 × 22 = 1.381,6 cm²"},
 {q:"Kerucut dengan r = 5 cm dan garis pelukis s = 13 cm (π = 3,14). Berapa luas permukaannya?",options:["204,1 cm²","282,6 cm²","78,5 cm²","408,2 cm²"],correct:1,exp:"L = πr(r + s) = 3,14 × 5 × 18 = 282,6 cm²"},
 {q:"Bola dengan jari-jari 7 cm (π = 22/7). Berapa luas permukaannya?",options:["308 cm²","616 cm²","1.232 cm²","154 cm²"],correct:1,exp:"L = 4πr² = 4 × 22/7 × 49 = 616 cm²"},
 {q:"Mainan terdiri dari kubus rusuk 6 cm dengan limas di atasnya (alas limas = tutup kubus, tinggi sisi tegak 5 cm). Berapa luas permukaan gabungannya?",options:["216 cm²","252 cm²","240 cm²","276 cm²"],correct:2,exp:"Kubus tanpa tutup = 5 × 36 = 180. Sisi tegak limas = 4 × (½ × 6 × 5) = 60. Total = 240 cm²"}
];
let quizIndex=0,quizScore=0,quizAnswers=0,quizStarted=false,quizAnswered=false;const quizTotal=quizData.length;
function startQuiz(){quizStarted=true;quizIndex=0;quizScore=0;quizAnswers=0;renderQuizProgress();renderQuizQuestion()}
function renderQuizProgress(){const p=document.getElementById('quiz-progress');p.innerHTML='';for(let i=0;i<quizTotal;i++){const d=document.createElement('div');d.className='dot'+(i<quizIndex?' done':(i===quizIndex?' current':''));p.appendChild(d)}}
function renderQuizQuestion(){
 quizAnswered=false;const body=document.getElementById('quiz-body');
 if(quizIndex>=quizTotal){const pct=Math.round(quizScore/quizTotal*100);
  const msg=pct>=80?'Luar biasa! Kamu menguasai materi ini.':(pct>=50?'Bagus! Coba ulas kembali bagian yang salah.':'Yuk pelajari lagi rumusnya, kamu pasti bisa!');
  body.innerHTML=`<div class="quiz-final"><div class="big-score">${quizScore}/${quizTotal}</div><p class="lead" style="margin:14px auto">${msg}</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="startQuiz()">Ulangi Kuis</button><button class="btn solid big" onclick="goTo(${totalSlides-1})">Lanjut ke Penutup →</button></div></div>`;return}
 const item=quizData[quizIndex];
 body.innerHTML=`<div class="quiz-q">${quizIndex+1}. ${item.q}</div><div class="quiz-options" id="quiz-options"></div><div class="quiz-feedback" id="quiz-feedback"></div><div class="quiz-score">Skor sementara: ${quizScore} / ${quizIndex}</div>`;
 const w=document.getElementById('quiz-options');
 item.options.forEach((opt,idx)=>{const b=document.createElement('button');b.className='quiz-option';b.textContent=opt;b.onclick=()=>answerQuiz(idx);w.appendChild(b)});
}
function answerQuiz(idx){
 if(quizAnswered)return;quizAnswered=true;quizAnswers++;const item=quizData[quizIndex];
 document.querySelectorAll('#quiz-options .quiz-option').forEach((o,i)=>{o.disabled=true;if(i===item.correct)o.classList.add('correct');if(i===idx&&idx!==item.correct)o.classList.add('wrong')});
 const fb=document.getElementById('quiz-feedback');
 if(idx===item.correct){quizScore++;fb.innerHTML='<span style="color:var(--success)">Benar!</span> '+item.exp}else{fb.innerHTML='<span style="color:var(--danger)">Belum tepat.</span> '+item.exp}
 const btn=document.createElement('button');btn.className='btn solid';btn.style.marginTop='14px';btn.textContent=(quizIndex===quizTotal-1)?'Lihat Hasil →':'Soal Berikutnya →';
 btn.onclick=()=>{quizIndex++;renderQuizProgress();renderQuizQuestion()};document.getElementById('quiz-body').appendChild(btn);
}
updateUI();
</script>
