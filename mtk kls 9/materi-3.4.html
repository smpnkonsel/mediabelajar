<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3.4 Penerapan Bangun Ruang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0A0F24;--line:rgba(255,255,255,.045);--line2:rgba(255,255,255,.14);--ink:#F3F5FC;--soft:#8D96B8;--white:#151B36;--white2:#1C2444;--coral:#FB923C;--coral-s:rgba(251,146,60,.14);--purple:#A78BFA;--teal:#2DD4BF;--teal-s:rgba(45,212,191,.14);--shadow:0 18px 40px -18px rgba(0,0,0,.65);--vh:1vh}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--paper);overflow:hidden;height:calc(var(--vh)*100);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:'JetBrains Mono',monospace}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border:2px solid var(--ink);position:relative;flex-shrink:0;transform:rotate(10deg)}
.brand-mark::after{content:"";position:absolute;inset:5px;border:2px solid var(--coral)}
.brand-text{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.brand-text b{color:var(--ink)}
.track{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--coral);width:0;transition:width .4s;border-radius:3px}
.cnt{font-size:10.5px;color:var(--soft);min-width:48px;text-align:right}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 7% 24px;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .4s,transform .4s;overflow-y:auto}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.inner{width:100%;max-width:960px;margin:auto;padding-block:6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);margin-bottom:12px}
.eyebrow::before{content:"";width:14px;height:1.5px;background:var(--coral)}
h1.big{font-size:clamp(28px,6vw,50px);line-height:1.05;font-weight:700;font-family:'Space Grotesk'}
h2{font-size:clamp(21px,4vw,30px);font-weight:700;line-height:1.15;margin-bottom:6px;font-family:'Space Grotesk'}
.sub{font-size:clamp(12.5px,2vw,14.5px);color:var(--soft);margin-bottom:18px;max-width:640px;line-height:1.55}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .eyebrow{justify-content:center}
.dim{display:inline-flex;gap:6px;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;background:var(--white);border:1.5px dashed var(--line2);padding:5px 10px;border-radius:100px}
.btn{font-family:'Space Grotesk';font-weight:600;font-size:14px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;min-height:44px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.b1{background:var(--ink);color:var(--white);box-shadow:var(--shadow)}
.b2{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.b3{background:var(--coral);color:#12121a}
.cta{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.cp-line{margin-top:18px;font-size:12.5px;color:var(--soft);max-width:560px;line-height:1.6;border-left:2px solid var(--coral);padding-left:14px;text-align:left}
.pill{font-family:'JetBrains Mono';font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:100px;border:1.5px solid;color:var(--teal);border-color:var(--teal);background:var(--teal-s)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cp-box{background:var(--white);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px;border-left:3px solid var(--teal)}
.cp-box b{color:var(--teal);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;font-family:'Space Grotesk'}
.cp-box p{font-size:13.5px;line-height:1.55}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--white);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.num{font-family:'JetBrains Mono';font-size:12px;font-weight:700;color:var(--coral);flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--coral-s);display:flex;align-items:center;justify-content:center}
.item p{font-size:13.5px;color:var(--soft);line-height:1.5;padding-top:3px}
.item p b{color:var(--ink)}
.tw{background:var(--white);border-radius:16px;padding:6px;box-shadow:var(--shadow);overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:420px}
th{font-family:'Space Grotesk';font-size:11.5px;text-transform:uppercase;color:var(--soft);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line2)}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line)}
tr:last-child td{border:none}
td:first-child{font-weight:600;font-family:'Space Grotesk'}
td.f{font-family:'JetBrains Mono';color:var(--coral);font-size:12.5px}
.prob{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start}
.pic{background:radial-gradient(circle at 50% 42%,#3b3a9e,#0d1130 80%);border:1.5px solid var(--line2);border-radius:16px;padding:12px;text-align:center}
.pic svg{width:100%;max-height:230px}
.pic small{display:block;color:#c9ccff;font-size:11px;margin-top:4px}
.prob details{background:var(--white);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--soft);line-height:1.6}
.prob summary{cursor:pointer;color:var(--teal);font-weight:600}
.prob details p{margin:4px 0}
.prob details b{color:var(--ink)}
.prob h4{font-family:'Space Grotesk';font-size:13px;color:var(--coral);margin:12px 0 4px}
.tag{display:inline-block;font:700 10.5px 'JetBrains Mono';color:#12121a;background:var(--purple);padding:3px 9px;border-radius:100px;margin-bottom:8px}
.quiz{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;min-height:320px;display:flex;flex-direction:column}
.qp{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;font:11.5px 'JetBrains Mono';color:var(--soft)}
.qb{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qf{height:100%;background:var(--coral);width:0;transition:width .4s}
#qs{color:var(--teal);font-weight:600}
.qt{font:600 17px 'Space Grotesk';margin-bottom:16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font:500 13.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:10px;min-height:46px}
.opt:hover{border-color:var(--soft)}
.opt i{font:700 11px 'JetBrains Mono';width:22px;height:22px;border-radius:6px;background:var(--white2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);font-style:normal}
.opt.ok{background:var(--teal-s);border-color:var(--teal)}.opt.ok i{background:var(--teal);color:#12121a}
.opt.no{background:var(--coral-s);border-color:var(--coral)}.opt.no i{background:var(--coral);color:#12121a}
.opt.off{pointer-events:none}
.fb{margin-top:12px;font-size:12.5px;color:var(--soft);background:var(--paper);border-left:3px solid var(--purple);padding:10px 14px;border-radius:8px;display:none;line-height:1.5}
.fb.show{display:block}
.qn{margin-top:14px;display:flex;justify-content:flex-end}
#res{display:none;text-align:center;flex-direction:column;align-items:center;justify-content:center;flex:1}
#res.show{display:flex}
.rs{font:700 46px 'Space Grotesk'}
.rs span{font-size:19px;color:var(--soft);font-weight:500}
.rm{font-size:13px;color:var(--soft);margin:10px 0 20px;max-width:380px}
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px 16px;flex-shrink:0}
.nav{background:var(--white);color:var(--ink);border:1.5px solid var(--line2);border-radius:10px;padding:10px 16px;font:600 13px 'Space Grotesk';cursor:pointer;min-height:44px}
.nav:hover{border-color:var(--ink)}
.nav:disabled{opacity:.35;pointer-events:none}
.nav.p{background:var(--ink);color:var(--paper)}
.sl{font-size:10.5px;color:var(--soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl b{color:var(--ink)}
@media(max-width:760px){.prob{grid-template-columns:1fr}.brand-text{display:none}.slide{padding:10px 5.5% 18px}.nav .l{display:none}.qt{font-size:15.5px}}
</style>
</head>
<body>
<div class="topbar"><div class="brand-mark"></div><div class="brand-text"><b>Matematika</b> · Bab 3 Bangun Ruang</div><div class="track"><div class="fill" id="pf"></div></div><div class="cnt mono" id="cnt"></div></div>
<main id="main"></main>
<div class="bottombar"><button class="nav" id="pv" onclick="goTo(cur-1)">← <span class="l">Sebelumnya</span></button><div class="sl" id="sl"></div><button class="nav p" id="nx" onclick="goTo(cur+1)"><span class="l">Selanjutnya</span> →</button></div>

<script>
const $=id=>document.getElementById(id);
function setVh(){document.documentElement.style.setProperty('--vh',innerHeight*.01+'px')}setVh();addEventListener('resize',setVh);

/* ===== Gambar benda nyata (SVG) ===== */
const T=(x,y,s,c='#fff',a='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="11" font-weight="700" font-family="JetBrains Mono,monospace" text-anchor="${a}">${s}</text>`;
const box=(w,d,h,o={})=>`<svg viewBox="0 0 230 165">
${o.water?`<polygon points="22,92 142,92 142,142 22,142" fill="#2DD4BF" opacity=".5"/><polygon points="142,92 192,67 192,117 142,142" fill="#2DD4BF" opacity=".35"/>`:''}
<polygon points="22,62 142,62 142,142 22,142" fill="${o.c||'#c4955a'}" opacity="${o.water?.25:.95}" stroke="#fff" stroke-width="2"/>
<polygon points="142,62 192,37 192,117 142,142" fill="${o.c||'#a77b44'}" opacity="${o.water?.2:.9}" stroke="#fff" stroke-width="2"/>
<polygon points="22,62 72,37 192,37 142,62" fill="${o.c||'#e0b576'}" opacity="${o.open?.15:.95}" stroke="#fff" stroke-width="2" ${o.open?'stroke-dasharray="5 3"':''}/>
${o.tape?'<polygon points="72,37 92,37 42,62 22,62" fill="none"/><rect x="72" y="62" width="22" height="80" fill="#e9d8a8" opacity=".7"/>':''}
${o.q?T(82,108,o.q,'#ffd60a'):''}${T(82,158,w)}${T(176,146,d,'#fff','start')}${T(198,82,h,'#fff','start')}</svg>`;
const cyl=(d,t,o={})=>`<svg viewBox="0 0 230 165"><rect x="55" y="40" width="120" height="90" fill="${o.c||'#8fa3b8'}"/>
${o.band?`<rect x="55" y="70" width="120" height="30" fill="${o.band}"/>`:''}
<ellipse cx="115" cy="130" rx="60" ry="16" fill="${o.c||'#8fa3b8'}" stroke="#fff" stroke-width="2"/><rect x="55" y="40" width="120" height="90" fill="${o.c||'#8fa3b8'}"/>
<line x1="55" y1="40" x2="55" y2="130" stroke="#fff" stroke-width="2"/><line x1="175" y1="40" x2="175" y2="130" stroke="#fff" stroke-width="2"/>
<ellipse cx="115" cy="40" rx="60" ry="16" fill="#d6dde6" stroke="#fff" stroke-width="2"/>${o.q?T(115,108,o.q,'#ffd60a'):''}${T(115,43,d,'#0a0f24')}${T(185,90,t,'#fff','start')}</svg>`;
const roket=`<svg viewBox="0 0 230 175"><polygon points="115,8 70,70 160,70" fill="#FB923C" stroke="#fff" stroke-width="2" transform="translate(0,0)"/>
<ellipse cx="115" cy="70" rx="55" ry="12" fill="#FB923C" stroke="#fff" stroke-width="2"/>
<rect x="60" y="70" width="110" height="65" fill="#A78BFA"/><line x1="60" y1="70" x2="60" y2="135" stroke="#fff" stroke-width="2"/><line x1="170" y1="70" x2="170" y2="135" stroke="#fff" stroke-width="2"/>
<ellipse cx="115" cy="135" rx="55" ry="12" fill="#A78BFA" stroke="#fff" stroke-width="2"/><polygon points="115,8 60,70 170,70" fill="#FB923C" stroke="#fff" stroke-width="2" opacity=".0"/>
<circle cx="115" cy="100" r="13" fill="#2DD4BF" stroke="#fff" stroke-width="2"/>${T(180,42,'t = 24 cm','#fff','start')}${T(180,108,'t = 10 cm','#fff','start')}${T(115,160,'r = 7 cm')}</svg>`;
const pair=`<svg viewBox="0 0 230 165"><g transform="scale(.62) translate(-6,60)">${box('10 cm','10 cm','10 cm',{tape:1}).replace(/<svg[^>]*>|<\/svg>/g,'')}</g><g transform="translate(120,0)"><rect x="12" y="50" width="76" height="70" fill="#d94f4f"/><rect x="12" y="72" width="76" height="22" fill="#f6f2e6"/><ellipse cx="50" cy="120" rx="38" ry="10" fill="#d94f4f" stroke="#fff" stroke-width="2"/><rect x="12" y="50" width="76" height="70" fill="#d94f4f"/><rect x="12" y="72" width="76" height="22" fill="#f6f2e6"/><ellipse cx="50" cy="50" rx="38" ry="10" fill="#d6dde6" stroke="#fff" stroke-width="2"/>${T(50,53,'d=10','#0a0f24')}${T(94,90,'t=10','#fff','start')}</g>${T(40,152,'Kardus')}${T(170,152,'Kaleng')}</svg>`;

/* ===== Slide soal dengan gambar ===== */
const prob=(ey,ti,sub,svg,cap,soal,jw,tag)=>`<div class="inner"><div class="eyebrow">${ey}</div><h2>${ti}</h2><p class="sub">${sub}</p><div class="prob"><div class="pic">${svg}<small>${cap}</small></div><div>${tag?'<span class="tag">HOTS</span>':''}<div class="cp-box"><b>Soal</b><p>${soal}</p></div><details><summary>Lihat penyelesaian</summary>${jw}</details></div></div></div>`;
const S=[];
S.push(`<div class="inner center"><div class="eyebrow">Bab 3 · 3.4 · Fase D</div><h1 class="big">Penerapan Bangun Ruang</h1><p class="sub" style="margin:14px auto 0">Menyelesaikan masalah nyata tentang luas permukaan dan volume, termasuk bangun ruang gabungan dan soal HOTS.</p><div class="cp-line"><b>Capaian Pembelajaran:</b> Peserta didik mampu menyelesaikan masalah kontekstual yang berkaitan dengan luas permukaan dan volume bangun ruang.</div><div class="cta"><button class="btn b1" onclick="goTo(1)">Mulai Belajar →</button><span class="dim">↔ 10 slide</span></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">3.4 Penerapan</div><div class="head"><h2 style="margin:0">Tujuan Pembelajaran</h2><span class="pill">3.4</span></div><div class="list">
<div class="item"><div class="num">1</div><p>Menyelesaikan masalah kehidupan sehari-hari yang melibatkan bangun ruang.</p></div>
<div class="item"><div class="num">2</div><p>Menentukan ukuran yang belum diketahui (rusuk, tinggi, jari-jari) dari luas permukaan atau volume yang diketahui.</p></div>
<div class="item"><div class="num">3</div><p>Menghitung luas permukaan dan volume dalam konteks nyata.</p></div>
<div class="item"><div class="num">4</div><p>Menghitung luas permukaan dan volume bangun ruang gabungan.</p></div>
<div class="item"><div class="num">5</div><p>Menyelesaikan soal HOTS yang menuntut penalaran dan perbandingan.</p></div></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">Strategi</div><h2>Langkah Menyelesaikan Masalah Nyata</h2><p class="sub">Gunakan empat langkah ini pada setiap soal cerita bangun ruang.</p><div class="list">
<div class="item"><div class="num">1</div><p><b>Pahami soal.</b> Bangun apa? Apa yang diketahui dan ditanyakan? Samakan satuan.</p></div>
<div class="item"><div class="num">2</div><p><b>Tentukan yang dicari.</b> Bahan, cat, atau kain berarti luas permukaan. Isi, kapasitas, atau air berarti volume.</p></div>
<div class="item"><div class="num">3</div><p><b>Pilih rumus</b> lalu hitung. Jika ada ukuran yang belum diketahui, balik rumusnya.</p></div>
<div class="item"><div class="num">4</div><p><b>Periksa.</b> Satuan sudah benar? Jawaban masuk akal? Ingat 1 liter = 1.000 cm³ = 1 dm³.</p></div></div>
<div class="tw"><table><thead><tr><th>Bangun</th><th>Luas permukaan</th><th>Volume</th></tr></thead><tbody>
<tr><td>Kubus</td><td class="f">6s²</td><td class="f">s³</td></tr>
<tr><td>Balok</td><td class="f">2(pl + pt + lt)</td><td class="f">p × l × t</td></tr>
<tr><td>Tabung</td><td class="f">2πr(r + t)</td><td class="f">πr²t</td></tr>
<tr><td>Kerucut</td><td class="f">πr(r + s)</td><td class="f">⅓πr²t</td></tr>
<tr><td>Bola</td><td class="f">4πr²</td><td class="f">⁴⁄₃πr³</td></tr></tbody></table></div></div>`);
S.push(prob('Luas permukaan dalam konteks nyata','Akuarium Tanpa Tutup','Banyak benda tidak memiliki semua sisinya. Hitung hanya sisi yang ada.',box('80 cm','40 cm','50 cm',{water:1,open:1,c:'#7fd8ff'}),'Akuarium kaca berbentuk balok, bagian atas terbuka (ilustrasi)',
'Pak Rudi membuat akuarium kaca berbentuk balok berukuran 80 cm × 40 cm × 50 cm, tanpa tutup. a) Berapa cm² kaca yang dibutuhkan? b) Jika kaca Rp150 per 100 cm², berapa biaya kacanya?',
'<p>Sisi yang ada: 1 alas + 2 sisi depan/belakang + 2 sisi samping.</p><p>Alas = 80 × 40 = 3.200</p><p>Depan + belakang = 2 × (80 × 50) = 8.000</p><p>Samping = 2 × (40 × 50) = 4.000</p><p>a) Luas = <b>15.200 cm²</b></p><p>b) Biaya = 15.200 ÷ 100 × Rp150 = <b>Rp22.800</b></p>'));
S.push(prob('Volume dalam konteks nyata','Drum Penampung Air','Volume menunjukkan kapasitas. Ubah satuan sebelum menjawab.',cyl('d = 70 cm','t = 100 cm',{c:'#2f6fb5',band:'#e8eef7'}),'Drum air berbentuk tabung (ilustrasi)',
'Sebuah drum berbentuk tabung berdiameter 70 cm dan tinggi 100 cm (π = 22/7). a) Berapa liter kapasitas drum? b) Air penuh dipindah ke jeriken 35 liter. Berapa jeriken yang terisi?',
'<p>d = 70 maka r = 35 cm</p><p>V = (22/7) × 35 × 35 × 100 = 22 × 5 × 35 × 100 = 385.000 cm³</p><p>a) 385.000 cm³ ÷ 1.000 = <b>385 liter</b></p><p>b) 385 ÷ 35 = <b>11 jeriken</b></p>'));
S.push(prob('Menentukan ukuran yang belum diketahui','Mencari Tinggi dan Jari-jari','Jika volume diketahui, balik rumusnya untuk mencari ukuran yang hilang.',box('4 m','3 m','t = ?',{q:'24 m³',c:'#5aa6d6'}),'Kolam renang berbentuk balok (ilustrasi)',
'a) Sebuah kolam balok berukuran panjang 4 m, lebar 3 m, bervolume 24 m³. Berapa kedalamannya? b) Kaleng tabung bervolume 1.540 cm³ dan jari-jari 7 cm. Berapa tingginya? (π = 22/7)',
'<h4>a) Kolam</h4><p>V = p × l × t maka t = 24 ÷ (4 × 3) = <b>2 m</b></p><h4>b) Kaleng</h4><p>V = πr²t maka t = 1.540 ÷ ((22/7) × 49) = 1.540 ÷ 154 = <b>10 cm</b></p><h4>Kubus?</h4><p>Jika LP = 150 cm², maka 6s² = 150, s² = 25, s = <b>5 cm</b></p>'));
S.push(prob('Bangun ruang gabungan','Roket Mainan (Tabung + Kerucut)','Pisahkan bangun gabungan menjadi bagian-bagian, lalu jumlahkan. Sisi yang menempel tidak dihitung.',roket,'Roket mainan: badan tabung, atap kerucut (ilustrasi)',
'Roket mainan terdiri dari tabung (r = 7 cm, t = 10 cm) dan kerucut di atasnya (r = 7 cm, t = 24 cm). π = 22/7. a) Berapa volume roket? b) Berapa luas permukaan roket yang dicat?',
'<p>Volume tabung = (22/7) × 49 × 10 = 1.540</p><p>Volume kerucut = ⅓ × 154 × 24 = 1.232</p><p>a) Volume = <b>2.772 cm³</b></p><p>s = √(7² + 24²) = √625 = 25 cm</p><p>Selimut kerucut = (22/7) × 7 × 25 = 550</p><p>Selimut tabung = 2 × (22/7) × 7 × 10 = 440</p><p>Alas tabung = 22/7 × 49 = 154 (tutup tabung dan alas kerucut tertutup)</p><p>b) LP = 550 + 440 + 154 = <b>1.144 cm²</b></p>'));
S.push(`<div class="inner"><div class="eyebrow">Soal HOTS · Penalaran tingkat tinggi</div><h2>Tantangan HOTS</h2><p class="sub">Coba selesaikan sendiri dulu, lalu buka penyelesaiannya.</p>
<div class="prob"><div class="pic">${pair}<small>Kemasan susu: kardus kubus vs kaleng tabung (ilustrasi)</small></div><div><span class="tag">HOTS 1</span><div class="cp-box"><b>Kardus atau kaleng?</b><p>Kardus kubus rusuk 10 cm dan kaleng tabung diameter 10 cm, tinggi 10 cm (π = 3,14). Budi berkata, "Kaleng lebih hemat bahan karena luas permukaannya lebih kecil." Benarkah?</p></div><details><summary>Lihat penyelesaian</summary><p>LP kardus = 6 × 10² = 600 cm²; V kardus = 1.000 cm³</p><p>LP kaleng = 2 × 3,14 × 5 × 15 = 471 cm²; V kaleng = 3,14 × 25 × 10 = 785 cm³</p><p>Bahan per isi: kardus 600/1.000 = 0,6; kaleng 471/785 = 0,6.</p><p><b>Pernyataan Budi kurang tepat.</b> LP kaleng memang lebih kecil, tetapi isinya juga lebih kecil. Per cm³ isi, bahannya sama.</p></details></div></div>
<div class="list" style="margin-top:14px"><div class="cp-box" style="margin:0"><span class="tag">HOTS 2</span><p>Akuarium 80 × 40 × 50 cm berisi air setinggi 30 cm. Sebuah batu dimasukkan sampai tenggelam dan tinggi air naik menjadi 32 cm. Berapa volume batu?</p><details style="margin-top:8px;font-size:13px;color:var(--soft)"><summary style="cursor:pointer;color:var(--teal);font-weight:600">Lihat penyelesaian</summary><p>Volume batu = volume air yang naik = 80 × 40 × 2 = <b style="color:var(--ink)">6.400 cm³</b></p></details></div>
<div class="cp-box" style="margin:0"><span class="tag">HOTS 3</span><p>Air dari drum 385 liter dituang seluruhnya ke bak balok berukuran alas 70 cm × 50 cm. Berapa tinggi air dalam bak, dan cukupkah bak setinggi 100 cm?</p><details style="margin-top:8px;font-size:13px;color:var(--soft)"><summary style="cursor:pointer;color:var(--teal);font-weight:600">Lihat penyelesaian</summary><p>385 liter = 385.000 cm³. Tinggi = 385.000 ÷ (70 × 50) = 385.000 ÷ 3.500 = <b style="color:var(--ink)">110 cm</b>. Karena 110 > 100, bak <b style="color:var(--ink)">tidak cukup</b> (air meluap 10 cm).</p></details></div></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">Latihan</div><h2>Uji Pemahamanmu</h2><p class="sub">5 soal pilihan ganda seputar penerapan bangun ruang.</p><div class="quiz"><div id="play"><div class="qp"><span id="qn">Soal 1/5</span><div class="qb"><div class="qf" id="qf"></div></div><span id="qs">Skor: 0</span></div><div class="qt" id="qt"></div><div class="opts" id="qo"></div><div class="fb" id="fb"></div><div class="qn"><button class="btn b1" id="qx" onclick="nextQ()" style="display:none">Lanjut →</button></div></div>
<div id="res"><div class="rs"><span id="rsn" style="font-size:46px;color:var(--ink);font-weight:700">0</span><span>/5 benar</span></div><div class="rm" id="rm"></div><div class="cta" style="margin:0"><button class="btn b2" onclick="restartQ()">Ulangi Kuis</button><button class="btn b3" onclick="goTo(9)">Lanjut ke Penutup →</button></div></div></div></div>`);
S.push(`<div class="inner center"><div class="eyebrow">Ringkasan</div><h2>Kerja Bagus! 🎉</h2><p class="sub" style="margin:0 auto 16px">Kamu sudah bisa menerapkan bangun ruang pada masalah nyata:</p><div class="list" style="width:100%;max-width:560px;text-align:left;margin-bottom:22px"><div class="item"><div class="num">LP</div><p>Bahan, cat, atau kain: hitung hanya sisi yang ada.</p></div><div class="item"><div class="num">V</div><p>Kapasitas atau isi: ubah satuan ke liter bila perlu.</p></div><div class="item"><div class="num">+</div><p>Bangun gabungan: pisahkan, hitung, lalu jumlahkan. Sisi yang menempel dikurangi.</p></div></div><button class="btn b1" onclick="location.href='bab3.html'">✓ Selesai — Kembali ke Bab 3</button></div>`);
const names=["Sampul","Tujuan","Strategi","Luas Permukaan","Volume","Ukuran Tak Diketahui","Bangun Gabungan","Soal HOTS","Kuis","Penutup"];
$('main').innerHTML=S.map((h,i)=>`<section class="slide" id="s${i}">${h}</section>`).join('');
let cur=0;
function goTo(i){if(i<0||i>=S.length)return;$('s'+cur).classList.remove('active');cur=i;$('s'+cur).classList.add('active');
$('cnt').textContent=String(cur+1).padStart(2,'0')+'/'+String(S.length).padStart(2,'0');$('pf').style.width=(cur+1)/S.length*100+'%';
$('sl').innerHTML=`${cur+1}/${S.length} · <b>${names[cur]}</b>`;$('pv').disabled=!cur;$('nx').disabled=cur===S.length-1}
/* kuis */
const Q=[
{q:"Bak mandi berbentuk kubus dengan rusuk 80 cm. Berapa liter kapasitasnya?",o:["64 liter","384 liter","512 liter","640 liter"],c:2,e:"V = 80³ = 512.000 cm³ = 512 liter."},
{q:"Volume balok 120 cm³, panjang 6 cm, lebar 5 cm. Berapa tingginya?",o:["2 cm","3 cm","4 cm","5 cm"],c:2,e:"t = 120 ÷ (6 × 5) = 4 cm."},
{q:"Label kaleng (selimut tabung) dengan r = 7 cm, t = 10 cm. Berapa luasnya? (π = 22/7)",o:["220 cm²","440 cm²","1.540 cm²","308 cm²"],c:1,e:"Selimut = 2πrt = 2 × 22/7 × 7 × 10 = 440 cm²."},
{q:"Kolam balok 5 m × 4 m × 2 m diisi air sebanyak ¾ volumenya. Berapa m³ airnya?",o:["20 m³","30 m³","32 m³","40 m³"],c:1,e:"V = 40 m³, maka ¾ × 40 = 30 m³."},
{q:"Dua kubus rusuk 4 cm ditempelkan sehingga membentuk balok 8 × 4 × 4 cm. Berapa luas permukaannya?",o:["192 cm²","160 cm²","128 cm²","96 cm²"],c:1,e:"LP balok = 2(32 + 32 + 16) = 160 cm². Bukan 2 × 96 = 192, karena dua sisi yang menempel tidak dihitung."}];
let qi=0,sc=0,ans=false;
function rq(){ans=false;const it=Q[qi];$('qn').textContent=`Soal ${qi+1}/${Q.length}`;$('qs').textContent='Skor: '+sc;$('qf').style.width=qi/Q.length*100+'%';$('qt').textContent=it.q;$('fb').classList.remove('show');$('qx').style.display='none';
const w=$('qo');w.innerHTML='';it.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<i>${'ABCD'[i]}</i><span>${t}</span>`;b.onclick=()=>pick(i);w.appendChild(b)})}
function pick(i){if(ans)return;ans=true;const it=Q[qi],ok=i===it.c;if(ok)sc++;
document.querySelectorAll('#qo .opt').forEach((el,k)=>{el.classList.add('off');if(k===it.c)el.classList.add('ok');else if(k===i)el.classList.add('no')});
$('fb').textContent=(ok?'Benar! ':'Belum tepat. ')+it.e;$('fb').classList.add('show');$('qs').textContent='Skor: '+sc;$('qx').textContent=qi<Q.length-1?'Lanjut →':'Lihat Hasil →';$('qx').style.display='inline-block'}
function nextQ(){if(qi<Q.length-1){qi++;rq()}else{$('qf').style.width='100%';$('play').style.display='none';$('res').classList.add('show');$('rsn').textContent=sc;
$('rm').textContent=sc===Q.length?'Sempurna! Kamu menguasai penerapan bangun ruang.':sc>=3?'Bagus! Sedikit lagi kamu menguasainya.':'Ayo coba lagi dan pelajari kembali contoh soalnya.'}}
function restartQ(){qi=0;sc=0;$('res').classList.remove('show');$('play').style.display='block';rq()}
rq();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goTo(cur+1);if(e.key==='ArrowLeft')goTo(cur-1)});
goTo(0);
</script>
</body>
