<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5.8 Penerapan dan Pemecahan Masalah Persamaan Garis Lurus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0A0F24;--line:rgba(255,255,255,.045);--line2:rgba(255,255,255,.14);--ink:#F3F5FC;--soft:#8D96B8;--white:#151B36;--white2:#1C2444;--coral:#FB923C;--coral-s:rgba(251,146,60,.14);--purple:#A78BFA;--teal:#2DD4BF;--teal-s:rgba(45,212,191,.14);--shadow:0 18px 40px -18px rgba(0,0,0,.65);--vh:1vh}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--paper);overflow:hidden;height:calc(var(--vh)*100);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border:2px solid var(--ink);position:relative;flex-shrink:0;transform:rotate(10deg)}
.brand-mark::after{content:"";position:absolute;inset:5px;border:2px solid var(--coral)}
.brand-text{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.brand-text b{color:var(--ink)}
.track{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--coral);width:0;transition:width .4s;border-radius:3px}
.cnt{font:10.5px 'JetBrains Mono';color:var(--soft);min-width:48px;text-align:right}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 7% 24px;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .4s,transform .4s;overflow-y:auto}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.inner{width:100%;max-width:960px;margin:auto;padding-block:6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);margin-bottom:12px}
.eyebrow::before{content:"";width:14px;height:1.5px;background:var(--coral)}
h1.big{font-size:clamp(28px,6vw,50px);line-height:1.05;font-weight:700;font-family:'Space Grotesk'}
h2{font-size:clamp(21px,4vw,30px);font-weight:700;line-height:1.15;margin-bottom:6px;font-family:'Space Grotesk'}
.sub{font-size:clamp(12.5px,2vw,14.5px);color:var(--soft);margin-bottom:18px;max-width:640px;line-height:1.55}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .eyebrow{justify-content:center}
.dim{display:inline-flex;gap:6px;font:600 11.5px 'JetBrains Mono';background:var(--white);border:1.5px dashed var(--line2);padding:5px 10px;border-radius:100px}
.btn{font:600 14px 'Space Grotesk';padding:12px 20px;border-radius:10px;border:none;cursor:pointer;min-height:44px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.b1{background:var(--ink);color:var(--white);box-shadow:var(--shadow)}
.b2{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.b3{background:var(--coral);color:#12121a}
.cta{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.cp-line{margin-top:18px;font-size:12.5px;color:var(--soft);max-width:560px;line-height:1.6;border-left:2px solid var(--coral);padding-left:14px;text-align:left}
.pill{font:700 11.5px 'JetBrains Mono';padding:6px 12px;border-radius:100px;border:1.5px solid var(--teal);color:var(--teal);background:var(--teal-s)}
.tag{display:inline-block;font:700 10.5px 'JetBrains Mono';color:#12121a;background:var(--purple);padding:3px 9px;border-radius:100px;margin-bottom:8px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cp-box{background:var(--white);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px;border-left:3px solid var(--teal)}
.cp-box b{color:var(--teal);font:700 11px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px}
.cp-box p{font-size:13.5px;line-height:1.55}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--white);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.num{font:700 12px 'JetBrains Mono';color:var(--coral);flex-shrink:0;min-width:26px;height:26px;padding:0 4px;border-radius:8px;background:var(--coral-s);display:flex;align-items:center;justify-content:center}
.item p{font-size:13.5px;color:var(--soft);line-height:1.5;padding-top:3px}
.item p b{color:var(--ink)}
.formula{background:var(--white);border:1.5px solid var(--coral);border-radius:16px;padding:14px;text-align:center;font:600 21px 'Space Grotesk';box-shadow:var(--shadow);margin-bottom:12px}
.tw{background:var(--white);border-radius:12px;padding:4px;overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;min-width:260px}
th,td{padding:7px 10px;font:600 12.5px 'JetBrains Mono';text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--coral);text-align:left}
tr:last-child th,tr:last-child td{border:none}
.prob{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start}
.pic{background:radial-gradient(circle at 50% 42%,#3b3a9e,#0d1130 80%);border:1.5px solid var(--line2);border-radius:16px;padding:10px;text-align:center}
.pic svg{width:100%;max-height:300px}
.pic small{display:block;color:#c9ccff;font-size:11px;margin-top:2px}
details{background:var(--white);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--soft);line-height:1.7}
summary{cursor:pointer;color:var(--teal);font-weight:600}
details p{margin:4px 0}details b{color:var(--ink)}
.sl{display:grid;gap:6px;margin-bottom:10px}
.sl label{font:600 12px 'JetBrains Mono';color:var(--soft);display:flex;align-items:center;gap:8px}
.sl input{flex:1;accent-color:var(--coral)}
.sl b{color:var(--ink);min-width:34px;text-align:right}
.out{background:var(--white);border-radius:14px;padding:12px 16px;font:600 13px 'JetBrains Mono';line-height:1.8;box-shadow:var(--shadow)}
.out .r{color:var(--coral);font-size:16px}
.quiz{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;min-height:320px;display:flex;flex-direction:column}
.qp{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;font:11.5px 'JetBrains Mono';color:var(--soft)}
.qb{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qf{height:100%;background:var(--coral);width:0;transition:width .4s}
#qs{color:var(--teal);font-weight:600}
.qt{font:600 17px 'Space Grotesk';margin-bottom:16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font:500 13.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:10px;min-height:46px}
.opt:hover{border-color:var(--soft)}
.opt i{font:700 11px 'JetBrains Mono';width:22px;height:22px;border-radius:6px;background:var(--white2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);font-style:normal}
.opt.ok{background:var(--teal-s);border-color:var(--teal)}.opt.ok i{background:var(--teal);color:#12121a}
.opt.no{background:var(--coral-s);border-color:var(--coral)}.opt.no i{background:var(--coral);color:#12121a}
.opt.off{pointer-events:none}
.fb{margin-top:12px;font-size:12.5px;color:var(--soft);background:var(--paper);border-left:3px solid var(--purple);padding:10px 14px;border-radius:8px;display:none;line-height:1.5}
.fb.show{display:block}
.qn{margin-top:14px;display:flex;justify-content:flex-end}
#res{display:none;text-align:center;flex-direction:column;align-items:center;justify-content:center;flex:1}
#res.show{display:flex}
.rs{font:700 46px 'Space Grotesk'}.rs span{font-size:19px;color:var(--soft);font-weight:500}
.rm{font-size:13px;color:var(--soft);margin:10px 0 20px;max-width:380px}
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px 16px;flex-shrink:0}
.nav{background:var(--white);color:var(--ink);border:1.5px solid var(--line2);border-radius:10px;padding:10px 16px;font:600 13px 'Space Grotesk';cursor:pointer;min-height:44px}
.nav:hover{border-color:var(--ink)}.nav:disabled{opacity:.35;pointer-events:none}.nav.p{background:var(--ink);color:var(--paper)}
.sn{font-size:10.5px;color:var(--soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sn b{color:var(--ink)}
@media(max-width:760px){.prob{grid-template-columns:1fr}.brand-text{display:none}.slide{padding:10px 5.5% 18px}.nav .l{display:none}.qt{font-size:15.5px}.formula{font-size:17px}}
</style>
</head>
<body>
<div class="topbar"><div class="brand-mark"></div><div class="brand-text"><b>Matematika</b> · Bab 5 Persamaan Linear</div><div class="track"><div class="fill" id="pf"></div></div><div class="cnt" id="cnt"></div></div>
<main id="main"></main>
<div class="bottombar"><button class="nav" id="pv" onclick="goTo(cur-1)">← <span class="l">Sebelumnya</span></button><div class="sn" id="sn"></div><button class="nav p" id="nx" onclick="goTo(cur+1)"><span class="l">Selanjutnya</span> →</button></div>

<script>
const $=id=>document.getElementById(id);
function setVh(){document.documentElement.style.setProperty('--vh',innerHeight*.01+'px')}setVh();addEventListener('resize',setVh);

/* ===== Grafik konteks nyata (sumbu berskala) ===== */
const COL=['#FB923C','#2DD4BF','#A78BFA'];
const tx=(x,y,s,c='#fff',a='middle',z=9)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${z}" font-weight="700" font-family="JetBrains Mono,monospace" text-anchor="${a}" stroke="#0d1130" stroke-width="3" paint-order="stroke">${s}</text>`;
const f=n=>(Math.round(n*100)/100<0?'−':'')+String(Math.abs(Math.round(n*100)/100)).replace('.',',');
const eq=(m,c)=>'y = '+(m===0?'':m===1?'x':m===-1?'−x':f(m)+'x')+(m===0?f(c):c>0?' + '+f(c):c<0?' − '+f(-c):'');
function GR(o){
 const L0=40,R=230,T=14,B=176,sx=x=>L0+x/o.xm*(R-L0),sy=y=>B-y/o.ym*(B-T);let s='<svg viewBox="0 0 240 214">';
 for(let i=0;i<=5;i++){const x=o.xm*i/5,y=o.ym*i/5;
  s+=`<line x1="${sx(x)}" y1="${T}" x2="${sx(x)}" y2="${B}" stroke="#fff" stroke-opacity=".12"/><line x1="${L0}" y1="${sy(y)}" x2="${R}" y2="${sy(y)}" stroke="#fff" stroke-opacity=".12"/>`;
  s+=tx(sx(x),B+12,f(x),'#9fa6d8')+tx(L0-4,sy(y)+3,f(y),'#9fa6d8','end')}
 s+=`<line x1="${L0}" y1="${B}" x2="${R}" y2="${B}" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><line x1="${L0}" y1="${T}" x2="${L0}" y2="${B}" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/>`;
 s+=tx((L0+R)/2,B+27,o.xt,'#c9ccff')+tx(L0,9,o.yt,'#c9ccff','start');
 o.L.forEach((l,i)=>{const[m,c]=l;let lo=0,hi=o.xm;
  if(m>0){lo=Math.max(lo,-c/m);hi=Math.min(hi,(o.ym-c)/m)}else if(m<0){lo=Math.max(lo,(o.ym-c)/m);hi=Math.min(hi,-c/m)}
  if(lo<hi)s+=`<line x1="${sx(lo)}" y1="${sy(m*lo+c)}" x2="${sx(hi)}" y2="${sy(m*hi+c)}" stroke="${COL[i]}" stroke-width="2.5"/>`});
 (o.P||[]).forEach(p=>{const r=p[0]>o.xm*.65;s+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4.5" fill="#ffd60a" stroke="#000" stroke-width="1.2"/>`+tx(sx(p[0])+(r?-7:7),sy(p[1])+(p[1]>o.ym*.85?14:-8),p[2]||`(${f(p[0])}, ${f(p[1])})`,'#fff',r?'end':'start')});
 (o.G||[]).forEach((g,i)=>s+=tx(L0+8,T+13+12*i,g,COL[i],'start'));
 return s+'</svg>'}
const prob=(ey,ti,sub,svg,cap,body)=>`<div class="inner"><div class="eyebrow">${ey}</div><h2>${ti}</h2><p class="sub">${sub}</p><div class="prob"><div class="pic">${svg}<small>${cap}</small></div><div>${body}</div></div></div>`;
const box=(t,p)=>`<div class="cp-box"><b>${t}</b><p>${p}</p></div>`;
const det=h=>`<details><summary>Lihat penyelesaian</summary>${h}</details>`;
const gap='<div style="height:10px"></div>';
const item=(n,t)=>`<div class="item"><div class="num">${n}</div><p>${t}</p></div>`;

const S=[];
S.push(`<div class="inner center"><div class="eyebrow">Bab 5 · 5.8 · Fase D</div><h1 class="big">Penerapan dan Pemecahan Masalah Persamaan Garis Lurus</h1><p class="sub" style="margin:14px auto 0">Memodelkan biaya, tarif, dan jarak dengan persamaan garis, lalu menafsirkan grafiknya.</p><div class="cp-line"><b>Capaian Pembelajaran:</b> Peserta didik mampu menyelesaikan masalah kontekstual yang berkaitan dengan persamaan garis lurus.</div><div class="cta"><button class="btn b1" onclick="goTo(1)">Mulai Belajar →</button><span class="dim">↔ 15 slide</span></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">5.8 Penerapan</div><div class="head"><h2 style="margin:0">Tujuan Pembelajaran</h2><span class="pill">5.8</span></div><div class="list">
${item(1,'Menyatakan hubungan biaya tetap dan biaya per barang, serta tarif per jarak, dalam persamaan garis.')}
${item(2,'Menyatakan hubungan waktu dan jarak pada kecepatan tetap.')}
${item(3,'Menentukan persamaan dari data atau tabel, dan menyelesaikan masalah dengan gradien.')}
${item(4,'Menafsirkan grafik dalam konteks nyata.')}
${item(5,'Menyelesaikan soal pemecahan masalah dan HOTS yang menggabungkan tabel, grafik, dan persamaan.')}</div></div>`);
S.push(`<div class="inner"><div class="eyebrow">Model linear</div><h2>Persamaan Garis dalam Kehidupan Sehari-hari</h2><p class="sub">Banyak hubungan dua besaran berpola garis lurus: perubahan tetap untuk setiap kenaikan satu satuan.</p><div class="formula">y = mx + c</div><div class="list">
${item('m','<b>Laju perubahan</b>: tambahan y untuk setiap tambahan 1 satuan x (harga per barang, tarif per km, kecepatan).')}
${item('c','<b>Nilai awal</b>: nilai y saat x = 0 (biaya tetap, tarif dasar, jarak awal). Pada grafik, ini titik potong sumbu-y.')}
${item('x, y','<b>Variabel</b>: x biasanya besaran yang kita pilih (jumlah, jarak, waktu), y hasilnya (biaya, jarak).')}</div>
<div class="cp-box" style="margin-top:14px"><b>Strategi</b><p>1) Tentukan x dan y. 2) Cari m (laju) dan c (nilai awal). 3) Tulis y = mx + c. 4) Gunakan untuk menjawab, lalu periksa satuannya.</p></div></div>`);
S.push(prob('Biaya tetap dan biaya per barang','Biaya Produksi','Total biaya = biaya tetap + (biaya per barang × jumlah barang).',GR({xm:50,ym:500,xt:'Jumlah barang (x)',yt:'Biaya (ribu Rp)',L:[[5,200]],P:[[0,200],[20,300],[50,450]]}),'Grafik y = 5x + 200',
box('Soal','Sebuah usaha memiliki biaya tetap Rp200.000 (sewa dan listrik) dan biaya Rp5.000 untuk setiap barang. Misal x jumlah barang dan y biaya total (ribu rupiah). a) Tulis persamaannya. b) Biaya untuk 30 barang. c) Berapa barang jika biaya total Rp450.000?')+det(`<p>a) c = 200 (biaya tetap), m = 5. <b>y = 5x + 200</b></p><p>b) y = 5(30) + 200 = <b>350</b>, yaitu Rp350.000</p><p>c) 450 = 5x + 200, maka 5x = 250 dan x = <b>50 barang</b></p>`)));
S.push(prob('Tarif perjalanan','Tarif Taksi Berdasarkan Jarak','Tarif dasar dibayar di awal, lalu ditambah tarif per kilometer.',GR({xm:15,ym:70,xt:'Jarak (km)',yt:'Tarif (ribu Rp)',L:[[4,8]],P:[[0,8],[10,48],[13,60]]}),'Grafik y = 4x + 8',
box('Soal','Tarif dasar taksi Rp8.000 dan tarif Rp4.000 per km. Misal x jarak (km) dan y tarif (ribu rupiah). a) Tentukan persamaannya. b) Tarif untuk 10 km. c) Berapa km yang bisa ditempuh dengan Rp60.000?')+det(`<p>a) c = 8, m = 4. <b>y = 4x + 8</b></p><p>b) y = 4(10) + 8 = <b>48</b>, yaitu Rp48.000</p><p>c) 60 = 4x + 8, maka 4x = 52 dan x = <b>13 km</b></p>`)+gap+item('?','Titik (0, 8) pada grafik berarti tarif dasar Rp8.000 saat jarak 0 km.')));
S.push(prob('Waktu dan jarak','Kecepatan Tetap','Pada kecepatan tetap, grafik jarak terhadap waktu berupa garis lurus. Gradiennya adalah kecepatan.',GR({xm:5,ym:350,xt:'Waktu sejak 08.00 (jam)',yt:'Jarak dari kota A (km)',L:[[60,30]],P:[[0,30],[3,210],[4,270]]}),'Grafik y = 60x + 30',
box('Soal','Pukul 08.00 sebuah mobil sudah berjarak 30 km dari kota A dan melaju 60 km/jam menjauhi kota A. Misal x waktu sejak 08.00 (jam) dan y jarak dari kota A (km). a) Tentukan persamaannya. b) Jarak pada pukul 11.00. c) Pukul berapa mobil berjarak 270 km?')+det(`<p>a) m = 60 (kecepatan), c = 30 (jarak awal). <b>y = 60x + 30</b></p><p>b) Pukul 11.00 berarti x = 3. y = 60(3) + 30 = <b>210 km</b></p><p>c) 270 = 60x + 30, maka x = 4. Pukul <b>12.00</b></p>`)));
S.push(prob('Dari data atau tabel','Menentukan Persamaan dari Tabel','Hitung gradien dari dua baris data, lalu cari c dari nilai x = 0 atau dengan substitusi.',GR({xm:10,ym:40,xt:'Umur tanaman (hari)',yt:'Tinggi (cm)',L:[[3,5]],P:[[0,5],[2,11],[4,17],[6,23]]}),'Titik data tinggi tanaman membentuk garis lurus',
box('Soal','Tinggi tanaman (y, cm) pada hari ke-x ditunjukkan tabel berikut. Tentukan persamaannya dan prediksikan tinggi pada hari ke-10.')+`<div class="tw"><table><tr><th>x (hari)</th><td>0</td><td>2</td><td>4</td><td>6</td></tr><tr><th>y (cm)</th><td>5</td><td>11</td><td>17</td><td>23</td></tr></table></div>`+det(`<p>m = (11 − 5) ÷ (2 − 0) = <b>3</b> cm/hari. Cek: (23 − 17) ÷ (6 − 4) = 3.</p><p>Saat x = 0, y = 5, jadi c = <b>5</b>.</p><p>Persamaan: <b>y = 3x + 5</b></p><p>Hari ke-10: y = 3(10) + 5 = <b>35 cm</b></p>`)));
S.push(prob('Menyelesaikan dengan gradien','Dua Data, Cari Laju dan Persamaan','Jika hanya dua data yang diketahui, gradien adalah perubahan y dibagi perubahan x.',GR({xm:6,ym:100,xt:'Waktu (menit)',yt:'Volume air (liter)',L:[[15,10]],P:[[0,10],[2,40],[5,85]]}),'Pengisian tangki air',
box('Soal','Air mengisi tangki dengan laju tetap. Setelah 2 menit volumenya 40 liter, dan setelah 5 menit volumenya 85 liter. a) Berapa laju pengisian? b) Tentukan persamaan volume. c) Berapa volume awal? d) Setelah berapa menit tangki berisi 100 liter?')+det(`<p>a) m = (85 − 40) ÷ (5 − 2) = 45 ÷ 3 = <b>15 liter/menit</b></p><p>b) y − 40 = 15(x − 2) = 15x − 30, maka <b>y = 15x + 10</b></p><p>c) Volume awal c = <b>10 liter</b></p><p>d) 100 = 15x + 10, maka x = <b>6 menit</b></p>`)));
S.push(prob('Menafsirkan grafik','Membandingkan Dua Penyedia Jasa','Titik potong dua garis menunjukkan kapan kedua nilai sama.',GR({xm:8,ym:80,xt:'Lama sewa (jam)',yt:'Biaya (ribu Rp)',L:[[5,20],[10,0]],G:['A: y = 5x + 20','B: y = 10x'],P:[[4,40]]}),'Rental A memiliki biaya tetap, rental B tanpa biaya tetap',
box('Soal','Grafik menunjukkan biaya sewa dua rental alat (ribu rupiah). a) Apa arti titik (0, 20) pada garis A? b) Mana yang lebih murah untuk 6 jam? c) Apa arti titik potong (4, 40)? d) Rental mana yang lebih hemat untuk sewa lama?')+det(`<p>a) Biaya tetap A, yaitu Rp20.000, dibayar walau belum dipakai.</p><p>b) A: 5(6) + 20 = 50. B: 10(6) = 60. <b>A lebih murah</b> (Rp50.000 vs Rp60.000).</p><p>c) Pada 4 jam, biaya keduanya sama: <b>Rp40.000</b>.</p><p>d) Setelah 4 jam, garis A di bawah garis B, jadi <b>A lebih hemat</b> untuk sewa lama.</p>`)));
S.push(`<div class="inner"><div class="eyebrow">Eksplorasi</div><h2>Model Biaya Interaktif</h2><p class="sub">Atur biaya tetap, biaya per barang, dan jumlah barang untuk melihat total biayanya.</p><div class="prob"><div class="pic" id="gp"></div><div><div class="sl" id="sli"></div><div class="out" id="out"></div></div></div></div>`);
S.push(prob('Pemecahan masalah','Soal Kontekstual: Gradien Negatif','Tidak semua garis naik. Jika nilai berkurang tetap per satuan waktu, gradiennya negatif.',GR({xm:8,ym:20,xt:'Waktu menyala (jam)',yt:'Tinggi lilin (cm)',L:[[-2.5,20]],P:[[0,20],[3,12.5],[8,0]]}),'Grafik y = −2,5x + 20',
box('Soal 1 · Lilin','Lilin setinggi 20 cm terbakar 2,5 cm setiap jam. Tentukan persamaan tinggi lilin, tinggi setelah 3 jam, dan lama lilin habis.')+det(`<p>m = −2,5 (berkurang), c = 20. <b>y = −2,5x + 20</b></p><p>3 jam: y = −2,5(3) + 20 = <b>12,5 cm</b></p><p>Habis: y = 0, maka x = 20 ÷ 2,5 = <b>8 jam</b></p>`)+gap+box('Soal 2 · Bensin','Tangki mobil berisi 40 liter. Setiap menempuh 100 km, bensin terpakai 8 liter. Misal x jarak (ratusan km) dan y sisa bensin (liter). Tentukan persamaan, sisa setelah 300 km, dan jarak maksimum.')+det(`<p><b>y = −8x + 40</b></p><p>300 km berarti x = 3: y = −24 + 40 = <b>16 liter</b></p><p>Habis: x = 40 ÷ 8 = 5, yaitu <b>500 km</b></p>`)));
S.push(prob('Soal HOTS 1 · Tabel + grafik + persamaan','Memilih Toko Kue','Gabungkan tiga representasi berbeda untuk mengambil keputusan.',GR({xm:20,ym:160,xt:'Banyak kue (x)',yt:'Biaya (ribu Rp)',L:[[7,20]],G:['Toko B'],P:[[0,20],[10,90]]}),'Grafik biaya Toko B melalui (0, 20) dan (10, 90)',
`<span class="tag">HOTS 1</span>`+box('Soal','Toko A: biaya (ribu rupiah) untuk x kue ditunjukkan tabel. Toko B: biaya ditunjukkan grafik. Tentukan persamaan keduanya, banyak kue saat biaya sama, dan toko termurah untuk 20 kue.')+`<div class="tw"><table><tr><th>x (kue)</th><td>0</td><td>10</td><td>20</td><td>30</td></tr><tr><th>Toko A</th><td>50</td><td>100</td><td>150</td><td>200</td></tr></table></div>`+det(`<p><b>Toko A:</b> m = (100 − 50) ÷ 10 = 5, c = 50, jadi y = 5x + 50</p><p><b>Toko B:</b> m = (90 − 20) ÷ 10 = 7, c = 20, jadi y = 7x + 20</p><p><b>Biaya sama:</b> 5x + 50 = 7x + 20, maka 2x = 30 dan x = <b>15 kue</b> (biaya Rp125.000)</p><p><b>20 kue:</b> A = 150, B = 160. <b>Toko A lebih murah</b> Rp10.000.</p>`)));
S.push(prob('Soal HOTS 2 · Grafik jarak-waktu','Menyusul di Perjalanan','Baca gradien dari grafik, susun persamaan, lalu cari titik potongnya.',GR({xm:5,ym:250,xt:'Waktu sejak pukul 07.00 (jam)',yt:'Jarak (km)',L:[[40,0],[60,-60]],G:['Ani','Budi (berangkat pukul 08.00)'],P:[[3,120]]}),'Ani dan Budi menempuh rute yang sama',
`<span class="tag">HOTS 2</span>`+box('Soal','Ani berangkat pukul 07.00 dengan kecepatan tetap. Budi berangkat 1 jam kemudian dengan kecepatan lebih tinggi. Tentukan a) kecepatan masing-masing, b) persamaan jarak keduanya, c) pukul berapa dan di jarak berapa Budi menyusul Ani, d) selisih jarak mereka pada pukul 11.00.')+det(`<p>a) Ani: 40 km/jam. Budi: 60 km/jam (gradien masing-masing garis).</p><p>b) Ani: <b>y = 40x</b>. Budi mulai di x = 1: y = 60(x − 1) = <b>60x − 60</b></p><p>c) 40x = 60x − 60, maka x = 3. Pukul <b>10.00</b>, jarak <b>120 km</b></p><p>d) Pukul 11.00 (x = 4): Ani 160 km, Budi 180 km. Selisih <b>20 km</b>, Budi di depan.</p>`)));
S.push(`<div class="inner"><div class="eyebrow">Latihan</div><h2>Uji Pemahamanmu</h2><p class="sub">6 soal penerapan persamaan garis lurus.</p><div class="quiz"><div id="play"><div class="qp"><span id="qn">Soal 1/6</span><div class="qb"><div class="qf" id="qf"></div></div><span id="qs">Skor: 0</span></div><div class="qt" id="qt"></div><div class="opts" id="qo"></div><div class="fb" id="fb"></div><div class="qn"><button class="btn b1" id="qx" onclick="nextQ()" style="display:none">Lanjut →</button></div></div>
<div id="res"><div class="rs"><span id="rsn" style="font-size:46px;color:var(--ink);font-weight:700">0</span><span>/6 benar</span></div><div class="rm" id="rm"></div><div class="cta" style="margin:0"><button class="btn b2" onclick="restartQ()">Ulangi</button><button class="btn b3" onclick="goTo(14)">Lanjut ke Penutup →</button></div></div></div></div>`);
S.push(`<div class="inner center"><div class="eyebrow">Ringkasan</div><h2>Kerja Bagus! 🎉</h2><p class="sub" style="margin:0 auto 16px">Ringkasan penerapan persamaan garis lurus:</p><div class="list" style="width:100%;max-width:560px;text-align:left;margin-bottom:22px">${item('m','Gradien adalah laju: harga per barang, tarif per km, atau kecepatan.')}${item('c','Konstanta c adalah nilai awal: biaya tetap, tarif dasar, atau jarak awal.')}${item('∩','Titik potong dua garis menunjukkan saat dua nilai sama; bandingkan untuk mengambil keputusan.')}</div><button class="btn b1" onclick="location.href='bab5.html'">✓ Selesai — Kembali ke Bab 5</button></div>`);
const names=["Sampul","Tujuan","Model Linear","Biaya","Tarif","Kecepatan","Tabel","Gradien","Tafsir Grafik","Eksplorasi","Kontekstual","HOTS 1","HOTS 2","Kuis","Penutup"];
$('main').innerHTML=S.map((h,i)=>`<section class="slide" id="s${i}">${h}</section>`).join('');
let cur=0;
function goTo(i){if(i<0||i>=S.length)return;$('s'+cur).classList.remove('active');cur=i;$('s'+cur).classList.add('active');
$('cnt').textContent=String(cur+1).padStart(2,'0')+'/'+String(S.length).padStart(2,'0');$('pf').style.width=(cur+1)/S.length*100+'%';
$('sn').innerHTML=`${cur+1}/${S.length} · <b>${names[cur]}</b>`;$('pv').disabled=!cur;$('nx').disabled=cur===S.length-1}

/* eksplorasi */
const V={c:20,m:5,x:10},LB={c:'Biaya tetap (c)',m:'Per barang (m)',x:'Jumlah (x)'},RG={c:[0,50,5],m:[1,10,1],x:[0,20,1]};
$('sli').innerHTML=Object.keys(V).map(k=>`<label style="flex-wrap:wrap">${LB[k]}<input type="range" min="${RG[k][0]}" max="${RG[k][1]}" step="${RG[k][2]}" value="${V[k]}" data-k="${k}"><b id="v${k}">${V[k]}</b></label>`).join('');
function upd(){const{c,m,x}=V,y=m*x+c,ym=Math.max(10,Math.ceil((c+m*20)/10)*10);
 $('gp').innerHTML=GR({xm:20,ym,xt:'Jumlah barang (x)',yt:'Biaya total (ribu Rp)',L:[[m,c]],P:[[x,y]]});
 $('out').innerHTML=`<span class="r">${eq(m,c)}</span><br>Untuk x = ${x}: y = ${m}(${x}) + ${c} = <span class="r">${y}</span><br>Biaya total Rp${(y*1000).toLocaleString('id-ID')}<br>Biaya tetap Rp${(c*1000).toLocaleString('id-ID')}, biaya variabel Rp${(m*x*1000).toLocaleString('id-ID')}`}
document.querySelectorAll('#sli input').forEach(i=>i.oninput=()=>{V[i.dataset.k]=+i.value;$('v'+i.dataset.k).textContent=i.value;upd()});upd();

/* kuis */
const Q=[
{q:"Biaya tetap Rp50.000 dan Rp3.000 per barang. Biaya total untuk 20 barang adalah...",o:["Rp60.000","Rp110.000","Rp120.000","Rp170.000"],c:1,e:"y = 3x + 50 (ribu). Untuk x = 20: y = 60 + 50 = 110, yaitu Rp110.000."},
{q:"Tarif dasar taksi Rp8.000 dan Rp4.000 per km. Tarif untuk 14 km adalah...",o:["Rp56.000","Rp64.000","Rp60.000","Rp72.000"],c:1,e:"y = 4(14) + 8 = 64, yaitu Rp64.000."},
{q:"Pada y = 60x + 30 (y jarak dalam km, x waktu dalam jam), angka 30 menyatakan...",o:["kecepatan mobil","jarak awal saat x = 0","waktu tempuh","jarak total"],c:1,e:"c adalah nilai y saat x = 0, yaitu jarak awal 30 km."},
{q:"Tabel: x = 0, 1, 2, 3 dan y = 4, 7, 10, 13. Persamaannya adalah...",o:["y = 3x + 4","y = 4x + 3","y = 3x + 7","y = x + 4"],c:0,e:"m = (7 − 4) ÷ (1 − 0) = 3 dan c = 4 (nilai y saat x = 0)."},
{q:"Lilin setinggi 20 cm berkurang 2,5 cm setiap jam. Lilin habis setelah...",o:["5 jam","6 jam","8 jam","10 jam"],c:2,e:"y = −2,5x + 20. Habis saat y = 0, x = 20 ÷ 2,5 = 8."},
{q:"HOTS: Rental A: y = 5x + 20 dan rental B: y = 10x (y dalam ribu rupiah). Biaya keduanya sama pada x = ...",o:["2","4","5","20"],c:1,e:"5x + 20 = 10x, maka 5x = 20 dan x = 4."}];
let qi=0,sc=0,ans=false;
function rq(){ans=false;const it=Q[qi];$('qn').textContent=`Soal ${qi+1}/${Q.length}`;$('qs').textContent='Skor: '+sc;$('qf').style.width=qi/Q.length*100+'%';$('qt').textContent=it.q;$('fb').classList.remove('show');$('qx').style.display='none';
const w=$('qo');w.innerHTML='';it.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<i>${'ABCD'[i]}</i><span>${t}</span>`;b.onclick=()=>pick(i);w.appendChild(b)})}
function pick(i){if(ans)return;ans=true;const it=Q[qi],ok=i===it.c;if(ok)sc++;
document.querySelectorAll('#qo .opt').forEach((e,k)=>{e.classList.add('off');if(k===it.c)e.classList.add('ok');else if(k===i)e.classList.add('no')});
$('fb').textContent=(ok?'Benar! ':'Belum tepat. ')+it.e;$('fb').classList.add('show');$('qs').textContent='Skor: '+sc;$('qx').textContent=qi<Q.length-1?'Lanjut →':'Lihat Hasil →';$('qx').style.display='inline-block'}
function nextQ(){if(qi<Q.length-1){qi++;rq()}else{$('qf').style.width='100%';$('play').style.display='none';$('res').classList.add('show');$('rsn').textContent=sc;
$('rm').textContent=sc===Q.length?'Sempurna! Kamu menguasai penerapan persamaan garis.':sc>=4?'Bagus! Sedikit lagi kamu menguasainya.':'Ayo coba lagi dan pelajari kembali contoh soalnya.'}}
function restartQ(){qi=0;sc=0;$('res').classList.remove('show');$('play').style.display='block';rq()}
rq();
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')goTo(cur+1);if(e.key==='ArrowLeft')goTo(cur-1)});
goTo(0);
