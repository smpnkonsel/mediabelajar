<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Evaluasi Bab 5 — Persamaan Garis Lurus</title>
<style>
:root{
  --primary:#4f46e5;--primary2:#7c3aed;--success:#16a34a;--danger:#dc2626;
  --warning:#f59e0b;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;
  --line:#e5e7eb;--soft:#eef2ff;--shadow:0 18px 50px rgba(30,41,59,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding:18px}
.shell{width:min(1100px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 10px 24px rgba(79,70,229,.25)}
.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.badge{padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:700;border:1px solid #c7d2fe}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.cover{padding:42px;text-align:center;overflow:hidden;position:relative}
.cover:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(79,70,229,.09);top:-130px;right:-80px}
.cover:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(124,58,237,.07);bottom:-120px;left:-80px}
.cover>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#eef2ff;color:var(--primary);font-weight:800;font-size:12px;letter-spacing:.04em}
.cover h2{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:18px auto 10px;max-width:850px}
.cover .lead{max-width:720px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.7}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px auto;max-width:800px}
.meta{padding:16px;border:1px solid var(--line);border-radius:18px;background:#fafbff}
.meta strong{display:block;font-size:18px}.meta span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;font-weight:800;transition:.2s transform,.2s box-shadow,.2s opacity}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 22px rgba(79,70,229,.22)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn-success{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
.btn-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.hidden{display:none!important}
.exam{padding:20px}
.exam-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:14px}
.exam-title{font-size:18px;font-weight:850}.exam-sub{font-size:13px;color:var(--muted);margin-top:4px}
.progress-wrap{margin:10px 0 16px}.progress-line{height:9px;background:#e9edf5;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .3s ease}
.progress-info{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:7px}
.question-nav{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 10px;scrollbar-width:thin}
.qnum{flex:0 0 auto;width:38px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800}
.qnum.active{background:var(--primary);color:#fff;border-color:var(--primary)}.qnum.correct{background:#ecfdf3;color:#15803d;border-color:#86efac}.qnum.wrong{background:#fef2f2;color:#b91c1c;border-color:#fca5a5}
.question-card{padding:26px;margin-top:8px}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.q-tag{font-size:12px;font-weight:800;color:var(--primary);background:#eef2ff;border:1px solid #c7d2fe;padding:7px 10px;border-radius:999px}
.level{font-size:12px;color:var(--muted)}
.question{font-size:clamp(18px,2.3vw,25px);line-height:1.55;font-weight:750;margin:0 0 20px}
.options{display:grid;gap:11px}.option{width:100%;text-align:left;padding:15px 16px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--text);display:flex;gap:12px;align-items:flex-start;transition:.18s}
.option:hover:not(:disabled){border-color:#a5b4fc;background:#f8faff}.option:disabled{cursor:default}
.option-letter{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f1f5f9;font-weight:900;flex:0 0 auto}
.option.correct{border-color:#86efac;background:#f0fdf4}.option.correct .option-letter{background:#22c55e;color:#fff}
.option.wrong{border-color:#fca5a5;background:#fef2f2}.option.wrong .option-letter{background:#ef4444;color:#fff}
.feedback{margin-top:17px;padding:16px;border-radius:16px;line-height:1.65;border:1px solid}.feedback.correct{background:#f0fdf4;border-color:#bbf7d0}.feedback.wrong{background:#fef2f2;border-color:#fecaca}
.feedback strong{display:block;margin-bottom:5px}.discussion{color:#334155}
.nav-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.essay-intro{padding:34px;text-align:center}.essay-intro h2{margin:0 0 10px}.essay-intro p{color:var(--muted);line-height:1.7}
.essay-card{padding:26px}.textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:16px;padding:15px;outline:none;background:#fbfcff;color:var(--text);line-height:1.6}
.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 4px #eef2ff}
.save-note{font-size:12px;color:var(--muted);margin-top:8px}.score-box{margin-top:20px;padding:18px;border-radius:16px;background:#fafbff;border:1px solid var(--line)}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.score-input{width:100px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.result{padding:34px}.result-hero{text-align:center;padding:18px}.result-hero h2{margin:0}.big-score{font-size:clamp(60px,12vw,110px);line-height:1;font-weight:950;background:linear-gradient(135deg,var(--primary),var(--primary2));color:transparent;background-clip:text;-webkit-background-clip:text;margin:15px 0 5px}
.category{font-weight:900;color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:16px;text-align:center}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.section{margin-top:24px}.section h3{margin:0 0 12px;font-size:17px}
.analysis-item{padding:14px 0;border-bottom:1px solid var(--line)}.analysis-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:750;margin-bottom:8px}.bar{height:10px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px}
.recommend{padding:12px 14px;border-radius:13px;background:#fafbff;border:1px solid var(--line);margin-top:8px;color:#475569;font-size:13px}
.accordion{border:1px solid var(--line);border-radius:15px;margin-bottom:9px;overflow:hidden}.acc-head{width:100%;padding:15px;background:#fff;border:0;text-align:left;font-weight:800;display:flex;justify-content:space-between;gap:10px}.acc-body{display:none;padding:15px;background:#fafbff;border-top:1px solid var(--line);line-height:1.7;color:#475569}.accordion.open .acc-body{display:block}
.final-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}
.validation{padding:18px;border-radius:16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:14px}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#172033;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(360px,calc(100vw - 36px))}
@media(max-width:700px){
  .app{padding:10px}.topbar{align-items:flex-start}.brand h1{font-size:15px}.brand p{font-size:11px}.logo{width:40px;height:40px}
  .badge{font-size:10px;padding:7px 9px}.cover{padding:28px 18px;border-radius:20px}.meta-grid{grid-template-columns:1fr;gap:8px}.meta{padding:12px}
  .exam{padding:10px}.exam-head{grid-template-columns:1fr}.question-card,.essay-card,.result{padding:18px}.question{font-size:19px}.option{padding:13px}
  .nav-actions{position:sticky;bottom:8px;background:rgba(245,247,251,.94);padding-top:8px;z-index:5}.nav-actions .btn{flex:1}
  .stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.final-actions{grid-template-columns:1fr}
  .q-top{align-items:flex-start;flex-direction:column}.score-row{align-items:flex-start;flex-direction:column}.score-input{width:100%}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">∑</div>
        <div><h1>Evaluasi Pembelajaran</h1><p id="brandMeta"></p></div>
      </div>
      <div class="badge" id="chapterBadge"></div>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================
   DATA MATERI — SATU-SATUNYA KONFIGURASI
========================= */
const DATA_MATERI = {
  mataPelajaran: "Matematika",
  kelas: "Kelas VIII / Fase D",
  bab: "Bab 5 — Persamaan Garis Lurus",
  submateri: [
    "5.1 Konsep Persamaan Garis Lurus",
    "5.2 Gradien Garis Lurus",
    "5.3 Gradien Garis melalui Dua Titik",
    "5.4 Persamaan Garis dari Grafik",
    "5.5 Persamaan Garis dengan Gradien dan Titik",
    "5.6 Hubungan Dua Garis",
    "5.7 Grafik Persamaan Garis Lurus",
    "5.8 Penerapan dan Pemecahan Masalah Persamaan Garis Lurus"
  ],
  jumlahPG: 15,
  jumlahEsai: 5,
  nextBabUrl: "mat-bab6.html",
  dashboardUrl: "mat-bab5.html"
};

/* =========================
   DATA SOAL — DIBUAT SAAT HTML
========================= */
const questions = [
  {id:1,submateri:DATA_MATERI.submateri[0],level:"Pemahaman",question:"Manakah yang merupakan persamaan garis lurus?",options:["y = 2x + 3","y = x² + 2","y = 1/x","y = √x + 1"],answer:0,discussion:"Persamaan garis lurus dapat ditulis dalam bentuk y = mx + c. Pilihan y = 2x + 3 memiliki pangkat x satu."},
  {id:2,submateri:DATA_MATERI.submateri[0],level:"Penerapan",question:"Jika suatu garis ditulis y = 3x − 5, berapakah nilai y ketika x = 4?",options:["5","7","12","17"],answer:1,discussion:"Substitusikan x = 4: y = 3(4) − 5 = 12 − 5 = 7."},
  {id:3,submateri:DATA_MATERI.submateri[1],level:"Pemahaman",question:"Pada persamaan y = −2x + 7, nilai gradien garis adalah ...",options:["−7","−2","2","7"],answer:1,discussion:"Pada bentuk y = mx + c, m adalah gradien. Jadi dari y = −2x + 7 diperoleh m = −2."},
  {id:4,submateri:DATA_MATERI.submateri[1],level:"Penerapan",question:"Sebuah garis memiliki perubahan y sebesar 6 ketika x bertambah 3. Gradien garis tersebut adalah ...",options:["−2","1/2","2","3"],answer:2,discussion:"Gradien m = perubahan y / perubahan x = 6/3 = 2."},
  {id:5,submateri:DATA_MATERI.submateri[2],level:"Analisis",question:"Gradien garis yang melalui titik A(2, 3) dan B(6, 11) adalah ...",options:["1","2","3","4"],answer:1,discussion:"m = (11 − 3)/(6 − 2) = 8/4 = 2."},
  {id:6,submateri:DATA_MATERI.submateri[2],level:"Penerapan",question:"Garis melalui P(−1, 4) dan Q(3, −4). Gradiennya adalah ...",options:["−2","−1/2","1/2","2"],answer:0,discussion:"m = (−4 − 4)/(3 − (−1)) = −8/4 = −2."},
  {id:7,submateri:DATA_MATERI.submateri[3],level:"Analisis",question:"Sebuah garis pada grafik melalui titik (0, 2) dan (4, 10). Persamaan garisnya adalah ...",options:["y = 2x + 2","y = 2x − 2","y = 4x + 2","y = x + 2"],answer:0,discussion:"Gradien = (10−2)/(4−0)=2. Karena memotong sumbu-y di 2, persamaannya y = 2x + 2."},
  {id:8,submateri:DATA_MATERI.submateri[3],level:"HOTS",question:"Pada grafik, sebuah garis memotong sumbu-y di −3 dan melalui titik (2, 5). Persamaan garis tersebut adalah ...",options:["y = 2x − 3","y = 3x − 2","y = 4x − 3","y = 4x + 3"],answer:2,discussion:"Gradien m = (5 − (−3))/(2 − 0) = 8/2 = 4. Dengan intersep −3, persamaan y = 4x − 3."},
  {id:9,submateri:DATA_MATERI.submateri[4],level:"Penerapan",question:"Persamaan garis dengan gradien 3 yang melalui titik (2, 5) adalah ...",options:["y = 3x − 1","y = 3x + 1","y = 2x + 3","y = 3x + 5"],answer:0,discussion:"Gunakan y − y₁ = m(x − x₁): y − 5 = 3(x − 2), sehingga y = 3x − 1."},
  {id:10,submateri:DATA_MATERI.submateri[4],level:"Analisis",question:"Garis bergradien −2 melalui titik (3, 1). Nilai konstanta c pada y = −2x + c adalah ...",options:["−7","−5","5","7"],answer:3,discussion:"1 = −2(3) + c, sehingga 1 = −6 + c dan c = 7."},
  {id:11,submateri:DATA_MATERI.submateri[5],level:"Pemahaman",question:"Dua garis yang memiliki gradien sama dan berbeda titik potong sumbu-y disebut garis ...",options:["tegak lurus","sejajar","berimpit","vertikal"],answer:1,discussion:"Garis sejajar memiliki gradien yang sama. Jika titik potong sumbu-y berbeda, keduanya tidak berimpit."},
  {id:12,submateri:DATA_MATERI.submateri[5],level:"HOTS",question:"Jika sebuah garis memiliki gradien 2, gradien garis yang tegak lurus dengannya adalah ...",options:["2","−2","1/2","−1/2"],answer:3,discussion:"Untuk dua garis yang saling tegak lurus, hasil kali gradiennya −1. Jadi m₂ = −1/2."},
  {id:13,submateri:DATA_MATERI.submateri[6],level:"Penerapan",question:"Untuk menggambar y = 2x − 1, pasangan titik yang benar adalah ...",options:["(0,−1) dan (1,1)","(0,1) dan (1,1)","(−1,−1) dan (1,−1)","(0,−2) dan (1,0)"],answer:0,discussion:"Saat x=0, y=−1. Saat x=1, y=1. Kedua titik tersebut berada pada garis y = 2x − 1."},
  {id:14,submateri:DATA_MATERI.submateri[6],level:"Analisis",question:"Jika grafik sebuah garis naik dari kiri ke kanan, maka gradien garis tersebut ...",options:["negatif","nol","positif","tidak terdefinisi"],answer:2,discussion:"Garis yang naik dari kiri ke kanan memiliki perubahan y positif ketika x bertambah, sehingga gradiennya positif."},
  {id:15,submateri:DATA_MATERI.submateri[7],level:"HOTS",question:"Biaya suatu layanan terdiri atas biaya tetap Rp5.000 dan Rp2.000 untuk setiap unit. Jika x adalah banyak unit dan y total biaya, model linear yang tepat adalah ...",options:["y = 5.000x + 2.000","y = 2.000x + 5.000","y = 7.000x","y = 2.000x − 5.000"],answer:1,discussion:"Biaya per unit menjadi gradien 2.000, sedangkan biaya tetap menjadi konstanta 5.000. Jadi y = 2.000x + 5.000."}
];

const essayQuestions = [
  {id:1,submateri:DATA_MATERI.submateri[0],question:"Jelaskan dengan kata-katamu sendiri apa yang dimaksud dengan persamaan garis lurus dan tuliskan bentuk umumnya.",answerGuide:"Persamaan garis lurus menggambarkan hubungan linear antara x dan y. Salah satu bentuk umumnya adalah y = mx + c, dengan m sebagai gradien dan c sebagai titik potong sumbu-y.",maxScore:10},
  {id:2,submateri:DATA_MATERI.submateri[2],question:"Tentukan gradien garis yang melalui A(−2, 1) dan B(4, 13). Tunjukkan langkah perhitungannya.",answerGuide:"Gunakan m = (y₂−y₁)/(x₂−x₁). m = (13−1)/(4−(−2)) = 12/6 = 2.",maxScore:10},
  {id:3,submateri:DATA_MATERI.submateri[4],question:"Tentukan persamaan garis yang memiliki gradien −3 dan melalui titik (2, 7). Jelaskan langkahnya.",answerGuide:"Gunakan y−y₁=m(x−x₁). y−7=−3(x−2), sehingga y−7=−3x+6 dan y=−3x+13.",maxScore:10},
  {id:4,submateri:DATA_MATERI.submateri[5],question:"Jelaskan bagaimana cara menentukan apakah dua garis sejajar atau tegak lurus berdasarkan gradiennya.",answerGuide:"Dua garis sejajar jika gradiennya sama. Dua garis tegak lurus jika hasil kali kedua gradien sama dengan −1 (untuk gradien yang terdefinisi).",maxScore:10},
  {id:5,submateri:DATA_MATERI.submateri[7],question:"Sebuah taksi mengenakan tarif awal Rp10.000 dan Rp4.000 setiap kilometer. Buat model persamaan linear biaya y terhadap jarak x, lalu tentukan biaya untuk 6 km.",answerGuide:"Modelnya y = 4.000x + 10.000. Untuk x=6, y = 24.000 + 10.000 = Rp34.000.",maxScore:10}
];

/* =========================
   STATE
========================= */
let userAnswers = [];
let essayAnswers = [];
let essayScores = [];
let currentSlide = 0;
let mode = "cover";
let currentEssay = 0;

const DASHBOARD_URL = DATA_MATERI.dashboardUrl;
const NEXT_BAB_URL = DATA_MATERI.nextBabUrl;

const app = document.getElementById("app");
const toast = document.getElementById("toast");

document.getElementById("brandMeta").textContent = `${DATA_MATERI.mataPelajaran} • ${DATA_MATERI.kelas}`;
document.getElementById("chapterBadge").textContent = DATA_MATERI.bab;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.remove("hidden");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.add("hidden"),2600);
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function validateData(){
  const errors=[];
  if(questions.length !== DATA_MATERI.jumlahPG) errors.push(`Jumlah PG aktual ${questions.length}, seharusnya ${DATA_MATERI.jumlahPG}.`);
  if(essayQuestions.length !== DATA_MATERI.jumlahEsai) errors.push(`Jumlah esai aktual ${essayQuestions.length}, seharusnya ${DATA_MATERI.jumlahEsai}.`);
  questions.forEach((q,i)=>{
    if(!q.question || !q.submateri || !Array.isArray(q.options) || q.options.length!==4 || ![0,1,2,3].includes(q.answer) || !q.discussion)
      errors.push(`Data PG nomor ${i+1} tidak lengkap.`);
  });
  essayQuestions.forEach((q,i)=>{
    if(!q.question || !q.answerGuide || typeof q.maxScore!=="number") errors.push(`Data esai nomor ${i+1} tidak lengkap.`);
  });
  return errors;
}

function resetEvaluation(){
  userAnswers = Array(questions.length).fill(null);
  essayAnswers = Array(essayQuestions.length).fill("");
  essayScores = Array(essayQuestions.length).fill(null);
  currentSlide = 0;
  currentEssay = 0;
  mode = "cover";
  render();
}

function startEvaluation(){
  userAnswers = Array(questions.length).fill(null);
  essayAnswers = Array(essayQuestions.length).fill("");
  essayScores = Array(essayQuestions.length).fill(null);
  currentSlide = 0;
  mode = questions.length ? "pg" : (essayQuestions.length ? "essayIntro" : "result");
  render();
}

function answerPG(index){
  if(userAnswers[index] !== null) return;
  const selected = Number(document.querySelector(`input[name="q${index}"]:checked`)?.value);
  if(!Number.isInteger(selected)) return;
  userAnswers[index]=selected;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goPG(index){
  if(index<0 || index>=questions.length) return;
  if(userAnswers[index]===null && index>0){
    showToast("Jawab soal ini terlebih dahulu.");
    return;
  }
  currentSlide=index;
  mode="pg";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function nextPG(){
  if(currentSlide < questions.length-1){
    if(userAnswers[currentSlide]===null){showToast("Jawab soal ini terlebih dahulu.");return;}
    currentSlide++; render(); window.scrollTo({top:0,behavior:"smooth"});
  } else {
    if(userAnswers[currentSlide]===null){showToast("Jawab soal ini terlebih dahulu.");return;}
    mode = essayQuestions.length ? "essayIntro" : "result";
    render(); window.scrollTo({top:0,behavior:"smooth"});
  }
}

function prevPG(){
  if(currentSlide>0){currentSlide--;render();window.scrollTo({top:0,behavior:"smooth"});}
}

function startEssay(){
  currentEssay=0; mode="essay"; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function saveEssay(value){
  essayAnswers[currentEssay]=value;
}
function nextEssay(){
  if(currentEssay<essayQuestions.length-1){currentEssay++;render();window.scrollTo({top:0,behavior:"smooth"});}
  else { mode="result"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function prevEssay(){
  if(currentEssay>0){currentEssay--;render();window.scrollTo({top:0,behavior:"smooth"});}
}
function saveScore(i){
  const input=document.getElementById(`score-${i}`);
  const value=Number(input.value);
  if(!Number.isFinite(value) || value<0 || value>essayQuestions[i].maxScore){
    showToast(`Skor harus 0–${essayQuestions[i].maxScore}.`);
    return;
  }
  essayScores[i]=value;
  showToast("Skor esai tersimpan.");
  render();
}

function calculate(){
  const correct=userAnswers.filter((a,i)=>a===questions[i]?.answer).length;
  const nilaiPG=questions.length ? (correct/questions.length)*100 : 0;
  const totalEssay=essayScores.reduce((a,v)=>a+(Number.isFinite(v)?v:0),0);
  const maxEssay=essayQuestions.reduce((a,q)=>a+q.maxScore,0);
  const nilaiEsai=essayQuestions.length && maxEssay ? (totalEssay/maxEssay)*100 : 0;
  let nilaiAkhir=0;
  if(!questions.length && essayQuestions.length) nilaiAkhir=nilaiEsai;
  else if(questions.length && !essayQuestions.length) nilaiAkhir=nilaiPG;
  else if(questions.length && essayQuestions.length) nilaiAkhir=(nilaiPG*.70)+(nilaiEsai*.30);
  return {correct,nilaiPG,totalEssay,maxEssay,nilaiEsai,nilaiAkhir};
}
function category(score){
  if(score>=85)return "Sangat Baik";
  if(score>=70)return "Baik";
  if(score>=55)return "Cukup";
  return "Perlu Bimbingan";
}
function analysisText(score){
  if(score>=85)return "Pemahaman terhadap materi sudah sangat baik. Pertahankan hasil belajar dan lanjutkan ke materi berikutnya.";
  if(score>=70)return "Pemahaman terhadap materi sudah baik. Masih terdapat beberapa bagian yang perlu diperkuat melalui latihan.";
  if(score>=55)return "Beberapa konsep sudah dipahami. Pelajari kembali bagian yang masih kurang dan lakukan latihan tambahan.";
  return "Pemahaman materi masih perlu diperkuat. Pelajari kembali submateri yang belum dikuasai dan lakukan latihan ulang.";
}
function submateriStats(){
  return DATA_MATERI.submateri.map(sub=>{
    const qs=questions.map((q,i)=>({q,i})).filter(x=>x.q.submateri===sub);
    const correct=qs.filter(x=>userAnswers[x.i]===x.q.answer).length;
    return {sub,total:qs.length,correct,pct:qs.length?correct/qs.length*100:null};
  }).filter(x=>x.total>0);
}

function render(){
  const errors=validateData();
  if(errors.length){
    app.innerHTML=`<div class="card validation"><strong>Validasi data:</strong><ul>${errors.map(e=>`<li>${escapeHTML(e)}</li>`).join("")}</ul></div>`;
    return;
  }
  if(mode==="cover") renderCover();
  else if(mode==="pg") renderPG();
  else if(mode==="essayIntro") renderEssayIntro();
  else if(mode==="essay") renderEssay();
  else if(mode==="result") renderResult();
}

function renderCover(){
  app.innerHTML=`
  <section class="card cover">
    <span class="eyebrow">📈 ${escapeHTML(DATA_MATERI.bab)}</span>
    <h2>EVALUASI PEMBELAJARAN</h2>
    <p class="lead">Uji pemahamanmu tentang ${escapeHTML(DATA_MATERI.bab.replace(/^Bab\\s*5\\s*—\\s*/i,""))} melalui soal pilihan ganda dan esai.</p>
    <div class="meta-grid">
      <div class="meta"><strong>${escapeHTML(DATA_MATERI.mataPelajaran)}</strong><span>Mata Pelajaran</span></div>
      <div class="meta"><strong>${escapeHTML(DATA_MATERI.kelas)}</strong><span>Kelas / Fase</span></div>
      <div class="meta"><strong>${questions.length + essayQuestions.length}</strong><span>Total Soal</span></div>
    </div>
    <p style="color:var(--muted);font-size:13px">📝 ${questions.length} Pilihan Ganda &nbsp;•&nbsp; ✍️ ${essayQuestions.length} Esai</p>
    <button class="btn btn-primary" onclick="startEvaluation()">🚀 MULAI EVALUASI</button>
  </section>`;
}

function renderPG(){
  const q=questions[currentSlide];
  const answered=userAnswers[currentSlide]!==null;
  const selected=userAnswers[currentSlide];
  const pct=((currentSlide+1)/questions.length)*100;
  const nav=questions.map((x,i)=>{
    const cls=i===currentSlide?"active":userAnswers[i]===null?"":userAnswers[i]===x.answer?"correct":"wrong";
    return `<button class="qnum ${cls}" onclick="goPG(${i})">${String(i+1).padStart(2,"0")}</button>`;
  }).join("");
  const options=q.options.map((opt,i)=>{
    let cls="";
    if(answered && i===q.answer) cls="correct";
    if(answered && i===selected && selected!==q.answer) cls="wrong";
    return `<button class="option ${cls}" ${answered?"disabled":""} onclick="chooseAndAnswer(${currentSlide},${i})">
      <span class="option-letter">${"ABCD"[i]}</span><span>${escapeHTML(opt)}</span>
    </button>`;
  }).join("");
  let feedback="";
  if(answered){
    const ok=selected===q.answer;
    feedback=`<div class="feedback ${ok?"correct":"wrong"}">
      <strong>${ok?"✅ Benar":"❌ Kurang tepat"}</strong>
      ${ok?"Jawabanmu benar.":"Jawaban yang benar: <b>"+escapeHTML(q.options[q.answer])+"</b>."}
      <div class="discussion"><b>Pembahasan:</b> ${escapeHTML(q.discussion)}</div>
    </div>`;
  }
  app.innerHTML=`
  <section class="card exam">
    <div class="exam-head">
      <div><div class="exam-title">Pilihan Ganda</div><div class="exam-sub">${escapeHTML(DATA_MATERI.bab)}</div></div>
      <div class="badge">Soal ${currentSlide+1} / ${questions.length}</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-info"><span>Progress evaluasi</span><b>${Math.round(pct)}%</b></div>
      <div class="progress-line"><div class="progress-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="question-nav">${nav}</div>
    <article class="card question-card">
      <div class="q-top"><span class="q-tag">${escapeHTML(q.submateri)}</span><span class="level">${escapeHTML(q.level)}</span></div>
      <h2 class="question">${escapeHTML(q.question)}</h2>
      <div class="options">${options}</div>
      ${feedback}
      <div class="nav-actions">
        <button class="btn btn-secondary" ${currentSlide===0?"disabled":""} onclick="prevPG()">← Sebelumnya</button>
        <button class="btn btn-primary" onclick="nextPG()">${currentSlide===questions.length-1?"Lanjut ke Esai →":"Berikutnya →"}</button>
      </div>
    </article>
  </section>`;
}
function chooseAndAnswer(index,value){
  if(userAnswers[index]!==null)return;
  userAnswers[index]=value;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderEssayIntro(){
  app.innerHTML=`
  <section class="card essay-intro">
    <div style="font-size:54px">✍️</div>
    <h2>SOAL ESAI</h2>
    <p>Seluruh soal pilihan ganda telah selesai. Jawablah setiap soal esai dengan langkah dan alasan yang jelas. Jawaban tersimpan selama evaluasi berlangsung.</p>
    <div class="meta-grid" style="max-width:500px"><div class="meta"><strong>${essayQuestions.length}</strong><span>Soal Esai</span></div><div class="meta"><strong>${essayQuestions.length*10}</strong><span>Skor Maksimum</span></div></div>
    <button class="btn btn-primary" onclick="startEssay()">✍️ MULAI SOAL ESAI</button>
  </section>`;
}

function renderEssay(){
  const q=essayQuestions[currentEssay];
  const pct=((currentEssay+1)/essayQuestions.length)*100;
  app.innerHTML=`
  <section class="card exam">
    <div class="exam-head"><div><div class="exam-title">✍️ Soal Esai</div><div class="exam-sub">${escapeHTML(DATA_MATERI.bab)}</div></div><div class="badge">Esai ${currentEssay+1} / ${essayQuestions.length}</div></div>
    <div class="progress-wrap"><div class="progress-info"><span>Progress esai</span><b>${Math.round(pct)}%</b></div><div class="progress-line"><div class="progress-bar" style="width:${pct}%"></div></div></div>
    <article class="card essay-card">
      <div class="q-top"><span class="q-tag">${escapeHTML(q.submateri)}</span><span class="level">Skor maksimum: ${q.maxScore}</span></div>
      <h2 class="question">${escapeHTML(q.question)}</h2>
      <textarea class="textarea" placeholder="Tuliskan jawaban dan langkah penyelesaianmu..." oninput="saveEssay(this.value)">${escapeHTML(essayAnswers[currentEssay])}</textarea>
      <div class="save-note">✓ Jawaban tersimpan otomatis saat kamu mengetik.</div>
      <div class="nav-actions">
        <button class="btn btn-secondary" ${currentEssay===0?"disabled":""} onclick="prevEssay()">← Sebelumnya</button>
        <button class="btn btn-primary" onclick="nextEssay()">${currentEssay===essayQuestions.length-1?"Lihat Hasil →":"Berikutnya →"}</button>
      </div>
    </article>
  </section>`;
}

function renderResult(){
  const c=calculate();
  const stats=submateriStats();
  const rec=stats.map(s=>{
    const text=s.pct>=80?"Sudah dikuasai dengan baik.":s.pct>=60?"Perlu latihan tambahan.":"Disarankan mempelajari kembali submateri ini.";
    return `<div class="recommend"><b>${escapeHTML(s.sub)}</b><br>${text}</div>`;
  }).join("");
  const keyPG=questions.map((q,i)=>`
    <div class="accordion">
      <button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>Soal ${i+1} — ${escapeHTML(q.submateri)}</span><span>⌄</span></button>
      <div class="acc-body"><b>Kunci: ${"ABCD"[q.answer]}</b><br>${escapeHTML(q.question)}<br><br><b>Pembahasan:</b> ${escapeHTML(q.discussion)}</div>
    </div>`).join("");
  const keyEssay=essayQuestions.map((q,i)=>`
    <div class="accordion">
      <button class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>Esai ${i+1} — ${escapeHTML(q.submateri)}</span><span>⌄</span></button>
      <div class="acc-body"><b>Pedoman Jawaban:</b> ${escapeHTML(q.answerGuide)}<br><br><b>Skor:</b> ${essayScores[i]===null?"Belum dinilai":essayScores[i]+" / "+q.maxScore}</div>
    </div>`).join("");
  app.innerHTML=`
  <section class="card result">
    <div class="result-hero">
      <span class="eyebrow">🎯 HASIL EVALUASI</span>
      <h2>${escapeHTML(DATA_MATERI.bab)}</h2>
      <div class="big-score">${c.nilaiAkhir.toFixed(2)}</div>
      <div class="category">${category(c.nilaiAkhir)}</div>
      <p style="color:var(--muted)">${analysisText(c.nilaiAkhir)}</p>
    </div>
    <div class="stats">
      <div class="stat"><strong>${c.correct}</strong><span>Benar</span></div>
      <div class="stat"><strong>${questions.length-c.correct}</strong><span>Salah</span></div>
      <div class="stat"><strong>${c.nilaiPG.toFixed(2)}</strong><span>Nilai PG</span></div>
      <div class="stat"><strong>${c.nilaiEsai.toFixed(2)}</strong><span>Nilai Esai</span></div>
      <div class="stat"><strong>${c.nilaiAkhir.toFixed(2)}</strong><span>Nilai Akhir</span></div>
    </div>

    <div class="section">
      <h3>📊 Analisis Penguasaan Materi</h3>
      ${stats.map(s=>`<div class="analysis-item"><div class="analysis-head"><span>${escapeHTML(s.sub)}</span><span>${s.pct.toFixed(0)}%</span></div><div class="bar"><i style="width:${s.pct}%"></i></div></div>`).join("")}
    </div>

    <div class="section">
      <h3>💡 Rekomendasi Belajar</h3>${rec}
    </div>

    <div class="section">
      <h3>🔐 Kunci Jawaban & Pembahasan</h3>
      <p style="color:var(--muted);font-size:13px">Kunci ditampilkan setelah evaluasi selesai. Klik item untuk membuka pembahasan.</p>
      ${keyPG}${keyEssay}
    </div>

    <div class="section">
      <h3>🧑‍🏫 Penilaian Guru — Esai</h3>
      <p style="color:var(--muted);font-size:13px">Masukkan skor 0 sampai skor maksimum. Nilai akhir akan dihitung ulang setelah skor disimpan.</p>
      ${essayQuestions.map((q,i)=>`<div class="score-box">
        <div><b>Esai ${i+1}</b> — ${escapeHTML(q.submateri)}</div>
        <div class="score-row" style="margin-top:10px">
          <span>Skor maksimal: <b>${q.maxScore}</b></span>
          <div style="display:flex;gap:8px;align-items:center;width:min(250px,100%)"><input id="score-${i}" class="score-input" type="number" min="0" max="${q.maxScore}" step="1" value="${essayScores[i]??""}" placeholder="0"><button class="btn btn-success" onclick="saveScore(${i})">Simpan</button></div>
        </div>
      </div>`).join("")}
    </div>

    <div class="final-actions">
      <button class="btn btn-secondary" onclick="resetEvaluation()">🔄 ULANGI EVALUASI</button>
      <button class="btn btn-primary" onclick="goDashboard()">📚 KEMBALI KE DASHBOARD</button>
      <button class="btn btn-primary" onclick="goNextBab()">➡️ BAB BERIKUTNYA</button>
    </div>
  </section>`;
}

function goDashboard(){
  if(!DASHBOARD_URL){showToast("URL dashboard belum tersedia.");return;}
  window.location.href=DASHBOARD_URL;
}
function goNextBab(){
  if(!NEXT_BAB_URL){showToast("Bab berikutnya belum tersedia.");return;}
  window.location.href=NEXT_BAB_URL;
}

resetEvaluation();
</script>
</body>
</html>
