<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5.7 Grafik Persamaan Garis Lurus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0A0F24;--line:rgba(255,255,255,.045);--line2:rgba(255,255,255,.14);--ink:#F3F5FC;--soft:#8D96B8;--white:#151B36;--white2:#1C2444;--coral:#FB923C;--coral-s:rgba(251,146,60,.14);--purple:#A78BFA;--teal:#2DD4BF;--teal-s:rgba(45,212,191,.14);--shadow:0 18px 40px -18px rgba(0,0,0,.65);--vh:1vh}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--paper);overflow:hidden;height:calc(var(--vh)*100);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-shrink:0}
.brand-mark{width:26px;height:26px;border:2px solid var(--ink);position:relative;flex-shrink:0;transform:rotate(10deg)}
.brand-mark::after{content:"";position:absolute;inset:5px;border:2px solid var(--coral)}
.brand-text{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.brand-text b{color:var(--ink)}
.track{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--coral);width:0;transition:width .4s;border-radius:3px}
.cnt{font:10.5px 'JetBrains Mono';color:var(--soft);min-width:48px;text-align:right}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 7% 24px;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .4s,transform .4s;overflow-y:auto}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.inner{width:100%;max-width:960px;margin:auto;padding-block:6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--coral);margin-bottom:12px}
.eyebrow::before{content:"";width:14px;height:1.5px;background:var(--coral)}
h1.big{font-size:clamp(28px,6vw,50px);line-height:1.05;font-weight:700;font-family:'Space Grotesk'}
h2{font-size:clamp(21px,4vw,30px);font-weight:700;line-height:1.15;margin-bottom:6px;font-family:'Space Grotesk'}
.sub{font-size:clamp(12.5px,2vw,14.5px);color:var(--soft);margin-bottom:18px;max-width:640px;line-height:1.55}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.center .eyebrow{justify-content:center}
.dim{display:inline-flex;gap:6px;font:600 11.5px 'JetBrains Mono';background:var(--white);border:1.5px dashed var(--line2);padding:5px 10px;border-radius:100px}
.btn{font:600 14px 'Space Grotesk';padding:12px 20px;border-radius:10px;border:none;cursor:pointer;min-height:44px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.b1{background:var(--ink);color:var(--white);box-shadow:var(--shadow)}
.b2{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.b3{background:var(--coral);color:#12121a}
.cta{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.cp-line{margin-top:18px;font-size:12.5px;color:var(--soft);max-width:560px;line-height:1.6;border-left:2px solid var(--coral);padding-left:14px;text-align:left}
.pill{font:700 11.5px 'JetBrains Mono';padding:6px 12px;border-radius:100px;border:1.5px solid var(--teal);color:var(--teal);background:var(--teal-s)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cp-box{background:var(--white);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px;border-left:3px solid var(--teal)}
.cp-box b{color:var(--teal);font:700 11px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px}
.cp-box p{font-size:13.5px;line-height:1.55}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--white);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.num{font:700 12px 'JetBrains Mono';color:var(--coral);flex-shrink:0;min-width:26px;height:26px;padding:0 4px;border-radius:8px;background:var(--coral-s);display:flex;align-items:center;justify-content:center}
.item p{font-size:13.5px;color:var(--soft);line-height:1.5;padding-top:3px}
.item p b{color:var(--ink)}
.formula{background:var(--white);border:1.5px solid var(--coral);border-radius:16px;padding:14px;text-align:center;font:600 22px 'Space Grotesk';box-shadow:var(--shadow);margin-bottom:12px}
.tw{background:var(--white);border-radius:12px;padding:4px;overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;min-width:260px}
th,td{padding:7px 10px;font:600 12.5px 'JetBrains Mono';text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--coral);text-align:left}
tr:last-child th,tr:last-child td{border:none}
.prob{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start}
.pic{background:radial-gradient(circle at 50% 42%,#3b3a9e,#0d1130 80%);border:1.5px solid var(--line2);border-radius:16px;padding:10px;text-align:center}
.pic svg{width:100%;max-height:300px}
.pic small{display:block;color:#c9ccff;font-size:11px;margin-top:2px}
details{background:var(--white);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--soft);line-height:1.7}
summary{cursor:pointer;color:var(--teal);font-weight:600}
details p{margin:4px 0}details b{color:var(--ink)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gc{background:var(--white);border-radius:14px;padding:8px;box-shadow:var(--shadow);text-align:center}
.gc svg{width:100%}
.gc h5{font:700 13px 'Space Grotesk'}
.gc p{font-size:11.5px;color:var(--soft);line-height:1.45;margin-top:3px}
.sl{display:grid;gap:6px;margin-bottom:10px}
.sl label{font:600 12px 'JetBrains Mono';color:var(--soft);display:flex;align-items:center;gap:8px}
.sl input{flex:1;accent-color:var(--coral)}
.sl b{color:var(--ink);min-width:34px;text-align:right}
.out{background:var(--white);border-radius:14px;padding:12px 16px;font:600 13px 'JetBrains Mono';line-height:1.8;box-shadow:var(--shadow);margin-bottom:10px}
.out .r{color:var(--coral);font-size:16px}
.plot svg{width:100%;max-width:340px;aspect-ratio:1;cursor:crosshair;touch-action:manipulation}
.msg{min-height:44px;font-size:13px;line-height:1.5;color:var(--soft);background:var(--paper);border-left:3px solid var(--purple);padding:9px 14px;border-radius:8px;margin:10px 0}
.msg.ok{border-color:var(--teal);color:var(--teal)}.msg.no{border-color:var(--coral);color:var(--coral)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{padding:9px 14px;font-size:13px;min-height:38px}
.quiz{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;min-height:320px;display:flex;flex-direction:column}
.qp{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;font:11.5px 'JetBrains Mono';color:var(--soft)}
.qb{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qf{height:100%;background:var(--coral);width:0;transition:width .4s}
#qs{color:var(--teal);font-weight:600}
.qt{font:600 17px 'Space Grotesk';margin-bottom:16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);font:500 13.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:10px;min-height:46px}
.opt:hover{border-color:var(--soft)}
.opt i{font:700 11px 'JetBrains Mono';width:22px;height:22px;border-radius:6px;background:var(--white2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);font-style:normal}
.opt.ok{background:var(--teal-s);border-color:var(--teal)}.opt.ok i{background:var(--teal);color:#12121a}
.opt.no{background:var(--coral-s);border-color:var(--coral)}.opt.no i{background:var(--coral);color:#12121a}
.opt.off{pointer-events:none}
.fb{margin-top:12px;font-size:12.5px;color:var(--soft);background:var(--paper);border-left:3px solid var(--purple);padding:10px 14px;border-radius:8px;display:none;line-height:1.5}
.fb.show{display:block}
.qn{margin-top:14px;display:flex;justify-content:flex-end}
#res{display:none;text-align:center;flex-direction:column;align-items:center;justify-content:center;flex:1}
#res.show{display:flex}
.rs{font:700 46px 'Space Grotesk'}.rs span{font-size:19px;color:var(--soft);font-weight:500}
.rm{font-size:13px;color:var(--soft);margin:10px 0 20px;max-width:380px}
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px 16px;flex-shrink:0}
.nav{background:var(--white);color:var(--ink);border:1.5px solid var(--line2);border-radius:10px;padding:10px 16px;font:600 13px 'Space Grotesk';cursor:pointer;min-height:44px}
.nav:hover{border-color:var(--ink)}.nav:disabled{opacity:.35;pointer-events:none}.nav.p{background:var(--ink);color:var(--paper)}
.sn{font-size:10.5px;color:var(--soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sn b{color:var(--ink)}
@media(max-width:760px){.prob{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.brand-text{display:none}.slide{padding:10px 5.5% 18px}.nav .l{display:none}.qt{font-size:15.5px}.formula{font-size:17px}}
</style>
</head>
<body>
<div class="topbar"><div class="brand-mark"></div><div class="brand-text"><b>Matematika</b> · Bab 5 Persamaan Linear</div><div class="track"><div class="fill" id="pf"></div></div><div class="cnt" id="cnt"></div></div>
<main id="main"></main>
<div class="bottombar"><button class="nav" id="pv" onclick="goTo(cur-1)">← <span class="l">Sebelumnya</span></button><div class="sn" id="sn"></div><button class="nav p" id="nx" onclick="goTo(cur+1)"><span class="l">Selanjutnya</span> →</button></div>

<script>
const $=id=>document.getElementById(id);
function setVh(){document.documentElement.style.setProperty('--vh',innerHeight*.01+'px')}setVh();addEventListener('resize',setVh);

/* ===== Bidang koordinat ===== */
const U=18,C=120,X=x=>C+x*U,Y=y=>C-y*U;
const tx=(x,y,s,c='#fff',a='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="10" font-weight="700" font-family="JetBrains Mono,monospace" text-anchor="${a}" stroke="#0d1130" stroke-width="3" paint-order="stroke">${s}</text>`;
const f=n=>(n<0?'−':'')+Math.abs(n);
function grid(){let s='';
 for(let i=-6;i<=6;i++)s+=`<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="240" stroke="#fff" stroke-opacity="${i?.1:.7}" stroke-width="${i?1:1.6}"/><line x1="0" y1="${Y(i)}" x2="240" y2="${Y(i)}" stroke="#fff" stroke-opacity="${i?.1:.7}" stroke-width="${i?1:1.6}"/>`;
 for(let i=-6;i<=6;i+=2)if(i){s+=tx(X(i),C+12,i,'#9fa6d8');s+=tx(C-8,Y(i)+3,i,'#9fa6d8','end')}
 return s+tx(232,C-6,'x','#9fa6d8','end')+tx(C+8,10,'y','#9fa6d8','start')}
const ln=(m,c,col='#FB923C',w=2.5)=>`<line x1="${X(-8)}" y1="${Y(-8*m+c)}" x2="${X(8)}" y2="${Y(8*m+c)}" stroke="${col}" stroke-width="${w}"/>`;
const dt=(p,l,c='#ffd60a')=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${c}" stroke="#000" stroke-width="1.2"/>`+(l?tx(X(p[0])+(p[0]>=0?7:-7),Y(p[1])+(p[1]>=0?-8:15),`(${f(p[0])}, ${f(p[1])})`,'#fff',p[0]>=0?'start':'end'):'');
function eq(m,c){const mx=m===0?'':m===1?'x':m===-1?'−x':f(m)+'x';return 'y = '+(mx?mx+(c>0?' + '+c:c<0?' − '+(-c):''):f(c))}
const COL=['#FB923C','#2DD4BF','#A78BFA','#ffd60a'];
const GM=(L,pts=[],lg=1)=>`<svg viewBox="0 0 240 240">${grid()}${L.map((l,i)=>ln(l[0],l[1],COL[i])).join('')}${pts.map(p=>dt(p,1)).join('')}${lg?L.map((l,i)=>tx(6,14+13*i,eq(l[0],l[1]),COL[i],'start')).join(''):''}</svg>`;
const fr=(a,b)=>`<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;font-size:16px"><span style="border-bottom:2px solid var(--coral);padding:0 6px 2px">${a}</span><span style="padding-top:2px">${b}</span></span>`;
const prob=(ey,ti,sub,svg,cap,body)=>`<div class="inner"><div class="eyebrow">${ey}</div><h2>${ti}</h2><p class="sub">${sub}</p><div class="prob"><div class="pic">${svg}<small>${cap}</small></div><div>${body}</div></div></div>`;
const box=(t,p)=>`<div class="cp-box"><b>${t}</b><p>${p}</p></div>`;
const det=h=>`<details><summary>Lihat penyelesaian</summary>${h}</details>`;
const gap='<div style="height:10px"></div>';
const item=(n,t)=>`<div class="item"><div class="num">${n}</div><p>${t}</p></div>`;
const tbl=(m,c,xs)=>`<div class="tw"><table><tr><th>x</th>${xs.map(x=>`<td>${f(x)}</td>`).join('')}</tr><tr><th>y</th>${xs.map(x=>`<td>${f(m*x+c)}</td>`).join('')}</tr><tr><th>(x, y)</th>${xs.map(x=>`<td>(${f(x)},${f(m*x+c)})</td>`).join('')}</tr></table></div>`;

const S=[];
S.push(`<div class="inner center"><div class="eyebrow">Bab 5 · 5.7 · Fase D</div><h1 class="big">Grafik Persamaan Garis Lurus</h1><p class="sub" style="margin:14px auto 0">Membuat tabel nilai, menggambar garis pada bidang Kartesius, dan memahami pengaruh m dan c.</p><div class="cp-line"><b>Capaian Pembelajaran:</b> Peserta didik mampu menggambar dan menafsirkan grafik persamaan garis lurus.</div><div class="cta"><button class="btn b1" onclick="goTo(1)">Mulai Belajar →</button><span class="dim">↔ 12 slide</span></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">5.7 Grafik Garis Lurus</div><div class="head"><h2 style="margin:0">Tujuan Pembelajaran</h2><span class="pill">5.7</span></div><div class="list">
${item(1,'Menentukan pasangan nilai x dan y, lalu membuat tabel nilai dari persamaan garis.')}
${item(2,'Menentukan titik koordinat dari tabel dan menggambar garis pada bidang Kartesius.')}
${item(3,'Menggambar grafik dari bentuk y = mx + c.')}
${item(4,'Memahami pengaruh gradien m terhadap kemiringan grafik.')}
${item(5,'Memahami pengaruh konstanta c terhadap titik potong sumbu-y.')}
${item(6,'Membandingkan grafik dari beberapa persamaan garis.')}</div></div>`);
S.push(prob('Pasangan nilai dan tabel','Pasangan Nilai x dan y','Setiap nilai x yang dimasukkan ke persamaan menghasilkan tepat satu nilai y.',GM([[2,1]],[[-2,-3],[-1,-1],[0,1],[1,3],[2,5]],1),'Titik-titik dari tabel terletak pada satu garis lurus',
box('Persamaan y = 2x + 1','Substitusikan nilai x untuk mendapat y. Misal x = 3, maka y = 2(3) + 1 = 7, sehingga pasangannya (3, 7).')+tbl(2,1,[-2,-1,0,1,2])+det(`<p>x = −2: y = 2(−2) + 1 = −3</p><p>x = −1: y = 2(−1) + 1 = −1</p><p>x = 0: y = 2(0) + 1 = 1</p><p>x = 1: y = 2(1) + 1 = 3</p><p>x = 2: y = 2(2) + 1 = 5</p><p>Titik koordinat: <b>(−2,−3), (−1,−1), (0,1), (1,3), (2,5)</b></p>`)));
S.push(prob('Menggambar dari tabel','Empat Langkah Menggambar Garis','Untuk garis lurus, dua titik sudah cukup. Titik ketiga dipakai untuk memeriksa.',GM([[-1,2]],[[-2,4],[0,2],[2,0],[4,-2]],1),'Grafik y = −x + 2',
`<div class="list">${item(1,'<b>Buat tabel</b> nilai x lalu hitung y.')}${item(2,'<b>Tulis titik</b> (x, y) dari setiap kolom.')}${item(3,'<b>Tandai titik</b> pada bidang koordinat.')}${item(4,'<b>Hubungkan</b> dengan penggaris dan perpanjang di kedua ujung.')}</div>`+tbl(-1,2,[-2,0,2,4])));
S.push(prob('Bentuk y = mx + c','Menggambar dari y = mx + c','Cara cepat: mulai dari titik potong sumbu-y (0, c), lalu geser mengikuti gradien.',`<svg viewBox="0 0 240 240">${grid()}${ln(.5,-2)}<polyline points="${X(0)},${Y(-2)} ${X(2)},${Y(-2)} ${X(2)},${Y(-1)}" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5 3"/>${dt([0,-2],1)}${dt([2,-1],1)}${dt([4,0],1)}${tx(X(1),Y(-2)+13,'2 ke kanan','#2DD4BF')}${tx(X(2)+5,Y(-1.5)+3,'1 naik','#2DD4BF','start')}</svg>`,'y = ½x − 2: titik awal (0, −2), m = ½',
box('Contoh','Gambar grafik y = ½x − 2.')+det(`<p><b>1.</b> c = −2, jadi titik awal (0, −2).</p><p><b>2.</b> m = ½ = Δy/Δx: 2 satuan ke kanan, 1 satuan ke atas, sehingga (2, −1).</p><p><b>3.</b> Ulangi: (4, 0).</p><p><b>4.</b> Hubungkan ketiga titik.</p>`)+gap+`<div class="formula">y = mx + c</div>`+item('m','gradien: kemiringan garis.')+gap+item('c','titik potong sumbu-y, yaitu (0, c).')));
S.push(prob('Pengaruh gradien','Pengaruh Gradien terhadap Grafik','Keempat garis memiliki c = 1, tetapi gradiennya berbeda.',GM([[.5,1],[1,1],[2,1],[-1,1]],[[0,1]],1),'Semua garis melalui (0, 1)',
`<div class="list">${item('+','m positif: garis naik ke kanan.')}${item('−','m negatif: garis turun ke kanan.')}${item('↑','Semakin besar |m|, semakin curam garisnya (m = 2 lebih curam daripada m = ½).')}${item('0','m = 0: garis mendatar sejajar sumbu-x.')}</div>`));
S.push(prob('Pengaruh konstanta c','Pengaruh c terhadap Titik Potong Sumbu-y','Ketiga garis memiliki m = 1, tetapi konstanta c berbeda.',GM([[1,-2],[1,0],[1,3]],[[0,-2],[0,0],[0,3]],1),'Garis-garis sejajar, titik potong sumbu-y berbeda',
`<div class="list">${item('c','Garis memotong sumbu-y di titik (0, c).')}${item('↕','c bertambah: garis bergeser ke atas. c berkurang: garis bergeser ke bawah.')}${item('∥','Gradien sama dengan c berbeda menghasilkan <b>garis-garis sejajar</b>.')}</div>`+gap+box('Menemukan titik potong sumbu-x','Substitusikan y = 0. Contoh y = x − 2: 0 = x − 2, jadi x = 2 dan titiknya (2, 0).')));
S.push(`<div class="inner"><div class="eyebrow">Perbandingan</div><h2>Membandingkan Beberapa Garis</h2><p class="sub">Bandingkan m dan c untuk memprediksi hubungan dua garis tanpa menggambarnya.</p><div class="g3">
<div class="gc">${GM([[2,1],[2,-3]],[[0,1],[0,-3]],1)}<h5>m sama, c beda</h5><p>Sejajar, tidak pernah berpotongan.</p></div>
<div class="gc">${GM([[1,1],[-2,1]],[[0,1]],1)}<h5>c sama, m beda</h5><p>Berpotongan di sumbu-y, yaitu (0, 1).</p></div>
<div class="gc">${GM([[3,-1],[-1,3]],[[1,2]],1)}<h5>m dan c beda</h5><p>Berpotongan di satu titik, di sini (1, 2).</p></div></div>
<div class="cp-box" style="margin-top:14px"><b>Mencari titik potong</b><p>Samakan kedua persamaan. Contoh y = 3x − 1 dan y = −x + 3: 3x − 1 = −x + 3, jadi 4x = 4, x = 1, dan y = 2. Titik potong (1, 2).</p></div></div>`);
S.push(`<div class="inner"><div class="eyebrow">Eksplorasi</div><h2>Atur m dan c</h2><p class="sub">Geser slider dan amati tabel serta grafiknya.</p><div class="prob"><div class="pic" id="gp"></div><div><div class="sl" id="sli"></div><div class="out" id="out"></div><div id="tb"></div></div></div></div>`);

<div id="res"><div class="rs"><span id="rsn" style="font-size:46px;color:var(--ink);font-weight:700">0</span><span>/6 benar</span></div><div class="rm" id="rm"></div><div class="cta" style="margin:0"><button class="btn b2" onclick="restartQ()">Ulangi</button><button class="btn b3" onclick="goTo(11)">Lanjut ke Penutup →</button></div></div></div></div>`);
S.push(`<div class="inner center"><div class="eyebrow">Ringkasan</div><h2>Kerja Bagus! 🎉</h2><p class="sub" style="margin:0 auto 16px">Ringkasan grafik persamaan garis lurus:</p><div class="list" style="width:100%;max-width:560px;text-align:left;margin-bottom:22px">${item('1','Tabel: pilih x, hitung y, tulis titik (x, y), lalu hubungkan.')}${item('m','Gradien menentukan kemiringan: positif naik, negatif turun, makin besar makin curam.')}${item('c','Konstanta c adalah titik potong sumbu-y (0, c). Gradien sama berarti sejajar.')}</div><button class="btn b1" onclick="location.href='bab5.html'">✓ Selesai — Kembali ke Bab 5</button></div>`);
const names=["Sampul","Tujuan","Pasangan x,y","Langkah","y = mx + c","Gradien","Konstanta c","Perbandingan","Eksplorasi","Gambar","Kuis","Penutup"];
$('main').innerHTML=S.map((h,i)=>`<section class="slide" id="s${i}">${h}</section>`).join('');
let cur=0;

$('cnt').textContent=String(cur+1).padStart(2,'0')+'/'+String(S.length).padStart(2,'0');$('pf').style.width=(cur+1)/S.length*100+'%';
$('sn').innerHTML=`${cur+1}/${S.length} · <b>${names[cur]}</b>`;$('pv').disabled=!cur;$('nx').disabled=cur===S.length-1}

const V={m:1,c:1},LB={m:'m',c:'c'};
$('sli').innerHTML=Object.keys(V).map(k=>`<label>${LB[k]}<input type="range" min="${k==='m'?-4:-5}" max="${k==='m'?4:5}" step="${k==='m'?.5:1}" value="${V[k]}" data-k="${k}"><b id="v${k}">${V[k]}</b></label>`).join('');
function upd(){const{m,c}=V;$('gp').innerHTML=GM([[m,c]],[[0,c]],1);
 $('out').innerHTML=`<span class="r">${eq(m,c)}</span><br>Gradien: ${f(m)} · ${m>0?'garis naik':m<0?'garis turun':'garis mendatar'}<br>Memotong sumbu-y di (0, ${f(c)})`;
 $('tb').innerHTML=tbl(m,c,[-2,-1,0,1,2])}
document.querySelectorAll('#sli input').forEach(i=>i.oninput=()=>{V[i.dataset.k]=+i.value;$('v'+i.dataset.k).textContent=f(+i.value);upd()});upd();

/* latihan menggambar */
const TK=[{m:1,c:2,xs:[-2,-1,0,1,2]},{m:2,c:-1,xs:[-1,0,1,2,3]},{m:-1,c:3,xs:[-1,0,1,2,3]},{m:.5,c:-2,xs:[-4,-2,0,2,4]}];
let ti=0,pts=[],shown=false,pdone=false,sw=0;
const el=$('pl');
function drawP(){const T=TK[ti];el.innerHTML=grid()+(pdone?ln(T.m,T.c):'')+pts.map(p=>dt(p,1)).join('')}
function setT(){const T=TK[ti];pts=[];pdone=false;$('pq').textContent=eq(T.m,T.c);$('pm').className='msg';$('pm').textContent='Tandai titik pada grafik.';$('ph').innerHTML='';$('pt').textContent=`Soal ${ti+1}/${TK.length}`;drawP()}
el.addEventListener('click',e=>{const r=el.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)/r.width*240-C)/U),y=Math.round((C-(e.clientY-r.top)/r.height*240)/U);
 if(Math.abs(x)>6||Math.abs(y)>6)return;pdone=false;const k=pts.findIndex(p=>p[0]===x&&p[1]===y);k>=0?pts.splice(k,1):pts.push([x,y]);$('pm').className='msg';$('pm').textContent=`Titik ditandai: ${pts.length}`;drawP()});
function clearP(){pts=[];pdone=false;$('pm').className='msg';$('pm').textContent='Dihapus. Tandai titik lagi.';drawP()}
function hintT(){const T=TK[ti];$('ph').innerHTML=tbl(T.m,T.c,T.xs)}
function chk(){const T=TK[ti],bad=pts.filter(p=>Math.abs(p[1]-(T.m*p[0]+T.c))>1e-9),m=$('pm');
 if(bad.length){m.className='msg no';m.textContent=`Titik (${f(bad[0][0])}, ${f(bad[0][1])}) belum memenuhi. Hitung y untuk x = ${f(bad[0][0])}: y = ${f(T.m*bad[0][0]+T.c)}.`}
 else if(pts.length<2){m.className='msg no';m.textContent='Tandai minimal 2 titik (3 titik lebih aman untuk memeriksa).'}
 else{pdone=true;m.className='msg ok';m.textContent='Benar! Semua titik memenuhi persamaan, garisnya sudah digambar.';drawP()}}
function nextT(){ti=(ti+1)%TK.length;setT()}
setT();

{q:"Garis manakah yang paling curam?",o:["y = ½x","y = −3x","y = 2x","y = x"],c:1,e:"Kecuraman ditentukan oleh |m|. |−3| = 3 paling besar."},
{q:"Garis y = 2x + 1 dan y = 2x − 4 adalah garis...",o:["sejajar","berpotongan di sumbu-y","tegak lurus","berimpit"],c:0,e:"Gradiennya sama (2) dan c berbeda, sehingga sejajar."},
{q:"Garis y = −x + 3 memotong sumbu-x di titik...",o:["(0, 3)","(3, 0)","(−3, 0)","(0, −3)"],c:1,e:"Substitusi y = 0: 0 = −x + 3, jadi x = 3. Titiknya (3, 0)."}];
let qi=0,sc=0,ans=false;
function rq(){ans=false;const it=Q[qi];$('qn').textContent=`Soal ${qi+1}/${Q.length}`;$('qs').textContent='Skor: '+sc;$('qf').style.width=qi/Q.length*100+'%';$('qt').textContent=it.q;$('fb').classList.remove('show');$('qx').style.display='none';
const w=$('qo');w.innerHTML='';it.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<i>${'ABCD'[i]}</i><span>${t}</span>`;b.onclick=()=>pick(i);w.appendChild(b)})}
function pick(i){if(ans)return;ans=true;const it=Q[qi],ok=i===it.c;if(ok)sc++;
document.querySelectorAll('#qo .opt').forEach((e,k)=>{e.classList.add('off');if(k===it.c)e.classList.add('ok');else if(k===i)e.classList.add('no')});
$('fb').textContent=(ok?'Benar! ':'Belum tepat. ')+it.e;$('fb').classList.add('show');$('qs').textContent='Skor: '+sc;$('qx').textContent=qi<Q.length-1?'Lanjut →':'Lihat Hasil →';$('qx').style.display='inline-block'}
function nextQ(){if(qi<Q.length-1){qi++;rq()}else{$('qf').style.width='100%';$('play').style.display='none';$('res').classList.add('show');$('rsn').textContent=sc;
$('rm').textContent=sc===Q.length?'Sempurna! Kamu menguasai grafik garis lurus.':sc>=4?'Bagus! Sedikit lagi kamu menguasainya.':'Ayo coba lagi dan pelajari kembali contoh soalnya.'}}
function restartQ(){qi=0;sc=0;$('res').classList.remove('show');$('play').style.display='block';rq()}
