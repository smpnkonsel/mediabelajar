<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5.2 Gradien Garis Lurus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--card:rgba(24,22,48,.66);--card2:rgba(34,31,64,.72);--violet:#8B5CF6;--violet2:#C4B5FD;--cyan:#22D3EE;--cyan2:#8CF1FF;--pink:#F472B6;--green:#34D399;--red:#FB7185;--amber:#FBBF24;--text:#ECE9FB;--muted:#A3A5CE;--line:rgba(139,92,246,.28);--f-title:'Fredoka',system-ui,sans-serif;--f-body:'Plus Jakarta Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--f-body);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:16px;background:radial-gradient(ellipse 760px 520px at 6% -6%,rgba(139,92,246,.22),transparent 60%),radial-gradient(ellipse 760px 520px at 96% 106%,rgba(34,211,238,.15),transparent 60%),var(--bg)}
h1,h2,h3,h4{font-family:var(--f-title);font-weight:600;letter-spacing:.2px}
.app{width:100%;max-width:1120px;height:min(calc(100vh - 32px),830px);height:min(calc(100dvh - 32px),830px);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(21,19,44,.93),rgba(10,10,22,.97));border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-title);font-weight:600;white-space:nowrap}.brand b{color:var(--cyan2);font-family:var(--f-mono)}
#stitle{flex:1;min-width:0;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bar{flex:none;height:5px;background:rgba(255,255,255,.07)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px rgba(34,211,238,.6);transition:width .3s}
.stage{flex:1;min-height:0;position:relative;background-image:linear-gradient(rgba(139,92,246,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.05) 1px,transparent 1px);background-size:36px 36px}
.slide{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:26px 30px;-webkit-overflow-scrolling:touch}
.slide.active{display:flex;flex-direction:column;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pin{margin:auto;width:100%}
h1{font-size:clamp(2rem,5.4vw,3.1rem);line-height:1.08;margin:10px 0 12px}
h2{font-size:clamp(1.45rem,3.4vw,2.1rem);line-height:1.15;margin:8px 0 10px}
h4{font-size:1.05rem;margin-bottom:6px}
.grad{background:linear-gradient(90deg,var(--violet2),var(--cyan2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{line-height:1.65;color:#CFCFEA;margin:8px 0;font-size:1rem}.lead{font-size:1.1rem;max-width:62ch}
.badge{display:inline-block;font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan2);border:1px solid rgba(34,211,238,.45);background:rgba(34,211,238,.08);padding:4px 11px;border-radius:999px}
.badge.v{color:var(--violet2);border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.1)}.badge.g{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1)}.badge.a{color:var(--amber);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols.mid{align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(6px)}
.card.hl{border-color:rgba(34,211,238,.5);box-shadow:0 0 28px rgba(34,211,238,.12)}
.center{text-align:center}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.row.c{justify-content:center}
.btn{font-family:var(--f-body);font-weight:600;font-size:.92rem;padding:10px 20px;border-radius:999px;border:1px solid rgba(34,211,238,.45);background:var(--card2);color:var(--cyan2);cursor:pointer;transition:.2s}
.btn:hover:not(:disabled){background:rgba(34,211,238,.14);border-color:var(--cyan);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(90deg,var(--violet),var(--cyan));color:#07070f;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent;border-color:rgba(139,92,246,.5);color:var(--violet2)}.btn.sm{padding:7px 14px;font-size:.8rem}
.btn.on{background:var(--cyan);color:#07070f;border-color:var(--cyan)}
.eq{font-family:var(--f-mono);font-weight:700;color:var(--cyan2);background:linear-gradient(120deg,rgba(139,92,246,.16),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.45);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:clamp(1rem,2.4vw,1.35rem);box-shadow:0 0 22px rgba(139,92,246,.16);overflow-wrap:anywhere}
.mono{font-family:var(--f-mono)}.up{color:var(--pink)}.rn{color:var(--cyan2)}.gm{color:var(--green)}.rd{color:var(--red)}.am{color:var(--amber)}
.callout{margin:12px 0;padding:12px 14px;border-radius:14px;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.08);color:#F3E7B5;font-size:.95rem;line-height:1.6}
.callout.ok{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1);color:#B8F2DC}.callout.no{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.1);color:#FFC7D0}
.callout.info{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08);color:#C5F5FF}
[hidden]{display:none!important}
.plane{width:100%;max-width:440px;height:auto;aspect-ratio:1;display:block;margin:0 auto;touch-action:none;border-radius:12px}
.plane text{font-family:var(--f-mono);font-size:11px;fill:#9a9cc6}.plane .pl{font-weight:700;font-size:13px}
.scene{width:100%;height:auto;display:block;border-radius:12px}.sc .ov{display:none}.sc.show .ov{display:block}
.cap{font-size:.9rem;color:var(--muted);min-height:2.6em}
.sl{margin:10px 0}.sl label{display:flex;justify-content:space-between;font-size:.9rem;color:#CFCFEA;margin-bottom:2px}.sl b{font-family:var(--f-mono);color:var(--cyan2)}
.sl input{width:100%;accent-color:#8B5CF6;height:28px}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.steps li{counter-increment:s;padding:10px 12px 10px 42px;position:relative;border:1px solid var(--line);border-radius:12px;opacity:.28;transition:.3s;font-size:.95rem;line-height:1.55;background:rgba(10,9,22,.4)}
.steps li::before{content:counter(s);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--violet);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.steps li.on{opacity:1}.steps li.cur{border-color:var(--cyan);background:rgba(34,211,238,.08)}
.acc{border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden;background:var(--card)}
.acc button{width:100%;text-align:left;padding:13px 16px;background:none;border:none;color:var(--text);font-family:var(--f-title);font-size:1.05rem;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.acc button::after{content:'+';color:var(--cyan2);font-family:var(--f-mono)}.acc.open button::after{content:'-'}
.acc div{display:none;padding:0 16px 14px;color:#CFCFEA;line-height:1.6;font-size:.96rem}.acc.open div{display:block}
.inp{font-family:var(--f-mono);font-size:1rem;padding:9px 12px;border-radius:12px;border:1px solid rgba(139,92,246,.5);background:rgba(10,9,22,.7);color:var(--text);width:min(100%,200px)}
.inp:focus{outline:2px solid var(--cyan);outline-offset:1px}
.inp.good{border-color:var(--green)}.inp.bad{border-color:var(--red)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-family:var(--f-mono);font-size:.95rem;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--violet);background:rgba(139,92,246,.12)}
.opt.good{border-color:var(--green);background:rgba(52,211,153,.14);color:#B8F2DC}.opt.bad{border-color:var(--red);background:rgba(251,113,133,.14);color:#FFC7D0}.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.12)}
.opt:disabled{cursor:default}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mt .opt{margin:6px 0;text-align:center}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat div{background:rgba(10,9,22,.55);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}.stat b{display:block;font-size:1.05rem;margin-top:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer;background:var(--card)}
.chk input{margin-top:3px;accent-color:#34D399;width:18px;height:18px;flex:none}
.draw{stroke-dasharray:1;animation:dr 2s .3s ease backwards}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ctl{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(10,9,22,.9)}
.ind{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
#dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:46vw}#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);cursor:pointer}#dots i.on{background:var(--cyan);width:18px;border-radius:4px}#dots i.dn{background:var(--violet)}
#cnt{font-family:var(--f-mono);font-size:.82rem;color:var(--violet2);font-weight:700}
@media(max-width:900px){.cols,.cols.c3,.cols.c4{grid-template-columns:minmax(0,1fr)}.cols.c4{grid-template-columns:repeat(2,minmax(0,1fr))}#dots{display:none}.mt{grid-template-columns:1fr}}
@media(max-width:768px){body{padding:0}.app{height:100vh;height:100dvh;max-width:none;border-radius:0;border-left:0;border-right:0}.slide{padding:18px 14px}.btn{padding:10px 16px}.ctl .btn span{display:inline}.stat{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:400px){.ctl .btn span{display:none}.cols.c4{grid-template-columns:minmax(0,1fr)}}
@media(max-height:560px){.slide{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><b>5.2</b> Gradien Garis Lurus</div><span id="stitle"></span><button class="btn ghost sm" onclick="goTo(0)" aria-label="Kembali ke awal">Ke awal</button></header>
  <div class="bar"><i id="bar"></i></div>
  <main class="stage" id="stage"></main>
  <footer class="ctl">
    <button class="btn" id="prev" onclick="prev()">← <span>Sebelumnya</span></button>
    <div class="ind"><div id="dots"></div><div id="cnt"></div></div>
    <button class="btn primary" id="next" onclick="next()"><span>Berikutnya</span> →</button>
  </footer>
</div>

<script>
/* ================= UTIL ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{if(d===0)return'tidak terdefinisi';const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n):n+'/'+d};
const dc=(n,d)=>d===0?'-':String(Math.round(n/d*100)/100).replace('.',',');
const nf=n=>String(Math.round(n*100)/100).replace('.',',');
const eqStr=(m,c)=>{let s='y = ';if(m===0)return s+nf(c);s+=(m===1?'':m===-1?'-':nf(m))+'x';if(c>0)s+=' + '+nf(c);if(c<0)s+=' - '+nf(Math.abs(c));return s};
const PK='#F472B6',CY='#22D3EE',VI='#C4B5FD',YL='#FBBF24',GR='#34D399';

/* ================= BIDANG KOORDINAT ================= */
let pid=0;
function Plane(svg,o={}){
 const n=o.n||12,x0=o.x0===undefined?-6:o.x0,y0=o.y0===undefined?-6:o.y0,u=36,mg=26,S=n*u+2*mg,id='cp'+(++pid);
 svg.setAttribute('viewBox','0 0 '+S+' '+S);
 const X=x=>mg+(x-x0)*u,Y=y=>mg+(y0+n-y)*u,x1=x0+n,y1=y0+n,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 const inv=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*S/r.width,py=(e.clientY-r.top)*S/r.height;return[(px-mg)/u+x0,y0+n-(py-mg)/u]};
 const P={X,Y,S,x0,x1,y0,y1,inv,n,u};
 P.base=()=>{const w=n*u;let s=`<defs><clipPath id="${id}"><rect x="${mg}" y="${mg}" width="${w}" height="${w}"/></clipPath></defs><rect x="${mg}" y="${mg}" width="${w}" height="${w}" rx="6" fill="#0c0b1f" stroke="rgba(139,92,246,.4)"/>`;
  for(let i=x0;i<=x1;i++)s+=`<line x1="${X(i)}" y1="${mg}" x2="${X(i)}" y2="${mg+w}" stroke="rgba(139,92,246,.16)"/>`;
  for(let j=y0;j<=y1;j++)s+=`<line x1="${mg}" y1="${Y(j)}" x2="${mg+w}" y2="${Y(j)}" stroke="rgba(139,92,246,.16)"/>`;
  s+=`<line x1="${X(0)}" y1="${mg}" x2="${X(0)}" y2="${mg+w}" stroke="#8CF1FF" stroke-opacity=".7" stroke-width="1.6"/><line x1="${mg}" y1="${Y(0)}" x2="${mg+w}" y2="${Y(0)}" stroke="#8CF1FF" stroke-opacity=".7" stroke-width="1.6"/>`;
  for(let i=x0;i<=x1;i+=2)if(i!==0)s+=`<text x="${X(i)}" y="${Y(0)+15}" text-anchor="middle">${i}</text>`;
  for(let j=y0;j<=y1;j+=2)if(j!==0)s+=`<text x="${X(0)-6}" y="${Y(j)+4}" text-anchor="end">${j}</text>`;
  s+=`<text x="${mg+w+2}" y="${Y(0)-5}" text-anchor="end" class="pl">x</text><text x="${X(0)+7}" y="${mg+12}" class="pl">y</text>`;return s};
 P.line=(m,c,col,w)=>`<line clip-path="url(#${id})" x1="${X(x0)}" y1="${Y(m*x0+c)}" x2="${X(x1)}" y2="${Y(m*x1+c)}" stroke="${col}" stroke-width="${w||3}" stroke-linecap="round"/>`;
 P.vline=(k,col,w)=>`<line x1="${X(k)}" y1="${mg}" x2="${X(k)}" y2="${mg+n*u}" stroke="${col}" stroke-width="${w||3}" stroke-linecap="round"/>`;
 P.seg=(a,b,c,d,col,dash,w)=>`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col}" stroke-width="${w||3}"${dash?` stroke-dasharray="${dash}"`:''} stroke-linecap="round"/>`;
 P.pt=(x,y,col,lab,dx,dy,r)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="${r||7}" fill="${col}" stroke="#fff" stroke-width="2"/>`+(lab?`<text x="${X(x)+(dx===undefined?10:dx)}" y="${Y(y)+(dy===undefined?-10:dy)}" class="pl" style="fill:${col}">${lab}</text>`:'');
 P.txt=(x,y,t,col,anchor)=>`<text x="${X(x)}" y="${Y(y)}" class="pl" text-anchor="${anchor||'middle'}" style="fill:${col}">${t}</text>`;
 P.drag=(pts,on)=>{let k=-1;svg.style.touchAction='none';
  svg.addEventListener('pointerdown',e=>{const[mx,my]=inv(e);let b=-1,bd=1e9;pts().forEach((p,i)=>{const d=Math.hypot((mx-p.x)*u,(my-p.y)*u);if(d<bd){bd=d;b=i}});if(bd<34){k=b;try{svg.setPointerCapture(e.pointerId)}catch(_){}}});
  svg.addEventListener('pointermove',e=>{if(k<0)return;const[mx,my]=inv(e),p=pts()[k];p.x=cl(Math.round(mx),x0,x1);p.y=cl(Math.round(my),y0,y1);on(k)});
  const up=()=>{k=-1};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up)};
 return P;
}
/* garis dari dua titik */
const through=(P,a,b,col,w)=>a.x===b.x?P.vline(a.x,col,w):P.line((b.y-a.y)/(b.x-a.x),a.y-(b.y-a.y)/(b.x-a.x)*a.x,col,w);

/* ================= ILUSTRASI BENDA NYATA (SVG) ================= */
let gid=0;
const TX=(x,y,t,c,a)=>`<text x="${x}" y="${y}" fill="${c||'#fff'}" font-size="12.5" font-weight="700" text-anchor="${a||'middle'}" style="paint-order:stroke;stroke:#0b0a1a;stroke-width:3.5px;stroke-linejoin:round;font-family:Plus Jakarta Sans,sans-serif">${t}</text>`;
const DL=(a,b,c,d,col)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="3.2" stroke-dasharray="7 5" stroke-linecap="round"/>`;
const SKY=(t,b)=>{const id='sk'+(++gid);return`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="240" fill="url(#${id})"/><circle cx="332" cy="44" r="16" fill="#fff6cf" opacity=".9"/><circle cx="332" cy="44" r="28" fill="#fff6cf" opacity=".12"/>`};
const GRASS='<rect y="206" width="400" height="34" fill="#1f5c3e"/><rect y="206" width="400" height="5" fill="#2f7d55"/>';
const SC={
 stairs:o=>{const n=6,rho=o.r;let run=250,rise=run*rho;if(rise>150){rise=150;run=rise/rho}const w=run/n,h=rise/n,x0=40+(260-run)/2,g=206;
  let p=`M${x0} ${g}`;for(let i=0;i<n;i++)p+=` L${x0+i*w} ${g-(i+1)*h} L${x0+(i+1)*w} ${g-(i+1)*h}`;p+=` L${x0+n*w} ${g} Z`;
  let s=SKY('#1d1750','#7a5cc9')+`<rect x="${x0+n*w}" y="26" width="${400-x0-n*w}" height="${g-26}" fill="#2d2760"/>`+GRASS+`<path d="${p}" fill="#b7bbd8"/>`;
  for(let i=0;i<n;i++){const y=g-(i+1)*h;s+=`<rect x="${x0+i*w}" y="${y}" width="${w}" height="5" fill="#f1f2fd"/><rect x="${x0+i*w}" y="${y+5}" width="3" height="${h-5}" fill="#8286ab" opacity=".75"/>`}
  s+=`<line x1="${x0}" y1="${g-h-44}" x2="${x0+n*w}" y2="${g-n*h-44}" stroke="#f2b84b" stroke-width="4.5" stroke-linecap="round"/>`;
  for(let i=0;i<n;i+=2){const x=x0+i*w+w/2,y=g-(i+1)*h;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-44-(w/2)*h/w}" stroke="#d9a63f" stroke-width="3"/>`}
  const px=x0+n*w,py=g-n*h;return s+`<g class="ov">${DL(x0,g,px,g,CY)}${DL(px,g,px,py,PK)}${DL(x0,g,px,py,YL)}${TX((x0+px)/2,g+17,o.lh,CY)}${TX(px-8,(g+py)/2,o.lv,PK,'end')}</g>`},
 road:o=>{const yy=x=>190-.24*x;let s=SKY('#1d1750','#7a5cc9')+`<polygon points="0,140 80,84 160,128 250,64 330,110 400,80 400,240 0,240" fill="#2b2563"/><polygon points="0,216 400,120 400,240 0,240" fill="#25613f"/><polygon points="0,190 400,94 400,122 0,218" fill="#3b3d52"/><line x1="0" y1="204" x2="400" y2="108" stroke="#f5d36b" stroke-width="2.5" stroke-dasharray="14 10"/>`;
  s+=`<g transform="translate(190 ${yy(190)-1}) rotate(-13.5)"><rect x="-38" y="-33" width="46" height="31" rx="3" fill="#eef0fb"/><rect x="10" y="-26" width="25" height="24" rx="3" fill="#fb923c"/><rect x="16" y="-22" width="12" height="9" fill="#8cf1ff"/><circle cx="-22" cy="0" r="7.5" fill="#15132c"/><circle cx="22" cy="0" r="7.5" fill="#15132c"/><circle cx="-22" cy="0" r="3" fill="#9aa0c8"/><circle cx="22" cy="0" r="3" fill="#9aa0c8"/></g>`;

function wireScenes(el){$$('.sc',el).forEach(c=>{const b=$('.tg',c),cap=$('.cap',c),t0=cap.textContent,t1=c.dataset.cap||'';b.onclick=()=>{c.classList.toggle('show');const on=c.classList.contains('show');b.textContent=on?'Sembunyikan':'Ukur kemiringannya';cap.innerHTML=on?(c.dataset.cap||t0):t0}})}

function Stepper(el,cb){const L=$$('.steps li',el),nx=$('.snx',el),rs=$('.srs',el);let i=0;
 const show=()=>{L.forEach((li,k)=>{li.classList.toggle('on',k<=i);li.classList.toggle('cur',k===i)});nx.disabled=i>=L.length-1;cb&&cb(i)};
 nx.onclick=()=>{if(i<L.length-1){i++;show()}};rs.onclick=()=>{i=0;show()};show()}
const stepBtns='<div class="row"><button class="btn sm primary snx">Langkah berikutnya</button><button class="btn sm ghost srs">Ulangi</button></div>';
function parseAns(s){s=String(s).trim().toLowerCase().replace(/\s+/g,'').replace(',','.').replace('−','-');if(/tak|tidak|undef|tt/.test(s))return'tt';if(s.includes('/')){const[a,b]=s.split('/');return b&&+b?+a/+b:NaN}return s===''?NaN:+s}
function practice(el,items){
 el.innerHTML=items.map((it,i)=>`<div class="card" style="margin:10px 0" data-i="${i}"><p style="margin-top:0"><b>${i+1}.</b> ${it.q}</p><div class="row"><input class="inp" type="text" inputmode="text" autocomplete="off" placeholder="Jawabanmu" aria-label="Jawaban soal ${i+1}"><button class="btn sm primary ck">Periksa</button><button class="btn sm ghost hn">Petunjuk</button><button class="btn sm ghost sv">Lihat pembahasan</button></div><div class="callout" hidden></div></div>`).join('');
 $$('.card',el).forEach((c,i)=>{const it=items[i],inp=$('.inp',c),fb=$('.callout',c);const say=(t,k)=>{fb.hidden=false;fb.className='callout '+(k||'');fb.innerHTML=t};
  const check=()=>{const v=parseAns(inp.value);if(inp.value.trim()===''){say('Tulis jawabanmu dulu.');return}
   const ok=it.a==='tt'?v==='tt':(typeof v==='number'&&Math.abs(v-it.a)<.011);inp.classList.toggle('good',ok);inp.classList.toggle('bad',!ok);
   say(ok?'Benar! '+it.ok:'Belum tepat. Coba lagi, atau tekan Petunjuk.',ok?'ok':'no')};
  $('.ck',c).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
  $('.hn',c).onclick=()=>say('Petunjuk: '+it.h,'info');$('.sv',c).onclick=()=>say(it.s,'info')})}
function Quiz(el,Q,opt){let i=0,sc=0,log=[];const root=el;
 const show=()=>{if(i>=Q.length){const pct=Math.round(sc/Q.length*100);root.innerHTML=`<div class="card center"><h2>Skor kamu: <span class="grad">${sc} / ${Q.length}</span></h2><p class="mono" style="font-size:1.3rem;color:var(--violet2)">${pct}%</p><p>${pct===100?'Sempurna! Kamu menguasai gradien.':pct>=80?'Sangat bagus! Pemahamanmu sudah kuat.':pct>=60?'Bagus. Pelajari lagi bagian yang masih keliru.':'Ayo ulangi materi, lalu coba kuis lagi.'}</p><div style="text-align:left;margin-top:8px">${log.map((l,k)=>`<div class="callout ${l.ok?'ok':'no'}"><b>Soal ${k+1}: ${l.ok?'Benar':'Salah'}</b><br>${l.exp}</div>`).join('')}</div><div class="row c"><button class="btn primary" id="qr">Ulangi Kuis</button></div></div>`;$('#qr',root).onclick=()=>{i=0;sc=0;log=[];show()};return}
  const q=Q[i];root.innerHTML=`<div class="row" style="justify-content:space-between;margin:0 0 6px"><span class="badge">Soal ${i+1} / ${Q.length}</span><span class="badge g">Skor: ${sc}</span></div><div class="card"><p style="font-size:1.08rem;margin-top:0"><b>${q.q}</b></p><div id="qo">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')}</div><div id="qf"></div></div>`;
  $$('.opt',root).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.c;if(ok)sc++;log.push({ok,exp:q.e});$$('.opt',root).forEach((x,j)=>{x.disabled=true;if(j===q.c)x.classList.add('good');else if(j===k)x.classList.add('bad')});
   $('#qf',root).innerHTML=`<div class="callout ${ok?'ok':'no'}"><b>${ok?'Benar!':'Belum tepat.'}</b> ${q.e}</div><div class="row"><button class="btn primary" id="qn">${i===Q.length-1?'Lihat Hasil':'Soal Berikutnya'} →</button></div>`;$('#qn',root).onclick=()=>{i++;show()}})};
 show()}

add('pemantik','Pertanyaan pemantik',`<div class="pin"><span class="badge v">Pertanyaan pemantik</span><h2>Mana yang lebih <span class="grad">curam</span>?</h2><p class="lead">Dua tangga ini sama-sama punya 6 anak tangga. Menurutmu, tangga mana yang lebih curam?</p><div class="cols"><div class="card sc" id="sA">${scene('stairs',{r:.5,lh:'maju 30 cm',lv:'naik 15 cm',alt:'Tangga A landai'})}<h4 style="margin-top:8px">Tangga A</h4></div><div class="card sc" id="sB">${scene('stairs',{r:1.2,lh:'maju 20 cm',lv:'naik 24 cm',alt:'Tangga B curam'})}<h4 style="margin-top:8px">Tangga B</h4></div></div><div class="row c" id="pmB"><button class="btn" data-a="A">Tangga A</button><button class="btn" data-a="B">Tangga B</button><button class="btn" data-a="S">Sama saja</button></div><div class="callout" id="pmF" hidden></div></div>`,el=>{

add('sekitar','Kemiringan di sekitar kita',`<div class="pin"><span class="badge v">Apersepsi</span><h2>Kemiringan ada di <span class="grad">sekitar kita</span></h2><p>Tekan tombol di tiap gambar untuk melihat berapa tinggi yang dinaiki (atau diturunkan) tiap jarak mendatar tertentu.</p><div class="cols">${scCard('stairs',{r:.75,lh:'maju 4 m',lv:'naik 3 m',alt:'Tangga rumah'},'Tangga rumah','Naik 3 m untuk maju 4 m. Perbandingannya 3/4.')}${scCard('road',{lh:'maju 40 m',lv:'naik 10 m',alt:'Jalan menanjak'},'Jalan menanjak','Naik 10 m untuk maju 40 m. Perbandingannya 10/40 = 1/4.')}${scCard('roof',{lh:'maju 3 m',lv:'naik 2 m',lv2:'turun 2 m',alt:'Atap rumah'},'Atap rumah','Sisi kiri naik 2 m untuk maju 3 m (2/3). Sisi kanan justru turun.')}${scCard('slide',{lh:'maju 3 m',lv:'turun 2 m',alt:'Seluncuran'},'Seluncuran','Turun 2 m untuk maju 3 m. Garisnya menurun ke kanan.')}</div></div>`,wireScenes);

add('koordinat','Mengingat koordinat',`<div class="pin"><span class="badge v">Apersepsi · prasyarat</span><h2>Ingat lagi: <span class="grad">koordinat</span> dan selisih</h2><div class="cols mid"><div class="card"><svg class="plane" id="kp"></svg></div><div><p>Ketuk bidang koordinat untuk menaruh <b class="rn">titik A</b>, lalu <b class="up">titik B</b>. Ketukan ketiga memulai lagi.</p><div class="card hl" id="ko">-</div><p class="cap">Selisih dihitung dari titik A ke titik B: nilai titik kedua dikurangi nilai titik pertama.</p><div class="row"><button class="btn sm ghost" id="kr">Ulangi</button></div></div></div></div>`,el=>{
 const svg=$('#kp',el),P=Plane(svg),pts=[],out=$('#ko',el);
 const draw=()=>{let s=P.base();if(pts.length===2){const[a,b]=pts;s+=P.seg(a.x,a.y,b.x,a.y,CY,'7 5')+P.seg(b.x,a.y,b.x,b.y,PK,'7 5')+P.seg(a.x,a.y,b.x,b.y,VI,'',2)}
  pts.forEach((p,i)=>s+=P.pt(p.x,p.y,i?PK:CY,'AB'[i]+'('+p.x+', '+p.y+')',10,-10));svg.innerHTML=s;
  out.innerHTML=pts.length<2?'Belum ada dua titik.':`<div class="mono">A(${pts[0].x}, ${pts[0].y}) &nbsp; B(${pts[1].x}, ${pts[1].y})</div><div class="mono rn">Δx = ${pts[1].x} - (${pts[0].x}) = ${pts[1].x-pts[0].x}</div><div class="mono up">Δy = ${pts[1].y} - (${pts[0].y}) = ${pts[1].y-pts[0].y}</div>`};
 svg.onclick=e=>{const[mx,my]=P.inv(e),x=Math.round(mx),y=Math.round(my);if(x<P.x0||x>P.x1||y<P.y0||y>P.y1)return;if(pts.length>=2)pts.length=0;pts.push({x,y});draw()};
 $('#kr',el).onclick=()=>{pts.length=0;draw()};draw()});

add('pengertian','Pengertian gradien',`<div class="pin"><span class="badge">Konsep</span><h2>Apa itu <span class="grad">gradien</span>?</h2><div class="cols mid"><div class="card"><svg class="plane" id="gp"></svg></div><div><p><b>Gradien</b> adalah ukuran kemiringan suatu garis, yaitu perbandingan antara perubahan <b class="up">vertikal (naik/turun)</b> dan perubahan <b class="rn">horizontal (maju)</b>.</p><div class="eq">m = naik / maju</div><div class="callout info">Geser titik <b>A</b> dan <b>B</b> pada grafik. Amati bagaimana angka berubah.</div><div class="stat"><div>Δy (naik)<b class="up" id="gy">-</b></div><div>Δx (maju)<b class="rn" id="gx">-</b></div><div>gradien m<b class="gm" id="gm">-</b></div></div><p id="gt" class="cap"></p></div></div></div>`,el=>{
 const svg=$('#gp',el),P=Plane(svg),A={x:-3,y:-2},B={x:3,y:2};
 const draw=()=>{const dy=B.y-A.y,dx=B.x-A.x;let s=P.base();if(dx||dy)s+=through(P,A,B,VI,3);s+=P.seg(A.x,A.y,B.x,A.y,CY,'7 5',3)+P.seg(B.x,A.y,B.x,B.y,PK,'7 5',3)+P.pt(A.x,A.y,CY,'A')+P.pt(B.x,B.y,PK,'B');svg.innerHTML=s;
  $('#gy',el).textContent=dy;$('#gx',el).textContent=dx;$('#gm',el).textContent=(dx===0&&dy===0)?'-':dx===0?'tak terdefinisi':fr(dy,dx)+(String(fr(dy,dx)).includes('/')?' = '+dc(dy,dx):'');
  $('#gt',el).textContent=(dx===0&&dy===0)?'A dan B berimpit. Geser salah satunya.':dx===0?'Garis vertikal: Δx = 0, gradien tidak terdefinisi.':dy===0?'Garis horizontal: Δy = 0, gradien nol.':dy*dx>0?'Garis naik dari kiri ke kanan: gradien positif.':'Garis turun dari kiri ke kanan: gradien negatif.'};
 P.drag(()=>[A,B],draw);draw()});

add('istilah','Istilah penting',`<div class="pin"><span class="badge">Istilah penting</span><h2>Kenali <span class="grad">istilahnya</span></h2><p>Ketuk tiap istilah untuk membuka penjelasannya.</p>${[['Perubahan vertikal (Δy)','Selisih tinggi dua titik: <b class="up">Δy = y₂ - y₁</b>. Bernilai positif jika garis naik, negatif jika turun. Simbol Δ dibaca "delta".'],['Perubahan horizontal (Δx)','Selisih posisi mendatar dua titik: <b class="rn">Δx = x₂ - x₁</b>. Dibaca dari kiri ke kanan, sehingga nilainya positif.'],['Gradien (m)','Ukuran kemiringan garis: <b class="gm">m = Δy / Δx</b>. Disebut juga kemiringan atau kecuraman.'],['Titik potong sumbu-y (c)','Titik tempat garis memotong sumbu-y, yaitu (0, c). Muncul pada persamaan y = mx + c.']].map((a,i)=>`<div class="acc${i===0?' open':''}"><button>${a[0]}</button><div>${a[1]}</div></div>`).join('')}</div>`,el=>$$('.acc button',el).forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open')));

add('rumus','Rumus gradien',`<div class="pin"><span class="badge">Penjelasan bertahap</span><h2>Rumus gradien dari <span class="grad">dua titik</span></h2><div class="cols"><div class="card"><svg class="plane" id="rp"></svg></div><div><div class="eq">m = Δy / Δx = (y₂ - y₁) / (x₂ - x₁)</div><p style="margin-top:0">Contoh: titik A(2, 1) dan B(6, 4).</p><ol class="steps"><li>Tentukan dua titik: A(x₁, y₁) = (2, 1) dan B(x₂, y₂) = (6, 4).</li><li>Hitung perubahan vertikal: <b class="up">Δy = 4 - 1 = 3</b>.</li><li>Hitung perubahan horizontal: <b class="rn">Δx = 6 - 2 = 4</b>.</li><li>Bagi: <b class="gm">m = 3/4</b>. Garis naik, jadi gradiennya positif.</li></ol>${stepBtns}<p class="cap">Urutan titik boleh ditukar (A dan B), asalkan konsisten untuk Δy dan Δx. Hasilnya sama.</p></div></div></div>`,el=>{
 const svg=$('#rp',el),P=Plane(svg,{x0:-2,y0:-2});Stepper(el,i=>{let s=P.base();if(i>=0)s+=P.pt(2,1,CY,'A(2,1)')+P.pt(6,4,PK,'B(6,4)');if(i>=1)s+=P.seg(6,1,6,4,PK,'7 5',3.5)+P.txt(6.3,2.6,'Δy = 3',PK,'start');if(i>=2)s+=P.seg(2,1,6,1,CY,'7 5',3.5)+P.txt(4,0.4,'Δx = 4',CY);if(i>=3)s+=P.line(.75,-.5,VI,3);svg.innerHTML=s})});

add('contoh1','Contoh 1',`<div class="pin"><span class="badge a">Contoh 1 · interaktif</span><h2>Hitung gradien <span class="grad">garis PQ</span></h2><div class="cols"><div class="card"><svg class="plane" id="c1p"></svg></div><div><p>Garis melalui <b>P(1, 2)</b> dan <b>Q(4, 8)</b>. Isi langkah-langkahnya.</p><div class="card"><p class="mono" style="margin:6px 0">Δy = 8 - 2 = <input class="inp" style="width:90px" id="a1" aria-label="Δy"></p><p class="mono" style="margin:6px 0">Δx = 4 - 1 = <input class="inp" style="width:90px" id="a2" aria-label="Δx"></p><p class="mono" style="margin:6px 0">m = Δy / Δx = <input class="inp" style="width:90px" id="a3" aria-label="gradien"></p><div class="row"><button class="btn sm primary" id="c1k">Periksa</button><button class="btn sm ghost" id="c1h">Petunjuk</button></div></div><div class="callout" id="c1f" hidden></div></div></div></div>`,el=>{
 const svg=$('#c1p',el),P=Plane(svg,{x0:-2,y0:-2}),base=()=>P.base()+P.pt(1,2,CY,'P(1,2)')+P.pt(4,8,PK,'Q(4,8)');svg.innerHTML=base();
 const f=$('#c1f',el);$('#c1h',el).onclick=()=>{f.hidden=false;f.className='callout info';f.textContent='Petunjuk: Δy = y₂ - y₁ (titik Q dikurangi titik P). Lakukan hal yang sama untuk Δx, lalu bagi.'};
 $('#c1k',el).onclick=()=>{const v=['a1','a2','a3'].map(k=>parseAns($('#'+k,el).value)),ans=[6,3,2];const ok=v.map((x,i)=>Math.abs(x-ans[i])<.001);['a1','a2','a3'].forEach((k,i)=>{$('#'+k,el).classList.toggle('good',ok[i]);$('#'+k,el).classList.toggle('bad',!ok[i])});f.hidden=false;
  if(ok.every(Boolean)){f.className='callout ok';f.innerHTML='<b>Tepat!</b> m = 6/3 = <b>2</b>. Setiap maju 1, garis naik 2. Garis naik, gradiennya positif.';svg.innerHTML=base()+P.line(2,0,VI,3)+P.seg(1,2,4,2,CY,'7 5',3)+P.seg(4,2,4,8,PK,'7 5',3)}else{f.className='callout no';f.textContent='Ada yang belum tepat. Periksa kolom yang berwarna merah.'}}});

const slider1=(id,t,bd,min,max,step,v,sc,txt)=>add(id,t,`<div class="pin"><span class="badge">${bd}</span><h2>${txt.h}</h2><div class="cols mid"><div class="card"><svg class="plane" id="sp"></svg></div><div>${txt.body}${SLD('s1',min,max,step,v,txt.lab)}<div class="eq" id="se"></div><div class="stat"><div>maju (Δx)<b class="rn" id="sx"></b></div><div>${txt.dy}<b class="up" id="sy"></b></div><div>gradien m<b class="gm" id="sm"></b></div></div></div></div><div class="cols mid" style="margin-top:14px"><div class="card sc" data-cap="${txt.cap.replace(/"/g,'&quot;')}">${scene(sc[0],sc[1])}<h4 style="margin-top:8px">${sc[2]}</h4><p class="cap">Tekan tombol untuk melihat ukurannya.</p><button class="btn sm tg">Ukur kemiringannya</button></div><div class="card hl">${txt.ciri}</div></div></div>`,el=>{
 const svg=$('#sp',el),P=Plane(svg),inp=$('#s1',el);wireScenes(el);
 const draw=()=>{const m=+inp.value;$('[data-v="s1"]',el).textContent=nf(m);let s=P.base()+P.line(m,0,VI,3.5);s+=P.seg(0,0,1,0,CY,'6 4',3.5)+P.seg(1,0,1,m,PK,'6 4',3.5)+P.pt(0,0,YL,'',0,0,5)+P.pt(1,m,PK,'',0,0,6);svg.innerHTML=s;
  $('#se',el).textContent='y = '+(m===1?'':m===-1?'-':nf(m))+'x';$('#sx',el).textContent='1';$('#sy',el).textContent=nf(m);$('#sm',el).textContent=nf(m)};
 inp.oninput=draw;draw()});
slider1('positif','Gradien positif','Konsep · gradien positif',.25,5,.25,1,['road',{lh:'maju 40 m',lv:'naik 10 m',alt:'Jalan menanjak'},'Jalan menanjak'],{h:'Gradien <span class="grad">positif</span>',lab:'Gradien (m)',dy:'naik (Δy)',body:'<p style="margin-top:0">Geser slider untuk mengubah gradien. Garis <b>y = mx</b> melalui titik asal. Untuk setiap <b class="rn">maju 1</b>, garis <b class="up">naik m</b>.</p>',cap:'Jalan menanjak: kendaraan bergerak ke kanan sambil naik. Naik 10 m tiap maju 40 m, gradiennya 1/4.',ciri:'<h4>Ciri gradien positif (m &gt; 0)</h4><ul style="padding-left:18px;line-height:1.7;color:#CFCFEA"><li>Garis <b>naik</b> dari kiri ke kanan.</li><li>Δy dan Δx sama-sama positif (atau sama-sama negatif).</li><li>Contoh: tangga yang naik, jalan menanjak.</li></ul>'});
slider1('negatif','Gradien negatif','Konsep · gradien negatif',-5,-.25,.25,-1,['slide',{lh:'maju 3 m',lv:'turun 2 m',alt:'Seluncuran'},'Seluncuran'],{h:'Gradien <span class="grad">negatif</span>',lab:'Gradien (m)',dy:'turun (Δy)',body:'<p style="margin-top:0">Sekarang gradien bernilai negatif. Setiap <b class="rn">maju 1</b>, garis <b class="up">turun</b> sebesar |m|.</p>',cap:'Seluncuran: anak bergerak ke kanan sambil turun. Turun 2 m tiap maju 3 m, gradiennya -2/3.',ciri:'<h4>Ciri gradien negatif (m &lt; 0)</h4><ul style="padding-left:18px;line-height:1.7;color:#CFCFEA"><li>Garis <b>turun</b> dari kiri ke kanan.</li><li>Δy dan Δx berlawanan tanda.</li><li>Contoh: seluncuran, sisi kanan atap rumah.</li></ul>'});

add('nol','Gradien nol',`<div class="pin"><span class="badge">Konsep · gradien nol</span><h2>Garis <span class="grad">horizontal</span></h2><div class="cols mid"><div class="card"><svg class="plane" id="np"></svg></div><div><p style="margin-top:0">Pada garis horizontal, tingginya tidak berubah: <b class="up">Δy = 0</b>. Karena itu <b class="gm">m = 0 / Δx = 0</b>.</p>${SLD('n1',-5,5,1,2,'Tinggi garis (c)')}<div class="eq" id="ne"></div><div class="callout info">Persamaan garis horizontal: <b>y = c</b>. Garisnya sejajar sumbu-x.</div></div></div><div class="cols mid" style="margin-top:14px"><div class="card sc" data-cap="Jalan datar: kendaraan maju tanpa naik atau turun. Naik 0 m, gradiennya 0.">${scene('flat',{lh:'maju 40 m',lv:'naik 0 m',alt:'Jalan datar'})}<h4 style="margin-top:8px">Jalan datar</h4><p class="cap">Tekan tombol untuk melihat ukurannya.</p><button class="btn sm tg">Ukur kemiringannya</button></div><div class="card hl"><h4>Ciri gradien nol</h4><ul style="padding-left:18px;line-height:1.7;color:#CFCFEA"><li>Garis <b>datar</b>, tidak naik dan tidak turun.</li><li>Dua titik pada garis memiliki y yang sama.</li><li>Contoh: lantai, jalan yang rata.</li></ul></div></div></div>`,el=>{
 const svg=$('#np',el),P=Plane(svg),inp=$('#n1',el);wireScenes(el);
 const draw=()=>{const c=+inp.value;$('[data-v="n1"]',el).textContent=c;svg.innerHTML=P.base()+P.line(0,c,VI,3.5)+P.pt(-3,c,CY,'',0,0)+P.pt(3,c,PK,'',0,0)+P.seg(-3,c,3,c,CY,'6 4',2)+P.txt(0,c+.7,'Δy = 0',PK);$('#ne',el).textContent='y = '+c+'   (m = 0)'};
 inp.oninput=draw;draw()});

add('vertikal','Garis vertikal',`<div class="pin"><span class="badge">Konsep · tidak terdefinisi</span><h2>Garis <span class="grad">vertikal</span></h2><div class="cols mid"><div class="card"><svg class="plane" id="vp"></svg></div><div><p style="margin-top:0">Titik A(-1, -3) tetap. Titik B digeser mendekati garis tegak lurus. Perhatikan nilai gradien saat <b class="rn">Δx</b> mengecil. Tinggi tetap: <b class="up">Δy = 6</b>.</p>${SLD('v1',0,4,.5,3,'Maju (Δx)')}<div class="stat"><div>Δx<b class="rn" id="vx"></b></div><div>Δy<b class="up" id="vy">6</b></div><div>m = Δy/Δx<b class="gm" id="vm"></b></div></div><div class="callout" id="vt"></div></div></div><div class="cols mid" style="margin-top:14px"><div class="card sc" data-cap="Tiang bendera tegak lurus: naik tinggi tetapi tidak maju sama sekali (maju 0 m), sehingga pembagian oleh nol.">${scene('wall',{lh:'maju 0 m',lv:'naik 8 m',alt:'Tiang bendera'})}<h4 style="margin-top:8px">Tiang bendera</h4><p class="cap">Tekan tombol untuk melihat ukurannya.</p><button class="btn sm tg">Ukur kemiringannya</button></div><div class="card hl"><h4>Ingat bedanya!</h4><ul style="padding-left:18px;line-height:1.7;color:#CFCFEA"><li>Horizontal: Δy = 0, gradien <b>0</b>.</li><li>Vertikal: Δx = 0, gradien <b>tidak terdefinisi</b> (tidak bisa dibagi nol).</li><li>Persamaan garis vertikal: <b>x = k</b>.</li></ul></div></div></div>`,el=>{
 const svg=$('#vp',el),P=Plane(svg),inp=$('#v1',el);wireScenes(el);
 const draw=()=>{const dx=+inp.value;$('[data-v="v1"]',el).textContent=nf(dx);const A={x:-1,y:-3},B={x:-1+dx,y:3};let s=P.base();s+=dx===0?P.vline(-1,VI,3.5):through(P,A,B,VI,3.5);s+=P.seg(-1,-3,-1+dx,-3,CY,'6 4',3)+P.seg(-1+dx,-3,-1+dx,3,PK,'6 4',3)+P.pt(-1,-3,CY,'A')+P.pt(-1+dx,3,PK,'B');svg.innerHTML=s;
  $('#vx',el).textContent=nf(dx);$('#vm',el).textContent=dx===0?'tak terdefinisi':nf(6/dx);const t=$('#vt',el);if(dx===0){t.className='callout no';t.innerHTML='<b>Δx = 0</b>: A dan B sejajar sumbu-y, garis menjadi vertikal. Pembagian dengan nol tidak terdefinisi, jadi gradien tidak terdefinisi.'}else{t.className='callout';t.innerHTML='Semakin kecil Δx, semakin besar gradien: garis semakin curam. Coba geser sampai 0.'}};
 inp.oninput=draw;draw()});

add('tebak','Tebak jenis gradien',`<div class="pin"><span class="badge g">Aktivitas</span><h2>Jenis gradien <span class="grad">apa ini</span>?</h2><div class="cols mid"><div class="card"><svg class="plane" id="tp"></svg></div><div><div class="row" style="justify-content:space-between;margin:0"><span class="badge" id="tn"></span><span class="badge g" id="ts"></span></div><div id="to"></div><div id="tf"></div></div></div></div>`,el=>{
 const svg=$('#tp',el),P=Plane(svg),Q=[[2,-1,'positif'],[-1,3,'negatif'],[0,2,'nol'],[null,-3,'tidak terdefinisi'],[.5,1,'positif'],[-3,0,'negatif']],OPT=['positif','negatif','nol','tidak terdefinisi'];let i=0,sc=0;
 const show=()=>{if(i>=Q.length){svg.innerHTML=P.base();$('#to',el).innerHTML='';$('#tn',el).textContent='Selesai';$('#tf',el).innerHTML=`<div class="callout ok"><b>Skor: ${sc} / ${Q.length}.</b> ${sc>=5?'Hebat!':'Ulangi sekali lagi untuk memantapkan.'}</div><div class="row"><button class="btn primary" id="tr">Ulangi</button></div>`;$('#tr',el).onclick=()=>{i=0;sc=0;show()};return}
  const q=Q[i];svg.innerHTML=P.base()+(q[0]===null?P.vline(q[1],VI,4):P.line(q[0],q[1],VI,4));$('#tn',el).textContent='Garis '+(i+1)+' / '+Q.length;$('#ts',el).textContent='Skor: '+sc;$('#tf',el).innerHTML='';
  $('#to',el).innerHTML=OPT.map(o=>`<button class="opt" data-o="${o}">Gradien ${o}</button>`).join('');
  $$('.opt',$('#to',el)).forEach(b=>b.onclick=()=>{const ok=b.dataset.o===q[2];if(ok)sc++;$$('.opt',$('#to',el)).forEach(x=>{x.disabled=true;if(x.dataset.o===q[2])x.classList.add('good');else if(x===b)x.classList.add('bad')});
   const why={positif:'garis naik dari kiri ke kanan',negatif:'garis turun dari kiri ke kanan',nol:'garis horizontal (Δy = 0)','tidak terdefinisi':'garis vertikal (Δx = 0)'}[q[2]];
   $('#tf',el).innerHTML=`<div class="callout ${ok?'ok':'no'}"><b>${ok?'Benar!':'Belum tepat.'}</b> Gradien ${q[2]}: ${why}.</div><div class="row"><button class="btn primary" id="tx">Lanjut →</button></div>`;$('#tx',el).onclick=()=>{i++;show()}})};
 show()});

add('ymxc','Persamaan y = mx + c',`<div class="pin"><span class="badge">Konsep · bentuk persamaan</span><h2>Persamaan <span class="grad">y = mx + c</span></h2><div class="cols mid"><div class="card"><svg class="plane" id="yp"></svg></div><div><div class="eq" id="ye"></div><p style="margin-top:0"><b class="gm">m</b> = gradien (kemiringan). <b class="am">c</b> = titik potong sumbu-y, yaitu titik (0, c).</p>${SLD('y1',-4,4,.5,1.5,'Gradien (m)')}${SLD('y2',-5,5,1,-1,'Titik potong sumbu-y (c)')}<div class="callout info" id="yt"></div></div></div></div>`,el=>{
 const svg=$('#yp',el),P=Plane(svg),i1=$('#y1',el),i2=$('#y2',el);
 const draw=()=>{const m=+i1.value,c=+i2.value;$('[data-v="y1"]',el).textContent=nf(m);$('[data-v="y2"]',el).textContent=c;let s=P.base()+P.line(m,c,VI,3.5)+P.seg(0,c,1,c,CY,'6 4',3)+P.seg(1,c,1,c+m,PK,'6 4',3)+P.pt(0,c,YL,'(0, '+c+')',10,-10);svg.innerHTML=s;
  $('#ye',el).textContent=eqStr(m,c);$('#yt',el).innerHTML=m>0?'m = '+nf(m)+' &gt; 0: garis naik. Dari titik (0, '+c+') maju 1, naik '+nf(m)+'.':m<0?'m = '+nf(m)+' &lt; 0: garis turun. Dari titik (0, '+c+') maju 1, turun '+nf(Math.abs(m))+'.':'m = 0: garis horizontal y = '+c+'.'};
 i1.oninput=draw;i2.oninput=draw;draw()});

add('dariPers','Gradien dari persamaan',`<div class="pin"><span class="badge">Konsep · menentukan gradien</span><h2>Gradien dari <span class="grad">persamaan</span></h2><div class="eq">y = mx + c &nbsp;&rarr;&nbsp; gradien = koefisien x</div><p>Koefisien x adalah angka yang mengalikan x. Ketuk tiap persamaan untuk melihat gradiennya.</p><div class="cols c3" id="gq"></div></div>`,el=>{
 const L=[['y = <i>3</i>x + 2','3','Koefisien x adalah 3.'],['y = <i>-5</i>x + 1','-5','Tanda minus ikut: gradien -5 (garis turun).'],['y = <i>1</i>x - 4','1','Ditulis y = x - 4. "x" berarti 1x, jadi m = 1.'],['y = <i>-1</i>x','-1','Ditulis y = -x. Berarti -1x, jadi m = -1.'],['y = <i>1/2</i>x + 3','1/2','Koefisien x adalah pecahan 1/2.'],['y = 7','0','Tidak ada suku x: y = 0x + 7, jadi m = 0 (garis horizontal).']];
 $('#gq',el).innerHTML=L.map((l,i)=>`<button class="card opt" style="margin:0;text-align:center" data-i="${i}"><div class="mono" style="font-size:1.15rem">${l[0]}</div><div class="cap" style="min-height:3em">Ketuk untuk membuka</div></button>`).join('');
 $$('.opt',el).forEach(b=>b.onclick=()=>{const l=L[+b.dataset.i];b.classList.add('good');$('.cap',b).innerHTML='<b class="gm">m = '+l[1]+'</b><br>'+l[2]});
 const st=document.createElement('style');st.textContent='#gq i{color:#34D399;font-style:normal;font-weight:700}';el.appendChild(st)});

add('pengayaan','Pengayaan',`<div class="pin"><span class="badge a">Pengayaan</span><h2>Bentuk <span class="grad">ax + by = c</span> menjadi y = mx + c</h2><p>Jika persamaan belum berbentuk y = mx + c, ubah dahulu sampai y berdiri sendiri.</p><div class="row"><button class="btn sm on" data-t="0">2x + y = 6</button><button class="btn sm" data-t="1">3x + 2y = 12</button></div><div id="pe0"><ol class="steps"><li>Tujuan: membuat y sendirian di ruas kiri.</li><li>Pindahkan 2x ke ruas kanan: <span class="mono">y = 6 - 2x</span>.</li><li>Susun menurut y = mx + c: <span class="mono">y = -2x + 6</span>.</li><li>Baca koefisien x: <b class="gm">m = -2</b> dan c = 6.</li></ol>${stepBtns}</div><div id="pe1" hidden><ol class="steps"><li>Pindahkan 3x ke ruas kanan: <span class="mono">2y = -3x + 12</span>.</li><li>Bagi kedua ruas dengan 2: <span class="mono">y = -(3/2)x + 6</span>.</li><li>Baca koefisien x: <b class="gm">m = -3/2</b> dan c = 6.</li><li>Pintasan: untuk ax + by = c, gradiennya <b>m = -a/b</b> = -3/2. Sama!</li></ol>${stepBtns}</div></div>`,el=>{
 [0,1].forEach(k=>Stepper($('#pe'+k,el)));$$('[data-t]',el).forEach(b=>b.onclick=()=>{$$('[data-t]',el).forEach(x=>x.classList.toggle('on',x===b));$('#pe0',el).hidden=b.dataset.t!=='0';$('#pe1',el).hidden=b.dataset.t!=='1'})});

add('pengaruh','Pengaruh nilai gradien',`<div class="pin"><span class="badge">Simulasi</span><h2>Pengaruh gradien terhadap <span class="grad">kemiringan</span></h2><div class="cols mid"><div class="card"><svg class="plane" id="ip"></svg></div><div><p style="margin-top:0">Atur dua garis yang melalui titik asal: <b style="color:#C4B5FD">garis 1</b> dan <b class="rn">garis 2</b>.</p>${SLD('i1',-5,5,.5,1,'Gradien garis 1')}${SLD('i2',-5,5,.5,3,'Gradien garis 2')}<div class="callout info" id="it"></div><div class="callout">Tantangan: buat dua garis yang sama curam tetapi arahnya berlawanan.</div></div></div><div class="cols c4" style="margin-top:12px">${[['|m| besar','garis makin curam'],['|m| kecil','garis makin landai'],['m &gt; 0','garis naik'],['m &lt; 0','garis turun']].map(a=>`<div class="card center"><b class="gm">${a[0]}</b><p style="margin:4px 0 0">${a[1]}</p></div>`).join('')}</div></div>`,el=>{
 const svg=$('#ip',el),P=Plane(svg),a=$('#i1',el),b=$('#i2',el);
 const draw=()=>{const m1=+a.value,m2=+b.value;$('[data-v="i1"]',el).textContent=nf(m1);$('[data-v="i2"]',el).textContent=nf(m2);svg.innerHTML=P.base()+P.line(m1,0,VI,3.5)+P.line(m2,0,CY,3.5);
  const A=Math.abs(m1),B=Math.abs(m2);$('#it',el).innerHTML=A===B?(A===0?'Kedua garis horizontal.':'Kedua garis <b>sama curam</b> karena |m| sama'+(m1===m2?' (bahkan berimpit).':', tetapi arahnya berlawanan.')):`Garis ${A>B?'1':'2'} <b>lebih curam</b> karena |${nf(A>B?m1:m2)}| = ${nf(Math.max(A,B))} lebih besar dari ${nf(Math.min(A,B))}.`};
 a.oninput=draw;b.oninput=draw;draw()});

add('contoh2','Contoh 2',`<div class="pin"><span class="badge a">Contoh 2 · membaca grafik</span><h2>Gradien dari <span class="grad">grafik</span></h2><div class="cols"><div class="card"><svg class="plane" id="e2p"></svg></div><div><p style="margin-top:0">Garis pada grafik melalui titik <b class="rn">(-3, -1)</b> dan <b class="up">(3, 3)</b>. Berapa gradiennya?</p><div class="row"><input class="inp" id="e2i" placeholder="mis. 2/3" aria-label="gradien"><button class="btn sm primary" id="e2k">Periksa</button><button class="btn sm ghost" id="e2s">Lihat langkah</button></div><div class="callout" id="e2f" hidden></div></div></div></div>`,el=>{
 const svg=$('#e2p',el),P=Plane(svg);svg.innerHTML=P.base()+P.line(2/3,1,VI,3.5)+P.pt(-3,-1,CY,'(-3,-1)')+P.pt(3,3,PK,'(3,3)')+P.pt(0,1,YL,'',0,0,5);const f=$('#e2f',el);
 $('#e2k',el).onclick=()=>{const v=parseAns($('#e2i',el).value),ok=Math.abs(v-2/3)<.011;f.hidden=false;f.className='callout '+(ok?'ok':'no');f.innerHTML=ok?'<b>Benar!</b> m = 2/3.':'Belum tepat. Hitung Δy dan Δx dari kedua titik, lalu bagi.'};
 $('#e2s',el).onclick=()=>{f.hidden=false;f.className='callout info';f.innerHTML='Δy = 3 - (-1) = 4<br>Δx = 3 - (-3) = 6<br>m = 4/6 = <b>2/3</b>. Garis naik, gradien positif.';svg.innerHTML=P.base()+P.line(2/3,1,VI,3.5)+P.seg(-3,-1,3,-1,CY,'7 5',3)+P.seg(3,-1,3,3,PK,'7 5',3)+P.pt(-3,-1,CY,'')+P.pt(3,3,PK,'')+P.txt(0,-1.8,'Δx = 6',CY)+P.txt(3.3,1,'Δy = 4',PK,'start')}});

add('contoh3','Contoh 3',`<div class="pin"><span class="badge a">Contoh 3 · gradien negatif</span><h2>Garis melalui <span class="grad">A(-3, 4)</span> dan <span class="grad">B(3, -2)</span></h2><div class="cols"><div class="card"><svg class="plane" id="e3p"></svg></div><div><ol class="steps"><li>Tentukan titik: A(-3, 4) dan B(3, -2).</li><li>Δy = -2 - 4 = <b class="up">-6</b> (turun 6).</li><li>Δx = 3 - (-3) = <b class="rn">6</b> (maju 6).</li><li>m = -6/6 = <b class="gm">-1</b>. Garis turun, gradien negatif.</li></ol>${stepBtns}</div></div></div>`,el=>{
 const svg=$('#e3p',el),P=Plane(svg);Stepper(el,i=>{let s=P.base()+P.pt(-3,4,CY,'A(-3,4)')+P.pt(3,-2,PK,'B(3,-2)');if(i>=1)s+=P.seg(3,4,3,-2,PK,'7 5',3.5)+P.txt(3.3,1,'Δy = -6',PK,'start');if(i>=2)s+=P.seg(-3,4,3,4,CY,'7 5',3.5)+P.txt(0,4.8,'Δx = 6',CY);if(i>=3)s+=P.line(-1,1,VI,3.5);svg.innerHTML=s})});

add('contoh4','Contoh 4',`<div class="pin"><span class="badge a">Contoh 4 · dari persamaan</span><h2>Mana yang lebih <span class="grad">curam</span>?</h2><div class="cols"><div class="card"><svg class="plane" id="e4p"></svg></div><div><p style="margin-top:0">Garis p: <b class="mono" style="color:#C4B5FD">y = -3x + 5</b><br>Garis q: <b class="mono rn">y = 2x - 1</b></p><p>Tentukan gradien tiap garis, lalu tentukan garis yang lebih curam.</p><div class="row"><button class="btn sm primary" id="e4s">Lihat penyelesaian</button></div><div class="callout info" id="e4f" hidden></div></div></div></div>`,el=>{
 const svg=$('#e4p',el),P=Plane(svg);svg.innerHTML=P.base();
 $('#e4s',el).onclick=()=>{svg.innerHTML=P.base()+P.line(-3,5,VI,3.5)+P.line(2,-1,CY,3.5);const f=$('#e4f',el);f.hidden=false;f.innerHTML='Garis p: m = <b>-3</b> (koefisien x).<br>Garis q: m = <b>2</b>.<br>Bandingkan |m|: |-3| = 3 lebih besar dari |2| = 2.<br><b class="gm">Garis p lebih curam</b> (menurun), garis q lebih landai (menaik).'}});

add('contoh5','Contoh 5',`<div class="pin"><span class="badge a">Contoh 5 · kasus khusus</span><h2>Dua titik, dua <span class="grad">kasus</span></h2><div class="row"><button class="btn sm on" data-t="0">(a) (2, 5) dan (7, 5)</button><button class="btn sm" data-t="1">(b) (3, -1) dan (3, 6)</button></div><div class="cols"><div class="card"><svg class="plane" id="e5p"></svg></div><div id="e5t"></div></div></div>`,el=>{
 const svg=$('#e5p',el),P=Plane(svg),T=[{h:'<ol class="steps"><li>Δy = 5 - 5 = <b class="up">0</b>.</li><li>Δx = 7 - 2 = <b class="rn">5</b>.</li><li>m = 0/5 = <b class="gm">0</b>. Garis horizontal y = 5.</li></ol>'+stepBtns,d:()=>P.base()+P.line(0,5,VI,3.5)+P.pt(2,5,CY,'(2,5)')+P.pt(6,5,PK,'(7,5)',-30,-10)},{h:'<ol class="steps"><li>Δy = 6 - (-1) = <b class="up">7</b>.</li><li>Δx = 3 - 3 = <b class="rn">0</b>.</li><li>m = 7/0: pembagian dengan nol, jadi <b class="gm">gradien tidak terdefinisi</b>. Garis vertikal x = 3.</li></ol>'+stepBtns,d:()=>P.base()+P.vline(3,VI,3.5)+P.pt(3,-1,CY,'(3,-1)')+P.pt(3,6,PK,'(3,6)')}];
 const set=k=>{$$('[data-t]',el).forEach(x=>x.classList.toggle('on',x.dataset.t==k));const t=$('#e5t',el);t.innerHTML=T[k].h;svg.innerHTML=T[k].d();Stepper(t)};

add('pasang','Pasangkan',`<div class="pin"><span class="badge g">Aktivitas · menjodohkan</span><h2>Pasangkan <span class="grad">persamaan</span> dengan gradiennya</h2><p>Ketuk satu persamaan, lalu ketuk gradien pasangannya.</p><div class="mt"><div id="ml"></div><div id="mr"></div></div><div class="callout info" id="mf">Pasangan benar: 0 / 5</div><div class="row"><button class="btn sm ghost" id="mx">Ulangi</button></div></div>`,el=>{
 const L=[['y = 5x - 2','5'],['y = -x + 7','-1'],['y = 1/2 x + 3','1/2'],['y = -3','0'],['x = 4','tidak terdefinisi']],RO=[2,4,0,3,1];let sel=null,ok=0;
 const build=()=>{sel=null;ok=0;$('#ml',el).innerHTML=L.map((l,i)=>`<button class="opt" data-l="${i}">${l[0]}</button>`).join('');$('#mr',el).innerHTML=RO.map(i=>`<button class="opt" data-r="${i}">${L[i][1]}</button>`).join('');$('#mf',el).textContent='Pasangan benar: 0 / 5';
  $$('[data-l]',el).forEach(b=>b.onclick=()=>{if(b.classList.contains('good'))return;$$('[data-l]',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l});
  $$('[data-r]',el).forEach(b=>b.onclick=()=>{if(sel===null||b.classList.contains('good'))return;const lb=$('[data-l="'+sel+'"]',el);if(+b.dataset.r===sel){b.classList.add('good');lb.classList.remove('sel');lb.classList.add('good');ok++;sel=null;$('#mf',el).textContent=ok===5?'Semua pasangan benar. Hebat!':'Pasangan benar: '+ok+' / 5'}else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),320)}})};
 $('#mx',el).onclick=build;build()});

add('bs','Benar atau salah',`<div class="pin"><span class="badge g">Aktivitas · benar/salah</span><h2>Benar atau <span class="grad">salah</span>?</h2><div id="bsq"></div></div>`,el=>{
 const Q=[['Garis yang naik dari kiri ke kanan memiliki gradien positif.',1,'Benar. Naik ke kanan berarti Δy dan Δx bertanda sama, jadi m &gt; 0.'],['Garis horizontal memiliki gradien tidak terdefinisi.',0,'Salah. Garis horizontal memiliki gradien 0. Yang tidak terdefinisi adalah garis vertikal.'],['Pada y = -4x + 2, gradiennya adalah 2.',0,'Salah. Gradien adalah koefisien x, yaitu -4. Angka 2 adalah titik potong sumbu-y.'],['Semakin besar nilai |m|, garis semakin curam.',1,'Benar. Nilai mutlak gradien menentukan kecuraman.'],['Garis vertikal tidak memiliki gradien yang terdefinisi.',1,'Benar. Δx = 0 sehingga Δy/Δx tidak terdefinisi.'],['Garis y = 3x lebih curam daripada y = -2x.',1,'Benar. |3| = 3 lebih besar dari |-2| = 2.']];

 $$('.card',el).forEach((c,i)=>$$('[data-a]',c).forEach(b=>b.onclick=()=>{const ok=+b.dataset.a===Q[i][1],f=$('.callout',c);f.hidden=false;f.className='callout '+(ok?'ok':'no');f.innerHTML=(ok?'<b>Tepat!</b> ':'<b>Belum tepat.</b> ')+Q[i][2];$$('[data-a]',c).forEach(x=>x.disabled=true)}))});

add('latmudah','Latihan 1: mudah',`<div class="pin"><span class="badge g">Latihan · mudah</span><h2>Latihan <span class="grad">mudah</span></h2><p>Tulis jawaban berupa bilangan, pecahan (mis. 1/2), atau desimal. Jika tidak terdefinisi, tulis "tidak terdefinisi".</p><div id="pl"></div></div>`,el=>practice($('#pl',el),[

add('latsedang','Latihan 2: sedang',`<div class="pin"><span class="badge a">Latihan · sedang</span><h2>Latihan <span class="grad">sedang</span></h2><div id="pl"></div></div>`,el=>practice($('#pl',el),[
 {q:'Garis melalui A(1, 3) dan B(5, 11). Gradiennya ...',a:2,h:'Δy = 11 - 3, Δx = 5 - 1.',ok:'m = 8/4 = 2.',s:'Δy = 11 - 3 = 8. Δx = 5 - 1 = 4. m = 8/4 = 2.'},
 {q:'Garis melalui P(-2, 5) dan Q(4, -1). Gradiennya ...',a:-1,h:'Hati-hati dengan tanda: -1 - 5 dan 4 - (-2).',ok:'m = -6/6 = -1.',s:'Δy = -1 - 5 = -6. Δx = 4 - (-2) = 6. m = -6/6 = -1.'},
 {q:'Gradien garis y = (3/4)x - 2 adalah ... (tulis 3/4 atau 0,75)',a:.75,h:'Koefisien x adalah pecahan 3/4.',ok:'m = 3/4.',s:'Koefisien x adalah 3/4, jadi m = 3/4 = 0,75.'},

add('kuis','Kuis',`<div class="pin"><span class="badge v">Kuis akhir</span><h2>Uji <span class="grad">pemahamanmu</span></h2><div id="kq"></div></div>`,el=>Quiz($('#kq',el),[

add('refleksi','Refleksi',`<div class="pin"><span class="badge v">Refleksi</span><h2>Bagaimana <span class="grad">pemahamanmu</span>?</h2><p>Centang pernyataan yang sudah kamu kuasai.</p><div id="rf"></div><div class="callout info" id="rm"></div><div class="card"><h4>Renungkan</h4><p style="margin:4px 0">Di mana kamu menemukan kemiringan di sekitarmu? Bagian mana yang paling membantumu memahami gradien? Bagian mana yang perlu kamu ulangi?</p></div></div>`,el=>{
 const L=['Saya dapat menjelaskan gradien sebagai perbandingan naik : maju.','Saya dapat menghitung gradien dari dua titik.','Saya dapat mengenali gradien positif dan negatif dari grafik.','Saya tahu gradien garis horizontal adalah nol.','Saya tahu gradien garis vertikal tidak terdefinisi.','Saya dapat menentukan gradien dari persamaan y = mx + c.','Saya dapat menjelaskan pengaruh |m| terhadap kecuraman garis.'];
 $('#rf',el).innerHTML=L.map((l,i)=>`<label class="chk"><input type="checkbox" data-i="${i}"><span>${l}</span></label>`).join('');
 const up=()=>{const n=$$('input:checked',el).length;$('#rm',el).textContent=n+' dari '+L.length+' pernyataan sudah kamu kuasai. '+(n===L.length?'Luar biasa, kamu siap!':n>=5?'Hampir sempurna. Ulangi bagian yang belum dicentang.':'Ulangi slide yang berkaitan, lalu coba lagi.')};
 $$('input',el).forEach(i=>i.onchange=up);up()});

add('rangkuman','Rangkuman',`<div class="pin"><span class="badge g">Rangkuman</span><h2>Yang sudah kita <span class="grad">pelajari</span></h2><div class="eq">m = Δy / Δx = (y₂ - y₁) / (x₂ - x₁)</div><div class="cols c3">${[['Gradien','Ukuran kemiringan garis: perbandingan naik/turun terhadap maju.'],['Positif (m &gt; 0)','Garis naik dari kiri ke kanan.'],['Negatif (m &lt; 0)','Garis turun dari kiri ke kanan.'],['Nol (m = 0)','Garis horizontal, persamaan y = c.'],['Tidak terdefinisi','Garis vertikal (Δx = 0), persamaan x = k.'],['y = mx + c','m adalah gradien dan c titik potong sumbu-y.'],['Kecuraman','Semakin besar |m|, garis semakin curam.']].map(c=>`<div class="card"><h4 class="gm">${c[0]}</h4><p style="margin:0;font-size:.94rem">${c[1]}</p></div>`).join('')}</div></div>`);

add('penutup','Penutup',`<div class="pin center"><span class="badge g">Selesai</span><h1>Kerja <span class="grad">hebat!</span></h1><p class="lead" style="margin:0 auto 6px">Kamu sudah memahami gradien garis lurus: dari tangga dan jalan menanjak sampai persamaan y = mx + c.</p><div class="row c"><button class="btn primary" onclick="goTo(0)">Kembali ke awal</button><button class="btn" onclick="goId('kuis')">Ulangi kuis</button></div></div>`);

/* ================= RENDER & NAVIGASI ================= */
const stage=$('#stage');
stage.innerHTML=SL.map(s=>`<section class="slide" id="s-${s.id}" aria-label="${s.t}">${s.h}</section>`).join('');
$('#dots').innerHTML=SL.map((s,i)=>`<i title="${s.t}" onclick="goTo(${i})"></i>`).join('');
let cur=0;const seen=new Set();
SL.forEach(s=>{const el=document.getElementById('s-'+s.id);if(s.i)s.i(el)});
function goTo(i){if(i<0||i>=SL.length)return;cur=i;seen.add(i);$$('.slide').forEach((s,k)=>s.classList.toggle('active',k===i));$('.slide.active').scrollTop=0;
 $('#cnt').textContent=(i+1)+' / '+SL.length;$('#stitle').textContent=SL[i].t;$('#bar').style.width=((i+1)/SL.length*100)+'%';
 $('#prev').disabled=i===0;$('#next').disabled=i===SL.length-1;$$('#dots i').forEach((d,k)=>{d.classList.toggle('on',k===i);d.classList.toggle('dn',k!==i&&seen.has(k))})}
const next=()=>goTo(cur+1),prev=()=>goTo(cur-1),goId=id=>goTo(SL.findIndex(s=>s.id===id));
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
goTo(0);
</script>
