<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>5.5 Penggunaan Spreadsheet untuk Analisis Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1319;
  --bg-grid:#111923;
  --panel:#151f2a;
  --panel-2:#1b2733;
  --panel-3:#20303f;
  --line:#2a3947;
  --line-soft:#1e2a36;
  --text:#e9eff5;
  --text-muted:#93a5b8;
  --text-faint:#5b6c7e;
  --accent:#4fd6b0;
  --accent-dim:#2a5548;
  --amber:#f2b24d;
  --amber-dim:#4a3a20;
  --blue:#6f93ff;
  --red:#ef7a68;
  --red-dim:#4a2a24;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:24px;
  --font-head:'Fredoka',sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --maxw:920px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(180deg, rgba(13,19,25,0.94), rgba(13,19,25,0.98)),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 41px, var(--line-soft) 41px 42px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 68px, var(--line-soft) 68px 69px);
  background-color:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#062019;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

/* ---------- App shell ---------- */
#app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}

.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:var(--line-soft);z-index:60;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .45s cubic-bezier(.4,0,.2,1);}

.slides-viewport{flex:1;position:relative;overflow:hidden;padding:44px 24px 96px;display:flex;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  padding:44px 24px 96px;
  opacity:0;pointer-events:none;
  transform:translateX(24px);
  transition:opacity .38s ease, transform .38s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.slide.leave-left{transform:translateX(-24px);}

.slide-inner{width:100%;max-width:var(--maxw);margin:0 auto;padding-bottom:20px;}

/* fx bar — recurring structural device: each slide is a "cell" in the workbook */
.fx-bar{
  display:flex;align-items:center;gap:0;
  width:100%;max-width:var(--maxw);margin:0 auto 28px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  overflow:hidden;font-family:var(--font-mono);font-size:13px;
}
.fx-namebox{
  padding:9px 14px;background:var(--panel-2);color:var(--accent);
  border-right:1px solid var(--line);min-width:52px;text-align:center;font-weight:600;
}
.fx-fx{padding:9px 12px;color:var(--text-faint);border-right:1px solid var(--line);font-style:italic;}
.fx-content{padding:9px 16px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.eyebrow{display:none;} /* intentionally unused — avoided per design guidance */

h1.slide-title{
  font-family:var(--font-head);font-weight:600;
  font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0 0 14px;color:var(--text);
}
h2.section-title{
  font-family:var(--font-head);font-weight:600;
  font-size:clamp(20px,3vw,26px);margin:0 0 12px;color:var(--text);
}
p.lead{font-size:16.5px;line-height:1.65;color:var(--text-muted);margin:0 0 18px;max-width:70ch;}
p{line-height:1.65;color:var(--text-muted);}
strong{color:var(--text);font-weight:600;}
code, .cellref{font-family:var(--font-mono);}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:20px 22px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:12px;color:var(--accent);
  background:var(--accent-dim);border:1px solid #3a6a58;padding:3px 10px;border-radius:20px;
}

.btn{
  font-family:var(--font-body);font-weight:600;font-size:14.5px;
  padding:11px 20px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);cursor:pointer;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{background:var(--panel-3);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#062019;}
.btn-primary:hover{background:#63e0bf;}
.btn-ghost{background:transparent;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ---------- Bottom navigation ---------- */
.nav-bar{
  position:fixed;left:0;bottom:0;width:100%;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 22px;background:rgba(19,27,35,.9);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;
}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn:not(:disabled):hover{background:var(--panel-3);}
.nav-mid{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);color:var(--text-muted);font-size:13px;}
.nav-home{color:var(--text-faint);background:transparent;border:none;cursor:pointer;font-size:13px;font-family:var(--font-mono);}
.nav-home:hover{color:var(--accent);}

/* ---------- Mini spreadsheet component ---------- */
.sheet{border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--panel);}
.sheet-toolbar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:13px;
}
.sheet-toolbar .fxlabel{color:var(--text-faint);font-style:italic;}
.sheet-toolbar .formula-text{color:var(--accent);font-weight:600;}
.sheet-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:14px;}
.sheet-table th{
  background:var(--panel-2);color:var(--text-faint);font-weight:600;font-size:12px;
  padding:7px 0;border:1px solid var(--line);width:64px;
}
.sheet-table td{
  border:1px solid var(--line);text-align:center;padding:9px 6px;color:var(--text);
  cursor:pointer;user-select:none;transition:background .12s ease;background:var(--bg-grid);
}
.sheet-table td.rowhead{background:var(--panel-2);color:var(--text-faint);cursor:default;font-size:12px;}
.sheet-table td.label{background:var(--panel-2);color:var(--text-muted);cursor:default;text-align:left;padding-left:10px;font-family:var(--font-body);}
.sheet-table td.selectable:hover{background:#22323f;}
.sheet-table td.selected{background:var(--accent-dim);color:var(--accent);outline:1px solid var(--accent);outline-offset:-1px;}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap;}
.sheet-result{font-family:var(--font-mono);font-size:14px;color:var(--text-muted);min-height:20px;}
.sheet-result.show .val{color:var(--accent);font-weight:700;font-size:16px;}
.hint-small{font-size:12.5px;color:var(--text-faint);padding:0 14px 12px;}

/* ---------- Accordion ---------- */
.accordion-item{border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;overflow:hidden;background:var(--panel);}
.accordion-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;cursor:pointer;background:var(--panel);
}
.accordion-head:hover{background:var(--panel-2);}
.accordion-head .term{font-weight:700;color:var(--text);font-family:var(--font-head);font-size:16px;}
.accordion-head .chev{color:var(--accent);transition:transform .25s ease;font-size:14px;}
.accordion-item.open .chev{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.accordion-item.open .accordion-body{max-height:260px;}
.accordion-body-inner{padding:0 16px 16px;color:var(--text-muted);font-size:14.5px;line-height:1.6;}

/* ---------- Hotspot diagram ---------- */
.mockup{position:relative;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--panel);}
.mockup-topbar{display:flex;border-bottom:1px solid var(--line);}
.mockup-namebox{width:70px;padding:8px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);border-right:1px solid var(--line);background:var(--panel-2);}
.mockup-formulabar{flex:1;padding:8px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text-faint);background:var(--bg-grid);}
.mockup-grid{display:grid;grid-template-columns:34px repeat(4,1fr);}
.mockup-cell{border:1px solid var(--line-soft);height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);font-family:var(--font-mono);background:var(--bg-grid);}
.mockup-headcell{background:var(--panel-2);color:var(--text-muted);}
.hotspot{
  position:absolute;width:22px;height:22px;border-radius:50%;
  background:var(--amber);border:2px solid #0d1319;color:#0d1319;font-weight:800;font-size:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,178,77,.5);}50%{box-shadow:0 0 0 7px rgba(242,178,77,0);}}
.hotspot-note{
  display:none;margin-top:14px;padding:14px 16px;border-radius:var(--radius-s);
  background:var(--panel-2);border:1px solid var(--line);font-size:14.5px;color:var(--text-muted);
}
.hotspot-note.show{display:block;}
.hotspot-note b{color:var(--amber);}

/* ---------- Chips / classify ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.chip{
  padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);
  font-family:var(--font-mono);font-size:13.5px;cursor:pointer;color:var(--text);
}
.chip.picked{border-color:var(--blue);color:var(--blue);}
.chip.correct{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.chip.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.bucket-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
@media (max-width:720px){.bucket-row{grid-template-columns:1fr;}}
.bucket{border:1px dashed var(--line);border-radius:var(--radius-s);padding:12px;text-align:center;color:var(--text-muted);font-size:13px;cursor:pointer;min-height:52px;}
.bucket.active-target{border-color:var(--blue);color:var(--blue);}

/* ---------- Matching ---------- */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px;}
@media (max-width:720px){.match-cols{grid-template-columns:1fr;}}
.match-item{
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);
  margin-bottom:10px;cursor:pointer;font-size:14.5px;color:var(--text);
}
.match-item.selected{border-color:var(--blue);background:#17233a;}
.match-item.matched{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);cursor:default;}
.match-item.shake{animation:shake .32s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* ---------- Steps ---------- */
.step-list{counter-reset:step;}
.step{display:flex;gap:14px;margin-bottom:16px;}
.step-num{
  counter-increment:step;flex:none;width:34px;height:34px;border-radius:50%;
  background:var(--panel-2);border:1px solid var(--line);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;
}
.step-num::before{content:counter(step);}
.step-body{flex:1;padding-top:4px;}
.step-body .stitle{font-weight:700;color:var(--text);margin-bottom:3px;}

/* ---------- Sort/table demo ---------- */
.data-table{width:100%;border-collapse:collapse;font-size:14.5px;}
.data-table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);color:var(--text);}
.data-table tr{transition:transform .3s ease;}

/* ---------- Chart ---------- */
.chart-wrap{border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 18px 8px;background:var(--panel);}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-label{width:64px;flex:none;font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);text-align:right;}
.bar-track{flex:1;background:var(--bg-grid);border-radius:4px;overflow:hidden;height:20px;}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .8s cubic-bezier(.4,0,.2,1);border-radius:4px;}
.bar-val{width:34px;flex:none;font-family:var(--font-mono);font-size:12.5px;color:var(--text-faint);}

/* ---------- Fill-in blanks (case study) ---------- */
.blank-input{
  font-family:var(--font-mono);font-size:14px;width:150px;padding:7px 10px;
  background:var(--bg-grid);border:1px solid var(--line);border-radius:6px;color:var(--text);
}
.blank-input:focus{border-color:var(--accent);}
.blank-input.ok{border-color:var(--accent);color:var(--accent);}
.blank-input.bad{border-color:var(--red);color:var(--red);}
.feedback-icon{margin-left:6px;font-size:13px;}

/* ---------- Quiz ---------- */
.quiz-progress{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.quiz-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.quiz-dot.answered{background:var(--accent);}
.quiz-dot.current{outline:2px solid var(--blue);outline-offset:2px;}
.opt-btn{
  display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  color:var(--text);font-size:14.5px;cursor:pointer;
}
.opt-btn:hover{border-color:var(--blue);}
.opt-btn.correct{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.opt-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.opt-btn:disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--line);font-size:14px;color:var(--text-muted);display:none;}
.explain-box.show{display:block;}
.quiz-score{text-align:center;padding:30px 10px;}
.quiz-score .num{font-family:var(--font-head);font-size:56px;color:var(--accent);}
.quiz-score .of{color:var(--text-faint);font-family:var(--font-mono);}

/* ---------- Reflection ---------- */
textarea.reflect{
  width:100%;min-height:80px;background:var(--bg-grid);border:1px solid var(--line);
  border-radius:var(--radius-s);color:var(--text);font-family:var(--font-body);font-size:14.5px;
  padding:12px;resize:vertical;
}
textarea.reflect:focus{border-color:var(--accent);}
.checklist label{display:flex;align-items:center;gap:10px;padding:9px 0;color:var(--text-muted);font-size:14.5px;cursor:pointer;}
.checklist input{accent-color:var(--accent);width:17px;height:17px;}

/* ---------- Cover ---------- */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding-top:20px;}
.cover-grid{position:relative;width:min(340px,80vw);height:150px;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:26px;background:var(--panel);}
.cover-grid .g{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);}
.cover-grid .g div{border:1px solid var(--line-soft);}
.cover-grid .active-cell{position:absolute;width:calc(100%/6);height:calc(100%/4);border:2px solid var(--accent);background:rgba(79,214,176,.12);animation:moveCell 6s linear infinite;}
@keyframes moveCell{
  0%{left:0%;top:0%;} 12%{left:16.6667%;top:0%;} 24%{left:33.3333%;top:0%;}
  36%{left:33.3333%;top:25%;} 48%{left:50%;top:25%;} 60%{left:50%;top:50%;}
  72%{left:66.6667%;top:50%;} 84%{left:66.6667%;top:75%;} 100%{left:0%;top:0%;}
}
.kode-badge{font-family:var(--font-mono);color:var(--amber);background:var(--amber-dim);border:1px solid #6b552a;padding:4px 12px;border-radius:20px;font-size:12.5px;margin-bottom:16px;display:inline-block;}
.cover-wrap h1{font-size:clamp(30px,6vw,48px);}
.cover-wrap .sub{color:var(--text-muted);font-size:16px;max-width:60ch;margin-bottom:30px;}

/* ---------- Summary cards ---------- */
.summary-card{border-left:3px solid var(--accent);padding:14px 18px;background:var(--panel);border-radius:0 var(--radius-s) var(--radius-s) 0;margin-bottom:12px;}
.summary-card b{color:var(--text);}

/* scrollbar */
.slide::-webkit-scrollbar{width:8px;}
.slide::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

@media (max-width:600px){
  .nav-mid span.hint{display:none;}
  .sheet-table{font-size:12px;}
  .fx-content{font-size:12px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="slides-viewport" id="viewport"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">‹ Sebelumnya</button>
    <div class="nav-mid">
      <button class="nav-home" id="homeBtn" title="Kembali ke awal">⌂ Awal</button>
      <span id="slideCounter">1 / 1</span>
      <span class="hint" style="color:var(--text-faint);">&nbsp;·&nbsp; gunakan ← →</span>
    </div>
    <button class="nav-btn" id="nextBtn">Berikutnya ›</button>
  </div>
</div>

<template id="slide-template"></template>

<script>
/* =========================================================================
   DATA — konten pembelajaran (Kode 5.5)
   Materi Pokok : Memasukkan data, menggunakan rumus sederhana, fungsi
                   statistik dasar, serta mengolah data dengan spreadsheet
   Submateri     : Penggunaan Spreadsheet untuk Analisis Data
   ========================================================================= */

const SLIDES = [];
function addSlide(html){ SLIDES.push(html); }

/* ---------- 1. Cover ---------- */
addSlide(`
<div class="cover-wrap">
  <span class="kode-badge">Kode 5.5 · Analisis Data</span>
  <div class="cover-grid"><div class="g">${'<div></div>'.repeat(24)}</div><div class="active-cell"></div></div>
  <h1 class="slide-title">Penggunaan Spreadsheet<br>untuk Analisis Data</h1>
  <p class="sub">Belajar memasukkan data, menulis rumus sederhana, memakai fungsi statistik dasar, dan mengolah data memakai spreadsheet — langkah demi langkah, sambil praktik langsung.</p>
  <button class="btn btn-primary" id="startBtn">Mulai Belajar →</button>
</div>
`);

/* ---------- 2. Apersepsi ---------- */
addSlide(`
<h1 class="slide-title">Sebelum Mulai, Coba Pikirkan Dulu</h1>
<p class="lead">Bu Nadia adalah wali kelas dengan 30 siswa. Ia perlu mencari nilai rata-rata, nilai tertinggi, dan nilai terendah dari hasil ulangan seluruh siswa — hari itu juga, untuk dibagikan ke orang tua.</p>
<div class="card">
  <p style="margin:0 0 14px;color:var(--text);font-weight:600;">Kira-kira, cara mana yang paling masuk akal untuk Bu Nadia?</p>
  <div id="apersepsiOpts"></div>
  <div class="hotspot-note" id="apersepsiNote"></div>
</div>
`);

/* ---------- 3. Tujuan Pembelajaran ---------- */
addSlide(`
<h1 class="slide-title">Tujuan Pembelajaran</h1>
<p class="lead">Setelah menyelesaikan pembelajaran ini, kalian diharapkan mampu:</p>
<div class="card" style="padding:8px 0;">
  <table class="sheet-table" style="border:none;">
    <tbody id="tujuanBody"></tbody>
  </table>

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let current = 0;
const total = SLIDES.length;
const slideEls = Array.from(document.querySelectorAll('.slide'));
const progressFill = document.getElementById('progressFill');
const counter = document.getElementById('slideCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function goTo(idx){
  if(idx < 0 || idx >= total) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  slideEls[current].scrollTop = 0;
  progressFill.style.width = ((current)/(total-1)*100) + '%';
  counter.textContent = (current+1) + ' / ' + total;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}
prevBtn.addEventListener('click', () => goTo(current-1));
nextBtn.addEventListener('click', () => goTo(current+1));
document.getElementById('homeBtn').addEventListener('click', () => goTo(0));
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'textarea' || tag === 'input') return;
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});
goTo(0);

document.addEventListener('click', (e) => {
  if(e.target.id === 'startBtn') goTo(1);
  if(e.target.id === 'restartBtn') goTo(0);
});

/* =========================================================================
   SLIDE 6 — Classify chips
   ========================================================================= */
(function(){
  const items = [
    {v:"152", cat:"angka"},
    {v:"Ahmad Fauzi", cat:"teks"},
    {v:"09/09/2026", cat:"tanggal"},
    {v:"7.5", cat:"angka"},
    {v:"Kelas VII-B", cat:"teks"},
    {v:"17 Agustus 1945", cat:"tanggal"}
  ];
  const chipRow = document.getElementById('classifyChips');
  const progressEl = document.getElementById('classifyProgress');
  let selected = null;
  let correctCount = 0;

  items.forEach((it,i)=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = it.v;
    chip.dataset.cat = it.cat;
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('correct')) return;
      chipRow.querySelectorAll('.chip').forEach(c=>c.classList.remove('picked'));
      chip.classList.add('picked');
      selected = chip;
    });
    chipRow.appendChild(chip);
  });

  document.querySelectorAll('#classifyBuckets .bucket').forEach(bucket=>{
    bucket.addEventListener('click', ()=>{
      if(!selected) return;
      if(selected.dataset.cat === bucket.dataset.cat){
        selected.classList.remove('picked');
        selected.classList.add('correct');
        selected.style.pointerEvents = 'none';
        correctCount++;
        progressEl.textContent = correctCount + ' / ' + items.length + ' benar';
      } else {
        selected.classList.add('wrong');
        setTimeout(()=> selected.classList.remove('wrong'), 500);
      }
      selected = null;
    });
  });
})();

/* =========================================================================

(function(){
  const a = 12, b = 5;
  const formulaEl = document.getElementById('opFormula');
  const resultCell = document.getElementById('opResultCell');
  const resultBox = document.getElementById('opResult');
  document.getElementById('opButtons').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-op]');
    if(!btn) return;
    const op = btn.dataset.op;
    let res;
    let sym = op;
    if(op === '+') res = a + b;
    if(op === '-') res = a - b;
    if(op === '*'){ res = a * b; sym = '×'; }
    if(op === '/'){ res = (a / b).toFixed(2); sym = '÷'; }
    formulaEl.textContent = `=A1${op}B1`;
    resultCell.textContent = res;
    resultCell.style.color = 'var(--accent)';
    resultBox.querySelector('.val') ? null : resultBox.innerHTML = 'Hasil: <span class="val"></span>';
    resultBox.innerHTML = `Hasil: A1 ${sym} B1 = <span class="val">${res}</span>`;
  });
})();

/* =========================================================================
   REUSABLE — Mini sheet dengan seleksi rentang (SUM/AVERAGE/COUNT)
   ========================================================================= */
function initSelectableSheets(){
  document.querySelectorAll('.sheet[data-fn]').forEach(sheet=>{
    const fn = sheet.dataset.fn;
    const cells = sheet.querySelectorAll('td.selectable');
    const formulaEl = sheet.querySelector('.js-formula');
    const resultEl = sheet.querySelector('.js-result');
    cells.forEach(cell=>{
      cell.addEventListener('click', ()=>{
        cell.classList.toggle('selected');
        const selected = sheet.querySelectorAll('td.selectable.selected');
        if(selected.length === 0){
          formulaEl.textContent = `=${fn}()`;
        } else {
          const refs = Array.from(selected).map(c => 'B' + (Array.from(cells).indexOf(c)+1));
          formulaEl.textContent = `=${fn}(${refs.join(',')})`;
        }
      });
    });
    sheet.querySelector('.js-calc').addEventListener('click', ()=>{
      const selected = sheet.querySelectorAll('td.selectable.selected');
      if(selected.length === 0){
        resultEl.textContent = 'Pilih dahulu sel yang ingin dihitung.';
        return;
      }
      let res;
      if(fn === 'SUM'){
        res = Array.from(selected).reduce((s,c)=> s + parseFloat(c.dataset.val||0), 0);
      } else if(fn === 'AVERAGE'){
        const sum = Array.from(selected).reduce((s,c)=> s + parseFloat(c.dataset.val||0), 0);
        res = (sum / selected.length).toFixed(2);
      } else if(fn === 'COUNT'){
        res = Array.from(selected).filter(c => !c.dataset.text).length;
      }
      resultEl.classList.add('show');
      resultEl.innerHTML = `Hasil: <span class="val">${res}</span>`;
    });
  });
}
initSelectableSheets();

/* =========================================================================
   SLIDE 12 — MAX/MIN
   ========================================================================= */
(function(){
  const table = document.getElementById('mmTable');
  const cells = table.querySelectorAll('td[data-val]');
  const resultEl = document.getElementById('mmResult');
  const formulaEl = document.getElementById('mmFormula');
  function run(fn){
    cells.forEach(c=>c.classList.remove('selected'));
    const values = Array.from(cells).map(c=>parseFloat(c.dataset.val));
    const target = fn === 'MAX' ? Math.max(...values) : Math.min(...values);
    cells.forEach(c=>{ if(parseFloat(c.dataset.val) === target) c.classList.add('selected'); });
    formulaEl.textContent = `=${fn}(B1:B5)`;
    resultEl.innerHTML = `Hasil <strong style="color:${fn==='MAX'?'var(--accent)':'var(--amber)'};">${fn}</strong> = <span style="color:var(--accent);font-weight:700;">${target}°C</span>`;
  }
  document.getElementById('mmMaxBtn').addEventListener('click', ()=>run('MAX'));
  document.getElementById('mmMinBtn').addEventListener('click', ()=>run('MIN'));
})();

/* =========================================================================
   SLIDE 18 — Kuis
   ========================================================================= */
const QUIZ = [
  {q:"Pertemuan antara satu kolom dan satu baris pada spreadsheet disebut...",
   opts:["Sheet","Sel","Grafik","Fungsi"], correct:1, explain:"Sel (cell) adalah kotak pertemuan satu kolom dan satu baris."},
  {q:"Setiap rumus pada spreadsheet harus diawali dengan tanda...",

   opts:["14","6","40","2.5"], correct:2, explain:"10 dikalikan 4 sama dengan 40."},
  {q:"Fungsi yang digunakan untuk mencari nilai rata-rata adalah...",
   opts:["SUM","AVERAGE","MAX","COUNT"], correct:1, explain:"AVERAGE menghitung rata-rata dari sekumpulan nilai."},
  {q:"Data 'Hadir' pada sebuah sel tergolong jenis data...",
   opts:["Angka","Tanggal","Teks","Rumus"], correct:2, explain:"'Hadir' terdiri atas huruf, sehingga termasuk jenis data teks."},
  {q:"Fungsi =MIN(B1:B5) digunakan untuk mencari...",
   opts:["Nilai tertinggi","Nilai terendah","Jumlah data","Rata-rata data"], correct:1, explain:"MIN mencari nilai terkecil dari rentang sel yang dipilih."},
  {q:"Rentang A2:A6 berisi lima angka. Rumus =COUNT(A2:A6) akan menghasilkan...",
   opts:["Jumlah kelima angka","Rata-rata kelima angka","5","Angka terbesar"], correct:2, explain:"COUNT menghitung banyaknya sel berisi angka, yaitu 5 sel."},
  {q:"Mengurutkan data dari nilai terbesar ke terkecil disebut mengurutkan secara...",
   opts:["Ascending (naik)","Descending (turun)","Acak","Alfabetis"], correct:1, explain:"Descending berarti mengurutkan dari nilai terbesar ke terkecil."},
  {q:"Tujuan utama membuat grafik dari data spreadsheet adalah...",
   opts:["Mempercantik tampilan saja","Mengubah jenis data","Memudahkan membandingkan data secara visual","Mengurangi jumlah data"], correct:2, explain:"Grafik membantu membandingkan dan memahami pola data secara visual, lebih cepat daripada membaca angka satu per satu."},
  {q:"Sel B3 berarti sel tersebut berada pada...",
   opts:["Kolom B, baris 3","Kolom 3, baris B","Baris ke-3 dari kiri","Sheet ke-3"], correct:0, explain:"Referensi sel ditulis [kolom][baris], sehingga B3 berarti kolom B, baris 3."}
];
let quizAnswers = new Array(QUIZ.length).fill(null);
let quizIndex = 0;

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const allAnswered = quizAnswers.every(a => a !== null);
  if(allAnswered){
    const score = quizAnswers.reduce((s,a,i)=> s + (a === QUIZ[i].correct ? 1 : 0), 0);
    area.innerHTML = `
      <div class="quiz-score">
        <div style="font-family:var(--font-mono);color:var(--text-muted);margin-bottom:6px;">Skor Akhir</div>
        <div class="num">${score}</div>
        <div class="of">dari ${QUIZ.length} soal</div>
      </div>
      <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" id="retryQuiz">↺ Ulangi Kuis</button></div>
    `;
    document.getElementById('retryQuiz').addEventListener('click', ()=>{
      quizAnswers = new Array(QUIZ.length).fill(null);
      quizIndex = 0;
      renderQuiz();
    });
    return;
  }
  if(quizAnswers[quizIndex] !== null){
    const next = quizAnswers.findIndex(a=>a===null);
    quizIndex = next === -1 ? quizIndex : next;
  }
  const item = QUIZ[quizIndex];
  const dots = QUIZ.map((_,i)=>`<div class="quiz-dot ${quizAnswers[i]!==null?'answered':''} ${i===quizIndex?'current':''}"></div>`).join('');
  area.innerHTML = `
    <div class="quiz-progress">${dots}</div>
    <div class="card">
      <span class="tag">Soal ${quizIndex+1} / ${QUIZ.length}</span>
      <p style="margin:12px 0 14px;color:var(--text);font-size:16px;">${item.q}</p>
      <div id="quizOpts"></div>
      <div class="explain-box" id="quizExplain">${item.explain}</div>
      <div class="btn-row" id="quizNavRow" style="display:none;">
        <button class="btn" id="quizPrev">‹ Soal sebelumnya</button>
        <button class="btn btn-primary" id="quizNext">Soal berikutnya ›</button>
      </div>
    </div>
  `;
  const optWrap = document.getElementById('quizOpts');
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.addEventListener('click', ()=>{
      quizAnswers[quizIndex] = i;
      optWrap.querySelectorAll('.opt-btn').forEach((x,xi)=>{
        x.disabled = true;
        if(xi === item.correct) x.classList.add('correct');
        else if(xi === i) x.classList.add('wrong');
      });
      document.getElementById('quizExplain').classList.add('show');
      document.getElementById('quizNavRow').style.display = 'flex';
      document.querySelector('#quizArea .quiz-dot.current')?.classList.add('answered');
    });
    optWrap.appendChild(b);
  });
  if(item !== undefined){
    setTimeout(()=>{
      const prevBtn2 = document.getElementById('quizPrev');
      const nextBtn2 = document.getElementById('quizNext');
      if(prevBtn2) prevBtn2.addEventListener('click', ()=>{ quizIndex = Math.max(0, quizIndex-1); renderQuiz(); });
      if(nextBtn2) nextBtn2.addEventListener('click', ()=>{
        quizIndex = quizIndex+1 < QUIZ.length ? quizIndex+1 : quizIndex;
        renderQuiz();
      });
    },0);
  }
}
renderQuiz();
</script>
