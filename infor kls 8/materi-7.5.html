<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>7.5 Bijak Membagikan Informasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130f1d;
  --panel:#1d1830;
  --panel-2:#241d3d;
  --panel-3:#2c2449;
  --line:#3a2f5c;
  --line-soft:#251e3d;
  --text:#f1eef8;
  --text-muted:#a99fc4;
  --text-faint:#65597f;
  --coral:#ff8a5c;
  --coral-dim:#4a2c1c;
  --green:#4ade91;
  --green-dim:#1e3c2c;
  --red:#ff6b6b;
  --red-dim:#4a2226;
  --violet:#8b7cff;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:24px;
  --font-head:'Fredoka',sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --maxw:920px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 0%, rgba(255,138,92,0.07), transparent),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(139,124,255,0.08), transparent);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--coral);color:#2a1408;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px;}

#app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}
.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:var(--line-soft);z-index:60;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--coral),var(--violet));transition:width .45s cubic-bezier(.4,0,.2,1);}

.slides-viewport{flex:1;position:relative;overflow:hidden;}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:44px 24px 96px;opacity:0;pointer-events:none;transform:translateX(24px);
  transition:opacity .38s ease, transform .38s cubic-bezier(.4,0,.2,1);overflow-y:auto;
}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.slide-inner{width:100%;max-width:var(--maxw);margin:0 auto;padding-bottom:20px;}

/* review bar — recurring structural device: "periksa sebelum lanjut" */
.review-bar{
  display:flex;align-items:center;gap:10px;width:100%;max-width:var(--maxw);margin:0 auto 28px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:10px 16px;font-family:var(--font-mono);font-size:12.5px;
}
.review-bar .ic{color:var(--coral);font-size:14px;}
.review-bar .tag2{color:var(--text-faint);border-right:1px solid var(--line);padding-right:12px;}
.review-bar .status{color:var(--green);background:var(--green-dim);border:1px solid #2c5b40;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.review-bar .title{color:var(--text-muted);margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

h1.slide-title{font-family:var(--font-head);font-weight:600;font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0 0 14px;color:var(--text);}
p.lead{font-size:16.5px;line-height:1.65;color:var(--text-muted);margin:0 0 18px;max-width:70ch;}
p{line-height:1.65;color:var(--text-muted);}
strong{color:var(--text);font-weight:600;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:20px 22px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--coral);background:var(--coral-dim);border:1px solid #7a4a2c;padding:3px 10px;border-radius:20px;}
.tag.danger{color:var(--red);background:var(--red-dim);border-color:#7a3438;}
.tag.safe{color:var(--green);background:var(--green-dim);border-color:#2c5b40;}

.btn{font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:11px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;transition:transform .15s ease, background .15s ease;}
.btn:hover{background:var(--panel-3);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--coral);border-color:var(--coral);color:#2a1408;}
.btn-primary:hover{background:#ff9d78;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.nav-bar{position:fixed;left:0;bottom:0;width:100%;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:rgba(19,15,29,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.nav-btn{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn:not(:disabled):hover{background:var(--panel-3);}
.nav-mid{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);color:var(--text-muted);font-size:13px;}
.nav-home{color:var(--text-faint);background:transparent;border:none;cursor:pointer;font-size:13px;font-family:var(--font-mono);}
.nav-home:hover{color:var(--coral);}

/* Accordion */
.accordion-item{border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;overflow:hidden;background:var(--panel);}
.accordion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;}
.accordion-head:hover{background:var(--panel-2);}
.accordion-head .term{font-weight:700;color:var(--text);font-family:var(--font-head);font-size:16px;}
.accordion-head .chev{color:var(--coral);transition:transform .25s ease;font-size:14px;}
.accordion-item.open .chev{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.accordion-item.open .accordion-body{max-height:280px;}
.accordion-body-inner{padding:0 16px 16px;color:var(--text-muted);font-size:14.5px;line-height:1.6;}

/* Chips / classify */
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.chip{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;cursor:pointer;color:var(--text);}
.chip.picked{border-color:var(--violet);color:var(--violet);}
.chip.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.chip.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.bucket-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px;}
@media (max-width:720px){.bucket-row{grid-template-columns:1fr;}}
.bucket{border:1px dashed var(--line);border-radius:var(--radius-s);padding:14px 10px;text-align:center;color:var(--text-muted);font-size:13px;cursor:pointer;min-height:56px;}
.bucket:hover{border-color:var(--violet);}

/* Steps */
.step-list{counter-reset:step;}
.step{display:flex;gap:14px;margin-bottom:16px;}
.step-num{counter-increment:step;flex:none;width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--coral);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;}
.step-num::before{content:counter(step);}
.step-body{flex:1;padding-top:4px;}
.step-body .stitle{font-weight:700;color:var(--text);margin-bottom:3px;}

/* Source credibility cards */
.source-card{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--panel);padding:18px 20px;margin-bottom:14px;}
.source-card p{margin:0 0 12px;color:var(--text);font-size:14.5px;}
.verdict{display:none;margin-top:12px;padding:12px 14px;border-radius:var(--radius-s);font-size:14px;}
.verdict.show{display:block;}
.verdict.ok{background:var(--green-dim);border:1px solid #2c5b40;color:var(--green);}
.verdict.bad{background:var(--red-dim);border:1px solid #7a3438;color:var(--red);}

/* Mockup social post (hotspot) */
.post-mockup{position:relative;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--panel);}
.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);}
.post-avatar{width:34px;height:34px;border-radius:50%;background:var(--panel-3);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;}
.post-name{font-weight:700;color:var(--text);font-size:14px;}
.post-handle{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.post-body{padding:16px;font-size:14px;color:var(--text-muted);line-height:1.7;}
.post-body .shout{color:var(--red);font-weight:700;}
.post-foot{padding:10px 16px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.hotspot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--red);border:2px solid var(--bg);color:#2a0d0f;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5);}50%{box-shadow:0 0 0 7px rgba(255,107,107,0);}}
.hotspot-note{display:none;margin-top:14px;padding:14px 16px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--line);font-size:14.5px;color:var(--text-muted);}
.hotspot-note.show{display:block;}
.hotspot-note b{color:var(--red);}

/* Options */
.opt-btn{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--text);font-size:14.5px;cursor:pointer;}
.opt-btn:hover{border-color:var(--violet);}
.opt-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.opt-btn:disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--line);font-size:14px;color:var(--text-muted);display:none;}
.explain-box.show{display:block;}

/* Tip cards */
.tip-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px;background:var(--panel);}
.tip-card .ic{font-size:22px;margin-bottom:8px;display:block;}
.tip-card h3{font-family:var(--font-head);font-size:15.5px;margin:0 0 6px;color:var(--text);font-weight:600;}
.tip-card p{font-size:13.5px;margin:0;}

/* Pre-post checklist wizard */
.compose-box{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--panel);overflow:hidden;}
.compose-draft{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:14.5px;color:var(--text);line-height:1.6;}
.compose-checks{padding:16px 18px;}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.check-row:last-child{border-bottom:none;}
.check-row input{margin-top:3px;accent-color:var(--coral);width:17px;height:17px;flex:none;}
.check-row label{font-size:14px;color:var(--text-muted);cursor:pointer;}
.compose-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.compose-msg{font-size:13.5px;color:var(--text-faint);}
.compose-success{display:none;margin-top:14px;padding:14px 16px;border-radius:var(--radius-s);background:var(--green-dim);border:1px solid #2c5b40;color:var(--green);font-size:14px;}
.compose-success.show{display:block;}

/* Quiz */
.quiz-progress{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.quiz-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.quiz-dot.answered{background:var(--coral);}
.quiz-dot.current{outline:2px solid var(--violet);outline-offset:2px;}
.quiz-score{text-align:center;padding:30px 10px;}
.quiz-score .num{font-family:var(--font-head);font-size:56px;color:var(--coral);}
.quiz-score .of{color:var(--text-faint);font-family:var(--font-mono);}

/* Reflection */
textarea.reflect{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--text);font-family:var(--font-body);font-size:14.5px;padding:12px;resize:vertical;}
textarea.reflect:focus{border-color:var(--coral);}
.checklist label{display:flex;align-items:center;gap:10px;padding:9px 0;color:var(--text-muted);font-size:14.5px;cursor:pointer;}
.checklist input{accent-color:var(--coral);width:17px;height:17px;}

/* Cover */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding-top:10px;}
.hero-icon{width:96px;height:96px;margin-bottom:22px;}
.kode-badge{font-family:var(--font-mono);color:var(--coral);background:var(--coral-dim);border:1px solid #7a4a2c;padding:4px 12px;border-radius:20px;font-size:12.5px;margin-bottom:16px;display:inline-block;}
.cover-wrap h1{font-size:clamp(30px,6vw,46px);}
.cover-wrap .sub{color:var(--text-muted);font-size:16px;max-width:60ch;margin-bottom:30px;}

.summary-card{border-left:3px solid var(--coral);padding:14px 18px;background:var(--panel);border-radius:0 var(--radius-s) var(--radius-s) 0;margin-bottom:12px;}
.summary-card b{color:var(--text);}

.slide::-webkit-scrollbar{width:8px;}
.slide::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

@media (max-width:600px){
  .nav-mid span.hint{display:none;}
  .review-bar .title{font-size:11.5px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="slides-viewport" id="viewport"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">‹ Sebelumnya</button>
    <div class="nav-mid">
      <button class="nav-home" id="homeBtn" title="Kembali ke awal">⌂ Awal</button>
      <span id="slideCounter">1 / 1</span>
      <span class="hint" style="color:var(--text-faint);">&nbsp;·&nbsp; gunakan ← →</span>
    </div>
    <button class="nav-btn" id="nextBtn">Berikutnya ›</button>
  </div>
</div>

<script>
/* =========================================================================
   DATA — konten pembelajaran
   Bab 7 — Membagikan Informasi dan Perlindungan Data Pribadi
   Submateri (kode 7.5) : Bijak Membagikan Informasi
   Materi Pokok : Memilah informasi sebelum dibagikan, memeriksa sumber,
                  menjaga privasi orang lain, dan berpikir sebelum mengunggah
   ========================================================================= */

const SLIDES = [];
function addSlide(html){ SLIDES.push(html); }

/* ---------- 1. Cover ---------- */
addSlide(`
<div class="cover-wrap">
  <span class="kode-badge">Bab 7 · 7.5 Bijak Membagikan Informasi</span>
  <svg class="hero-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="14" y="26" width="72" height="48" rx="10" fill="#241d3d" stroke="#ff8a5c" stroke-width="3"/>
    <path d="M14 34 L50 56 L86 34" stroke="#ff8a5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle id="checkCircle" cx="76" cy="70" r="15" fill="#4ade91" stroke="#130f1d" stroke-width="3" opacity="0" />
    <path id="checkMark" d="M69 70 l5 5 l10 -11" stroke="#12281d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
  </svg>
  <h1 class="slide-title">Bijak Membagikan<br>Informasi</h1>
  <p class="sub">Belajar memilah informasi sebelum dibagikan, memeriksa sumber, menjaga privasi orang lain, dan berpikir dulu sebelum mengunggah.</p>
  <button class="btn btn-primary" id="startBtn">Mulai Belajar →</button>
</div>
<style>
#checkCircle,#checkMark{animation:fadeInCheck 2.4s ease-in-out 0.6s forwards;}
@keyframes fadeInCheck{0%{opacity:0;}60%{opacity:0;}100%{opacity:1;}}
</style>
`);

/* ---------- 2. Apersepsi ---------- */
addSlide(`
<h1 class="slide-title">Sebelum Mulai, Coba Pikirkan Dulu</h1>
<p class="lead">Dini menerima pesan berantai di grup keluarga: "AWAS! Ada penculik anak berkeliaran naik motor hitam di sekitar sekolah kita, SEBARKAN SEKARANG sebelum terlambat!!" Tanpa berpikir panjang, Dini langsung meneruskan pesan itu ke lima grup lain.</p>
<div class="card">
  <p style="margin:0 0 14px;color:var(--text);font-weight:600;">Menurutmu, apa yang seharusnya Dini lakukan sebelum meneruskan pesan itu?</p>
  <div id="apersepsiOpts"></div>
  <div class="hotspot-note" id="apersepsiNote"></div>
</div>
`);

/* ---------- 3. Tujuan ---------- */
addSlide(`
<h1 class="slide-title">Tujuan Pembelajaran</h1>
<p class="lead">Setelah menyelesaikan pembelajaran ini, kalian diharapkan mampu:</p>
<div class="step-list">
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Memilah informasi yang layak dibagikan dan yang perlu diperiksa lebih dulu.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Memeriksa kredibilitas sumber informasi sebelum mempercayainya.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Menjaga privasi orang lain saat membagikan foto, video, atau informasi.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Membiasakan diri berpikir sebelum mengunggah sesuatu di internet.</p></div></div>
</div>
`);

/* ---------- 4. Mengapa penting ---------- */
addSlide(`
<h1 class="slide-title">Mengapa Bijak Berbagi Informasi Itu Penting?</h1>
<p class="lead">Apa pun yang kita unggah atau bagikan di internet meninggalkan <strong>jejak digital</strong> yang sulit dihapus sepenuhnya, dan bisa memengaruhi diri sendiri maupun orang lain.</p>
<div class="grid-2">
  <div class="card"><span class="tag danger">Jika sembarangan</span><p style="margin-top:10px;">Informasi keliru bisa menyesatkan banyak orang, dan privasi orang lain bisa terlanggar tanpa sadar.</p></div>
  <div class="card"><span class="tag safe">Jika bijak</span><p style="margin-top:10px;">Kita ikut menjaga informasi yang beredar tetap akurat, dan dipercaya sebagai sumber yang bertanggung jawab.</p></div>
</div>
`);

/* ---------- 5. Memilah informasi (accordion) ---------- */
addSlide(`
<h1 class="slide-title">Memilah Informasi: Kenali Ciri-cirinya</h1>
<p class="lead">Ketuk setiap istilah untuk memahami hal-hal yang perlu diwaspadai sebelum membagikan informasi.</p>
<div id="accordionTerms"></div>
`);

/* ---------- 6. Latihan fakta/hoaks ---------- */
addSlide(`
<h1 class="slide-title">Latihan: Fakta atau Hoaks?</h1>
<p class="lead">Ketuk sebuah pernyataan, lalu ketuk kategori yang menurutmu tepat.</p>
<div class="chip-row" id="factHoaxChips"></div>
<div class="bucket-row" id="factHoaxBuckets">
  <div class="bucket" data-cat="fakta">✅ Fakta</div>
  <div class="bucket" data-cat="hoaks">🚫 Hoaks</div>
</div>
<p id="factHoaxProgress" style="margin-top:14px;color:var(--text-faint);font-family:var(--font-mono);font-size:13px;">0 / 6 benar</p>
`);

/* ---------- 7. Memeriksa sumber (steps) ---------- */
addSlide(`
<h1 class="slide-title">Memeriksa Sumber: Langkah Verifikasi</h1>
<div class="step-list">

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let current = 0;
const total = SLIDES.length;
const slideEls = Array.from(document.querySelectorAll('.slide'));
const progressFill = document.getElementById('progressFill');
const counter = document.getElementById('slideCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function goTo(idx){
  if(idx < 0 || idx >= total) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  slideEls[current].scrollTop = 0;
  progressFill.style.width = ((current)/(total-1)*100) + '%';
  counter.textContent = (current+1) + ' / ' + total;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}
prevBtn.addEventListener('click', () => goTo(current-1));
nextBtn.addEventListener('click', () => goTo(current+1));
document.getElementById('homeBtn').addEventListener('click', () => goTo(0));
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'textarea' || tag === 'input') return;
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});
goTo(0);
document.addEventListener('click', (e) => {
  if(e.target.id === 'startBtn') goTo(1);
  if(e.target.id === 'restartBtn') goTo(0);
});

/* =========================================================================
   REUSABLE — classify chips + buckets
   ========================================================================= */
function initClassifyGame(chipsId, bucketsId, progressId, items){
  const chipRow = document.getElementById(chipsId);
  const progressEl = document.getElementById(progressId);
  let selected = null;
  let correctCount = 0;
  items.forEach(it=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = it.v;
    chip.dataset.cat = it.cat;
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('correct')) return;
      chipRow.querySelectorAll('.chip').forEach(c=>c.classList.remove('picked'));
      chip.classList.add('picked');
      selected = chip;
    });
    chipRow.appendChild(chip);
  });
  document.querySelectorAll('#'+bucketsId+' .bucket').forEach(bucket=>{
    bucket.addEventListener('click', ()=>{
      if(!selected) return;
      if(selected.dataset.cat === bucket.dataset.cat){
        selected.classList.remove('picked');
        selected.classList.add('correct');
        selected.style.pointerEvents = 'none';
        correctCount++;
        progressEl.textContent = correctCount + ' / ' + items.length + ' benar';
      } else {
        selected.classList.add('wrong');
        setTimeout(()=> selected.classList.remove('wrong'), 500);
      }
      selected = null;
    });
  });
}

const QUIZ = [
  {q:"Informasi palsu yang sengaja dibuat untuk menyesatkan disebut...",
   opts:["Clickbait","Hoaks","Opini","Fakta"], correct:1,
   explain:"Hoaks adalah informasi palsu yang sengaja dibuat untuk menyesatkan pembaca."},
  {q:"Salah satu ciri judul clickbait adalah...",
   opts:["Mencantumkan tanggal terbit","Ditulis sangat sensasional untuk memancing klik","Mencantumkan nama penulis","Menyertakan data pendukung"], correct:1,
   explain:"Clickbait sengaja dibuat sensasional agar orang tertarik mengklik, meski isinya belum tentu sesuai judul."},
  {q:"Langkah pertama saat memeriksa sumber informasi adalah...",
   opts:["Langsung membagikannya","Melihat siapa penulis atau penerbitnya","Menghapus pesan tersebut","Menambahkan emoji"], correct:1,
   explain:"Mengetahui siapa penulis atau lembaga penerbitnya membantu menilai apakah sumber tersebut dapat dipercaya."},
  {q:"Mengapa perlu membandingkan suatu informasi dengan sumber lain?",
   opts:["Agar terlihat lebih rajin","Untuk memastikan kebenaran lewat cross-check","Karena diwajibkan oleh aplikasi","Agar informasi terlihat lebih panjang"], correct:1,
   explain:"Membandingkan dengan sumber tepercaya lain (cross-check) membantu memastikan apakah informasi tersebut benar."},
  {q:"Sebelum membagikan foto yang menampilkan temanmu, sebaiknya kamu...",
   opts:["Langsung mengunggahnya karena fotonya bagus","Meminta izin terlebih dahulu kepada temanmu","Mengeditnya tanpa sepengetahuan temanmu","Menandai (tag) tanpa bertanya"], correct:1,
   explain:"Meminta izin menunjukkan penghormatan terhadap privasi orang lain sebelum membagikan konten yang melibatkan mereka."},
  {q:"Salah satu dari lima pertanyaan sebelum mengunggah adalah...",
   opts:["Apakah ini akan viral?","Apakah ini bermanfaat bagi orang yang menerimanya?","Apakah ini akan menambah pengikut?","Apakah ini menarik secara visual?"], correct:1,
   explain:"Menilai manfaat bagi penerima adalah salah satu dari lima pertanyaan penting sebelum membagikan sesuatu."},
  {q:"Jika seseorang meminta kontennya (foto/video) dihapus, sebaiknya kita...",
   opts:["Mengabaikan permintaan tersebut","Menghapusnya dan menghormati permintaan itu","Membagikannya lebih luas lagi","Menyimpannya secara diam-diam"], correct:1,
   explain:"Menghormati permintaan untuk menghapus konten adalah bagian penting dari menjaga privasi orang lain."},
  {q:"Manakah dampak yang bisa terjadi akibat menyebarkan informasi palsu?",
   opts:["Meningkatkan kepercayaan orang lain","Menimbulkan kepanikan dan menyesatkan banyak orang","Membuat internet menjadi lebih cepat","Tidak ada dampak apa pun"], correct:1,
   explain:"Informasi palsu yang tersebar luas dapat menimbulkan kepanikan dan menyesatkan banyak orang yang mempercayainya."},
  {q:"Tanda umum akun penyebar informasi mencurigakan di media sosial adalah...",
   opts:["Mencantumkan sumber yang jelas","Akun anonim dengan ajakan mendesak untuk segera menyebarkan","Menyertakan data pendukung","Ditulis oleh jurnalis resmi"], correct:1,
   explain:"Akun anonim yang mendesak agar informasi segera disebarkan adalah tanda klasik informasi yang patut dicurigai."},
  {q:"Sikap paling bijak saat menerima pesan berantai yang mendesak untuk segera disebarkan adalah...",
   opts:["Langsung menyebarkannya ke banyak grup","Memeriksa kebenarannya dulu sebelum bertindak","Mengabaikannya tanpa berpikir","Menambahkan komentar tanpa memeriksa faktanya"], correct:1,
   explain:"Memeriksa kebenaran sebelum bertindak mencegah penyebaran informasi keliru dan kepanikan yang tidak perlu."}
];
let quizAnswers = new Array(QUIZ.length).fill(null);
let quizIndex = 0;

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const allAnswered = quizAnswers.every(a => a !== null);
  if(allAnswered){
    const score = quizAnswers.reduce((s,a,i)=> s + (a === QUIZ[i].correct ? 1 : 0), 0);
    area.innerHTML = `
      <div class="quiz-score">
        <div style="font-family:var(--font-mono);color:var(--text-muted);margin-bottom:6px;">Skor Akhir</div>
        <div class="num">${score}</div>
        <div class="of">dari ${QUIZ.length} soal</div>
      </div>
      <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" id="retryQuiz">↺ Ulangi Kuis</button></div>
    `;
    document.getElementById('retryQuiz').addEventListener('click', ()=>{
      quizAnswers = new Array(QUIZ.length).fill(null);
      quizIndex = 0;
      renderQuiz();
    });
    return;
  }
  if(quizAnswers[quizIndex] !== null){
    const next = quizAnswers.findIndex(a=>a===null);
    quizIndex = next === -1 ? quizIndex : next;
  }
  const item = QUIZ[quizIndex];
  const dots = QUIZ.map((_,i)=>`<div class="quiz-dot ${quizAnswers[i]!==null?'answered':''} ${i===quizIndex?'current':''}"></div>`).join('');
  area.innerHTML = `
    <div class="quiz-progress">${dots}</div>
    <div class="card">
      <span class="tag">Soal ${quizIndex+1} / ${QUIZ.length}</span>
      <p style="margin:12px 0 14px;color:var(--text);font-size:16px;">${item.q}</p>
      <div id="quizOpts"></div>
      <div class="explain-box" id="quizExplain">${item.explain}</div>
      <div class="btn-row" id="quizNavRow" style="display:none;">
        <button class="btn" id="quizPrev">‹ Soal sebelumnya</button>
        <button class="btn btn-primary" id="quizNext">Soal berikutnya ›</button>
      </div>
    </div>
  `;
  const optWrap = document.getElementById('quizOpts');
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.addEventListener('click', ()=>{
      quizAnswers[quizIndex] = i;
      optWrap.querySelectorAll('.opt-btn').forEach((x,xi)=>{
        x.disabled = true;
        if(xi === item.correct) x.classList.add('correct');
        else if(xi === i) x.classList.add('wrong');
      });
      document.getElementById('quizExplain').classList.add('show');
      document.getElementById('quizNavRow').style.display = 'flex';
      document.querySelector('#quizArea .quiz-dot.current')?.classList.add('answered');
    });
    optWrap.appendChild(b);
  });
  setTimeout(()=>{
    const prevBtn2 = document.getElementById('quizPrev');
    const nextBtn2 = document.getElementById('quizNext');
    if(prevBtn2) prevBtn2.addEventListener('click', ()=>{ quizIndex = Math.max(0, quizIndex-1); renderQuiz(); });
    if(nextBtn2) nextBtn2.addEventListener('click', ()=>{
      quizIndex = quizIndex+1 < QUIZ.length ? quizIndex+1 : quizIndex;
      renderQuiz();
    });
  },0);
}
renderQuiz();
</script>
