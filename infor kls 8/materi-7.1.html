<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berbagi Informasi di Dunia Digital | Bab 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0a0e1a;
  --bg-1:#0f1424;
  --bg-2:#151b30;
  --card:#161d33;
  --card-hi:#1c2440;
  --border:#252e4d;
  --coral:#ff6b6b;
  --coral-dim:#ff6b6b33;
  --teal:#2dd4bf;
  --teal-dim:#2dd4bf33;
  --amber:#fbbf24;
  --amber-dim:#fbbf2433;
  --violet:#a78bfa;
  --text-1:#eef1fb;
  --text-2:#9aa3c7;
  --text-3:#6b7396;
  --ok:#34d399;
  --bad:#fb7185;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans', sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #1c2a4a55 0%, transparent 45%),
    radial-gradient(circle at 90% 85%, #2a1c3f55 0%, transparent 45%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1) 60%, var(--bg-0));
  color:var(--text-1);
  min-height:100vh;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.brand,.big-num{font-family:'Fredoka', sans-serif;}
.mono{font-family:'JetBrains Mono', monospace;}

#app{
  display:flex; flex-direction:column;
  height:100vh; width:100vw;
  max-width:1100px; margin:0 auto;
  padding:14px 18px 10px;
}

.topbar{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
.topbar .brand{font-size:15px; font-weight:600; color:var(--text-2); white-space:nowrap;}
.progress-track{flex:1; height:7px; border-radius:99px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--coral), var(--amber)); transition:width .4s cubic-bezier(.4,0,.2,1); width:0%;}
.slide-counter{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-2); white-space:nowrap;}

#stage{flex:1; position:relative; overflow:hidden; border-radius:var(--radius-lg);}
.slide{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding:26px clamp(16px,4vw,52px);
  opacity:0; transform:translateX(40px) scale(.98);
  pointer-events:none; transition:opacity .45s ease, transform .45s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.slide.active{opacity:1; transform:translateX(0) scale(1); pointer-events:auto;}
.slide::-webkit-scrollbar{width:6px;}
.slide::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}

.eyebrow{
  display:inline-flex; align-items:center; gap:8px; width:fit-content;
  font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--teal); background:var(--teal-dim); border:1px solid #2dd4bf55;
  padding:6px 14px; border-radius:99px; margin-bottom:16px;
}
.eyebrow.amber{color:var(--amber); background:var(--amber-dim); border-color:#fbbf2455;}
.eyebrow.coral{color:var(--coral); background:var(--coral-dim); border-color:#ff6b6b55;}
.eyebrow.violet{color:var(--violet); background:#a78bfa33; border-color:#a78bfa55;}
.eyebrow.bad{color:var(--bad); background:#fb718533; border-color:#fb718555;}

h2.slide-title{font-size:clamp(22px,4vw,34px); font-weight:600; line-height:1.25; margin-bottom:6px;}
.slide-sub{color:var(--text-2); font-size:clamp(13.5px,2vw,16px); margin-bottom:20px; max-width:720px;}

.card{
  background:linear-gradient(180deg, var(--card-hi), var(--card));
  border:1px solid var(--border); border-radius:var(--radius-md);
  padding:20px 22px; box-shadow:var(--shadow);
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:720px){ .grid2, .grid3{grid-template-columns:1fr;} }

.btn{
  cursor:pointer; border:none; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700;
  border-radius:99px; padding:12px 22px; font-size:14.5px; transition:transform .15s, box-shadow .15s, opacity .15s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(120deg, var(--coral), #ff9770); color:#1a0e0e; box-shadow:0 10px 26px -10px #ff6b6b88;}
.btn-primary:hover{box-shadow:0 14px 30px -8px #ff6b6bcc;}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text-1);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal);}
.btn:disabled{opacity:.35; cursor:not-allowed;}

.navbar{display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px;}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60vw;}
.dot{width:8px; height:8px; border-radius:99px; background:var(--border); cursor:pointer; transition:.25s; flex-shrink:0;}
.dot.active{width:22px; background:var(--coral);}
.dot.done{background:var(--teal);}
.nav-btn{
  width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:var(--card);
  color:var(--text-1); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:.2s;
}
.nav-btn:hover:not(:disabled){border-color:var(--coral); color:var(--coral); transform:translateY(-2px);}
.nav-btn:disabled{opacity:.3; cursor:not-allowed;}

.info-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px 20px; position:relative; overflow:hidden;}
.info-card .icon{font-size:26px; margin-bottom:10px; display:block;}
.info-card h3{font-size:16.5px; font-weight:700; margin-bottom:6px;}
.info-card p{font-size:14px; color:var(--text-2); line-height:1.55;}

.accordion-item{border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; background:var(--card);}
.accordion-head{padding:14px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:700; font-size:14.5px;}
.accordion-head .arrow{transition:transform .3s; color:var(--teal);}
.accordion-item.open .arrow{transform:rotate(180deg);}
.accordion-body{max-height:0; overflow:hidden; transition:max-height .35s ease; padding:0 18px;}
.accordion-item.open .accordion-body{max-height:400px; padding:0 18px 16px;}
.accordion-body p{color:var(--text-2); font-size:13.8px; line-height:1.6;}
.accordion-item.risk .accordion-head{color:var(--bad);}
.accordion-item.benefit .accordion-head{color:var(--ok);}

.term-box{border-left:4px solid var(--amber); background:#fbbf2412; border-radius:10px; padding:14px 18px; margin:14px 0;}
.term-box b{color:var(--amber);}
.term-box.warn{border-left-color:var(--bad); background:#fb718512;}
.term-box.warn b{color:var(--bad);}

.flip-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
.flip-card{perspective:1000px; height:130px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px;}
.flip-front{background:linear-gradient(135deg, var(--card-hi), var(--card)); border:1px solid var(--border); font-weight:700; font-size:14px;}
.flip-back{background:linear-gradient(135deg, #2dd4bf22, #2dd4bf08); border:1px solid #2dd4bf55; transform:rotateY(180deg); font-size:12px; color:var(--text-1); line-height:1.5;}

.compare-wrap{display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border);}
.compare-col{flex:1; padding:20px; }
.compare-col.left{background:linear-gradient(180deg,#34d3991c, transparent);}
.compare-col.right{background:linear-gradient(180deg,#fb71851c, transparent);}
.compare-col h4{font-size:16px; margin-bottom:10px;}
.compare-col.left h4{color:var(--ok);}
.compare-col.right h4{color:var(--bad);}
.compare-col ul{padding-left:18px; font-size:13.5px; color:var(--text-2); line-height:1.9;}
.compare-mid{width:1px; background:var(--border);}
@media(max-width:700px){.compare-wrap{flex-direction:column;} .compare-mid{width:100%; height:1px;}}

.reveal-btn{cursor:pointer; border:1px dashed var(--teal); color:var(--teal); background:transparent; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13.5px; width:100%; margin-top:10px;}
.reveal-content{max-height:0; overflow:hidden; transition:max-height .4s ease; margin-top:0;}
.reveal-content.open{max-height:600px; margin-top:12px;}

.step-flow{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:16px; align-items:flex-start; position:relative; padding-bottom:26px;}
.step-item:last-child{padding-bottom:0;}
.step-item::before{content:''; position:absolute; left:19px; top:42px; bottom:0; width:2px; background:var(--border);}
.step-item:last-child::before{display:none;}
.step-num{width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0e; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fredoka'; flex-shrink:0; z-index:1;}
.step-text h4{font-size:15px; margin-bottom:4px;}
.step-text p{font-size:13.5px; color:var(--text-2); line-height:1.6;}

.example-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
.example-tag{display:inline-block; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; margin-bottom:10px;}
.tag-easy{background:#34d39933; color:#34d399;}
.tag-med{background:#fbbf2433; color:#fbbf24;}
.tag-hard{background:#fb718533; color:#fb7185;}

.mc-options{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.mc-opt{border:1.5px solid var(--border); background:var(--card); border-radius:12px; padding:13px 16px; cursor:pointer; font-size:14px; transition:.2s; display:flex; align-items:center; gap:10px;}
.mc-opt:hover{border-color:var(--teal);}
.mc-opt.correct{border-color:var(--ok); background:#34d39922; color:var(--ok);}
.mc-opt.wrong{border-color:var(--bad); background:#fb718522; color:var(--bad);}
.mc-opt .letter{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.feedback{margin-top:12px; padding:12px 16px; border-radius:10px; font-size:13.5px; display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#34d39922; border:1px solid #34d39955; color:#a7f3d0;}
.feedback.bad{background:#fb718522; border:1px solid #fb718555; color:#fecdd3;}

.drag-wrap{display:flex; flex-wrap:wrap; gap:20px; margin-top:16px;}
.drag-pool{flex:1; min-width:220px; display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start;}
.drag-chip{padding:10px 16px; background:var(--card-hi); border:1.5px solid var(--border); border-radius:99px; cursor:grab; font-size:13px; font-weight:600; user-select:none;}
.drag-chip.placed{opacity:.3; cursor:default;}
.drop-zones{flex:1.4; min-width:260px; display:flex; flex-direction:column; gap:12px;}
.drop-zone{border:2px dashed var(--border); border-radius:12px; padding:12px 14px; min-height:56px; display:flex; flex-direction:column; gap:6px;}
.drop-zone .dz-label{font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em;}
.drop-zone.over{border-color:var(--teal); background:#2dd4bf12;}
.drop-zone .dz-chip{background:var(--teal-dim); border:1px solid #2dd4bf55; padding:6px 12px; border-radius:99px; font-size:12.5px; display:inline-block;}

.quiz-progress{display:flex; gap:5px; margin-bottom:16px;}
.quiz-progress span{flex:1; height:5px; border-radius:99px; background:var(--border);}
.quiz-progress span.done{background:var(--teal);}
.quiz-progress span.wrong{background:var(--bad);}

.big-num{font-size:clamp(40px,7vw,64px); font-weight:700; background:linear-gradient(120deg,var(--coral),var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1;}

.tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.tag-pill{font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:99px; background:var(--card); border:1px solid var(--border); color:var(--text-2);}

footer.hint{text-align:center; font-size:11.5px; color:var(--text-3); margin-top:8px;}
::selection{background:var(--coral); color:#1a0e0e;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">🌐 Berbagi Informasi</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="slide-counter" id="slideCounter">1 / 19</span>
  </div>

  <div id="stage"></div>

  <div class="navbar">
    <button class="nav-btn" id="btnPrev" aria-label="Sebelumnya">←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="btnNext" aria-label="Berikutnya">→</button>
  </div>
  <footer class="hint">Gunakan tombol ← → atau geser layar untuk berpindah slide</footer>
</div>

<script>
/* ================= SLIDE DEFINITIONS ================= */
const slides = [
  // 0. COVER
  {
    id:'cover',
    render: () => `
      <div style="display:flex; flex-direction:column; justify-content:center; align-items:flex-start; height:100%;">
        <span class="eyebrow">Bab 7 &middot; Kode 7.1</span>
        <h1 style="font-size:clamp(28px,5.6vw,48px); font-weight:700; line-height:1.15; max-width:800px;">
          Berbagi Informasi<br>di <span style="background:linear-gradient(120deg,var(--coral),var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent;">Dunia Digital</span>
        </h1>
        <p style="margin-top:16px; color:var(--text-2); font-size:16px; max-width:620px; line-height:1.7;">
          Pengertian berbagi informasi, media berbagi informasi, manfaat, serta risiko berbagi informasi secara digital.
        </p>
        <div style="display:flex; gap:10px; margin-top:28px; flex-wrap:wrap;">
          <span class="tag-pill">📤 Pengertian</span>
          <span class="tag-pill">📱 Media</span>
          <span class="tag-pill">✅ Manfaat</span>
          <span class="tag-pill">⚠️ Risiko</span>
        </div>
        <button class="btn btn-primary" style="margin-top:34px;" onclick="goTo(1)">Mulai Belajar &rarr;</button>
      </div>`
  },
  // 1. APERSEPSI
  {
    id:'apersepsi',
    render: () => `
      <span class="eyebrow amber">Apersepsi</span>
      <h2 class="slide-title">Setiap Hari Kita "Membagikan" Sesuatu</h2>
      <p class="slide-sub">Coba ingat-ingat, aktivitas apa saja yang pernah kamu lakukan berikut ini?</p>
      <div class="grid3">
        <div class="info-card"><span class="icon">📸</span><h3>Unggah Foto</h3><p>Mengunggah foto liburan ke Instagram agar dilihat teman-teman.</p></div>
        <div class="info-card"><span class="icon">🔁</span><h3>Membagikan Berita</h3><p>Meneruskan (share) sebuah artikel berita ke grup WhatsApp keluarga.</p></div>
        <div class="info-card"><span class="icon">📍</span><h3>Check-in Lokasi</h3><p>Menandai lokasi saat sedang berada di suatu tempat pada media sosial.</p></div>
      </div>
      <div class="term-box" style="margin-top:22px;">
        <p>🤔 <b>Pertanyaan pemantik:</b> Setiap kali kita membagikan sesuatu secara digital, informasi itu bisa dilihat, disimpan, bahkan disebarluaskan oleh orang lain. Apakah semua informasi aman untuk dibagikan? Apa untung dan ruginya berbagi informasi secara digital?</p>
      </div>`
  },
  // 2. TUJUAN
  {
    id:'tujuan',
    render: () => `
      <span class="eyebrow">Tujuan Pembelajaran</span>
      <h2 class="slide-title">Setelah mempelajari materi ini, kamu diharapkan mampu:</h2>
      <div class="step-flow" style="margin-top:10px;">
        <div class="step-item"><div class="step-num">1</div><div class="step-text"><h4>Menjelaskan pengertian berbagi informasi digital</h4><p>Memahami konsep dasar berbagi informasi melalui perangkat digital.</p></div></div>
        <div class="step-item"><div class="step-num">2</div><div class="step-text"><h4>Mengidentifikasi media berbagi informasi</h4><p>Mengenali berbagai platform yang digunakan untuk berbagi informasi.</p></div></div>
        <div class="step-item"><div class="step-num">3</div><div class="step-text"><h4>Menjelaskan manfaat berbagi informasi</h4><p>Memahami keuntungan berbagi informasi secara digital.</p></div></div>
        <div class="step-item"><div class="step-num">4</div><div class="step-text"><h4>Mengidentifikasi risiko berbagi informasi</h4><p>Menyadari bahaya yang mungkin timbul dan cara bersikap bijak.</p></div></div>
      </div>`
  },
  // 3. PENGERTIAN
  {
    id:'pengertian',
    render: () => `
      <span class="eyebrow coral">Konsep 1</span>
      <h2 class="slide-title">Apa itu Berbagi Informasi di Dunia Digital?</h2>
      <div class="card">
        <p style="font-size:15.5px; line-height:1.8;">
          <b style="color:var(--coral);">Berbagi informasi di dunia digital</b> adalah kegiatan menyampaikan, menyebarkan, atau membagikan data, pesan, foto, video, maupun pendapat kepada orang lain melalui perangkat digital yang terhubung dengan internet.
        </p>
      </div>
      <div class="term-box">
        <p><b>Ciri utama:</b> prosesnya cepat, jangkauannya luas (bisa menjangkau banyak orang sekaligus), dan informasi yang sudah dibagikan sulit untuk sepenuhnya ditarik kembali.</p>
      </div>`
  },
  // 4. CONTOH BERBAGI INFORMASI (flip)
  {
    id:'contoh-berbagi',
    render: () => `
      <span class="eyebrow coral">Konsep 1 (lanjutan)</span>
      <h2 class="slide-title">Bentuk-bentuk Berbagi Informasi</h2>
      <p class="slide-sub">Klik setiap kartu untuk melihat contohnya.</p>
      <div class="flip-grid" id="bentukFlip"></div>`,
    afterRender: () => {
      const items = [
        {front:'📝 Teks/Tulisan', back:'Status, caption, atau pesan yang dibagikan di media sosial atau chat.'},
        {front:'🖼️ Gambar/Foto', back:'Foto pribadi, meme, atau infografis yang diunggah ke internet.'},
        {front:'🎬 Video', back:'Video pendek, tutorial, atau vlog yang dibagikan ke platform video.'},
        {front:'🔊 Audio', back:'Rekaman suara, podcast, atau pesan suara yang dikirim ke orang lain.'}
      ];
      document.getElementById('bentukFlip').innerHTML = items.map(it=>`
        <div class="flip-card" onclick="this.classList.toggle('flipped')">
          <div class="flip-inner">
            <div class="flip-face flip-front">${it.front}</div>
            <div class="flip-face flip-back">${it.back}</div>
          </div>
        </div>`).join('');
    }
  },
  // 5. MEDIA BERBAGI INFORMASI - overview
  {
    id:'media-overview',
    render: () => `
      <span class="eyebrow" style="color:var(--violet); background:#a78bfa33; border-color:#a78bfa55;">Konsep 2</span>
      <h2 class="slide-title">Media untuk Berbagi Informasi</h2>
      <p class="slide-sub">Ada berbagai platform digital yang dapat digunakan untuk berbagi informasi. Klik setiap kartu untuk penjelasan singkat.</p>
      <div class="flip-grid" id="mediaFlip"></div>`,
    afterRender: () => {
      const items = [
        {front:'📱 Media Sosial', back:'Instagram, Facebook, TikTok, X — untuk berbagi foto, video, dan status kepada banyak orang.'},
        {front:'💬 Aplikasi Pesan', back:'WhatsApp, Telegram, Line — untuk berbagi pesan secara personal atau kelompok.'},
        {front:'✉️ Email', back:'Digunakan untuk mengirim informasi resmi, dokumen, atau lampiran file.'},
        {front:'📝 Blog/Website', back:'Untuk membagikan tulisan, artikel, atau opini secara lebih panjang dan terstruktur.'},
        {front:'☁️ Cloud Storage', back:'Google Drive, Dropbox — untuk berbagi file besar seperti dokumen, foto, atau video.'},
        {front:'🎬 Platform Video', back:'YouTube — untuk membagikan video kepada audiens yang luas.'}
      ];
      document.getElementById('mediaFlip').innerHTML = items.map(it=>`
        <div class="flip-card" onclick="this.classList.toggle('flipped')">
          <div class="flip-inner">
            <div class="flip-face flip-front">${it.front}</div>
            <div class="flip-face flip-back">${it.back}</div>
          </div>
        </div>`).join('');
    }
  },
  // 6. MEDIA: PERSONAL VS PUBLIK
  {
    id:'media-jangkauan',
    render: () => `
      <span class="eyebrow" style="color:var(--violet); background:#a78bfa33; border-color:#a78bfa55;">Konsep 2 (lanjutan)</span>

/* ================= QUIZ DATA ================= */
const quizQuestions = [
  {q:'Manakah pengertian yang paling tepat untuk "berbagi informasi di dunia digital"?', opts:['Menyimpan data hanya untuk diri sendiri','Menyampaikan atau menyebarkan data/pesan kepada orang lain melalui perangkat digital','Menghapus data dari perangkat digital','Membeli barang secara online'], correct:1, exp:'Berbagi informasi digital adalah kegiatan menyampaikan/menyebarkan data kepada orang lain melalui perangkat digital yang terhubung internet.'},
  {q:'Manakah yang termasuk media untuk berbagi informasi dengan jangkauan luas/publik?', opts:['Chat pribadi dengan satu teman','Email ke satu penerima','Postingan publik di media sosial','Pesan suara pribadi'], correct:2, exp:'Postingan publik di media sosial dapat dilihat siapa saja, sehingga jangkauannya luas/publik.'},
  {q:'Manakah pernyataan berikut yang merupakan MANFAAT berbagi informasi secara digital?', opts:['Data pribadi bocor ke pihak tak bertanggung jawab', 'Informasi penting tersebar cepat ke banyak orang','Menjadi korban penipuan online','Foto pribadi disebarluaskan tanpa izin'], correct:1, exp:'Kecepatan penyebaran informasi penting adalah salah satu manfaat berbagi informasi digital.'},
  {q:'Menyebarkan pesan berantai yang belum tentu benar tanpa memeriksa sumbernya termasuk risiko...', opts:['Cyberbullying','Penipuan online','Penyebaran hoaks','Kebocoran data'], correct:2, exp:'Menyebarkan informasi yang belum diperiksa kebenarannya berisiko menyebabkan penyebaran hoaks.'},
  {q:'Informasi yang sudah pernah dibagikan secara publik di internet, walau sudah dihapus, tetap bisa "tertinggal" karena disimpan atau disebarkan orang lain. Hal ini disebut...', opts:['Protokol digital','Jejak digital','Media sosial','Enkripsi data'], correct:1, exp:'Jejak digital adalah bekas informasi yang tertinggal di internet meski sudah dihapus dari sumber aslinya.'},
  {q:'Sebelum membagikan informasi secara digital, sikap paling bijak yang sebaiknya dilakukan adalah...', opts:['Langsung membagikan tanpa memeriksa kebenarannya','Membagikan data pribadi sebanyak mungkin agar meyakinkan','Memikirkan dan memeriksa dahulu kebenaran serta dampaknya','Membagikan ke sebanyak mungkin platform sekaligus'], correct:2, exp:'Sikap bijak adalah memikirkan dan memeriksa kebenaran informasi serta dampaknya sebelum membagikan.'}
];
let quizState = {current:0, score:0, answered:false, log:[]};

function initQuiz(){
  quizState = {current:0, score:0, answered:false, log:[]};
  renderQuizProgress();
  renderQuizQuestion();
}
function renderQuizProgress(){
  const el = document.getElementById('quizProgress');
  if(!el) return;
  el.innerHTML = quizQuestions.map((_,i)=>{
    let cls='';
    if(quizState.log[i]===true) cls='done';
    if(quizState.log[i]===false) cls='wrong';
    return `<span class="${cls}"></span>`;
  }).join('');
}
function renderQuizQuestion(){
  const body = document.getElementById('quizBody');
  if(!body) return;
  if(quizState.current >= quizQuestions.length){
    const pct = Math.round((quizState.score/quizQuestions.length)*100);
    let msg = pct>=80 ? 'Luar biasa! Pemahamanmu tentang berbagi informasi digital sangat baik. 🌟' : pct>=60 ? 'Bagus! Terus berlatih agar semakin bijak bermedia digital. 💪' : 'Jangan menyerah, coba pelajari lagi materinya. 📘';
    body.innerHTML = `
      <div style="text-align:center; padding:20px 0;">
        <div class="big-num">${quizState.score}/${quizQuestions.length}</div>
        <p style="color:var(--text-2); margin:10px 0 4px; font-size:15px;">Skor kamu: <b class="mono" style="color:var(--text-1);">${pct}%</b></p>
        <p style="color:var(--text-2); font-size:14px; max-width:420px; margin:10px auto 22px;">${msg}</p>
        <button class="btn btn-primary" onclick="initQuiz()">🔄 Ulangi Kuis</button>
      </div>`;
    document.getElementById('quizTitle').textContent = 'Hasil Kuis';
    return;
  }
  const q = quizQuestions[quizState.current];
  document.getElementById('quizTitle').textContent = `Soal ${quizState.current+1} dari ${quizQuestions.length}`;
  quizState.answered = false;
  body.innerHTML = `
    <div class="card">
      <p style="font-size:15px; font-weight:600; margin-bottom:4px;">${q.q}</p>
      <div class="mc-options">
        ${q.opts.map((o,i)=>`<div class="mc-opt" data-i="${i}" onclick="answerQuiz(${i})"><span class="letter">${String.fromCharCode(65+i)}</span> ${o}</div>`).join('')}
      </div>
      <div class="feedback" id="quizFeedback"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-outline" id="quizNextBtn" style="display:none;" onclick="nextQuizQuestion()">Lanjut &rarr;</button>
      </div>
    </div>`;
}
function answerQuiz(i){
  if(quizState.answered) return;
  quizState.answered = true;
  const q = quizQuestions[quizState.current];
  const opts = document.querySelectorAll('#quizBody .mc-opt');
  const correct = i === q.correct;
  if(correct) quizState.score++;
  quizState.log[quizState.current] = correct;
  opts.forEach((el,idx)=>{
    if(idx===q.correct) el.classList.add('correct');
    else if(idx===i) el.classList.add('wrong');
  });
  const fb = document.getElementById('quizFeedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'bad');
  fb.innerHTML = (correct ? '✅ <b>Benar!</b> ' : '❌ <b>Belum tepat.</b> ') + q.exp;
  document.getElementById('quizNextBtn').style.display = 'inline-flex';
  renderQuizProgress();
}
function nextQuizQuestion(){
  quizState.current++;
  renderQuizQuestion();
}

/* ================= HELPERS ================= */
function toggleAccordion(id){
  document.getElementById(id).classList.toggle('open');
}
function toggleReveal(btn){
  const content = btn.nextElementSibling;
  content.classList.toggle('open');
}
function answerMC(el, prefix){
  const parent = el.parentElement;
  if(parent.dataset.locked) return;
  parent.dataset.locked = '1';
  const opts = parent.querySelectorAll('.mc-opt');
  const isCorrect = el.dataset.correct === 'true';
  opts.forEach(o=>{
    if(o.dataset.correct==='true') o.classList.add('correct');
    else if(o===el) o.classList.add('wrong');
  });
  const fb = document.getElementById(prefix+'-feedback');
  fb.className = 'feedback show ' + (isCorrect?'ok':'bad');
  fb.innerHTML = isCorrect ? '✅ <b>Tepat sekali!</b>' : '❌ <b>Belum tepat.</b> Perhatikan kembali penjelasan materi di atas.';
}
function answerTF(headEl, correct){
  const item = headEl.parentElement;
  const resultBox = item.querySelector('.tf-result');
  if(resultBox.dataset.answered) return;
  resultBox.dataset.answered = '1';
  resultBox.innerHTML = correct
    ? `<div class="feedback show ok" style="margin:10px 0 14px;">✅ <b>Benar</b> — pernyataan ini sesuai konsep.</div>`
    : `<div class="feedback show bad" style="margin:10px 0 14px;">❌ <b>Ini salah.</b></div>`;
}

/* ================= DRAG & DROP ================= */
function setupDragDrop(){
  const chips = document.querySelectorAll('.drag-chip');
  const zones = document.querySelectorAll('.drop-zone');
  chips.forEach(chip=>{
    chip.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', chip.dataset.idx); });
  });
  zones.forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('over');
      const idx = e.dataTransfer.getData('text/plain');
      const chip = document.querySelector(`.drag-chip[data-idx="${idx}"]`);
      if(!chip || chip.classList.contains('placed')) return;
      chip.classList.add('placed');
      const dzChip = document.createElement('span');
      dzChip.className = 'dz-chip';
      dzChip.textContent = chip.textContent;
      dzChip.dataset.idx = idx;
      dzChip.dataset.zoneType = zone.dataset.type;
      zone.appendChild(dzChip);
    });
  });
}
function checkDragMR(){
  const chips = [
    {type:'manfaat'},{type:'risiko'},{type:'manfaat'},{type:'risiko'}
  ];
  let correctCount = 0, total = 0;
  document.querySelectorAll('.drop-zone .dz-chip').forEach(dz=>{
    total++;
    const idx = dz.dataset.idx;
    if(chips[idx].type === dz.dataset.zoneType) correctCount++;
  });
  const result = document.getElementById('mrResult');
  if(total < chips.length){
    result.className = 'feedback show bad';
    result.innerHTML = '⚠️ Masih ada pernyataan yang belum kamu tempatkan. Seret semua kartu ke kotak yang sesuai.';
    return;
  }
  result.className = 'feedback show ' + (correctCount===chips.length ? 'ok' : 'bad');
  result.innerHTML = correctCount===chips.length
    ? '✅ <b>Sempurna!</b> Semua pernyataan sudah kamu kelompokkan dengan benar.'
    : `⚠️ Skor kamu: ${correctCount}/${chips.length} benar. Coba periksa kembali mana yang menguntungkan dan mana yang berisiko.`;
}

/* ================= ENGINE: navigation ================= */
let currentSlide = 0;
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');

function buildDots(){
  dotsWrap.innerHTML = slides.map((_,i)=>`<div class="dot" onclick="goTo(${i})"></div>`).join('');
}
function renderSlide(idx){
  stage.innerHTML = `<div class="slide" id="slideEl">${slides[idx].render()}</div>`;
  const el = document.getElementById('slideEl');
  requestAnimationFrame(()=> el.classList.add('active'));
  if(slides[idx].afterRender) slides[idx].afterRender();
  updateChrome(idx);
}
function updateChrome(idx){
  document.getElementById('slideCounter').textContent = `${idx+1} / ${slides.length}`;
  document.getElementById('progressFill').style.width = `${((idx+1)/slides.length)*100}%`;
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done', i<idx);
  });
  document.getElementById('btnPrev').disabled = idx===0;
  document.getElementById('btnNext').disabled = idx===slides.length-1;
}
function goTo(idx){
  if(idx<0 || idx>=slides.length) return;
  if(idx===currentSlide) return;
  currentSlide = Math.max(0, Math.min(slides.length-1, idx));
  renderSlide(currentSlide);
}
document.getElementById('btnPrev').addEventListener('click', ()=> goTo(currentSlide-1));
document.getElementById('btnNext').addEventListener('click', ()=> goTo(currentSlide+1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') goTo(currentSlide+1);
  if(e.key==='ArrowLeft') goTo(currentSlide-1);
});
let touchStartX = 0;
stage.addEventListener('touchstart', e=> touchStartX = e.changedTouches[0].screenX, {passive:true});
stage.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 50){ dx<0 ? goTo(currentSlide+1) : goTo(currentSlide-1); }
}, {passive:true});

/* ================= INIT ================= */
buildDots();
renderSlide(0);
</script>
