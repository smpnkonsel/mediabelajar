<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penyajian Data — 5.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1017;
    --bg-soft:#12161f;
    --panel:#1a2030;
    --panel-2:#212a3d;
    --line: rgba(148,163,196,0.14);
    --text:#e9edf7;
    --text-dim:#93a0bd;
    --text-faint:#5f6c8a;
    --tabel: #7c9eff;
    --batang: #ffb069;
    --garis: #6fe3c0;
    --lingkaran: #ff8ab0;
    --accent: #7c9eff;
    --good: #4fd18b;
    --bad: #ff6b7f;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 900px 600px at 12% -10%, rgba(124,158,255,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 110%, rgba(111,227,192,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.font-head{ font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:0.2px; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  ::selection{ background: rgba(124,158,255,0.35); }

  #app{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; gap:14px;
    padding:14px 24px 10px 24px;
    flex-shrink:0;
  }
  #topbar .kode{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--text-faint);
    border:1px solid var(--line); padding:3px 9px; border-radius:999px;
  }
  #topbar .judul-mini{ font-size:13px; color:var(--text-dim); }
  #progress-wrap{
    flex:1; height:6px; background:var(--panel); border-radius:999px; overflow:hidden;
    margin:0 6px;
  }
  #progress-bar{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--tabel), var(--garis));
    border-radius:999px;
    transition: width .45s cubic-bezier(.65,0,.35,1);
  }
  #slide-counter{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); min-width:52px; text-align:right; }

  /* ---------- stage ---------- */
  #stage{ position:relative; flex:1; overflow:hidden; }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding: 28px 56px 34px 56px;
    opacity:0; visibility:hidden; transform: translateY(14px) scale(0.99);
    transition: opacity .5s cubic-bezier(.65,0,.35,1), transform .5s cubic-bezier(.65,0,.35,1);
    overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  .slide-inner{ max-width:980px; margin:0 auto; width:100%; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--text-dim);
    margin-bottom:10px;
  }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .slide h2{ font-size:clamp(22px,3.4vw,34px); margin:0 0 6px 0; line-height:1.15; }
  .lead{ color:var(--text-dim); font-size:15px; margin:0 0 22px 0; max-width:640px; line-height:1.55; }

  /* ---------- cards ---------- */
  .card{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:20px 22px;
    box-shadow: var(--shadow);
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:820px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  .chip{
    display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--text-dim); margin-bottom:10px;
  }

  /* ---------- accordion ---------- */
  .acc-item{ border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; background:var(--bg-soft); }
  .acc-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; cursor:pointer; user-select:none; font-size:14.5px; font-weight:600;
  }
  .acc-head:hover{ background:rgba(255,255,255,0.03); }
  .acc-head .arrow{ transition: transform .3s; color:var(--text-faint); }
  .acc-item.open .acc-head .arrow{ transform:rotate(180deg); }
  .acc-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .acc-item.open .acc-body{ max-height:400px; }
  .acc-body-inner{ padding:0 16px 15px 16px; font-size:14px; color:var(--text-dim); line-height:1.6; }

  /* ---------- buttons ---------- */
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600;
    transition: all .2s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:rgba(124,158,255,0.5); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-accent{ background: linear-gradient(135deg, var(--tabel), #5a7ce0); border:none; color:#0d1017; }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- reveal ---------- */
  .reveal-box{ border:1px dashed var(--line); border-radius:var(--radius-sm); padding:14px 16px; background:var(--bg-soft); }
  .reveal-content{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .reveal-content.open{ max-height:500px; margin-top:10px; }

  /* ---------- quiz / options ---------- */
  .opt{
    display:block; width:100%; text-align:left;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--text);
    padding:11px 15px; border-radius:12px; margin-bottom:9px; font-size:14px;
    transition: all .18s;
  }
  .opt:hover:not(:disabled){ border-color:var(--accent); background:rgba(124,158,255,0.08); }
  .opt.correct{ border-color:var(--good); background:rgba(79,209,139,0.14); }
  .opt.wrong{ border-color:var(--bad); background:rgba(255,107,127,0.14); }
  .opt:disabled{ cursor:default; }

  .feedback{ font-size:13.5px; margin-top:10px; padding:10px 13px; border-radius:10px; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ background:rgba(79,209,139,0.12); color:var(--good); border:1px solid rgba(79,209,139,0.3); }
  .feedback.bad{ background:rgba(255,107,127,0.12); color:var(--bad); border:1px solid rgba(255,107,127,0.3); }

  /* ---------- table styling ---------- */
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ padding:10px 14px; text-align:center; border-bottom:1px solid var(--line); }
  th{ color:var(--text-dim); font-weight:600; font-size:12.5px; text-transform:none; background:rgba(255,255,255,0.02); }
  td.mono{ font-size:14px; }
  tr:last-child td{ border-bottom:none; }

  /* ---------- svg charts ---------- */
  .chart-wrap{ display:flex; justify-content:center; padding:6px 0; }
  svg text{ font-family:'Plus Jakarta Sans', sans-serif; }
  .bar-rect{ transition: height .4s cubic-bezier(.65,0,.35,1), y .4s cubic-bezier(.65,0,.35,1); cursor:pointer; }
  .pie-slice{ transition: opacity .2s; cursor:pointer; }
  .pie-slice:hover{ opacity:0.8; }

  /* ---------- slider ---------- */
  input[type=range]{ width:100%; accent-color: var(--batang); }

  /* ---------- footer nav ---------- */
  #navbar{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px 20px 24px; gap:14px;
  }
  #dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60%; }
  .dot-btn{ width:7px; height:7px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer; transition:all .25s; }
  .dot-btn.active{ width:20px; border-radius:5px; background:var(--accent); }
  .navbtn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:17px;
    display:flex; align-items:center; justify-content:center; transition:all .2s;
  }
  .navbtn:hover:not(:disabled){ background:var(--panel-2); border-color:var(--accent); }
  .navbtn:disabled{ opacity:.3; cursor:not-allowed; }

  .badge-good{ color:var(--good); font-weight:700; }
  .badge-bad{ color:var(--bad); font-weight:700; }
  ul.spaced li{ margin-bottom:6px; }
  .kbd{ font-family:'JetBrains Mono',monospace; font-size:11px; border:1px solid var(--line); padding:2px 6px; border-radius:6px; color:var(--text-dim); }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; justify-content:center; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .legend-dot{ width:10px; height:10px; border-radius:3px; }

  .cover-icons{ display:flex; gap:14px; margin:22px 0 6px 0; }
  .cover-icons .ic{
    width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:24px; border:1px solid var(--line);
  }

  .match-card{
    border:1px solid var(--line); background:var(--bg-soft); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:all .18s;
  }
  .match-card.selected{ border-color:var(--accent); background:rgba(124,158,255,0.1); }
  .match-card.matched{ border-color:var(--good); background:rgba(79,209,139,0.1); opacity:0.75; cursor:default; }
  .match-card.shake{ animation: shake .35s; border-color:var(--bad); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .score-circle{
    width:150px; height:150px; border-radius:50%; margin:16px auto;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: conic-gradient(var(--good) calc(var(--pct,0) * 1%), var(--panel) 0);
    position:relative;
  }
  .score-circle::before{
    content:''; position:absolute; inset:9px; border-radius:50%; background:var(--bg-soft);
  }
  .score-circle .val{ position:relative; font-family:'Fredoka'; font-size:30px; font-weight:600; }
  .score-circle .lbl{ position:relative; font-size:11px; color:var(--text-dim); }

  @media (max-width:720px){
    .slide{ padding:20px 18px 24px 18px; }
    #topbar{ padding:12px 16px 8px 16px; }
    #navbar{ padding:10px 16px 16px 16px; }
    #dots{ display:none; }
    .grid3{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="kode mono">5.3</span>
    <span class="judul-mini">Penyajian Data</span>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="slide-counter" class="mono">1 / 1</span>
  </div>

  <div id="stage"></div>

  <div id="navbar">
    <button class="navbtn" id="btn-prev" onclick="prevSlide()">‹</button>
    <div id="dots"></div>
    <button class="navbtn" id="btn-next" onclick="nextSlide()">›</button>
  </div>
</div>

<script>
/* =========================================================
   DATA MATERI
   ========================================================= */
const pengunjung = [
  {label:'Senin', value:25},
  {label:'Selasa', value:30},
  {label:'Rabu', value:20},
  {label:'Kamis', value:35},
  {label:'Jumat', value:40},
];
const suhu = [
  {label:'Jan', value:27},
  {label:'Feb', value:28},
  {label:'Mar', value:29},
  {label:'Apr', value:30},
  {label:'Mei', value:29},
  {label:'Jun', value:28},
];
const genre = [
  {label:'Fiksi', value:16, color:'#7c9eff'},
  {label:'Komik', value:10, color:'#ffb069'},
  {label:'Ensiklopedia', value:6, color:'#6fe3c0'},
  {label:'Biografi', value:4, color:'#ff8ab0'},
  {label:'Lainnya', value:4, color:'#c792ea'},
];
const totalGenre = genre.reduce((a,b)=>a+b.value,0);

/* =========================================================
   SVG CHART BUILDERS
   ========================================================= */
function buildBarChart(data, opts={}){
  const w = opts.w||620, h = opts.h||300;
  const padL=46, padB=40, padT=20, padR=20;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxV = opts.max || Math.max(...data.map(d=>d.value))*1.25;
  const bw = chartW/data.length*0.55;
  const gap = chartW/data.length;
  let bars='', labels='', gridlines='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH/steps)*i;
    const val = Math.round(maxV/steps*i);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(148,163,196,0.12)" stroke-width="1"/>`;
    gridlines += `<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${val}</text>`;
  }
  data.forEach((d,i)=>{
    const bh = (d.value/maxV)*chartH;
    const x = padL + gap*i + (gap-bw)/2;
    const y = padT + chartH - bh;
    const color = opts.color || 'var(--batang)';
    bars += `<rect class="bar-rect" data-i="${i}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="${color}" opacity="0.9"/>`;
    bars += `<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${d.value}</text>`;
    labels += `<text x="${x+bw/2}" y="${h-padB+18}" text-anchor="middle" font-size="11.5" fill="var(--text-dim)">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;">${gridlines}${bars}${labels}</svg>`;
}

function buildLineChart(data, opts={}){
  const w = opts.w||620, h = opts.h||300;
  const padL=46, padB=40, padT=24, padR=24;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const minV = opts.min ?? Math.min(...data.map(d=>d.value))-2;
  const maxV = opts.max ?? Math.max(...data.map(d=>d.value))+2;
  const stepX = chartW/(data.length-1);
  const xy = data.map((d,i)=>{
    const x = padL + stepX*i;
    const y = padT + chartH - ((d.value-minV)/(maxV-minV))*chartH;
    return {x,y,...d};
  });
  let gridlines='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH/steps)*i;
    const val = Math.round(minV + (maxV-minV)/steps*i);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(148,163,196,0.12)" stroke-width="1"/>`;
    gridlines += `<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${val}°</text>`;
  }
  const pathD = xy.map((p,i)=> (i===0?'M':'L')+p.x+' '+p.y).join(' ');
  const areaD = pathD + ` L ${xy[xy.length-1].x} ${padT+chartH} L ${xy[0].x} ${padT+chartH} Z`;
  let dots='', labels='';
  xy.forEach(p=>{
    dots += `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--garis)" stroke="var(--bg)" stroke-width="2"/>`;
    dots += `<text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text)">${p.value}°</text>`;
    labels += `<text x="${p.x}" y="${h-padB+18}" text-anchor="middle" font-size="11.5" fill="var(--text-dim)">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe3c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6fe3c0" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridlines}
    <path d="${areaD}" fill="url(#lg1)"/>
    <path d="${pathD}" fill="none" stroke="var(--garis)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function buildPieChart(data, total, opts={}){
  const size = opts.size||280;
  const r = size/2 - 10, cx=size/2, cy=size/2;
  let angle = -90;
  let slices='';
  data.forEach((d,i)=>{
    const sweep = (d.value/total)*360;
    const x1 = cx + r*Math.cos(angle*Math.PI/180);
    const y1 = cy + r*Math.sin(angle*Math.PI/180);
    const end = angle+sweep;
    const x2 = cx + r*Math.cos(end*Math.PI/180);
    const y2 = cy + r*Math.sin(end*Math.PI/180);
    const large = sweep>180?1:0;
    slices += `<path class="pie-slice" data-i="${i}" d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${d.color}"/>`;
    angle = end;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto;">
    <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="rgba(148,163,196,0.15)" stroke-width="1"/>
    ${slices}
    <circle cx="${cx}" cy="${cy}" r="${r*0.52}" fill="var(--bg-soft)"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)">${total}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10.5" fill="var(--text-dim)">siswa</text>
  </svg>`;
}

/* =========================================================
   SLIDE DEFINITIONS  (returns HTML string for each)
   ========================================================= */
const slides = [];

/* ---- 1. PEMBUKA ---- */
slides.push({
  title:'Pembuka',
  html:`
  <div class="eyebrow"><span class="dot"></span>Matematika · Kode 5.3</div>
  <h2>Penyajian Data</h2>
  <p class="lead">Tabel, diagram batang, diagram garis, diagram lingkaran, dan cara memilih bentuk penyajian yang paling sesuai dengan data yang kita punya.</p>
  <div class="cover-icons">
    <div class="ic" style="background:rgba(124,158,255,0.12); color:var(--tabel);">▦</div>
    <div class="ic" style="background:rgba(255,176,105,0.12); color:var(--batang);">▊</div>
    <div class="ic" style="background:rgba(111,227,192,0.12); color:var(--garis);">〰</div>
    <div class="ic" style="background:rgba(255,138,176,0.12); color:var(--lingkaran);">◔</div>
  </div>
  <p style="color:var(--text-faint); font-size:13px; margin-top:18px;">Geser dengan tombol di bawah, atau gunakan tombol panah keyboard.</p>
  `
});

/* ---- 2. APERSEPSI ---- */
slides.push({
  title:'Apersepsi',
  html:`
  <div class="eyebrow"><span class="dot"></span>Apersepsi</div>
  <h2>Pernahkah kamu melihat data seperti ini?</h2>
  <p class="lead">Perhatikan tiga potongan informasi berikut. Semuanya menyampaikan data, tapi dengan cara yang berbeda.</p>
  <div class="grid3">
    <div class="card">
      <div class="chip">Berita cuaca</div>
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">"Suhu naik dari 27° menjadi 30° dalam empat bulan terakhir."</p>
    </div>
    <div class="card">
      <div class="chip">Rapor sekolah</div>
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">Daftar nilai per mata pelajaran, disusun rapi dalam baris dan kolom.</p>
    </div>
    <div class="card">
      <div class="chip">Survei kelas</div>
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">"40% siswa menyukai fiksi, 25% menyukai komik…"</p>
    </div>
  </div>
  <div class="reveal-box" style="margin-top:18px;">
    <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleReveal('rv-aper')">
      <strong style="font-size:14px;">🤔 Menurutmu, apa perbedaan cara menyampaikan ketiga data itu?</strong>
      <span class="btn" style="pointer-events:none;">Lihat gambaran</span>
    </div>
    <div class="reveal-content" id="rv-aper">
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6; padding-top:10px;">
      Data yang sama bisa disajikan dengan cara berbeda — sebagai tabel, sebagai diagram batang, diagram garis, atau diagram lingkaran. Pemilihan bentuk yang tepat membuat data lebih mudah dibaca dan dipahami. Itulah yang akan kita pelajari hari ini.
      </p>
    </div>
  </div>
  `
});

/* ---- 3. TUJUAN ---- */
slides.push({
  title:'Tujuan Pembelajaran',
  html:`
  <div class="eyebrow"><span class="dot"></span>Tujuan Pembelajaran</div>
  <h2>Setelah pembelajaran ini, kamu mampu:</h2>

/* =========================================================

const stage = document.getElementById('stage');
slides.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide';
  div.id = 'slide-'+i;
  div.innerHTML = `<div class="slide-inner">${s.html}</div>`;
  stage.appendChild(div);
});
const dotsWrap = document.getElementById('dots');
slides.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className='dot-btn';
  b.title = s.title;
  b.onclick = ()=>goTo(i);
  dotsWrap.appendChild(b);
});

let current = 0;
function render(){
  slides.forEach((s,i)=>{
    document.getElementById('slide-'+i).classList.toggle('active', i===current);
  });
  document.querySelectorAll('.dot-btn').forEach((d,i)=>d.classList.toggle('active', i===current));
  document.getElementById('progress-bar').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('slide-counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===slides.length-1;
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
});
render();

/* =========================================================
   MATCHING LATIHAN (PEMILIHAN BENTUK)
   ========================================================= */
const matchPairs = [
  {id:'a', situasi:'Membandingkan hasil panen 4 desa musim ini', bentuk:'batang'},
  {id:'b', situasi:'Menunjukkan kenaikan berat badan bayi tiap bulan', bentuk:'garis'},
  {id:'c', situasi:'Menunjukkan proporsi jenis kendaraan yang lewat', bentuk:'lingkaran'},
  {id:'d', situasi:'Mencatat nilai ulangan tiap siswa secara rinci', bentuk:'tabel'},
];
const bentukLabel = {batang:'Diagram Batang', garis:'Diagram Garis', lingkaran:'Diagram Lingkaran', tabel:'Tabel'};
let selectedSituasi = null;
let matchedCount = 0;

function renderMatch(){
  const left = document.getElementById('match-left');
  const right = document.getElementById('match-right');
  if(!left) return;
  left.innerHTML=''; right.innerHTML='';
  const shuffledSituasi = [...matchPairs];
  shuffledSituasi.forEach(p=>{
    const el = document.createElement('div');
    el.className='match-card';
    el.id='sit-'+p.id;
    el.textContent = p.situasi;
    el.onclick = ()=>selectSituasi(p.id, el);
    left.appendChild(el);
  });
  const bentukOrder = ['batang','garis','lingkaran','tabel'];
  bentukOrder.forEach(b=>{
    const el = document.createElement('div');
    el.className='match-card';
    el.id='bnt-'+b;
    el.textContent = bentukLabel[b];
    el.onclick = ()=>selectBentuk(b, el);
    right.appendChild(el);
  });
}
function selectSituasi(id, el){
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('#match-left .match-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedSituasi = id;
}
function selectBentuk(bentuk, el){
  if(el.classList.contains('matched') || !selectedSituasi) return;
  const pair = matchPairs.find(p=>p.id===selectedSituasi);
  const fb = document.getElementById('match-feedback');
  if(pair.bentuk === bentuk){
    document.getElementById('sit-'+selectedSituasi).classList.add('matched');
    document.getElementById('sit-'+selectedSituasi).classList.remove('selected');
    el.classList.add('matched');
    matchedCount++;
    fb.className='feedback show good';
    fb.textContent = '✓ Tepat! "'+pair.situasi+'" paling cocok disajikan dengan '+bentukLabel[bentuk]+'.';
    if(matchedCount===matchPairs.length){
      fb.textContent += ' 🎉 Semua pasangan sudah tepat!';
    }
  } else {
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 350);
    fb.className='feedback show bad';
    fb.textContent = '✗ Belum tepat, coba pikirkan lagi apa yang ingin ditunjukkan situasi tersebut: perbandingan, perubahan, atau proporsi?';
  }
  selectedSituasi = null;
}
renderMatch();

/* =========================================================
   KUIS
   ========================================================= */
const quizData = [
  {
    q:'Bentuk penyajian data manakah yang paling cocok untuk menunjukkan perubahan suhu setiap bulan?',
    options:['Tabel','Diagram Batang','Diagram Garis','Diagram Lingkaran'],
    correct:2,
    exp:'Diagram garis paling cocok karena dapat menunjukkan arah perubahan (tren) data dari waktu ke waktu.'
  },
  {
    q:'Dari 40 siswa, 10 siswa menyukai komik. Berapa persentase siswa yang menyukai komik?',
    options:['10%','20%','25%','40%'],
    correct:2,
    exp:'(10 ÷ 40) × 100% = 25%.'
  },
  {
    q:'Total besar sudut seluruh juring pada diagram lingkaran adalah…',
    options:['100°','180°','270°','360°'],
    correct:3,
    exp:'Satu lingkaran penuh selalu berukuran 360°, karena mewakili keseluruhan data (100%).'
  },
  {
    q:'Data pengunjung perpustakaan: Senin 25, Selasa 30, Rabu 20, Kamis 35, Jumat 40. Bentuk penyajian apa yang paling cocok untuk membandingkan jumlah pengunjung antar hari?',
    options:['Tabel saja','Diagram Batang','Diagram Garis','Diagram Lingkaran'],
    correct:1,
    exp:'Diagram batang paling cocok untuk membandingkan nilai antar kategori yang terpisah, seperti hari-hari dalam seminggu.'
  },
  {
    q:'Jika suatu juring diagram lingkaran berukuran 90°, berapa persentase yang diwakilinya?',
    options:['15%','25%','50%','75%'],
    correct:1,
    exp:'(90° ÷ 360°) × 100% = 25%.'
  },
];
let quizIndex = 0, quizScore = 0, quizAnswered = false;

function renderQuiz(){
  const area = document.getElementById('quiz-area');
  if(!area) return;
  if(quizIndex >= quizData.length){
    const pct = Math.round(quizScore/quizData.length*100);
    area.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="score-circle" style="--pct:${pct};">
          <div class="val">${quizScore}/${quizData.length}</div>
          <div class="lbl">skor kamu</div>
        </div>
        <p style="font-size:14px; color:var(--text-dim);">${pct>=80?'Luar biasa! Pemahamanmu sudah sangat baik. 🌟':pct>=60?'Bagus! Sedikit lagi kamu akan menguasai materi ini. 👍':'Yuk pelajari lagi bagian yang belum dipahami, lalu coba lagi. 💪'}</p>
        <button class="btn btn-accent" onclick="restartQuiz()">↺ Ulangi Kuis</button>
      </div>`;
    return;
  }
  const q = quizData[quizIndex];
  area.innerHTML = `
    <div class="chip">Soal ${quizIndex+1} dari ${quizData.length}</div>
    <div class="card">
      <p style="font-size:15px; margin:0 0 16px 0;">${q.q}</p>
      <div id="quiz-opts">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerQuiz(${i})">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="quiz-fb"></div>
    </div>
  `;
  quizAnswered = false;
}
function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizData[quizIndex];
  const opts = document.querySelectorAll('#quiz-opts .opt');
  opts.forEach((o,idx)=>{
    o.disabled = true;
    if(idx===q.correct) o.classList.add('correct');
    else if(idx===i) o.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  const isCorrect = i===q.correct;
  if(isCorrect) quizScore++;
  fb.className = 'feedback show '+(isCorrect?'good':'bad');
  fb.innerHTML = (isCorrect?'✓ Benar! ':'✗ Belum tepat. ')+q.exp+
    `<div style="margin-top:10px;"><button class="btn btn-accent" onclick="nextQuiz()">${quizIndex<quizData.length-1?'Soal berikutnya →':'Lihat skor →'}</button></div>`;
}
function nextQuiz(){ quizIndex++; renderQuiz(); }
function restartQuiz(){ quizIndex=0; quizScore=0; renderQuiz(); }
renderQuiz();

</script>
