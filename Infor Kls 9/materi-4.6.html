<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.6 Penerapan Keamanan Data — Bab 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0B0E14;
  --bg-1:#11151F;
  --bg-2:#171C2A;
  --bg-3:#1E2536;
  --line:#2A3247;
  --ink-0:#F3F5FA;
  --ink-1:#C1C8DB;
  --ink-2:#828CA6;
  --cyan:#3FD3D9;
  --violet:#9C87F5;
  --amber:#F0AB3D;
  --rose:#F1708A;
  --green:#48D989;
  --red:#F0605F;
  --grad-1: linear-gradient(135deg,#3FD3D9 0%, #9C87F5 100%);
  --grad-2: linear-gradient(135deg,#F1708A 0%, #F0AB3D 100%);
  --shadow: 0 20px 50px -20px rgba(0,0,0,.65);
  --radius: 18px;
  --font-title:'Fredoka', sans-serif;
  --font-body:'Plus Jakarta Sans', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 12% 10%, rgba(63,211,217,.10), transparent 45%),
    radial-gradient(circle at 88% 90%, rgba(156,135,245,.12), transparent 45%),
    var(--bg-0);
  color:var(--ink-0);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{height:100vh; display:flex; flex-direction:column;}

/* TOP BAR */
.topbar{
  display:flex; align-items:center; gap:16px;
  padding:14px 22px; border-bottom:1px solid var(--line);
  background:rgba(17,21,31,.72); backdrop-filter:blur(10px); z-index:20;
}
.topbar .brand{font-family:var(--font-title); font-weight:600; font-size:15px; color:var(--ink-0); white-space:nowrap;}
.topbar .brand span{color:var(--cyan);}
.progress-track{flex:1; height:6px; border-radius:99px; background:var(--bg-3); overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; background:var(--grad-1); width:0%; transition:width .4s cubic-bezier(.4,0,.2,1);}
.slide-counter{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); white-space:nowrap; min-width:52px; text-align:right;}
.btn-home{border:1px solid var(--line); background:var(--bg-2); color:var(--ink-1); width:34px;height:34px; border-radius:10px; display:flex;align-items:center;justify-content:center; cursor:pointer; transition:.2s; flex-shrink:0;}
.btn-home:hover{background:var(--bg-3); color:var(--ink-0);}

/* VIEWPORT */
.viewport{flex:1; position:relative; overflow:hidden;}
.slide{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start; padding:38px 8vw 30px;
  overflow-y:auto; opacity:0; transform:translateX(40px); pointer-events:none;
  transition:opacity .38s ease, transform .38s ease;
}
.slide.active{opacity:1; transform:translateX(0); pointer-events:auto;}
.slide.prev{transform:translateX(-40px);}
.slide-inner{width:100%; max-width:920px; margin:auto 0; padding:10px 0 20px;}
.eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--cyan); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);}
h1.slide-title{font-family:var(--font-title); font-weight:600; font-size:clamp(26px,4vw,42px); line-height:1.18; color:var(--ink-0); margin-bottom:14px;}
p.lead{font-size:17px; line-height:1.7; color:var(--ink-1); max-width:70ch; margin-bottom:18px;}
.card{background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:760px){ .grid2,.grid3{grid-template-columns:1fr;} }

/* NAVBAR */
.navbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 22px; border-top:1px solid var(--line); background:rgba(17,21,31,.72); backdrop-filter:blur(10px); z-index:20;}
.nav-btn{font-family:var(--font-body); font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; padding:10px 18px; border-radius:12px; border:1px solid var(--line); background:var(--bg-2); color:var(--ink-0); cursor:pointer; transition:.2s;}
.nav-btn:hover:not(:disabled){background:var(--bg-3); transform:translateY(-1px);}
.nav-btn:disabled{opacity:.35; cursor:not-allowed;}
.nav-btn.primary{background:var(--grad-1); border:none; color:#07181a;}
.nav-btn.primary:hover{filter:brightness(1.08);}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:40vw; overflow:hidden;}
.dots .d{width:7px;height:7px;border-radius:50%; background:var(--bg-3); cursor:pointer; transition:.2s; flex-shrink:0;}
.dots .d.on{background:var(--cyan); width:20px; border-radius:4px;}
.dots .d.done{background:var(--violet);}
@media (max-width:700px){ .dots{display:none;} .nav-btn span.txt{display:none;} }

/* COMPONENTS */
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; padding:5px 11px; border-radius:99px; border:1px solid var(--line); color:var(--ink-2); background:var(--bg-2);}
ul.clean{list-style:none;}
ul.clean li{position:relative; padding-left:26px; margin-bottom:10px; color:var(--ink-1); line-height:1.6; font-size:15.5px;}
ul.clean li::before{content:""; position:absolute; left:0; top:7px; width:9px;height:9px; border-radius:3px; background:var(--cyan);}

.accordion{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:12px; background:var(--bg-1);}
.accordion .acc-head{padding:16px 18px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-weight:600; font-size:15.5px; color:var(--ink-0); transition:.2s;}
.accordion .acc-head:hover{background:var(--bg-2);}
.accordion .acc-head .chev{transition:.25s; color:var(--cyan); font-size:14px;}
.accordion.open .acc-head .chev{transform:rotate(180deg);}
.accordion .acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.accordion.open .acc-body{border-top:1px solid var(--line);}
.accordion .acc-body-inner{padding:16px 18px; color:var(--ink-1); font-size:15px; line-height:1.7;}

.reveal-box{border:1px dashed var(--line); border-radius:14px; padding:16px 18px; cursor:pointer; background:var(--bg-1); transition:.2s;}
.reveal-box:hover{border-color:var(--cyan);}
.reveal-box .rq{font-weight:600; color:var(--ink-0); font-size:15.5px;}
.reveal-box .ra{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--cyan); display:none; font-size:15px; line-height:1.65;}
.reveal-box.shown .ra{display:block;}
.reveal-box .hint{font-size:12px; color:var(--ink-2); margin-top:8px; font-family:var(--font-mono);}

.code-block{font-family:var(--font-mono); background:#080B12; border:1px solid var(--line); border-radius:14px; padding:18px 20px; font-size:14px; line-height:1.85; color:#D8E1F5; overflow-x:auto;}
.code-block .kw{color:var(--violet); font-weight:700;}
.code-block .cm{color:var(--ink-2); font-style:italic;}

.mcq-option{display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; cursor:pointer; background:var(--bg-1); transition:.15s; font-size:15px; color:var(--ink-1);}
.mcq-option:hover{border-color:var(--cyan); background:var(--bg-2);}
.mcq-option .letter{width:26px;height:26px;border-radius:8px; background:var(--bg-3); color:var(--ink-1); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12.5px; flex-shrink:0;}
.mcq-option.correct{border-color:var(--green); background:rgba(72,217,137,.08);}
.mcq-option.correct .letter{background:var(--green); color:#062715;}
.mcq-option.wrong{border-color:var(--red); background:rgba(240,96,95,.08);}
.mcq-option.wrong .letter{background:var(--red); color:#2a0808;}
.mcq-option.disabled{pointer-events:none;}
.feedback-box{margin-top:14px; padding:14px 16px; border-radius:12px; font-size:14.5px; line-height:1.65; display:none;}
.feedback-box.show{display:block;}
.feedback-box.ok{background:rgba(72,217,137,.08); border:1px solid var(--green); color:#CDF7DE;}
.feedback-box.bad{background:rgba(240,96,95,.08); border:1px solid var(--red); color:#FCD3D3;}

.badge-diff{display:inline-block; font-family:var(--font-mono); font-size:11px; padding:4px 10px; border-radius:99px; margin-bottom:10px;}
.badge-easy{background:rgba(72,217,137,.15); color:var(--green);}
.badge-med{background:rgba(240,171,61,.15); color:var(--amber);}
.badge-hard{background:rgba(241,112,138,.15); color:var(--rose);}

.icon-circle{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}

.kv-table{width:100%; border-collapse:collapse; font-size:14.5px;}
.kv-table th,.kv-table td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); color:var(--ink-1);}
.kv-table th{color:var(--ink-2); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;}
.kv-table tr:last-child td{border-bottom:none;}
.kv-table td.mono{font-family:var(--font-mono); color:var(--cyan);}

.email-mock{background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:0; overflow:hidden;}
.email-head{padding:14px 18px; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--ink-2);}
.email-head .row{margin-bottom:4px;}
.email-head b{color:var(--ink-0);}
.email-body{padding:18px; font-size:14.5px; line-height:1.75; color:var(--ink-1);}
.sus{cursor:pointer; border-bottom:2px dotted var(--amber); position:relative; transition:.2s;}
.sus:hover{background:rgba(240,171,61,.12);}
.sus.found{background:rgba(240,96,95,.18); border-bottom:2px solid var(--red); color:var(--ink-0); border-radius:3px; padding:1px 2px;}
.sus-tip{display:none; font-size:12.5px; font-family:var(--font-mono); color:var(--red); margin-top:2px;}
.sus.found + .sus-note{display:block;}

.checklist-item{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; cursor:pointer; background:var(--bg-1); transition:.2s;}
.checklist-item:hover{border-color:var(--cyan);}
.checklist-item.checked{border-color:var(--green); background:rgba(72,217,137,.06);}
.check-box{width:22px;height:22px; border-radius:6px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent; transition:.2s; margin-top:2px;}
.checklist-item.checked .check-box{background:var(--green); border-color:var(--green); color:#062715;}

.meter-track{height:10px; border-radius:99px; background:var(--bg-3); overflow:hidden; margin-top:10px;}
.meter-fill{height:100%; border-radius:99px; width:0%; transition:width .35s ease, background .35s ease;}
.pw-btn{padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg-2); color:var(--ink-1); cursor:pointer; font-family:var(--font-mono); font-size:13px; transition:.2s;}
.pw-btn:hover{border-color:var(--cyan); color:var(--ink-0);}
.pw-btn.active{background:var(--grad-1); color:#07181a; border-color:transparent;}

.match-col{display:flex; flex-direction:column; gap:10px;}
.match-item{padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg-1); cursor:pointer; font-size:14.5px; color:var(--ink-1); transition:.2s;}
.match-item:hover{border-color:var(--cyan);}
.match-item.selected{border-color:var(--cyan); background:rgba(63,211,217,.08); color:var(--ink-0);}
.match-item.matched{border-color:var(--green); background:rgba(72,217,137,.08); color:var(--ink-0); cursor:default;}
.match-item.wrong-flash{border-color:var(--red); background:rgba(240,96,95,.12);}

.dropzone{min-height:52px; border:1.5px dashed var(--line); border-radius:12px; display:flex; align-items:center; gap:8px; padding:8px 12px; flex-wrap:wrap; background:var(--bg-1); transition:.2s;}
.dropzone.over{border-color:var(--cyan); background:rgba(63,211,217,.06);}
.drag-chip{padding:9px 14px; border-radius:10px; background:var(--bg-3); border:1px solid var(--line); font-size:13.5px; cursor:grab; color:var(--ink-0); user-select:none;}
.drag-chip:active{cursor:grabbing;}
.drag-pool{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.slot-num{font-family:var(--font-mono); color:var(--ink-2); font-size:12px; width:20px; flex-shrink:0;}

.score-ring{width:150px; height:150px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:conic-gradient(var(--cyan) calc(var(--pct)*1%), var(--bg-3) 0); position:relative;}
.score-ring::before{content:""; position:absolute; inset:10px; border-radius:50%; background:var(--bg-1);}
.score-ring .score-num{position:relative; font-family:var(--font-title); font-size:32px; z-index:2;}

.step-flow{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:16px; position:relative; padding-bottom:26px;}
.step-item:last-child{padding-bottom:0;}
.step-item::before{content:""; position:absolute; left:18px; top:38px; bottom:0; width:2px; background:var(--line);}
.step-item:last-child::before{display:none;}
.step-num{width:38px;height:38px; border-radius:12px; background:var(--grad-1); color:#07181a; display:flex; align-items:center; justify-content:center; font-family:var(--font-title); font-weight:600; font-size:16px; flex-shrink:0; z-index:1;}
.step-text h4{font-size:15.5px; color:var(--ink-0); margin-bottom:4px;}
.step-text p{font-size:14px; color:var(--ink-1); line-height:1.6;}

.end-hero{text-align:center; padding:40px 0;}
.end-hero .big-check{width:88px; height:88px; margin:0 auto 22px; border-radius:26px; background:var(--grad-1); display:flex; align-items:center; justify-content:center; font-size:40px;}
@keyframes pop{0%{transform:scale(.9); opacity:0;} 100%{transform:scale(1); opacity:1;}}
.pop-in{animation:pop .35s ease;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg-3); border-radius:99px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">Bab 4 <span>›</span> 4.6 Penerapan Keamanan Data</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="slide-counter" id="slideCounter">1 / 20</div>
    <button class="btn-home" id="homeBtn" title="Kembali ke awal">⟲</button>
  </div>

  <div class="viewport" id="viewport"></div>

  <div class="navbar">
    <button class="nav-btn" id="prevBtn">‹ <span class="txt">Sebelumnya</span></button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn primary" id="nextBtn"><span class="txt">Berikutnya</span> ›</button>
  </div>
</div>

<script>
/* ============================================================
   SLIDE RENDER FUNCTIONS
   ============================================================ */

function slideCover(){
  return `
  <div class="slide-inner" style="text-align:center; padding-top:6vh;">
    <div class="eyebrow" style="justify-content:center;"><span class="dot"></span>INFORMATIKA · KURIKULUM MERDEKA</div>
    <h1 class="slide-title" style="font-size:clamp(28px,5vw,50px);">Penerapan<br>Keamanan Data</h1>
    <p class="lead" style="margin:0 auto 26px;">Bab 4 — Manajemen Keamanan Data dan Perlindungan Privasi &nbsp;·&nbsp; Submateri 4.6</p>
    <div class="card" style="max-width:660px; margin:0 auto; text-align:left;">
      <p style="color:var(--ink-1); font-size:15px; line-height:1.7;">
      Pada bagian ini kamu akan belajar menganalisis kasus keamanan data, menentukan
      <strong style="color:var(--cyan);">tindakan pencegahan</strong> yang tepat, menangani
      <strong style="color:var(--cyan);">insiden sederhana</strong>, dan menerapkan
      <strong style="color:var(--cyan);">praktik keamanan</strong> dalam kehidupan sehari-hari.
      </p>
    </div>
    <p style="margin-top:26px; color:var(--ink-2); font-size:13px; font-family:var(--font-mono);">Tekan "Berikutnya" atau tombol → untuk mulai</p>
  </div>`;
}

function slideApersepsi(){
  return `
  <div class="slide-inner">
    <div class="eyebrow"><span class="dot"></span>APERSEPSI</div>
    <h1 class="slide-title">Pernahkah kamu mengalami hal ini?</h1>
    <p class="lead">Klik tiap kartu di bawah ini. Semua situasi ini berkaitan langsung dengan keamanan data pribadimu di dunia digital.</p>
    <div class="grid3" id="apersepsiGrid"></div>
  </div>`;
}

function slideTujuan(){
  return `
  <div class="slide-inner">
    <div class="eyebrow"><span class="dot"></span>TUJUAN PEMBELAJARAN</div>
    <h1 class="slide-title">Setelah mempelajari bagian ini, kamu mampu:</h1>
    <div class="card">
      <ul class="clean" style="margin-bottom:0;">
        <li>Menganalisis sebuah <strong style="color:var(--ink-0);">kasus keamanan data</strong> untuk menemukan penyebab dan celah yang dimanfaatkan.</li>
        <li>Menentukan <strong style="color:var(--ink-0);">tindakan pencegahan</strong> yang sesuai untuk berbagai jenis ancaman.</li>
        <li>Menjelaskan langkah-langkah <strong style="color:var(--ink-0);">menangani insiden sederhana</strong> saat keamanan data terganggu.</li>
        <li>Menerapkan <strong style="color:var(--ink-0);">praktik keamanan digital</strong> dalam aktivitas sehari-hari secara konsisten.</li>
        <li>Membedakan aktivitas online yang <strong style="color:var(--ink-0);">aman</strong> dan yang <strong style="color:var(--ink-0);">berisiko</strong>.</li>
      </ul>
    </div>
  </div>`;
}

function slideKonsepDasar(){
  return `
  <div class="slide-inner">
    <div class="eyebrow"><span class="dot"></span>KONSEP DASAR</div>
    <h1 class="slide-title">Mengapa keamanan data itu penting?</h1>
    <p class="lead">Data pribadimu — mulai dari kata sandi, nomor telepon, hingga riwayat percakapan — adalah aset berharga. Jika jatuh ke tangan yang salah, dampaknya bisa sangat merugikan.</p>
    <div class="grid2">
      <div class="card">
        <div class="icon-circle" style="background:rgba(156,135,245,.15); color:var(--violet); margin-bottom:12px;">🔓</div>
        <h3 style="font-family:var(--font-title); font-size:17px; margin-bottom:8px;">Jika data tidak dilindungi</h3>
        <p style="color:var(--ink-1); font-size:14.5px; line-height:1.6;">Akun bisa diretas, identitas disalahgunakan, kerugian finansial, hingga pencemaran nama baik.</p>
      </div>
      <div class="card" style="border-color:var(--cyan);">
        <div class="icon-circle" style="background:rgba(63,211,217,.15); color:var(--cyan); margin-bottom:12px;">🔒</div>
        <h3 style="font-family:var(--font-title); font-size:17px; margin-bottom:8px;">Jika data dilindungi dengan baik</h3>
        <p style="color:var(--ink-1); font-size:14.5px; line-height:1.6;">Privasi terjaga, risiko penyalahgunaan berkurang, dan kepercayaan terhadap layanan digital meningkat.</p>
      </div>
    </div>
    <div class="reveal-box" id="konsepReveal" style="margin-top:16px;">
      <div class="rq">💡 Apa bedanya "keamanan data" dan "privasi data"? (klik untuk membuka jawaban)</div>
      <div class="ra"><strong style="color:var(--ink-0);">Keamanan data</strong> adalah upaya melindungi data dari akses, perubahan, atau perusakan yang tidak sah (misalnya lewat sandi dan enkripsi). <strong style="color:var(--ink-0);">Privasi data</strong> adalah hak seseorang untuk menentukan siapa saja yang boleh mengetahui dan menggunakan datanya. Keduanya saling berkaitan: keamanan data yang baik adalah salah satu cara untuk menjaga privasi.</div>
    </div>
  </div>`;
}

function slideJenisAncaman(){
  return `
  <div class="slide-inner">
    <div class="eyebrow"><span class="dot"></span>MENGENAL ANCAMAN</div>
    <h1 class="slide-title">Jenis-jenis ancaman keamanan data</h1>
    <p class="lead">Klik setiap kartu untuk memahami bagaimana ancaman ini bekerja.</p>
    <div class="accordion" id="acc1">
      <div class="acc-head"><span>🎣 Phishing (pengelabuan)</span><span class="chev">▾</span></div>
      <div class="acc-body"><div class="acc-body-inner">Upaya menipu seseorang agar memberikan data pribadi (misalnya kata sandi atau nomor kartu) melalui pesan, email, atau situs web palsu yang tampak meyakinkan seperti aslinya.</div></div>
    </div>
    <div class="accordion" id="acc2">
      <div class="acc-head"><span>🦠 Malware (perangkat lunak berbahaya)</span><span class="chev">▾</span></div>

function buildViewport(){

function goTo(idx){
  if(idx < 0 || idx >= slides.length) return;
  const prevIdx = current;
  current = idx;
  document.querySelectorAll('.slide').forEach((el,i)=>{
    el.classList.remove('active','prev');
    if(i === idx){
      el.innerHTML = slides[i].render();
      el.classList.add('active');
      requestAnimationFrame(()=> initSlide(slides[i].id));
    } else if(i === prevIdx){
      el.classList.add('prev');
    }
  });
  updateChrome();
  window.scrollTo(0,0);
}

function updateChrome(){
  const pct = (current/(slides.length-1))*100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('slideCounter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current === 0;
  const nb = document.getElementById('nextBtn');
  nb.innerHTML = current === slides.length-1 ? '<span class="txt">Selesai</span> ✓' : '<span class="txt">Berikutnya</span> ›';
  renderDots();
}

function renderDots(){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = slides.map((s,i)=>
    `<div class="d ${i===current?'on':(i<current?'done':'')}" data-goto="${i}" title="${s.label}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.d').forEach(d=>{
    d.addEventListener('click', ()=> goTo(parseInt(d.dataset.goto)));
  });
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(current === slides.length-1){ goTo(0); } else { goTo(current+1); }
});
document.getElementById('homeBtn').addEventListener('click', ()=> goTo(0));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') { e.preventDefault(); goTo(Math.min(current+1, slides.length-1)); }
  if(e.key === 'ArrowLeft') { e.preventDefault(); goTo(Math.max(current-1, 0)); }
});

/* ---- Password strength ---- */
function pwScore(pw){
  if(!pw) return 0;
  let score = 0;
  if(pw.length >= 8) score++;
  if(pw.length >= 12) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  if(/^(123456|password|qwerty|111111|123456789)/i.test(pw)) score = 0;
  return Math.min(score,5);
}
function initPassword(){
  const input = document.getElementById('pwInput');
  const meter = document.getElementById('pwMeter');
  const label = document.getElementById('pwLabel');
  const tips = document.getElementById('pwTips');
  function update(pw){
    const s = pwScore(pw);
    const pct = (s/5)*100;
    meter.style.width = pct+'%';
    const levels = [
      {text:'—', color:'var(--bg-3)', tip:''},
      {text:'Sangat Lemah', color:'var(--red)', tip:'Terlalu pendek/umum. Hindari kata sandi seperti ini sama sekali.'},
      {text:'Lemah', color:'var(--red)', tip:'Tambahkan huruf besar, angka, dan simbol.'},
      {text:'Cukup', color:'var(--amber)', tip:'Sudah lebih baik, tapi coba perpanjang dan variasikan karakter.'},
      {text:'Kuat', color:'var(--cyan)', tip:'Bagus! Kata sandi ini cukup sulit ditebak.'},
      {text:'Sangat Kuat', color:'var(--green)', tip:'Sangat baik — panjang, acak, dan bervariasi.'}
    ];
    const lv = levels[s];
    meter.style.background = lv.color;
    label.innerHTML = `Level: <strong style="color:${lv.color};">${pw ? lv.text : '—'}</strong>`;
    tips.textContent = pw ? lv.tip : 'Contoh kata sandi lemah biasanya pendek, umum, atau mudah ditebak.';
  }
  input.addEventListener('input', (e)=> update(e.target.value));
  document.querySelectorAll('.pw-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.pw-btn').forEach(b=> b.classList.remove('active'));
      btn.classList.add('active');
      input.value = btn.dataset.pw;
      update(btn.dataset.pw);
    });
  });
  update('');
}

function initMatching(){

  const shuffledActions = [...MATCH_DATA].map((d,i)=>({text:d.action, id:i})).sort(()=>Math.random()-0.5);

  leftEl.innerHTML = MATCH_DATA.map((d,i)=>`<div class="match-item" data-id="${i}">${d.scenario}</div>`).join('');
  rightEl.innerHTML = shuffledActions.map(a=>`<div class="match-item" data-id="${a.id}">${a.text}</div>`).join('');

  let selectedLeft = null;
  let matched = 0;

  leftEl.querySelectorAll('.match-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      if(item.classList.contains('matched')) return;
      leftEl.querySelectorAll('.match-item').forEach(i=> i.classList.remove('selected'));
      item.classList.add('selected');
      selectedLeft = item;
    });
  });
  rightEl.querySelectorAll('.match-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      if(item.classList.contains('matched') || !selectedLeft) return;
      const leftId = selectedLeft.dataset.id;
      const rightId = item.dataset.id;
      if(leftId === rightId){
        selectedLeft.classList.add('matched');
        selectedLeft.classList.remove('selected');
        item.classList.add('matched');
        matched++;
        statusEl.textContent = `Cocok: ${matched} / ${MATCH_DATA.length}`;
        if(matched === MATCH_DATA.length){
          statusEl.textContent = `🎉 Semua pasangan berhasil dicocokkan!`;
          statusEl.style.color = 'var(--green)';
        }
        selectedLeft = null;
      } else {
        item.classList.add('wrong-flash');
        setTimeout(()=> item.classList.remove('wrong-flash'), 500);
      }
    });
  });
}

/* ---- Drag order ---- */
function initDragOrder(){
  const shuffled = [...ORDER_STEPS].sort(()=>Math.random()-0.5);
  const slotsEl = document.getElementById('dropSlots');
  const poolEl = document.getElementById('dragPool');
  slotsEl.innerHTML = ORDER_STEPS.map((_,i)=>`
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <span class="slot-num">${i+1}.</span>
      <div class="dropzone" data-slot="${i}"></div>
    </div>`).join('');
  poolEl.innerHTML = shuffled.map(s=>`<div class="drag-chip" draggable="true" data-id="${s.id}">${s.text}</div>`).join('');

  function addDnD(chip){
    chip.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', chip.dataset.id);
      setTimeout(()=> chip.style.opacity='0.3',0);
    });
    chip.addEventListener('dragend', ()=> chip.style.opacity='1');
  }
  poolEl.querySelectorAll('.drag-chip').forEach(addDnD);

  document.querySelectorAll('.dropzone').forEach(zone=>{
    zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      zone.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      const chip = document.querySelector(`.drag-chip[data-id="${id}"]`);
      if(!chip) return;
      if(zone.children.length > 0){ poolEl.appendChild(zone.children[0]); }
      zone.appendChild(chip);
    });
  });

  document.getElementById('checkOrderBtn').addEventListener('click', ()=>{
    const zones = document.querySelectorAll('.dropzone');
    let allFilled = true, allCorrect = true;
    zones.forEach((z,i)=>{
      if(z.children.length === 0){ allFilled = false; return; }
      const id = z.children[0].dataset.id;
      if(id !== ORDER_STEPS[i].id) allCorrect = false;
    });
    const fb = document.getElementById('fb_order');
    if(!allFilled){
      fb.className = 'feedback-box show bad';
      fb.textContent = 'Lengkapi dulu semua kotak urutan sebelum diperiksa.';
      return;
    }
    if(allCorrect){
      fb.className = 'feedback-box show ok';
      fb.textContent = '✓ Tepat sekali! Inilah urutan penanganan insiden yang benar: kenali tanda → ganti kata sandi → aktifkan 2FA → periksa sesi/perangkat → laporkan ke pihak berwenang.';
    } else {
      fb.className = 'feedback-box show bad';
      fb.textContent = '✗ Urutan belum tepat. Ingat: kenali masalah dulu sebelum bertindak, lalu amankan akun (ganti sandi & aktifkan 2FA), baru periksa dan laporkan.';
    }
  });
  document.getElementById('resetOrderBtn').addEventListener('click', initDragOrder);
}

function initQuizQuestion(i){

  const container = document.getElementById('quizOptions_'+i);
  container.innerHTML = item.options.map((o,oi)=>`<div class="mcq-option" data-i="${oi}"><div class="letter">${String.fromCharCode(65+oi)}</div><div>${o}</div></div>`).join('');
  const fb = document.getElementById('quizFeedback_'+i);
  if(quizState.answered[i] !== undefined){
    const chosen = quizState.answered[i];
    container.querySelectorAll('.mcq-option').forEach(o=> o.classList.add('disabled'));
    container.querySelectorAll('.mcq-option')[item.correct].classList.add('correct');
    if(chosen !== item.correct) container.querySelectorAll('.mcq-option')[chosen].classList.add('wrong');
    fb.className = 'feedback-box show ' + (chosen===item.correct ? 'ok':'bad');
    fb.textContent = (chosen===item.correct ? '✓ Benar! ' : '✗ Kurang tepat. ') + item.explain;
    return;
  }
  container.querySelectorAll('.mcq-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(quizState.answered[i] !== undefined) return;
      const oi = parseInt(opt.dataset.i);
      quizState.answered[i] = oi;
      container.querySelectorAll('.mcq-option').forEach(o=> o.classList.add('disabled'));
      if(oi === item.correct){
        opt.classList.add('correct');
        fb.className = 'feedback-box show ok';
        fb.textContent = '✓ Benar! ' + item.explain;
      } else {
        opt.classList.add('wrong');
        container.querySelectorAll('.mcq-option')[item.correct].classList.add('correct');
        fb.className = 'feedback-box show bad';
        fb.textContent = '✗ Kurang tepat. ' + item.explain;
      }
    });
  });
}

function initQuizResult(){
  const total = QUIZ.length;
  const score = QUIZ.reduce((acc,item,i)=> acc + (quizState.answered[i]===item.correct?1:0), 0);
  const pct = Math.round((score/total)*100);
  document.getElementById('scoreRing').style.setProperty('--pct', pct);
  document.getElementById('scoreNum').textContent = score+'/'+total;
  let msg;
  if(pct >= 80) msg = 'Luar biasa! Pemahamanmu tentang penerapan keamanan data sudah sangat baik.';
  else if(pct >= 50) msg = 'Bagus! Beberapa konsep masih perlu ditinjau ulang, coba baca kembali bagian yang terasa sulit.';
  else msg = 'Jangan menyerah! Pelajari ulang bagian jenis ancaman dan tindakan pencegahan, lalu ulangi kuisnya.';
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('retryQuizBtn').addEventListener('click', ()=>{
    quizState.answered = {};
    goTo(slides.findIndex(s=>s.id==='quiz_0'));
  });
}

/* INIT */
goTo(0);
</script>
