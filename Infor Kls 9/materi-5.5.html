<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menyajikan dan Memvisualisasikan Data — 5.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08111a;
    --bg-soft:#0e1a26;
    --panel:#132330;
    --panel-2:#182b3a;
    --line: rgba(150,200,220,0.14);
    --text:#e8f3f7;
    --text-dim:#8fa9b8;
    --text-faint:#546c79;
    --tabel:#5ec8e0;
    --bar:#ff9f5a;
    --garis:#63e6a0;
    --lingkaran:#ff7ab6;
    --sebar:#c792ea;
    --danger:#ff6b7f;
    --accent: #5ec8e0;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 900px 600px at 10% -10%, rgba(94,200,224,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 110%, rgba(199,146,234,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.font-head{ font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:0.2px; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  ::selection{ background: rgba(94,200,224,0.32); }

  #app{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; }

  #topbar{ display:flex; align-items:center; gap:14px; padding:14px 24px 10px 24px; flex-shrink:0; }
  #topbar .kode{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); border:1px solid var(--line); padding:3px 9px; border-radius:999px; }
  #topbar .judul-mini{ font-size:13px; color:var(--text-dim); }
  #progress-wrap{ flex:1; height:6px; background:var(--panel); border-radius:999px; overflow:hidden; margin:0 6px; }
  #progress-bar{ height:100%; width:0%; background: linear-gradient(90deg, var(--tabel), var(--sebar)); border-radius:999px; transition: width .45s cubic-bezier(.65,0,.35,1); }
  #slide-counter{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); min-width:52px; text-align:right; }

  #stage{ position:relative; flex:1; overflow:hidden; }
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding: 28px 56px 34px 56px;
    opacity:0; visibility:hidden; transform: translateY(14px) scale(0.99);
    transition: opacity .5s cubic-bezier(.65,0,.35,1), transform .5s cubic-bezier(.65,0,.35,1);
    overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  .slide-inner{ max-width:1000px; margin:0 auto; width:100%; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:10px; }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .slide h2{ font-size:clamp(22px,3.4vw,34px); margin:0 0 6px 0; line-height:1.15; }
  .lead{ color:var(--text-dim); font-size:15px; margin:0 0 22px 0; max-width:680px; line-height:1.55; }

  .card{ background: linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius: var(--radius); padding:20px 22px; box-shadow: var(--shadow); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .grid5{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  @media (max-width:900px){ .grid5{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:820px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  .chip{ display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); margin-bottom:10px; }

  .acc-item{ border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; background:var(--bg-soft); }
  .acc-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; user-select:none; font-size:14.5px; font-weight:600; }
  .acc-head:hover{ background:rgba(255,255,255,0.03); }
  .acc-head .arrow{ transition: transform .3s; color:var(--text-faint); }
  .acc-item.open .acc-head .arrow{ transform:rotate(180deg); }
  .acc-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .acc-item.open .acc-body{ max-height:420px; }
  .acc-body-inner{ padding:0 16px 15px 16px; font-size:14px; color:var(--text-dim); line-height:1.6; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600; transition: all .2s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ border-color:rgba(94,200,224,0.5); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-accent{ background: linear-gradient(135deg, var(--tabel), #2f95ad); border:none; color:#031017; }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  .reveal-box{ border:1px dashed var(--line); border-radius:var(--radius-sm); padding:14px 16px; background:var(--bg-soft); }
  .reveal-content{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .reveal-content.open{ max-height:600px; margin-top:10px; }

  .opt{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--bg-soft); color:var(--text); padding:11px 15px; border-radius:12px; margin-bottom:9px; font-size:14px; transition: all .18s; }
  .opt:hover:not(:disabled){ border-color:var(--accent); background:rgba(94,200,224,0.08); }
  .opt.correct{ border-color:var(--garis); background:rgba(99,230,160,0.14); }
  .opt.wrong{ border-color:var(--danger); background:rgba(255,107,127,0.14); }
  .opt:disabled{ cursor:default; }

  .feedback{ font-size:13.5px; margin-top:10px; padding:10px 13px; border-radius:10px; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ background:rgba(99,230,160,0.12); color:var(--garis); border:1px solid rgba(99,230,160,0.3); }
  .feedback.bad{ background:rgba(255,107,127,0.12); color:var(--danger); border:1px solid rgba(255,107,127,0.3); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ padding:9px 12px; text-align:center; border-bottom:1px solid var(--line); }
  th{ color:var(--text-dim); font-weight:600; font-size:12px; background:rgba(255,255,255,0.02); }
  tr:last-child td{ border-bottom:none; }

  .chart-wrap{ display:flex; justify-content:center; padding:6px 0; }
  svg text{ font-family:'Plus Jakarta Sans', sans-serif; }
  .bar-rect{ transition: height .4s cubic-bezier(.65,0,.35,1), y .4s cubic-bezier(.65,0,.35,1); }
  .pie-slice{ transition: opacity .2s; cursor:pointer; }
  .pie-slice:hover{ opacity:0.8; }

  .cover-icons{ display:flex; gap:14px; margin:22px 0 6px 0; }
  .cover-icons .ic{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; border:1px solid var(--line); }

  .match-card{ border:1px solid var(--line); background:var(--bg-soft); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:all .18s; }
  .match-card.selected{ border-color:var(--accent); background:rgba(94,200,224,0.1); }
  .match-card.matched{ border-color:var(--garis); background:rgba(99,230,160,0.1); opacity:0.75; cursor:default; }
  .match-card.shake{ animation: shake .35s; border-color:var(--danger); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .score-circle{ width:150px; height:150px; border-radius:50%; margin:16px auto; display:flex; align-items:center; justify-content:center; flex-direction:column; background: conic-gradient(var(--garis) calc(var(--pct,0) * 1%), var(--panel) 0); position:relative; }
  .score-circle::before{ content:''; position:absolute; inset:9px; border-radius:50%; background:var(--bg-soft); }
  .score-circle .val{ position:relative; font-family:'Fredoka'; font-size:30px; font-weight:600; }
  .score-circle .lbl{ position:relative; font-size:11px; color:var(--text-dim); }

  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; justify-content:center; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .legend-dot{ width:10px; height:10px; border-radius:3px; }

  .type-card{ border:1px solid var(--line); background:var(--bg-soft); border-radius:14px; padding:14px; text-align:center; cursor:pointer; transition:all .18s; }
  .type-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .type-card .icon{ font-size:26px; margin-bottom:6px; }
  .type-card .name{ font-size:12.5px; font-weight:700; }

  #navbar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 24px 20px 24px; gap:14px; }
  #dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60%; }
  .dot-btn{ width:7px; height:7px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer; transition:all .25s; }
  .dot-btn.active{ width:20px; border-radius:5px; background:var(--accent); }
  .navbtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .navbtn:hover:not(:disabled){ background:var(--panel-2); border-color:var(--accent); }
  .navbtn:disabled{ opacity:.3; cursor:not-allowed; }

  .badge-good{ color:var(--garis); font-weight:700; }
  .badge-bad{ color:var(--danger); font-weight:700; }
  ul.spaced li{ margin-bottom:6px; }

  @media (max-width:720px){
    .slide{ padding:20px 18px 24px 18px; }
    #topbar{ padding:12px 16px 8px 16px; }
    #navbar{ padding:10px 16px 16px 16px; }
    #dots{ display:none; }
    .grid3{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="kode mono">5.5</span>
    <span class="judul-mini">Menyajikan dan Memvisualisasikan Data</span>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="slide-counter" class="mono">1 / 1</span>
  </div>

  <div id="stage"></div>

  <div id="navbar">
    <button class="navbtn" id="btn-prev" onclick="prevSlide()">‹</button>
    <div id="dots"></div>
    <button class="navbtn" id="btn-next" onclick="nextSlide()">›</button>
  </div>
</div>

<script>
/* =========================================================
   DATA MATERI
   ========================================================= */
const olahraga = [
  {label:'Sepak Bola', value:14},
  {label:'Basket', value:9},
  {label:'Bulu Tangkis', value:11},
  {label:'Renang', value:6},
];
const nilaiBulanan = [
  {label:'Jan', value:74},
  {label:'Feb', value:76},
  {label:'Mar', value:79},
  {label:'Apr', value:81},
  {label:'Mei', value:80},
  {label:'Jun', value:85},
];
const pengeluaran = [
  {label:'Jajan', value:45, color:'#ff9f5a'},
  {label:'Transportasi', value:25, color:'#5ec8e0'},
  {label:'Tabungan', value:20, color:'#63e6a0'},
  {label:'Lainnya', value:10, color:'#c792ea'},
];
const totalPengeluaran = pengeluaran.reduce((a,b)=>a+b.value,0);
const jamBelajarNilai = [
  {x:1, y:60},{x:2, y:65},{x:2.5, y:68},{x:3, y:72},{x:3.5, y:75},
  {x:4, y:78},{x:4.5, y:80},{x:5, y:85},{x:5.5, y:88},{x:6, y:92},
];

/* =========================================================
   SVG CHART BUILDERS
   ========================================================= */
function buildBarChart(data, opts={}){
  const w=opts.w||620, h=opts.h||300, padL=46, padB=40, padT=20, padR=20;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const maxV = opts.max || Math.max(...data.map(d=>d.value))*1.25;
  const bw = chartW/data.length*0.55;
  const gap = chartW/data.length;
  let bars='', labels='', gridlines='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH/steps)*i;
    const val = Math.round(maxV/steps*i);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(150,200,220,0.12)" stroke-width="1"/>`;
    gridlines += `<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${val}</text>`;
  }
  data.forEach((d,i)=>{
    const bh = (d.value/maxV)*chartH;
    const x = padL + gap*i + (gap-bw)/2;
    const y = padT + chartH - bh;
    const color = opts.color || 'var(--bar)';
    bars += `<rect class="bar-rect" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="6" fill="${color}" opacity="0.9"/>`;
    bars += `<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${d.value}</text>`;
    labels += `<text x="${x+bw/2}" y="${h-padB+18}" text-anchor="middle" font-size="11" fill="var(--text-dim)">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;">${gridlines}${bars}${labels}</svg>`;
}

function buildLineChart(data, opts={}){
  const w=opts.w||620, h=opts.h||300, padL=46, padB=40, padT=24, padR=24;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const minV = opts.min ?? Math.min(...data.map(d=>d.value))-5;
  const maxV = opts.max ?? Math.max(...data.map(d=>d.value))+5;
  const stepX = chartW/(data.length-1);
  const xy = data.map((d,i)=>{
    const x = padL + stepX*i;
    const y = padT + chartH - ((d.value-minV)/(maxV-minV))*chartH;
    return {x,y,...d};
  });
  let gridlines='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH/steps)*i;
    const val = Math.round(minV + (maxV-minV)/steps*i);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(150,200,220,0.12)" stroke-width="1"/>`;
    gridlines += `<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${val}</text>`;
  }
  const pathD = xy.map((p,i)=> (i===0?'M':'L')+p.x+' '+p.y).join(' ');
  const areaD = pathD + ` L ${xy[xy.length-1].x} ${padT+chartH} L ${xy[0].x} ${padT+chartH} Z`;
  let dots='', labels='';
  xy.forEach(p=>{
    dots += `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--garis)" stroke="var(--bg)" stroke-width="2"/>`;
    dots += `<text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text)">${p.value}</text>`;
    labels += `<text x="${p.x}" y="${h-padB+18}" text-anchor="middle" font-size="11.5" fill="var(--text-dim)">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63e6a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#63e6a0" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridlines}
    <path d="${areaD}" fill="url(#lg1)"/>
    <path d="${pathD}" fill="none" stroke="var(--garis)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function buildPieChart(data, total, opts={}){
  const size = opts.size||280;
  const r = size/2 - 10, cx=size/2, cy=size/2;
  let angle = -90;
  let slices='';
  data.forEach((d)=>{
    const sweep = (d.value/total)*360;
    const x1 = cx + r*Math.cos(angle*Math.PI/180);
    const y1 = cy + r*Math.sin(angle*Math.PI/180);
    const end = angle+sweep;
    const x2 = cx + r*Math.cos(end*Math.PI/180);
    const y2 = cy + r*Math.sin(end*Math.PI/180);
    const large = sweep>180?1:0;
    slices += `<path class="pie-slice" d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${d.color}"/>`;
    angle = end;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto;">
    <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="rgba(150,200,220,0.15)" stroke-width="1"/>
    ${slices}
    <circle cx="${cx}" cy="${cy}" r="${r*0.5}" fill="var(--bg-soft)"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" fill="var(--text-dim)">100%</text>
  </svg>`;
}

function buildScatterChart(data, opts={}){
  const w=opts.w||560, h=opts.h||300, padL=46, padB=40, padT=20, padR=20;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const maxX = Math.max(...data.map(d=>d.x))+1, minX=0;
  const maxY = Math.max(...data.map(d=>d.y))+8, minY=Math.min(...data.map(d=>d.y))-8;
  let gridlines='', dots='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH/steps)*i;
    const val = Math.round(minY + (maxY-minY)/steps*i);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(150,200,220,0.12)" stroke-width="1"/>`;
    gridlines += `<text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${val}</text>`;
  }
  for(let i=0;i<=6;i++){
    const x = padL + chartW/6*i;
    const val = (minX + (maxX-minX)/6*i).toFixed(1);
    gridlines += `<text x="${x}" y="${h-padB+18}" text-anchor="middle" font-size="10.5" fill="var(--text-dim)">${val}</text>`;
  }
  data.forEach(d=>{
    const x = padL + ((d.x-minX)/(maxX-minX))*chartW;
    const y = padT + chartH - ((d.y-minY)/(maxY-minY))*chartH;
    dots += `<circle cx="${x}" cy="${y}" r="5.5" fill="var(--sebar)" opacity="0.85" stroke="var(--bg)" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;">
    ${gridlines}${dots}
    <text x="${w/2}" y="${h-4}" text-anchor="middle" font-size="11" fill="var(--text-faint)">Jam belajar per hari</text>
  </svg>`;
}

/* =========================================================
   SLIDE DEFINITIONS
   ========================================================= */
const slides = [];

/* ---- 1. PEMBUKA ---- */
slides.push({title:'Pembuka', html:`
  <div class="eyebrow"><span class="dot"></span>Bab 5 · Mengolah dan Menginterpretasikan Data</div>
  <h2>5.5 Menyajikan dan Memvisualisasikan Data</h2>
  <p class="lead">Mempelajari cara menyajikan data dalam bentuk tabel, diagram, dan grafik agar data lebih mudah dipahami dan dimaknai.</p>
  <div class="cover-icons">
    <div class="ic" style="background:rgba(94,200,224,0.14); color:var(--tabel);">▦</div>
    <div class="ic" style="background:rgba(255,159,90,0.14); color:var(--bar);">▊</div>
    <div class="ic" style="background:rgba(99,230,160,0.14); color:var(--garis);">〰</div>
    <div class="ic" style="background:rgba(255,122,182,0.14); color:var(--lingkaran);">◔</div>
    <div class="ic" style="background:rgba(199,146,234,0.14); color:var(--sebar);">⁘</div>
  </div>
  <p style="color:var(--text-faint); font-size:13px; margin-top:18px;">Geser dengan tombol di bawah, atau gunakan tombol panah keyboard.</p>
`});

/* ---- 2. APERSEPSI ---- */
slides.push({title:'Apersepsi', html:`
  <div class="eyebrow"><span class="dot"></span>Apersepsi</div>
  <h2>Mana yang lebih mudah dipahami?</h2>
  <div class="grid2">
    <div class="card">
      <div class="chip">Data mentah</div>
      <p class="mono" style="font-size:12.5px; color:var(--text-dim); line-height:1.9;">74, 76, 79, 81, 80, 85 — nilai rata-rata ulangan tiap bulan, Januari sampai Juni</p>
    </div>
    <div class="card">
      <div class="chip">Data divisualisasikan</div>
      <div class="chart-wrap">${buildLineChart(nilaiBulanan,{w:340,h:190})}</div>
    </div>
  </div>

/* =========================================================
   RENDER SLIDES
   ========================================================= */
const stage = document.getElementById('stage');
slides.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide';
  div.id = 'slide-'+i;
  div.innerHTML = `<div class="slide-inner">${s.html}</div>`;
  stage.appendChild(div);
});
const dotsWrap = document.getElementById('dots');
slides.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className='dot-btn';
  b.title = s.title;
  b.onclick = ()=>goTo(i);
  dotsWrap.appendChild(b);
});

let current = 0;
function render(){
  slides.forEach((s,i)=>{
    document.getElementById('slide-'+i).classList.toggle('active', i===current);
  });
  document.querySelectorAll('.dot-btn').forEach((d,i)=>d.classList.toggle('active', i===current));
  document.getElementById('progress-bar').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('slide-counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===slides.length-1;
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
});
render();

function toggleAcc(id){ document.getElementById(id).classList.toggle('open'); }
function toggleReveal(id){ document.getElementById(id).classList.toggle('open'); }

  {situasi:'Melihat apakah ada hubungan antara jam tidur dan nilai konsentrasi belajar', options:['Grafik Sebar','Tabel','Diagram Batang'], correct:0, exp:'Grafik sebar paling cocok untuk melihat hubungan atau korelasi antara dua variabel.'},
];
function renderChoose(){
  const wrap = document.getElementById('choose-list');
  if(!wrap) return;
  wrap.innerHTML='';
  chooseItems.forEach((item,i)=>{
    const card = document.createElement('div');
    card.className='card';
    card.style.marginBottom='14px';
    card.innerHTML = `
      <p style="font-size:13.5px; margin:0 0 12px 0;">${item.situasi}</p>
      <div id="choose-opts-${i}" style="display:flex; gap:8px; flex-wrap:wrap;">
        ${item.options.map((o,oi)=>`<button class="btn" onclick="answerChoose(${i},${oi})">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="choose-fb-${i}"></div>
    `;
    wrap.appendChild(card);
  });
}
function answerChoose(qi, oi){
  const item = chooseItems[qi];
  const fb = document.getElementById('choose-fb-'+qi);
  const isCorrect = oi===item.correct;
  fb.className='feedback show '+(isCorrect?'good':'bad');
  fb.textContent = (isCorrect?'✓ Tepat! ':'✗ Belum tepat. ')+item.exp;
}
renderChoose();

  {txt:'Sebuah diagram batang memotong sumbu-y sehingga perbedaan kecil terlihat sangat besar.', misleading:true, why:'Memotong sumbu membuat perbedaan antar kategori tampak jauh lebih besar dari kenyataan.'},
  {txt:'Diagram lingkaran digunakan untuk menunjukkan tren penjualan selama 12 bulan.', misleading:true, why:'Diagram lingkaran tidak cocok untuk menunjukkan tren waktu; diagram garis jauh lebih tepat untuk itu.'},
  {txt:'Semua juring pada diagram lingkaran diberi label persentase yang jumlahnya 100%.', misleading:false, why:'Ini sesuai aturan dasar diagram lingkaran, di mana seluruh juring harus berjumlah 100%.'},
];
function renderMislead(){
  const wrap = document.getElementById('mislead-list');
  if(!wrap) return;
  wrap.innerHTML='';
  misleadItems.forEach((item,i)=>{
    const el = document.createElement('div');
    el.className='reveal-box';
    el.style.marginBottom='10px';
    el.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:12px;" onclick="toggleReveal('mis-${i}')">
        <span style="font-size:13.5px;">${item.txt}</span>
        <span class="btn" style="pointer-events:none; font-size:12px; padding:5px 10px; flex-shrink:0;">Cek</span>
      </div>
      <div class="reveal-content" id="mis-${i}">
        <p style="padding-top:8px; font-size:13.5px; color:var(--text-dim);"><span class="${item.misleading?'badge-bad':'badge-good'}">${item.misleading?'⚠ MENYESATKAN':'✓ WAJAR'}</span> — ${item.why}</p>
      </div>
    `;
    wrap.appendChild(el);
  });
}
renderMislead();

/* =========================================================
   KUIS
   ========================================================= */
const quizData = [
  {q:'Bentuk visualisasi apa yang paling cocok untuk membandingkan jumlah siswa di 4 ekstrakurikuler berbeda?', options:['Diagram Garis','Diagram Batang','Grafik Sebar','Diagram Lingkaran'], correct:1, exp:'Diagram batang paling cocok untuk membandingkan nilai antar kategori yang terpisah.'},
  {q:'Grafik sebar (scatter plot) paling cocok digunakan untuk…', options:['Menunjukkan proporsi','Menunjukkan hubungan antara dua variabel','Mencatat data secara rinci','Menampilkan data dalam baris dan kolom'], correct:1, exp:'Grafik sebar menampilkan dua variabel sekaligus untuk melihat apakah ada hubungan atau pola di antara keduanya.'},
  {q:'Sebuah diagram batang yang sumbu-y-nya dipotong sehingga perbedaan kecil tampak sangat besar disebut…', options:['Diagram yang akurat','Diagram yang menyesatkan','Diagram yang lengkap','Diagram yang proporsional'], correct:1, exp:'Memotong sumbu-y membuat perbedaan antar kategori terlihat lebih besar dari kenyataan, sehingga menyesatkan pembaca.'},
  {q:'Total seluruh juring pada diagram lingkaran harus berjumlah…', options:['50%','75%','100%','200%'], correct:2, exp:'Diagram lingkaran mewakili keseluruhan data, sehingga seluruh juring harus berjumlah 100%.'},
  {q:'Menjelaskan makna dan pola yang muncul dari suatu visualisasi data disebut…', options:['Penyajian data','Interpretasi data','Pengumpulan data','Klasifikasi data'], correct:1, exp:'Interpretasi data adalah proses menjelaskan makna dan pola yang muncul dari data yang telah disajikan.'},
];
let quizIndex=0, quizScore=0, quizAnswered=false;
function renderQuiz(){
  const area = document.getElementById('quiz-area');
  if(!area) return;
  if(quizIndex >= quizData.length){
    const pct = Math.round(quizScore/quizData.length*100);
    area.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="score-circle" style="--pct:${pct};">
          <div class="val">${quizScore}/${quizData.length}</div>
          <div class="lbl">skor kamu</div>
        </div>
        <p style="font-size:14px; color:var(--text-dim);">${pct>=80?'Luar biasa! Pemahamanmu tentang visualisasi data sudah sangat baik. 🌟':pct>=60?'Bagus! Sedikit lagi kamu akan menguasai materi ini. 👍':'Yuk pelajari lagi bagian yang belum dipahami, lalu coba lagi. 💪'}</p>
        <button class="btn btn-accent" onclick="restartQuiz()">↺ Ulangi Kuis</button>
      </div>`;
    return;
  }
  const q = quizData[quizIndex];
  area.innerHTML = `
    <div class="chip">Soal ${quizIndex+1} dari ${quizData.length}</div>
    <div class="card">
      <p style="font-size:15px; margin:0 0 16px 0;">${q.q}</p>
      <div id="quiz-opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
      <div class="feedback" id="quiz-fb"></div>
    </div>`;
  quizAnswered=false;
}
function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered=true;
  const q = quizData[quizIndex];
  const opts = document.querySelectorAll('#quiz-opts .opt');
  opts.forEach((o,idx)=>{
    o.disabled=true;
    if(idx===q.correct) o.classList.add('correct');
    else if(idx===i) o.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  const isCorrect = i===q.correct;
  if(isCorrect) quizScore++;
  fb.className='feedback show '+(isCorrect?'good':'bad');
  fb.innerHTML=(isCorrect?'✓ Benar! ':'✗ Belum tepat. ')+q.exp+
    `<div style="margin-top:10px;"><button class="btn btn-accent" onclick="nextQuiz()">${quizIndex<quizData.length-1?'Soal berikutnya →':'Lihat skor →'}</button></div>`;
}
function nextQuiz(){ quizIndex++; renderQuiz(); }
function restartQuiz(){ quizIndex=0; quizScore=0; renderQuiz(); }
renderQuiz();

</script>
