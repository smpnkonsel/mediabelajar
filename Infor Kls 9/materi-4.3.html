<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>4.3 Ancaman dan Risiko Keamanan Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13;
  --panel:#12161f;
  --panel-2:#181e29;
  --panel-3:#1f2733;
  --line:#2b3444;
  --line-soft:#1a212c;
  --text:#eef1f7;
  --text-muted:#8e98ab;
  --text-faint:#556074;
  --red:#ff4d5e;
  --red-dim:#3d1b22;
  --amber:#ffb020;
  --amber-dim:#3d2e12;
  --cyan:#2fd8d8;
  --cyan-dim:#123434;
  --green:#3ddc8b;
  --green-dim:#163a29;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:24px;
  --font-head:'Fredoka',sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --maxw:920px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle 420px at 12% -6%, rgba(255,77,94,0.08), transparent),
    radial-gradient(circle 420px at 92% 104%, rgba(47,216,216,0.07), transparent);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--red);color:#1c0508;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}

#app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}
.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:var(--line-soft);z-index:60;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--cyan));transition:width .45s cubic-bezier(.4,0,.2,1);}

.slides-viewport{flex:1;position:relative;overflow:hidden;}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:44px 24px 96px;opacity:0;pointer-events:none;transform:translateX(24px);
  transition:opacity .38s ease, transform .38s cubic-bezier(.4,0,.2,1);overflow-y:auto;
}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.slide-inner{width:100%;max-width:var(--maxw);margin:0 auto;padding-bottom:20px;}

/* scan bar — recurring structural device: "radar ancaman" */
.scan-bar{
  display:flex;align-items:center;gap:10px;width:100%;max-width:var(--maxw);margin:0 auto 28px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:10px 16px;font-family:var(--font-mono);font-size:12.5px;
}
.scan-bar .ic{color:var(--cyan);font-size:14px;}
.scan-bar .mod{color:var(--text-faint);border-right:1px solid var(--line);padding-right:12px;}
.scan-bar .level{color:var(--amber);background:var(--amber-dim);border:1px solid #6b5320;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.scan-bar .title{color:var(--text-muted);margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

h1.slide-title{font-family:var(--font-head);font-weight:600;font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0 0 14px;color:var(--text);}
p.lead{font-size:16.5px;line-height:1.65;color:var(--text-muted);margin:0 0 18px;max-width:70ch;}
p{line-height:1.65;color:var(--text-muted);}
strong{color:var(--text);font-weight:600;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:20px 22px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--cyan);background:var(--cyan-dim);border:1px solid #1f6b6b;padding:3px 10px;border-radius:20px;}
.tag.danger{color:var(--red);background:var(--red-dim);border-color:#7a2c34;}
.tag.warn{color:var(--amber);background:var(--amber-dim);border-color:#6b5320;}
.tag.safe{color:var(--green);background:var(--green-dim);border-color:#2c5b40;}

.btn{font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:11px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;transition:transform .15s ease, background .15s ease;}
.btn:hover{background:var(--panel-3);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--red);border-color:var(--red);color:#1c0508;}
.btn-primary:hover{background:#ff6b78;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.nav-bar{position:fixed;left:0;bottom:0;width:100%;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:rgba(10,13,19,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.nav-btn{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn:not(:disabled):hover{background:var(--panel-3);}
.nav-mid{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);color:var(--text-muted);font-size:13px;}
.nav-home{color:var(--text-faint);background:transparent;border:none;cursor:pointer;font-size:13px;font-family:var(--font-mono);}
.nav-home:hover{color:var(--cyan);}

/* Accordion */
.accordion-item{border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;overflow:hidden;background:var(--panel);}
.accordion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;}
.accordion-head:hover{background:var(--panel-2);}
.accordion-head .term{font-weight:700;color:var(--text);font-family:var(--font-head);font-size:16px;}
.accordion-head .chev{color:var(--cyan);transition:transform .25s ease;font-size:14px;}
.accordion-item.open .chev{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.accordion-item.open .accordion-body{max-height:280px;}
.accordion-body-inner{padding:0 16px 16px;color:var(--text-muted);font-size:14.5px;line-height:1.6;}

/* Chips / classify */
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.chip{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;cursor:pointer;color:var(--text);}
.chip.picked{border-color:var(--cyan);color:var(--cyan);}
.chip.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.chip.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.bucket-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px;}
.bucket-row.three{grid-template-columns:repeat(3,1fr);}
@media (max-width:720px){.bucket-row,.bucket-row.three{grid-template-columns:1fr;}}
.bucket{border:1px dashed var(--line);border-radius:var(--radius-s);padding:14px 10px;text-align:center;color:var(--text-muted);font-size:13px;cursor:pointer;min-height:56px;}
.bucket:hover{border-color:var(--cyan);}

/* Steps */
.step-list{counter-reset:step;}
.step{display:flex;gap:14px;margin-bottom:16px;}
.step-num{counter-increment:step;flex:none;width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;}
.step-num::before{content:counter(step);}
.step-body{flex:1;padding-top:4px;}
.step-body .stitle{font-weight:700;color:var(--text);margin-bottom:3px;}

/* Tip cards */
.tip-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px;background:var(--panel);}
.tip-card .ic{font-size:22px;margin-bottom:8px;display:block;}
.tip-card h3{font-family:var(--font-head);font-size:15.5px;margin:0 0 6px;color:var(--text);font-weight:600;}
.tip-card p{font-size:13.5px;margin:0;}

/* SMS mockup (hotspot) */
.sms-wrap{position:relative;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--panel);padding:20px 18px;}
.sms-bubble{background:var(--panel-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px;max-width:420px;}
.sms-from{font-family:var(--font-mono);font-size:12px;color:var(--red);margin-bottom:8px;}
.sms-text{font-size:14px;color:var(--text);line-height:1.6;}
.sms-text .lnk{color:var(--cyan);font-family:var(--font-mono);}
.hotspot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--red);border:2px solid var(--bg);color:#1c0508;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.5);}50%{box-shadow:0 0 0 7px rgba(255,77,94,0);}}
.hotspot-note{display:none;margin-top:14px;padding:14px 16px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--line);font-size:14.5px;color:var(--text-muted);}
.hotspot-note.show{display:block;}
.hotspot-note b{color:var(--red);}

/* Risk checker cards */
.risk-card{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--panel);padding:18px 20px;margin-bottom:14px;}
.risk-card p.scenario{margin:0 0 12px;color:var(--text);font-size:14.5px;}
.risk-gauge-track{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:12px;}
.risk-gauge-fill{height:100%;width:0%;border-radius:4px;transition:width .5s ease, background .5s ease;}
.risk-verdict{display:none;margin-top:12px;}
.risk-verdict.show{display:block;}
.risk-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-family:var(--font-mono);font-size:12px;font-weight:700;margin-bottom:8px;}
.risk-badge.low{background:var(--green-dim);color:var(--green);}
.risk-badge.med{background:var(--amber-dim);color:var(--amber);}
.risk-badge.high{background:var(--red-dim);color:var(--red);}

/* Options */
.opt-btn{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--text);font-size:14.5px;cursor:pointer;}
.opt-btn:hover{border-color:var(--cyan);}
.opt-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.opt-btn:disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--line);font-size:14px;color:var(--text-muted);display:none;}
.explain-box.show{display:block;}

/* Quiz */
.quiz-progress{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.quiz-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.quiz-dot.answered{background:var(--red);}
.quiz-dot.current{outline:2px solid var(--cyan);outline-offset:2px;}
.quiz-score{text-align:center;padding:30px 10px;}
.quiz-score .num{font-family:var(--font-head);font-size:56px;color:var(--red);}
.quiz-score .of{color:var(--text-faint);font-family:var(--font-mono);}

/* Reflection */
textarea.reflect{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--text);font-family:var(--font-body);font-size:14.5px;padding:12px;resize:vertical;}
textarea.reflect:focus{border-color:var(--cyan);}
.checklist label{display:flex;align-items:center;gap:10px;padding:9px 0;color:var(--text-muted);font-size:14.5px;cursor:pointer;}
.checklist input{accent-color:var(--red);width:17px;height:17px;}

/* Cover */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding-top:10px;}
.hero-icon{width:110px;height:110px;margin-bottom:22px;}
.kode-badge{font-family:var(--font-mono);color:var(--red);background:var(--red-dim);border:1px solid #7a2c34;padding:4px 12px;border-radius:20px;font-size:12.5px;margin-bottom:16px;display:inline-block;}
.cover-wrap h1{font-size:clamp(28px,5.6vw,44px);}
.cover-wrap .sub{color:var(--text-muted);font-size:16px;max-width:60ch;margin-bottom:30px;}

.summary-card{border-left:3px solid var(--red);padding:14px 18px;background:var(--panel);border-radius:0 var(--radius-s) var(--radius-s) 0;margin-bottom:12px;}
.summary-card b{color:var(--text);}

.slide::-webkit-scrollbar{width:8px;}
.slide::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

@media (max-width:600px){
  .nav-mid span.hint{display:none;}
  .scan-bar .title{font-size:11.5px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="slides-viewport" id="viewport"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">‹ Sebelumnya</button>
    <div class="nav-mid">
      <button class="nav-home" id="homeBtn" title="Kembali ke awal">⌂ Awal</button>
      <span id="slideCounter">1 / 1</span>
      <span class="hint" style="color:var(--text-faint);">&nbsp;·&nbsp; gunakan ← →</span>
    </div>
    <button class="nav-btn" id="nextBtn">Berikutnya ›</button>
  </div>
</div>

<script>
/* =========================================================================
   DATA — konten pembelajaran
   Bab 4 — Manajemen Keamanan Data dan Perlindungan Privasi
   Submateri (kode 4.3) : Ancaman dan Risiko Keamanan Data
   Materi Pokok : Malware, phishing, pencurian identitas, kebocoran data,
                  rekayasa sosial, dan berbagai risiko keamanan digital
   ========================================================================= */

const SLIDES = [];
function addSlide(html){ SLIDES.push(html); }

/* ---------- 1. Cover ---------- */
addSlide(`
<div class="cover-wrap">
  <span class="kode-badge">Bab 4 · 4.3 Ancaman dan Risiko Keamanan Data</span>
  <svg class="hero-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#2b3444" stroke-width="2"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#2b3444" stroke-width="2"/>
    <circle cx="60" cy="60" r="18" fill="none" stroke="#2b3444" stroke-width="2"/>
    <circle cx="60" cy="60" r="3" fill="#2fd8d8"/>
    <g style="transform-origin:60px 60px;animation:sweep 3.2s linear infinite;">
      <path d="M60 60 L60 14 A46 46 0 0 1 96 34 Z" fill="url(#sweepGrad)" opacity="0.55"/>
    </g>
    <circle cx="86" cy="40" r="4" fill="#ff4d5e"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <defs>
      <linearGradient id="sweepGrad" x1="60" y1="60" x2="96" y2="14" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2fd8d8" stop-opacity="0.6"/>
        <stop offset="1" stop-color="#2fd8d8" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>
  <h1 class="slide-title">Ancaman dan Risiko<br>Keamanan Data</h1>
  <p class="sub">Mengenali malware, phishing, pencurian identitas, kebocoran data, rekayasa sosial, dan berbagai risiko keamanan digital lainnya — serta cara mewaspadainya.</p>
  <button class="btn btn-primary" id="startBtn">Mulai Belajar →</button>
</div>
<style>
@keyframes sweep{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
`);

/* ---------- 2. Apersepsi ---------- */
addSlide(`
<h1 class="slide-title">Sebelum Mulai, Coba Pikirkan Dulu</h1>
<p class="lead">Laptop sekolah tiba-tiba melambat drastis setelah Pak Budi memasang aplikasi pengedit dokumen gratis yang diunduh dari situs tidak resmi. Beberapa hari kemudian, banyak file penting di laptop itu tidak bisa dibuka dan muncul pesan permintaan uang tebusan.</p>
<div class="card">
  <p style="margin:0 0 14px;color:var(--text);font-weight:600;">Menurutmu, ancaman keamanan apa yang paling mungkin dialami Pak Budi?</p>
  <div id="apersepsiOpts"></div>
  <div class="hotspot-note" id="apersepsiNote"></div>
</div>
`);

/* ---------- 3. Tujuan ---------- */
addSlide(`
<h1 class="slide-title">Tujuan Pembelajaran</h1>
<p class="lead">Setelah menyelesaikan pembelajaran ini, kalian diharapkan mampu:</p>
<div class="step-list">
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Menjelaskan berbagai jenis malware dan cara kerjanya.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Mengenali ciri-ciri phishing dan pencurian identitas.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Menjelaskan penyebab kebocoran data dan langkah penanganannya.</p></div></div>
  <div class="step"><div class="step-num"></div><div class="step-body"><p style="margin:0;">Mengenali taktik rekayasa sosial dan menilai tingkat risiko keamanan digital.</p></div></div>
</div>
`);

/* ---------- 4. Apa itu ancaman & risiko ---------- */
addSlide(`
<h1 class="slide-title">Apa Itu Ancaman dan Risiko Keamanan Data?</h1>
<p class="lead"><strong>Ancaman</strong> adalah segala sesuatu yang berpotensi membahayakan data atau sistem digital kita, sedangkan <strong>risiko</strong> adalah kemungkinan dan besarnya dampak jika ancaman tersebut benar-benar terjadi.</p>
<div class="grid-2">
  <div class="card"><span class="tag danger">Ancaman</span><p style="margin-top:10px;">Contoh: virus komputer, email phishing, atau peretas yang mencoba masuk ke akun kita.</p></div>
  <div class="card"><span class="tag warn">Risiko</span><p style="margin-top:10px;">Contoh: seberapa besar kemungkinan data sekolah bocor, dan seberapa parah dampaknya jika benar terjadi.</p></div>
</div>
`);

/* ---------- 5. Peta ancaman ---------- */
addSlide(`
<h1 class="slide-title">Peta Ancaman Keamanan Digital</h1>
<p class="lead">Ada lima kelompok besar ancaman yang akan kita pelajari satu per satu di modul ini.</p>
<div class="grid-3">
  <div class="tip-card"><span class="ic">🦠</span><h3>Malware</h3><p>Perangkat lunak berbahaya yang merusak atau mencuri data.</p></div>
  <div class="tip-card"><span class="ic">🎣</span><h3>Phishing</h3><p>Penipuan untuk memancing korban memberikan data pribadi.</p></div>
  <div class="tip-card"><span class="ic">🪪</span><h3>Pencurian Identitas</h3><p>Penyalahgunaan data pribadi seseorang oleh pihak lain.</p></div>
  <div class="tip-card"><span class="ic">📤</span><h3>Kebocoran Data</h3><p>Data pengguna suatu layanan tersebar tanpa izin.</p></div>
  <div class="tip-card"><span class="ic">🎭</span><h3>Rekayasa Sosial</h3><p>Manipulasi psikologis agar korban membocorkan informasi.</p></div>
  <div class="tip-card"><span class="ic">⚠️</span><h3>Risiko Lainnya</h3><p>WiFi publik, aplikasi bajakan, dan kebiasaan digital berisiko lain.</p></div>
</div>
`);

/* ---------- 6. Malware: jenis-jenis (accordion) ---------- */
addSlide(`
<h1 class="slide-title">Malware: Apa Itu &amp; Jenis-jenisnya</h1>
<p class="lead"><strong>Malware</strong> (malicious software) adalah perangkat lunak yang sengaja dibuat untuk merusak, mencuri data, atau mengganggu sistem digital. Ketuk setiap jenis untuk mempelajarinya.</p>
<div id="accordionMalware"></div>
`);

/* ---------- 7. Bagaimana malware menyebar ---------- */
addSlide(`
<h1 class="slide-title">Bagaimana Malware Menyebar &amp; Cara Mencegahnya</h1>
<div class="step-list">

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let current = 0;
const total = SLIDES.length;
const slideEls = Array.from(document.querySelectorAll('.slide'));
const progressFill = document.getElementById('progressFill');
const counter = document.getElementById('slideCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function goTo(idx){
  if(idx < 0 || idx >= total) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  slideEls[current].scrollTop = 0;
  progressFill.style.width = ((current)/(total-1)*100) + '%';
  counter.textContent = (current+1) + ' / ' + total;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}
prevBtn.addEventListener('click', () => goTo(current-1));
nextBtn.addEventListener('click', () => goTo(current+1));
document.getElementById('homeBtn').addEventListener('click', () => goTo(0));
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'textarea' || tag === 'input') return;
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});
goTo(0);
document.addEventListener('click', (e) => {
  if(e.target.id === 'startBtn') goTo(1);
  if(e.target.id === 'restartBtn') goTo(0);
});

/* =========================================================================
   REUSABLE — classify chips + buckets
   ========================================================================= */
function initClassifyGame(chipsId, bucketsId, progressId, items){
  const chipRow = document.getElementById(chipsId);
  const progressEl = document.getElementById(progressId);
  let selected = null;
  let correctCount = 0;
  items.forEach(it=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = it.v;
    chip.dataset.cat = it.cat;
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('correct')) return;
      chipRow.querySelectorAll('.chip').forEach(c=>c.classList.remove('picked'));
      chip.classList.add('picked');
      selected = chip;
    });
    chipRow.appendChild(chip);
  });
  document.querySelectorAll('#'+bucketsId+' .bucket').forEach(bucket=>{
    bucket.addEventListener('click', ()=>{
      if(!selected) return;
      if(selected.dataset.cat === bucket.dataset.cat){
        selected.classList.remove('picked');
        selected.classList.add('correct');
        selected.style.pointerEvents = 'none';
        correctCount++;
        progressEl.textContent = correctCount + ' / ' + items.length + ' benar';
      } else {
        selected.classList.add('wrong');
        setTimeout(()=> selected.classList.remove('wrong'), 500);
      }
      selected = null;
    });
  });
}

   opts:["Mengabaikannya karena sudah terlanjur","Segera mengganti kata sandi, terutama yang dipakai berulang","Menghapus aplikasi tanpa mengganti kata sandi","Menunggu beberapa bulan sebelum bertindak"], correct:1,

   opts:["Meningkatkan risiko malware","Menurunkan risiko karena telah melalui pemeriksaan keamanan","Tidak berpengaruh pada risiko keamanan","Membuat ponsel otomatis lebih cepat"], correct:1,
   explain:"Aplikasi di toko resmi melewati proses pemeriksaan keamanan, sehingga risiko mengandung malware jauh lebih rendah."}
];
let quizAnswers = new Array(QUIZ.length).fill(null);
let quizIndex = 0;

function renderQuiz(){
  const area = document.getElementById('quizArea');
  const allAnswered = quizAnswers.every(a => a !== null);
  if(allAnswered){
    const score = quizAnswers.reduce((s,a,i)=> s + (a === QUIZ[i].correct ? 1 : 0), 0);
    area.innerHTML = `
      <div class="quiz-score">
        <div style="font-family:var(--font-mono);color:var(--text-muted);margin-bottom:6px;">Skor Akhir</div>
        <div class="num">${score}</div>
        <div class="of">dari ${QUIZ.length} soal</div>
      </div>
      <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" id="retryQuiz">↺ Ulangi Kuis</button></div>
    `;
    document.getElementById('retryQuiz').addEventListener('click', ()=>{
      quizAnswers = new Array(QUIZ.length).fill(null);
      quizIndex = 0;
      renderQuiz();
    });
    return;
  }
  if(quizAnswers[quizIndex] !== null){
    const next = quizAnswers.findIndex(a=>a===null);
    quizIndex = next === -1 ? quizIndex : next;
  }
  const item = QUIZ[quizIndex];
  const dots = QUIZ.map((_,i)=>`<div class="quiz-dot ${quizAnswers[i]!==null?'answered':''} ${i===quizIndex?'current':''}"></div>`).join('');
  area.innerHTML = `
    <div class="quiz-progress">${dots}</div>
    <div class="card">
      <span class="tag">Soal ${quizIndex+1} / ${QUIZ.length}</span>
      <p style="margin:12px 0 14px;color:var(--text);font-size:16px;">${item.q}</p>
      <div id="quizOpts"></div>
      <div class="explain-box" id="quizExplain">${item.explain}</div>
      <div class="btn-row" id="quizNavRow" style="display:none;">
        <button class="btn" id="quizPrev">‹ Soal sebelumnya</button>
        <button class="btn btn-primary" id="quizNext">Soal berikutnya ›</button>
      </div>
    </div>
  `;
  const optWrap = document.getElementById('quizOpts');
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.addEventListener('click', ()=>{
      quizAnswers[quizIndex] = i;
      optWrap.querySelectorAll('.opt-btn').forEach((x,xi)=>{
        x.disabled = true;
        if(xi === item.correct) x.classList.add('correct');
        else if(xi === i) x.classList.add('wrong');
      });
      document.getElementById('quizExplain').classList.add('show');
      document.getElementById('quizNavRow').style.display = 'flex';
      document.querySelector('#quizArea .quiz-dot.current')?.classList.add('answered');
    });
    optWrap.appendChild(b);
  });
  setTimeout(()=>{
    const prevBtn2 = document.getElementById('quizPrev');
    const nextBtn2 = document.getElementById('quizNext');
    if(prevBtn2) prevBtn2.addEventListener('click', ()=>{ quizIndex = Math.max(0, quizIndex-1); renderQuiz(); });
    if(nextBtn2) nextBtn2.addEventListener('click', ()=>{
      quizIndex = quizIndex+1 < QUIZ.length ? quizIndex+1 : quizIndex;
      renderQuiz();
    });
  },0);
}
renderQuiz();
</script>
