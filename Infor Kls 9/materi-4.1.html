<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep Keamanan Data — 4.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c14;
    --bg-soft:#11131e;
    --panel:#171a28;
    --panel-2:#1d2133;
    --line: rgba(160,160,220,0.14);
    --text:#eceefb;
    --text-dim:#9a9db8;
    --text-faint:#5c5f78;
    --confid:#a78bfa;
    --integ:#5ec8e0;
    --avail:#5fd6a0;
    --warn:#ffc061;
    --danger:#ff6b7f;
    --accent: #a78bfa;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 900px 600px at 10% -10%, rgba(167,139,250,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 110%, rgba(94,200,224,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.font-head{ font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:0.2px; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  ::selection{ background: rgba(167,139,250,0.32); }

  #app{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; }

  #topbar{ display:flex; align-items:center; gap:14px; padding:14px 24px 10px 24px; flex-shrink:0; }
  #topbar .kode{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); border:1px solid var(--line); padding:3px 9px; border-radius:999px; }
  #topbar .judul-mini{ font-size:13px; color:var(--text-dim); }
  #progress-wrap{ flex:1; height:6px; background:var(--panel); border-radius:999px; overflow:hidden; margin:0 6px; }
  #progress-bar{ height:100%; width:0%; background: linear-gradient(90deg, var(--confid), var(--integ), var(--avail)); border-radius:999px; transition: width .45s cubic-bezier(.65,0,.35,1); }
  #slide-counter{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint); min-width:52px; text-align:right; }

  #stage{ position:relative; flex:1; overflow:hidden; }
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding: 28px 56px 34px 56px;
    opacity:0; visibility:hidden; transform: translateY(14px) scale(0.99);
    transition: opacity .5s cubic-bezier(.65,0,.35,1), transform .5s cubic-bezier(.65,0,.35,1);
    overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  .slide-inner{ max-width:1000px; margin:0 auto; width:100%; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:10px; }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .slide h2{ font-size:clamp(22px,3.4vw,34px); margin:0 0 6px 0; line-height:1.15; }
  .lead{ color:var(--text-dim); font-size:15px; margin:0 0 22px 0; max-width:680px; line-height:1.55; }

  .card{ background: linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius: var(--radius); padding:20px 22px; box-shadow: var(--shadow); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:820px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  .chip{ display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); margin-bottom:10px; }

  .acc-item{ border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; background:var(--bg-soft); }
  .acc-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; user-select:none; font-size:14.5px; font-weight:600; }
  .acc-head:hover{ background:rgba(255,255,255,0.03); }
  .acc-head .arrow{ transition: transform .3s; color:var(--text-faint); }
  .acc-item.open .acc-head .arrow{ transform:rotate(180deg); }
  .acc-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .acc-item.open .acc-body{ max-height:420px; }
  .acc-body-inner{ padding:0 16px 15px 16px; font-size:14px; color:var(--text-dim); line-height:1.6; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600; transition: all .2s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ border-color:rgba(167,139,250,0.5); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-accent{ background: linear-gradient(135deg, var(--confid), #7c5cd6); border:none; color:#0e0a1c; }
  .btn-accent:hover{ filter:brightness(1.1); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  .reveal-box{ border:1px dashed var(--line); border-radius:var(--radius-sm); padding:14px 16px; background:var(--bg-soft); }
  .reveal-content{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .reveal-content.open{ max-height:600px; margin-top:10px; }

  .opt{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--bg-soft); color:var(--text); padding:11px 15px; border-radius:12px; margin-bottom:9px; font-size:14px; transition: all .18s; }
  .opt:hover:not(:disabled){ border-color:var(--accent); background:rgba(167,139,250,0.08); }
  .opt.correct{ border-color:var(--avail); background:rgba(95,214,160,0.14); }
  .opt.wrong{ border-color:var(--danger); background:rgba(255,107,127,0.14); }
  .opt:disabled{ cursor:default; }

  .feedback{ font-size:13.5px; margin-top:10px; padding:10px 13px; border-radius:10px; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ background:rgba(95,214,160,0.12); color:var(--avail); border:1px solid rgba(95,214,160,0.3); }
  .feedback.bad{ background:rgba(255,107,127,0.12); color:var(--danger); border:1px solid rgba(255,107,127,0.3); }

  .cover-icons{ display:flex; gap:14px; margin:22px 0 6px 0; }
  .cover-icons .ic{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; border:1px solid var(--line); }

  .match-card{ border:1px solid var(--line); background:var(--bg-soft); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:all .18s; }
  .match-card.selected{ border-color:var(--accent); background:rgba(167,139,250,0.1); }
  .match-card.matched{ border-color:var(--avail); background:rgba(95,214,160,0.1); opacity:0.75; cursor:default; }
  .match-card.shake{ animation: shake .35s; border-color:var(--danger); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .score-circle{ width:150px; height:150px; border-radius:50%; margin:16px auto; display:flex; align-items:center; justify-content:center; flex-direction:column; background: conic-gradient(var(--avail) calc(var(--pct,0) * 1%), var(--panel) 0); position:relative; }
  .score-circle::before{ content:''; position:absolute; inset:9px; border-radius:50%; background:var(--bg-soft); }
  .score-circle .val{ position:relative; font-family:'Fredoka'; font-size:30px; font-weight:600; }
  .score-circle .lbl{ position:relative; font-size:11px; color:var(--text-dim); }

  .classify-card{ border:1px solid var(--line); background:var(--bg-soft); border-radius:12px; padding:13px 15px; margin-bottom:9px; }
  .classify-card .txt{ font-size:13.5px; margin-bottom:10px; display:block; }
  .classify-card .btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .classify-card .mini-btn{ font-size:11.5px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); }
  .classify-card .mini-btn:hover{ color:var(--text); }
  .classify-card .mini-btn.picked-correct{ border-color:var(--avail); color:var(--avail); background:rgba(95,214,160,0.12); }
  .classify-card .mini-btn.picked-wrong{ border-color:var(--danger); color:var(--danger); background:rgba(255,107,127,0.12); }
  .classify-card .verdict{ font-size:12px; margin-top:8px; display:none; color:var(--text-dim); }
  .classify-card.answered .verdict{ display:block; }

  #navbar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 24px 20px 24px; gap:14px; }
  #dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60%; }
  .dot-btn{ width:7px; height:7px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer; transition:all .25s; }
  .dot-btn.active{ width:20px; border-radius:5px; background:var(--accent); }
  .navbtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .navbtn:hover:not(:disabled){ background:var(--panel-2); border-color:var(--accent); }
  .navbtn:disabled{ opacity:.3; cursor:not-allowed; }

  .badge-good{ color:var(--avail); font-weight:700; }
  .badge-bad{ color:var(--danger); font-weight:700; }
  ul.spaced li{ margin-bottom:6px; }

  .pillar-card{ border-radius:16px; padding:18px 20px; border:1px solid var(--line); position:relative; overflow:hidden; }
  .pillar-card .big-letter{ position:absolute; right:10px; top:-6px; font-family:'Fredoka'; font-size:64px; font-weight:700; opacity:0.12; }

  .triangle-wrap{ display:flex; justify-content:center; padding:10px 0; }

  @media (max-width:720px){
    .slide{ padding:20px 18px 24px 18px; }
    #topbar{ padding:12px 16px 8px 16px; }
    #navbar{ padding:10px 16px 16px 16px; }
    #dots{ display:none; }
    .grid3{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="kode mono">4.1</span>
    <span class="judul-mini">Konsep Keamanan Data</span>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="slide-counter" class="mono">1 / 1</span>
  </div>

  <div id="stage"></div>

  <div id="navbar">
    <button class="navbtn" id="btn-prev" onclick="prevSlide()">‹</button>
    <div id="dots"></div>
    <button class="navbtn" id="btn-next" onclick="nextSlide()">›</button>
  </div>
</div>

<script>
/* =========================================================
   SVG: SEGITIGA CIA
   ========================================================= */
function buildCIATriangle(highlight){
  // highlight: 'c' | 'i' | 'a' | null
  const w=420, h=380;
  const top={x:210,y:40}, left={x:50,y:330}, right={x:370,y:330};
  const op = (key)=> (!highlight || highlight===key) ? 1 : 0.25;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:420px; height:auto;">
    <polygon points="${top.x},${top.y} ${left.x},${left.y} ${right.x},${right.y}" fill="rgba(167,139,250,0.06)" stroke="rgba(160,160,220,0.25)" stroke-width="1.5"/>
    <circle cx="${top.x}" cy="${top.y}" r="34" fill="var(--confid)" opacity="${op('c')}"/>
    <text x="${top.x}" y="${top.y+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#0e0a1c" opacity="${op('c')}">C</text>
    <text x="${top.x}" y="${top.y-46}" text-anchor="middle" font-size="13" fill="var(--confid)" opacity="${op('c')}" font-weight="600">Kerahasiaan</text>

    <circle cx="${left.x}" cy="${left.y}" r="34" fill="var(--integ)" opacity="${op('i')}"/>
    <text x="${left.x}" y="${left.y+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#0e0a1c" opacity="${op('i')}">I</text>
    <text x="${left.x}" y="${left.y+56}" text-anchor="middle" font-size="13" fill="var(--integ)" opacity="${op('i')}" font-weight="600">Keutuhan</text>

    <circle cx="${right.x}" cy="${right.y}" r="34" fill="var(--avail)" opacity="${op('a')}"/>
    <text x="${right.x}" y="${right.y+7}" text-anchor="middle" font-size="20" font-weight="700" fill="#0e0a1c" opacity="${op('a')}">A</text>
    <text x="${right.x}" y="${right.y+56}" text-anchor="middle" font-size="13" fill="var(--avail)" opacity="${op('a')}" font-weight="600">Ketersediaan</text>
  </svg>`;
}

/* =========================================================
   SLIDE DEFINITIONS
   ========================================================= */
const slides = [];

/* ---- 1. PEMBUKA ---- */
slides.push({title:'Pembuka', html:`
  <div class="eyebrow"><span class="dot"></span>Bab 4 · Manajemen Keamanan Data dan Perlindungan Privasi</div>
  <h2>4.1 Konsep Keamanan Data</h2>
  <p class="lead">Mengenal pengertian keamanan data, tujuan perlindungan data, serta pentingnya menjaga kerahasiaan, keutuhan, dan ketersediaan data.</p>
  <div class="cover-icons">
    <div class="ic" style="background:rgba(167,139,250,0.14); color:var(--confid);">🔐</div>
    <div class="ic" style="background:rgba(94,200,224,0.14); color:var(--integ);">🧩</div>
    <div class="ic" style="background:rgba(95,214,160,0.14); color:var(--avail);">⚡</div>
  </div>
  <p style="color:var(--text-faint); font-size:13px; margin-top:18px;">Geser dengan tombol di bawah, atau gunakan tombol panah keyboard.</p>
`});

/* ---- 2. APERSEPSI ---- */
slides.push({title:'Apersepsi', html:`
  <div class="eyebrow"><span class="dot"></span>Apersepsi</div>
  <h2>Bayangkan tiga kejadian ini</h2>
  <div class="grid3">
    <div class="card"><div class="chip">Kejadian 1</div><p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">Data nilai siswa bocor dan dilihat oleh orang yang tidak berhak.</p></div>
    <div class="card"><div class="chip">Kejadian 2</div><p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">Data transaksi bank berubah sendiri karena diretas, jumlahnya tidak sesuai lagi.</p></div>
    <div class="card"><div class="chip">Kejadian 3</div><p style="font-size:13.5px; color:var(--text-dim); line-height:1.6;">Server sekolah down saat siswa sedang mengerjakan ujian daring.</p></div>
  </div>
  <div class="reveal-box" style="margin-top:18px;">
    <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleReveal('rv-aper')">
      <strong style="font-size:14px;">🤔 Apa masalah utama pada tiap kejadian di atas?</strong>
      <span class="btn" style="pointer-events:none;">Lihat gambaran</span>
    </div>
    <div class="reveal-content" id="rv-aper">
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7; padding-top:10px;">
      Ketiganya adalah tiga masalah keamanan data yang berbeda: data dilihat orang yang tidak berhak (kerahasiaan), data berubah tanpa izin (keutuhan), dan data tidak bisa diakses saat dibutuhkan (ketersediaan). Ketiga aspek inilah inti dari <strong>konsep keamanan data</strong> yang akan kita pelajari.
      </p>
    </div>
  </div>
`});

/* ---- 3. TUJUAN ---- */
slides.push({title:'Tujuan Pembelajaran', html:`
  <div class="eyebrow"><span class="dot"></span>Tujuan Pembelajaran</div>
  <h2>Setelah pembelajaran ini, kamu mampu:</h2>
  <div class="card">
    <ul class="spaced" style="font-size:14.5px; line-height:1.7; padding-left:20px; margin:0;">
      <li>Menjelaskan <strong>pengertian keamanan data</strong>.</li>
      <li>Menjelaskan <strong>tujuan perlindungan data</strong>.</li>
      <li>Menjelaskan tiga prinsip utama keamanan data: <strong>kerahasiaan, keutuhan, dan ketersediaan</strong>.</li>
      <li>Memberikan contoh penerapan dan pelanggaran dari masing-masing prinsip tersebut.</li>
      <li>Mengidentifikasi prinsip keamanan data mana yang terancam pada suatu kasus.</li>
    </ul>
  </div>
`});

/* ---- 4. KONSEP DASAR: pengertian ---- */
slides.push({title:'Pengertian Keamanan Data', html:`
  <div class="eyebrow"><span class="dot"></span>Konsep Dasar</div>
  <h2>Apa itu keamanan data?</h2>
  <p class="lead"><strong>Keamanan data (data security)</strong> adalah serangkaian praktik, kebijakan, dan teknologi yang digunakan untuk melindungi data dari akses tidak sah, perubahan yang tidak diinginkan, kerusakan, maupun gangguan lain yang dapat merugikan pemilik atau pengguna data.</p>
  <div class="card">
    <div class="chip">Mengapa dibutuhkan?</div>
    <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7;">Data kini menjadi aset yang sangat berharga — bagi individu, organisasi, maupun negara. Kebocoran atau kerusakan data dapat menimbulkan kerugian finansial, hukum, dan reputasi. Karena itu, data perlu dikelola secara aman.</p>
  </div>
`});

/* ---- 5. TUJUAN PERLINDUNGAN DATA ---- */
slides.push({title:'Tujuan Perlindungan Data', html:`
  <div class="eyebrow"><span class="dot"></span>Tujuan Perlindungan Data</div>
  <h2>Untuk apa data perlu dilindungi?</h2>
  <div class="grid2">
    <div class="card"><div class="chip">Mencegah kebocoran</div><p style="font-size:13px; color:var(--text-dim);">Menjaga agar data sensitif tidak jatuh ke pihak yang tidak berhak.</p></div>
    <div class="card"><div class="chip">Menjaga akurasi data</div><p style="font-size:13px; color:var(--text-dim);">Memastikan data tetap benar dan tidak diubah secara tidak sah.</p></div>
    <div class="card"><div class="chip">Menjamin akses saat dibutuhkan</div><p style="font-size:13px; color:var(--text-dim);">Memastikan data dan layanan tetap bisa diakses oleh pengguna yang berhak.</p></div>
    <div class="card"><div class="chip">Mematuhi aturan hukum</div><p style="font-size:13px; color:var(--text-dim);">Memenuhi kewajiban hukum terkait perlindungan data pribadi, misalnya UU PDP.</p></div>
  </div>
`});

/* ---- 6. TIGA PRINSIP: pengantar segitiga CIA ---- */
slides.push({title:'Tiga Prinsip Utama', html:`
  <div class="eyebrow"><span class="dot"></span>Tiga Prinsip Utama Keamanan Data</div>
  <h2>Kenalkan: Segitiga CIA</h2>
  <p class="lead">Keamanan data pada dasarnya bertumpu pada tiga prinsip utama, yang biasa digambarkan sebagai <strong>segitiga CIA</strong>: Confidentiality (Kerahasiaan), Integrity (Keutuhan), dan Availability (Ketersediaan).</p>
  <div class="card" style="display:flex; justify-content:center;">
    <div class="triangle-wrap">${buildCIATriangle(null)}</div>
  </div>
`});

/* ---- 7. KERAHASIAAN: pengertian ---- */
slides.push({title:'Kerahasiaan — Pengertian', html:`
  <div class="eyebrow"><span class="dot" style="background:var(--confid);"></span>Kerahasiaan (Confidentiality)</div>
  <h2>Data hanya diakses oleh yang berhak</h2>
  <p class="lead"><strong>Kerahasiaan</strong> berarti data hanya boleh diakses, dilihat, atau digunakan oleh pihak yang memang berwenang, dan terlindungi dari akses pihak lain yang tidak berhak.</p>
  <div class="grid2">
    <div class="pillar-card" style="background:rgba(167,139,250,0.08); border-color:rgba(167,139,250,0.3);">
      <div class="big-letter" style="color:var(--confid);">C</div>
      <div class="chip" style="color:var(--confid); border-color:rgba(167,139,250,0.4);">Contoh penerapan</div>
      <p style="font-size:13px; color:var(--text-dim); position:relative;">Data rekam medis pasien hanya bisa dibuka oleh dokter yang menangani, menggunakan kata sandi dan hak akses tertentu.</p>
    </div>
    <div class="pillar-card" style="background:rgba(255,107,127,0.06); border-color:rgba(255,107,127,0.25);">
      <div class="big-letter" style="color:var(--danger);">✕</div>
      <div class="chip" style="color:var(--danger); border-color:rgba(255,107,127,0.4);">Contoh pelanggaran</div>
      <p style="font-size:13px; color:var(--text-dim); position:relative;">Data nilai siswa bisa dibuka oleh siapa saja karena tidak diberi kata sandi atau pembatasan akses.</p>
    </div>
  </div>
`});

/* ---- 8. KERAHASIAAN: interaktif ---- */
slides.push({title:'Kerahasiaan — Latihan', html:`
  <div class="eyebrow"><span class="dot" style="background:var(--confid);"></span>Latihan</div>
  <h2>Mana yang menjaga kerahasiaan data?</h2>
  <p class="lead">Klik setiap contoh untuk memeriksa jawabanmu.</p>
  <div id="conf-list"></div>
`});

/* ---- 9. KEUTUHAN: pengertian ---- */
slides.push({title:'Keutuhan — Pengertian', html:`
  <div class="eyebrow"><span class="dot" style="background:var(--integ);"></span>Keutuhan (Integrity)</div>
  <h2>Data tetap akurat dan tidak diubah sembarangan</h2>

  <div class="grid2">

function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }

const ciaInfo = {
  c:'<strong style="color:var(--confid);">Kerahasiaan (Confidentiality):</strong> memastikan data hanya diakses oleh pihak yang berwenang.',
  i:'<strong style="color:var(--integ);">Keutuhan (Integrity):</strong> memastikan data tetap akurat dan tidak diubah tanpa izin.',
  a:'<strong style="color:var(--avail);">Ketersediaan (Availability):</strong> memastikan data dapat diakses kapan pun dibutuhkan.'
};
document.getElementById('cia-triangle-interactive').addEventListener('click', (e)=>{
  const svg = e.currentTarget.querySelector('svg');
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * 420;
  const y = (e.clientY - rect.top) / rect.height * 380;
  let key = null;
  if(Math.hypot(x-210,y-40) < 40) key='c';
  else if(Math.hypot(x-50,y-330) < 40) key='i';
  else if(Math.hypot(x-370,y-330) < 40) key='a';
  if(!key) return;
  document.getElementById('cia-triangle-interactive').innerHTML = buildCIATriangle(key);
  document.getElementById('cia-info').innerHTML = ciaInfo[key];
});

function renderCases(){
  const wrap = document.getElementById('case-list');
  if(!wrap) return;
  wrap.innerHTML='';
  caseItems.forEach((item,i)=>{

      </div>
      <div class="verdict"></div>
    `;

function answerCase(i, guess){
  const item = caseItems[i];
  const el = document.getElementById('case-'+i);
  if(el.classList.contains('answered')) return;
  const btns = el.querySelectorAll('.mini-btn');
  const keys=['c','i','a'];
  btns.forEach((b,idx)=>{
    if(keys[idx]===item.answer) b.classList.add('picked-correct');
    else if(keys[idx]===guess) b.classList.add('picked-wrong');
  });
  el.classList.add('answered');
  const verdict = el.querySelector('.verdict');
  if(guess===item.answer){
    verdict.innerHTML = '<span class="badge-good">✓ Tepat!</span> Kasus ini paling berkaitan dengan prinsip '+caseLabel[item.answer]+'.';
  } else {
    verdict.innerHTML = '<span class="badge-bad">✗ Kurang tepat.</span> Kasus ini sebenarnya paling berkaitan dengan prinsip '+caseLabel[item.answer]+'.';
  }
}

const matchPairs = [
  {id:'a', situasi:'Kata sandi akun bocor sehingga orang lain bisa membaca pesan pribadi', bentuk:'c'},
  {id:'b', situasi:'Virus mengubah isi file laporan keuangan tanpa sepengetahuan pemiliknya', bentuk:'i'},
  {id:'c', situasi:'Serangan DDoS membuat situs toko online tidak bisa diakses pelanggan', bentuk:'a'},
  {id:'d', situasi:'Karyawan magang tanpa izin membuka data rahasia perusahaan', bentuk:'c'},
];
const bentukLabel = {c:'Kerahasiaan (Confidentiality)', i:'Keutuhan (Integrity)', a:'Ketersediaan (Availability)'};
let selectedSituasi = null;
let matchedCount = 0;

function renderMatch(){
  const left = document.getElementById('match-left');
  const right = document.getElementById('match-right');
  if(!left) return;
  left.innerHTML=''; right.innerHTML='';
  matchPairs.forEach(p=>{
    const el = document.createElement('div');
    el.className='match-card';
    el.id='sit-'+p.id;
    el.textContent = p.situasi;
    el.onclick = ()=>selectSituasi(p.id, el);
    left.appendChild(el);
  });
  ['c','i','a'].forEach(b=>{
    const el = document.createElement('div');
    el.className='match-card';
    el.id='bnt-'+b;
    el.textContent = bentukLabel[b];
    el.onclick = ()=>selectBentuk(b, el);
    right.appendChild(el);
  });
}
function selectSituasi(id, el){
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('#match-left .match-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedSituasi = id;
}
function selectBentuk(bentuk, el){
  if(!selectedSituasi) return;
  const pair = matchPairs.find(p=>p.id===selectedSituasi);
  const fb = document.getElementById('match-feedback');
  if(pair.bentuk === bentuk){
    document.getElementById('sit-'+selectedSituasi).classList.add('matched');
    document.getElementById('sit-'+selectedSituasi).classList.remove('selected');
    matchedCount++;
    fb.className='feedback show good';
    fb.textContent = '✓ Tepat! "'+pair.situasi+'" berkaitan dengan prinsip '+bentukLabel[bentuk]+'.';
    if(matchedCount===matchPairs.length){ fb.textContent += ' 🎉 Semua pasangan sudah tepat!'; }
  } else {
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 350);
    fb.className='feedback show bad';
    fb.textContent = '✗ Belum tepat, coba pikirkan lagi prinsip apa yang paling terancam dari situasi tersebut.';
  }
  selectedSituasi = null;
}
renderMatch();

const quizData = [
  {q:'Prinsip yang memastikan data hanya dapat diakses oleh pihak yang berwenang disebut…', options:['Ketersediaan','Kerahasiaan','Keutuhan','Autentikasi'], correct:1, exp:'Kerahasiaan (Confidentiality) berarti data hanya boleh diakses oleh pihak yang memang berwenang.'},
  {q:'Server ujian daring lumpuh akibat serangan DDoS sehingga siswa tidak bisa login. Ini adalah pelanggaran terhadap prinsip…', options:['Kerahasiaan','Keutuhan','Ketersediaan','Privasi'], correct:2, exp:'Ketersediaan (Availability) berarti sistem dan data harus bisa diakses saat dibutuhkan; serangan DDoS mengganggu hal ini.'},
  {q:'Prinsip yang memastikan data tetap akurat dan tidak diubah oleh pihak tak berwenang disebut…', options:['Ketersediaan','Kerahasiaan','Keutuhan','Enkripsi'], correct:2, exp:'Keutuhan (Integrity) memastikan data tetap akurat, lengkap, dan konsisten.'},
  {q:'Manakah contoh pelanggaran prinsip kerahasiaan?', options:['Server down saat diakses banyak pengguna','Data laporan diubah tanpa proses verifikasi','Dokumen rahasia dibaca oleh karyawan yang tidak berwenang','Situs mengalami downtime akibat pemeliharaan'], correct:2, exp:'Dokumen rahasia yang dibaca pihak tak berwenang adalah pelanggaran kerahasiaan, karena akses seharusnya dibatasi.'},
  {q:'Mengapa keamanan data penting bagi sebuah organisasi?', options:['Agar tampilan aplikasi lebih menarik','Untuk mencegah kerugian finansial, hukum, dan reputasi akibat data bocor atau rusak','Agar data lebih cepat diproses','Supaya biaya penyimpanan data lebih murah'], correct:1, exp:'Data yang bocor, rusak, atau tidak bisa diakses dapat menimbulkan kerugian finansial, hukum, dan reputasi bagi organisasi.'},
];
let quizIndex=0, quizScore=0, quizAnswered=false;
function renderQuiz(){
  const area = document.getElementById('quiz-area');
  if(!area) return;
  if(quizIndex >= quizData.length){
    const pct = Math.round(quizScore/quizData.length*100);
    area.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="score-circle" style="--pct:${pct};">
          <div class="val">${quizScore}/${quizData.length}</div>
          <div class="lbl">skor kamu</div>
        </div>
        <p style="font-size:14px; color:var(--text-dim);">${pct>=80?'Luar biasa! Pemahamanmu tentang konsep keamanan data sudah sangat baik. 🌟':pct>=60?'Bagus! Sedikit lagi kamu akan menguasai materi ini. 👍':'Yuk pelajari lagi bagian yang belum dipahami, lalu coba lagi. 💪'}</p>
        <button class="btn btn-accent" onclick="restartQuiz()">↺ Ulangi Kuis</button>
      </div>`;
    return;
  }
  const q = quizData[quizIndex];
  area.innerHTML = `
    <div class="chip">Soal ${quizIndex+1} dari ${quizData.length}</div>
    <div class="card">
      <p style="font-size:15px; margin:0 0 16px 0;">${q.q}</p>
      <div id="quiz-opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
      <div class="feedback" id="quiz-fb"></div>
    </div>`;
  quizAnswered=false;
}
function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered=true;
  const q = quizData[quizIndex];
  const opts = document.querySelectorAll('#quiz-opts .opt');
  opts.forEach((o,idx)=>{
    o.disabled=true;
    if(idx===q.correct) o.classList.add('correct');
    else if(idx===i) o.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  const isCorrect = i===q.correct;
  if(isCorrect) quizScore++;
  fb.className='feedback show '+(isCorrect?'good':'bad');
  fb.innerHTML=(isCorrect?'✓ Benar! ':'✗ Belum tepat. ')+q.exp+
    `<div style="margin-top:10px;"><button class="btn btn-accent" onclick="nextQuiz()">${quizIndex<quizData.length-1?'Soal berikutnya →':'Lihat skor →'}</button></div>`;
}
function nextQuiz(){ quizIndex++; renderQuiz(); }
function restartQuiz(){ quizIndex=0; quizScore=0; renderQuiz(); }
renderQuiz();

</script>
</body>
</html>
